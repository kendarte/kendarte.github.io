name: Siza Data Driven Card Effects Migration V2

on:
  push:
    paths:
      - '.github/workflows/siza-card-effects-runtime-migration-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-effects:
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save acorn@8 jsdom@24
      - name: Run guarded effects migration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/siza-card-effects-runtime-migration.js
