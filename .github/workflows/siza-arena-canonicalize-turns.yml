name: Siza Arena Canonicalize Turn Lifecycle

on:
  push:
    paths:
      - '.github/workflows/siza-arena-canonicalize-turns.yml'

permissions:
  contents: write

jobs:
  canonicalize-turns:
    runs-on: ubuntu-latest
    steps:
      - name: Install transformation dependencies
        run: npm install --no-save acorn@8 jsdom@24

      - name: Canonicalize and validate turn runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const acorn=require('acorn');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,path='siza-mobile-test/index.html';
          const api=`https://api.github.com/repos/${repo}/contents/${path}`;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          const targets=new Set(['endTurn','enemyTurn','enemyChoosePlay','enemyAfterMain','finishEnemyTurn']);

          function parseFunctions(html){const so=html.lastIndexOf('<script>'),sc=html.indexOf('</script>',so);if(so<0||sc<0)throw new Error('Main script block not found');const cs=so+'<script>'.length,code=html.slice(cs,sc),ast=acorn.parse(code,{ecmaVersion:'latest',sourceType:'script'}),declarations=[];function walk(n){if(!n||typeof n!=='object')return;if(n.type==='FunctionDeclaration'&&n.id)declarations.push(n);for(const[k,v]of Object.entries(n)){if(k==='start'||k==='end'||k==='loc')continue;if(Array.isArray(v))for(const c of v)walk(c);else if(v&&typeof v==='object'&&typeof v.type==='string')walk(v)}}walk(ast);return{codeStart:cs,scriptClose:sc,code,declarations}}
          function countsOf(ds){const m=new Map();for(const n of ds)m.set(n.id.name,(m.get(n.id.name)||0)+1);return m}
          function makeDom(html,label){const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error(`[JSDOM ${label}]`,e.message));return new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/',virtualConsole:vc})}
          function instrument(html,name,body){const marker='window.SIZA={';if(!html.includes(marker))throw new Error('SIZA export marker not found');return html.replace(marker,`window.${name}=${body};\n`+marker)}
          function runner(){const results=[];return{results,test:(name,fn)=>{try{results.push({name,pass:!!fn()})}catch(error){results.push({name,pass:false,error:error.message})}}}}
          function report(results,label){for(const r of results)console.log(`${r.pass?'PASS':'FAIL'} ${r.name}${r.error?` :: ${r.error}`:''}`);const p=results.filter(r=>r.pass).length;console.log(`${label}: ${p}/${results.length}`);if(p!==results.length)throw new Error(`${label} failed ${p}/${results.length}`)}

          function runCore(html){const dom=makeDom(html,'core'),fn=dom.window.SIZA?.runArenaCriticalV071;if(typeof fn!=='function')throw new Error('Core runner unavailable');const r=fn();console.log(`SIZA Arena contract ${r.version}: ${r.passed}/${r.total}`);for(const x of r.results)console.log(`${x.pass?'PASS':'FAIL'} ${x.name}${x.error?` :: ${x.error}`:''}`);dom.window.close();if(r.passed!==r.total)throw new Error(`Core failed ${r.passed}/${r.total}`)}

          function runCombat(original){const html=instrument(original,'__C__',`{createMatch,setMatch:m=>state.match=m,addCreatureV070,assignAiBlockersV600,assignBlocker,resolveCombatV600,declarePlayerCombat}`),dom=makeDom(html,'combat');dom.window.setTimeout=()=>0;const H=dom.window.__C__,T=runner(),fresh=mode=>{const M=H.createMatch(false,mode);H.setMatch(M);return M};T.test('IA excluye bloqueadores agotados',()=>{const M=fresh('immediate');H.addCreatureV070(M.player,'leviathan');H.addCreatureV070(M.enemy,'watcher');H.addCreatureV070(M.enemy,'servitor');M.enemy.exhausted=[0];M.combat={owner:'player',attackers:[{index:0,id:'leviathan'}],blockers:{}};H.assignAiBlockersV600();return M.combat.blockers['0']===1});T.test('Jugador rechaza bloqueador agotado',()=>{const M=fresh('immediate');H.addCreatureV070(M.enemy,'leviathan');H.addCreatureV070(M.player,'watcher');H.addCreatureV070(M.player,'servitor');M.player.exhausted=[0];M.combat={owner:'enemy',attackers:[{index:0,id:'leviathan'}],blockers:{}};M.active='defense';H.assignBlocker(0,0);const no=M.combat.blockers['0']==null;H.assignBlocker(0,1);return no&&M.combat.blockers['0']===1});T.test('Daño simultáneo destruye ambos 2/2',()=>{const M=fresh('immediate');H.addCreatureV070(M.player,'servitor');H.addCreatureV070(M.enemy,'servitor');M.combat={owner:'player',attackers:[{index:0,id:'servitor'}],blockers:{'0':0}};M.active='enemy-defense';H.resolveCombatV600();return !M.player.battlefield.length&&!M.enemy.battlefield.length&&M.player.graveyard.includes('servitor')&&M.enemy.graveyard.includes('servitor')});T.test('Contrabandista +1 al declarar',()=>{const M=fresh('immediate');H.addCreatureV070(M.player,'smuggler');const life=M.enemy.life;H.declarePlayerCombat([0]);return M.enemy.life===life-1&&M.player.combatUsed&&M.player.exhausted.includes(0)});report(T.results,'SIZA live combat regression');dom.window.close()}

          function runStack(original){const html=instrument(original,'__S__',`{createMatch,setMatch:m=>state.match=m,resolveTopStack,resolveStackAll}`),dom=makeDom(html,'stack');dom.window.setTimeout=()=>0;const H=dom.window.__S__,T=runner(),fresh=()=>{const M=H.createMatch(false,'prepare');H.setMatch(M);return M};T.test('Chispa hace 2 y Cementerio',()=>{const M=fresh();M.player.graveyard=[];M.enemy.life=20;M.stack=[{id:'s',cardId:'spark',owner:'player'}];H.resolveTopStack();return M.enemy.life===18&&M.player.graveyard.includes('spark')});T.test('Niebla roba y Cementerio',()=>{const M=fresh();M.player.hand=[];M.player.library=['spark'];M.player.graveyard=[];M.stack=[{id:'m',cardId:'mist',owner:'player'}];H.resolveTopStack();return M.player.hand[0]==='spark'&&M.player.graveyard.includes('mist')});T.test('Servidor abre Observar',()=>{const M=fresh();M.player.library=['spark'];M.stack=[{id:'v',cardId:'servitor',owner:'player'}];H.resolveTopStack();return M.player.battlefield[0]==='servitor'&&M.pendingChoice?.type==='observe'});T.test('Negación anula objetivo',()=>{const M=fresh();M.player.graveyard=[];M.enemy.graveyard=[];M.stack=[{id:'t',cardId:'spark',owner:'enemy'},{id:'c',cardId:'counter',owner:'player',targetStackId:'t'}];H.resolveTopStack();return !M.stack.length&&M.player.graveyard.includes('counter')&&M.enemy.graveyard.includes('spark')});T.test('Stack pausa ante elección',()=>{const M=fresh();M.player.library=['spark'];M.stack=[{id:'low',cardId:'spark',owner:'player'},{id:'top',cardId:'servitor',owner:'player'}];H.resolveStackAll();return M.pendingChoice?.type==='observe'&&M.stack.length===1&&M.stack[0].id==='low'});report(T.results,'SIZA live stack regression');dom.window.close()}

          function runEquipment(original){const html=instrument(original,'__E__',`{createMatch,setMatch:m=>state.match=m,addCreatureV070,beginEquip,chooseEquipCrystalV070,equipTo,effectivePower,equipmentTrayHtml,equipPanelHtml}`),dom=makeDom(html,'equipment');dom.window.setTimeout=()=>0;const H=dom.window.__E__,T=runner(),fresh=()=>{const M=H.createMatch(false,'prepare');H.setMatch(M);H.addCreatureV070(M.player,'servitor');M.player.equipment=[{id:'tideblade',target:null}];M.player.crystals={U:2,R:1};return M};T.test('Equipar abre elección',()=>{const M=fresh();H.beginEquip(0);return M.pendingEquip?.eqIndex===0&&M.pendingEquip.color===null});T.test('Sin cristales no abre Equipar',()=>{const M=fresh();M.player.crystals={U:0,R:0};H.beginEquip(0);return M.pendingEquip===null});T.test('Consume color elegido y vincula',()=>{const M=fresh();H.beginEquip(0);H.chooseEquipCrystalV070('R');H.equipTo(0);return M.player.crystals.R===0&&M.player.crystals.U===2&&M.player.equipment[0].target===0&&H.effectivePower(M.player,0)===4});T.test('Contador + Equipo componen poder',()=>{const M=fresh();M.player.powerCounters[0]=1;M.player.equipment[0].target=0;return H.effectivePower(M.player,0)===5});T.test('Tray/panel vigentes',()=>{const M=fresh(),pt=H.equipmentTrayHtml(M.player,'player'),et=H.equipmentTrayHtml(M.player,'enemy');H.beginEquip(0);const b=H.equipPanelHtml();H.chooseEquipCrystalV070('U');const a=H.equipPanelHtml();return pt.includes('SIZA.beginEquip(0)')&&!et.includes('SIZA.beginEquip')&&b.includes('disabled')&&a.includes('selected')&&!a.includes('disabled')});report(T.results,'SIZA live equipment regression');dom.window.close()}

          function runTurns(original){
            const html=instrument(original,'__T__',`{createMatch,setMatch:m=>state.match=m,addCreatureV070,endTurn,enemyTurn,enemyChoosePlay,enemyAfterMain,finishEnemyTurn}`),dom=makeDom(html,'turns');const queued=[];dom.window.setTimeout=(fn,ms)=>{queued.push({fn,ms});return queued.length};const H=dom.window.__T__,T=runner(),fresh=mode=>{queued.length=0;const M=H.createMatch(false,mode);H.setMatch(M);return M};
            T.test('Fin de turno cede a rival sin gastar cristales restantes',()=>{const M=fresh('prepare');M.player.crystals={U:1,R:1};H.endTurn();return M.active==='enemy'&&M.phase==='Inicio rival'&&M.enemyStage==='start'&&M.player.crystals.U===1&&M.player.crystals.R===1&&queued.length===1&&queued[0].fn.name==='enemyTurn'});
            T.test('Inicio rival incrementa turno propio, roba y recarga U/U/R',()=>{const M=fresh('prepare');M.active='enemy';M.enemyStage='start';M.enemy.crystals={U:0,R:0};M.enemy.exhausted=[0];M.enemy.combatUsed=true;const hand=M.enemy.hand.length,own=M.enemy.ownTurn;H.enemyTurn();return M.enemy.ownTurn===own+1&&M.enemy.hand.length===hand+1&&M.enemy.crystals.U===2&&M.enemy.crystals.R===1&&!M.enemy.exhausted.length&&!M.enemy.combatUsed&&M.enemyStage==='main'&&queued.length===1&&queued[0].fn.name==='enemyChoosePlay'});
            T.test('IA equipa Equipo suelto pagando cristal antes de jugar carta',()=>{const M=fresh('immediate');M.active='enemy';M.enemyStage='main';H.addCreatureV070(M.enemy,'servitor');M.enemy.equipment=[{id:'tideblade',target:null}];M.enemy.crystals={U:2,R:1};H.enemyChoosePlay();return M.enemy.equipment[0].target===0&&M.enemy.crystals.U===1&&M.enemy.crystals.R===1&&queued.length===1&&queued[0].fn.name==='enemyChoosePlay'});
            T.test('Ataque rival usa sólo atacantes legales y aplica Contrabandista',()=>{const M=fresh('immediate');M.active='enemy';H.addCreatureV070(M.enemy,'watcher');H.addCreatureV070(M.enemy,'smuggler');M.enemy.exhausted=[0];const life=M.player.life;H.enemyAfterMain();return M.active==='defense'&&M.combat?.owner==='enemy'&&M.combat.attackers.length===1&&M.combat.attackers[0].id==='smuggler'&&M.player.life===life-1&&M.enemy.exhausted.includes(1)});
            T.test('Sin atacantes la IA termina turno, no usa Acción Física',()=>{const M=fresh('prepare');M.active='enemy';H.enemyAfterMain();return queued.length===1&&queued[0].fn.name==='finishEnemyTurn'&&queued[0].ms===400});
            T.test('Fin rival incrementa turnos, roba y recarga jugador',()=>{const M=fresh('prepare');M.active='enemy';M.player.crystals={U:0,R:0};M.player.exhausted=[0];M.player.combatUsed=true;const hand=M.player.hand.length,own=M.player.ownTurn,turn=M.turn;H.finishEnemyTurn();return M.turn===turn+1&&M.player.ownTurn===own+1&&M.player.hand.length===hand+1&&M.player.crystals.U===2&&M.player.crystals.R===1&&!M.player.exhausted.length&&!M.player.combatUsed&&M.active==='player'&&M.phase==='Main'&&M.enemyStage===null});
            report(T.results,'SIZA live turn regression');dom.window.close();
          }

          async function main(){const read=await fetch(`${api}?ref=main`,{headers});if(!read.ok)throw new Error(`GET ${read.status}: ${await read.text()}`);const current=await read.json(),html=Buffer.from(current.content.replace(/\n/g,''),'base64').toString('utf8');console.log(`Current Arena blob ${current.sha}`);const parsed=parseFunctions(html),byName=new Map([...targets].map(n=>[n,[]]));for(const d of parsed.declarations)if(targets.has(d.id.name))byName.get(d.id.name).push(d);for(const[n,nodes]of byName)if(nodes.length!==2)throw new Error(`${n}: expected 2 declarations before cleanup, found ${nodes.length}`);const removals=[];for(const[n,nodes]of byName){nodes.sort((a,b)=>a.start-b.start);const dead=nodes[0];let end=dead.end;while(end<parsed.code.length&&(parsed.code[end]==='\r'||parsed.code[end]==='\n'))end++;removals.push({n,start:dead.start,end})}removals.sort((a,b)=>b.start-a.start);let nextCode=parsed.code;for(const r of removals){console.log(`REMOVE dead ${r.n} @ ${r.start}-${r.end}`);nextCode=nextCode.slice(0,r.start)+nextCode.slice(r.end)}const nextHtml=html.slice(0,parsed.codeStart)+nextCode+html.slice(parsed.scriptClose),verified=parseFunctions(nextHtml),counts=countsOf(verified.declarations);for(const n of targets){const c=counts.get(n)||0;console.log(`CANONICAL ${n}: ${c}`);if(c!==1)throw new Error(`${n}: expected 1 after cleanup, found ${c}`)}const dup=[...counts.values()].filter(c=>c>1).length;console.log(`Named function declarations after turn cleanup: ${verified.declarations.length}`);console.log(`Duplicate names after turn cleanup: ${dup}`);if(verified.declarations.length!==170)throw new Error(`Expected 170 declarations, found ${verified.declarations.length}`);if(dup!==15)throw new Error(`Expected 15 duplicate names, found ${dup}`);runCore(nextHtml);runCombat(nextHtml);runStack(nextHtml);runEquipment(nextHtml);runTurns(nextHtml);const write=await fetch(api,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Canonicalize Arena turn lifecycle runtime',content:Buffer.from(nextHtml,'utf8').toString('base64'),sha:current.sha,branch:'main'})});if(!write.ok)throw new Error(`PUT ${write.status}: ${await write.text()}`);const result=await write.json();console.log(`COMMIT ${result.commit.sha}`)}
          main().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
