<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Siza Mobile Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111b;color:#f3ead5;font:14px system-ui}.app{min-height:100dvh;display:grid;grid-template-rows:58px 1fr 72px 130px;max-width:900px;margin:auto;background:radial-gradient(circle at 50% 40%,#11304a,#07111b 55%)}.bar{position:relative;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #29445c;background:#0a1725}.player{border-top:1px solid #29445c}.avatar{width:46px;height:46px;border:2px solid #d9b56d;border-radius:50%;display:grid;place-items:center;font-weight:800}.life{position:absolute;margin:0 0 30px 55px;background:#111e2b;border:1px solid #765b31;border-radius:20px;padding:2px 6px;font-size:11px}.turn{position:absolute;left:7px;top:7px;color:#e8cc8d;font-size:10px}.field{display:grid;grid-template-rows:1fr 50px 1fr;min-height:0}.lane{display:flex;align-items:center;justify-content:center;gap:8px}.enemy{border-bottom:1px solid #20384d}.unit,.card{border:1px solid #34516a;border-radius:9px;background:#102236;color:#f3ead5}.unit{width:74px;height:96px;padding:5px}.unit.sel{transform:translateY(-7px);border-color:#d9b56d}.art{height:52px;border-radius:6px;background:#173b57;display:grid;place-items:center;color:#8fa9bd;font-size:10px}.unit b,.card b{display:block;font-size:10px;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.stack{display:flex;align-items:center;justify-content:center;gap:8px}.face{width:48px;height:66px;border:1px solid #80683e;border-radius:7px;background:repeating-linear-gradient(135deg,#10253a 0 8px,#081522 8px 16px);display:grid;place-items:center;color:#d9b56d;font:700 18px Georgia}.die{width:48px;height:48px;border:2px solid #d9b56d;border-radius:12px;display:grid;place-items:center;font-size:28px}.msg{font-size:10px;color:#edd092;max-width:130px}.stats{position:absolute;left:7px;top:7px;font-size:9px;color:#abc0d0}.physical{position:absolute;left:50%;transform:translateX(-50%);top:50px}.end{position:absolute;right:7px;top:15px}.btn{border:1px solid #6f5732;background:#172536;color:#efd28c;border-radius:8px;padding:7px 9px;font-weight:700;font-size:10px}.gold{background:linear-gradient(#d9b56d,#a98343);color:#101419}.handArea{position:relative;overflow:hidden;border-top:1px solid #29445c;background:#050b11}.hand{height:100%;display:flex;align-items:flex-end;justify-content:center;padding:7px}.card{width:88px;height:116px;margin-left:-30px;padding:4px;background:#e7ddc5;color:#17202a}.card:first-child{margin-left:0}.card.sel{transform:translateY(-15px);z-index:4;border:2px solid #d9b56d}.card.instant{box-shadow:0 0 0 2px #43a9e6}.card.land{background:#d2cab7}.card .art{height:54px;background:#263b4f}.focus{position:absolute;left:7px;bottom:122px;width:210px;padding:9px;border:1px solid #765b31;border-radius:10px;background:#0b1825;z-index:9}.focus h3{font:500 15px Georgia;margin:0}.focus p{font-size:10px;color:#b3c5d3}.burn{position:absolute;left:50%;transform:translateX(-50%);bottom:132px;background:#0d1a26;border:1px solid #765b31;border-radius:10px;padding:8px;z-index:10;text-align:center}.burn button{margin:3px}.pass{position:absolute;right:7px;bottom:132px;z-index:10}.log{position:absolute;left:7px;top:5px;color:#8fa6b9;font-size:9px;max-width:45%}.hidden{display:none}.toast{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99;background:#101d2a;border:1px solid #765b31;border-radius:20px;padding:7px 10px;color:#efd28c;font-size:10px}@media(orientation:portrait){.app{grid-template-rows:54px 1fr 70px 124px}.card{width:82px;height:110px;margin-left:-32px}.focus{bottom:116px}.burn,.pass{bottom:126px}.unit{width:68px;height:90px}.art{height:48px}}
</style></head><body><div id="root"></div><script>
const C={counter:{n:'Negación',t:'Instant',dc:8,txt:'Contrarresta el spell objetivo.'},spark:{n:'Chispa',t:'Instant',dc:7,txt:'Hace 2 de daño.'},ign:{n:'Ignimite',t:'Creature',dc:7,p:2,txt:'Criatura 2/2.'},watch:{n:'Vigía',t:'Creature',dc:8,p:1,txt:'Criatura 1/3.'},land:{n:'Costa',t:'Land',txt:'Sólo Mana Burn.'}};
let S={turn:1,active:'p',p:{life:20,mf:3,prow:2,eva:3,hand:['counter','spark','land','land','land'],field:['ign'],success:false},e:{life:20,mf:2,prow:2,eva:2,hand:['spark','watch','land','land'],field:['watch'],success:false},sel:-1,unit:-1,stack:null,commit:null,response:false,burn:null,busy:false,log:'Tu turno.'};const d=()=>1+Math.floor(Math.random()*6),face=n=>['⚀','⚁','⚂','⚃','⚄','⚅'][n-1]||'?';
function toast(x){let e=document.createElement('div');e.className='toast';e.textContent=x;document.body.append(e);setTimeout(()=>e.remove(),1400)}
function handCard(id,i){let c=C[id];return `<button class="card ${S.sel===i?'sel':''} ${S.response&&c.t==='Instant'?'instant':''} ${id==='land'?'land':''}" data-h="${i}"><div class="art">${c.t}</div><b>${c.n}</b><small>${id==='land'?'BURN':'DC '+c.dc}</small></button>`}
function unit(id,i,o){let c=C[id];return `<button class="unit ${o==='p'&&S.unit===i?'sel':''}" data-u="${o}:${i}"><div class="art">${c.t}</div><b>${c.n}</b>${o==='p'&&S.unit===i?`<button class="btn gold" data-atk="1">Atacar</button>`:''}</button>`}
function render(){let f='',id=S.p.hand[S.sel],c=C[id];if(c)f=`<div class="focus"><h3>${c.n}</h3><p>${c.txt}</p>${id==='land'?'<span>Reserva de Burn</span>':`<button class="btn gold" data-cast="1">${S.response?'Responder':'Manifestar'}</button>`}<button class="btn" data-close="1">Cerrar</button></div>`;let mid=S.commit?`<div class="face">S</div><div class="die">${face(S.commit.roll)}</div><div class="msg">${S.commit.msg}</div>`:S.stack?`<div class="btn">STACK: ${C[S.stack.id].n}</div>`:'<div class="btn">STACK 0</div>';let b=S.burn?`<div class="burn">Falta +${S.burn.need}<br>${Array.from({length:S.burn.have},(_,i)=>`<button class="btn gold" data-b="${i}">LAND +1</button>`).join('')}</div>`:'';document.getElementById('root').innerHTML=`<main class="app"><section class="bar"><span class="turn">${S.active==='p'?'TU TURNO':'RIVAL'} ${S.turn}</span><div class="avatar">C</div><span class="life">${S.e.life}</span></section><section class="field"><div class="log">${S.log}</div><div class="lane enemy">${S.e.field.map((x,i)=>unit(x,i,'e')).join('')}</div><div class="stack">${mid}</div><div class="lane">${S.p.field.map((x,i)=>unit(x,i,'p')).join('')}</div></section><section class="bar player"><div class="stats">MF ${S.p.mf} · PROW ${S.p.prow} · EVA ${S.p.eva}</div><div class="avatar">NV</div><span class="life">${S.p.life}</span><button class="btn physical" data-phys="1" ${S.active!=='p'||S.p.success||S.busy?'disabled':''}>Ataque físico</button><button class="btn gold end" data-end="1" ${S.active!=='p'||S.busy||S.response?'disabled':''}>END TURN</button></section><section class="handArea"><div class="hand">${S.p.hand.map(handCard).join('')}</div>${f}${b}${S.response&&!S.busy?'<button class="btn pass" data-pass="1">PASAR</button>':''}</section></main>`;bind()}
function bind(){document.querySelectorAll('[data-h]').forEach(x=>x.onclick=()=>{if(!S.busy){S.sel=+x.dataset.h;render()}});document.querySelector('[data-close]')?.addEventListener('click',()=>{S.sel=-1;render()});document.querySelector('[data-cast]')?.addEventListener('click',()=>cast('p',S.sel,S.response));document.querySelector('[data-end]')?.addEventListener('click',enemyTurn);document.querySelector('[data-pass]')?.addEventListener('click',resolveEnemy);document.querySelector('[data-phys]')?.addEventListener('click',physical);document.querySelectorAll('[data-u]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-atk]'))return;let[o,i]=x.dataset.u.split(':');if(o==='p'&&S.active==='p'){S.unit=+i;render()}});document.querySelector('[data-atk]')?.addEventListener('click',attack);document.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>burn(+x.dataset.b+1))}
function cast(o,i,react=false){let P=o==='p'?S.p:S.e,id=P.hand[i],c=C[id];if(!c||c.t==='Land')return;S.busy=true;S.commit={o,i,id,react,roll:1,msg:'Carta boca abajo · tirando…'};render();let k=0,t=setInterval(()=>{S.commit.roll=1+(k++%6);render();if(k>7){clearInterval(t);let r=d(),need=Math.max(0,c.dc-(P.mf+r));S.commit.roll=r;S.commit.msg=`MF ${P.mf} + ${r} vs DC ${c.dc}${need?' · falta '+need:' · SUCCESS'}`;render();setTimeout(()=>rollDone(need),350)}},70)}
function rollDone(need){let m=S.commit,P=m.o==='p'?S.p:S.e,lands=P.hand.filter((x,i)=>x==='land'&&i!==m.i).length;if(!need)return success(0);if(need<=lands){if(m.o==='e')return setTimeout(()=>success(need),350);S.busy=false;S.burn={need,have:lands};S.log='Tirada fallida: Mana Burn disponible.';return render()}S.log='Manafestation falla. Burn insuficiente.';S.commit=null;S.busy=false;render();if(m.o==='e')setTimeout(enemyCombat,450);else if(m.react){S.response=false;setTimeout(resolveEnemy,450)}}
function burn(n){if(S.burn&&n>=S.burn.need){S.burn=null;success(n)}}function success(n){let m=S.commit,P=m.o==='p'?S.p:S.e;for(let k=0;k<n;k++){let j=P.hand.findIndex((x,i)=>x==='land'&&i!==m.i);if(j>=0){P.hand.splice(j,1);if(j<m.i)m.i--}}let id=P.hand.splice(m.i,1)[0];P.success=true;S.commit.msg=`SUCCESS${n?' · BURN '+n:''} · revela ${C[id].n}`;S.busy=true;render();setTimeout(()=>{S.commit=null;S.stack={o:m.o,id,react:m.react};S.sel=-1;if(m.o==='e'){S.response=true;S.active='p';S.busy=false;S.log=`${C[id].n} rival en Stack. Responde con Instant.`;toast('VENTANA DE RESPUESTA');render()}else if(m.react)resolveResponse(id);else resolveOwn(id)},500)}
function resolveOwn(id){S.stack=null;if(C[id].t==='Creature')S.p.field.push(id);else if(id==='spark')S.e.life-=2;S.busy=false;S.log=C[id].n+' resuelve.';render()}
function resolveResponse(id){if(id==='counter'&&S.stack){let target=S.stack;S.stack=null;S.log=`Negación contrarresta ${C[target.id].n}.`;toast('COUNTER')}else{if(id==='spark')S.e.life-=2;S.stack=null}S.response=false;S.active='e';S.busy=false;render();setTimeout(enemyCombat,450)}
function enemyTurn(){S.active='e';S.e.success=false;S.busy=true;S.sel=-1;S.log='El rival prepara una jugada.';render();setTimeout(()=>{let i=S.e.hand.findIndex(x=>x!=='land');if(i<0)return enemyCombat();cast('e',i,false)},450)}
function resolveEnemy(){S.response=false;S.busy=true;S.active='e';let x=S.stack;S.stack=null;if(x){if(C[x.id].t==='Creature')S.e.field.push(x.id);else if(x.id==='spark')S.p.life-=2;S.log=C[x.id].n+' rival resuelve.'}render();setTimeout(enemyCombat,450)}
function enemyCombat(){let dmg=S.e.field.reduce((n,x)=>n+(C[x].p||0),0);S.p.life-=dmg;S.log=dmg?`Criaturas rivales atacan por ${dmg}.`:'Sin ataque de criaturas.';render();setTimeout(()=>{if(!S.e.success){let a=S.e.prow+d(),v=S.p.eva+d();if(a>v)S.p.life--;S.log+=` Ataque físico ${a} vs ${v}.`}S.turn++;S.active='p';S.p.success=false;S.busy=false;S.p.hand.push(S.turn%2?'land':'spark');S.log+=' Tu turno.';render()},500)}
function physical(){let a=S.p.prow+d(),v=S.e.eva+d();if(a>v)S.e.life--;S.log=`Ataque físico ${a} vs ${v}: ${a>v?'IMPACTO':'FALLA'}.`;render()}function attack(){let id=S.p.field[S.unit];S.e.life-=C[id].p||0;S.log=C[id].n+' ataca.';S.unit=-1;render()}render();
</script></body></html>
