name: SIZA Book Battlefield v0.3 Tests

on:
  push:
    paths:
      - 'siza-world-engine/overlay/web/static/webclient/css/siza_tcg_battlefield_v03.css'
      - 'siza-world-engine/overlay/web/static/webclient/css/siza_tcg_zone_docks_v01.css'
      - 'siza-world-engine/overlay/web/static/webclient/js/siza_tcg_battlefield_v03.js'
      - 'siza-mobile-test/book-zone-snapshot-v01.js'
      - 'siza-world-engine/overlay/web/templates/webclient/webclient.html'
      - '.github/workflows/siza-book-battlefield-v03-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battlefield-layout-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate non-overlapping RPG TCG combat contract
        shell: bash
        run: |
          node --check siza-world-engine/overlay/web/static/webclient/js/siza_tcg_battlefield_v03.js
          node --check siza-mobile-test/book-zone-snapshot-v01.js
          python - <<'PY'
          from pathlib import Path

          css = Path('siza-world-engine/overlay/web/static/webclient/css/siza_tcg_battlefield_v03.css').read_text(encoding='utf-8')
          docks = Path('siza-world-engine/overlay/web/static/webclient/css/siza_tcg_zone_docks_v01.css').read_text(encoding='utf-8')
          js = Path('siza-world-engine/overlay/web/static/webclient/js/siza_tcg_battlefield_v03.js').read_text(encoding='utf-8')
          snap = Path('siza-mobile-test/book-zone-snapshot-v01.js').read_text(encoding='utf-8')
          template = Path('siza-world-engine/overlay/web/templates/webclient/webclient.html').read_text(encoding='utf-8')

          required = [
              '.arenaHalf.enemyHalf',
              'top: 56px !important',
              '.arenaHalf.playerHalf',
              'top: 170px !important',
              '.arenaHalf .arenaZones',
              'height: 28px !important',
              '.arenaHalf .arenaField',
              'height: 86px !important',
              'left: 100px !important',
              'right: 320px !important',
              '.stackAnchorV5:empty',
              'display: none !important',
              '.manifestInlineV5.manifestStageV600',
              'top: 150px !important',
              '.matchBoardV5 .matchLog',
              'left: auto !important',
              'width: 294px !important',
              'background: rgba(29,19,13,.88) !important',
              '.handAreaV5',
              'height: 114px !important',
              '.creatureCommandDockV610',
              'right: 92px !important',
              'object-fit: contain !important',
          ]
          for token in required:
              assert token in css, f'missing non-overlap battlefield contract: {token}'

          for selector in ['.arenaHalf .arenaMag', '.arenaHalf .arenaMagSlot', '.arenaHalfLabelV610', '.emptyFieldV5', '.phaseBannerV600']:
              assert selector in css, f'missing suppression selector: {selector}'

          for token in [
              '.bookTcgZoneDock-enemy',
              '.bookTcgZoneDock-player',
              '.bookTcgPile',
              '.bookEnemyHandV03',
              '.bookEnemyCardBackV03',
              '.bookEnemyHandCountV03',
              'content: "MANO RIVAL"',
              'visibility: visible !important',
              '.sizaCombatReadoutV02',
              'content: "RIVAL ACTÚA"',
              'content: "TU ACTÚAS"',
          ]:
              assert token in docks, f'missing rival-hand/phase presentation: {token}'

          for token in ['hand', 'library', 'graveyard', 'exile']:
              assert token in snap, f'missing read-only Arena zone snapshot: {token}'

          forbidden = [
              'SUPPORT · ARTIFACTS',
              'ENEMY INVOCATIONS / BATTLE SPRITES',
              'YOUR INVOCATIONS / BATTLE SPRITES',
              'STACK / EFFECTS',
              'border: 1px dashed',
              'object-fit: cover !important',
          ]
          for token in forbidden:
              assert token not in css, f'fake/debug card-table presentation returned: {token}'

          assert '0.3.4-book-battlefield-non-overlap' in js
          assert 'siza_tcg_battlefield_v03.css?v=0340' in js
          assert 'siza_tcg_zone_docks_v01.css?v=0120' in js
          assert 'book-zone-snapshot-v01.js?v=0110' in js
          assert 'bookEnemyHandV03' in js
          assert 'snapshot.enemy' in js
          assert 'Math.min(count, 10)' in js
          assert 'siza-book-battlefield-v02' in js
          assert 'siza_tcg_battlefield_v03.js' in template
          assert 'siza_tcg_battlefield_v02.js' not in template
          assert template.index('siza_tcg_embed_v01.js') < template.index('siza_tcg_battlefield_v03.js')

          print('PASS rival and player battlefield planes have separate fixed vertical lanes')
          print('PASS Manafestation/dice/Stack use the neutral centre instead of player hand space')
          print('PASS combat history explicitly defeats the old full-width parchment strip')
          print('PASS player hand, resources, command dock and end-turn own separate bottom regions')
          print('PASS rival hand is forced visible from authoritative enemy.hand count')
          print('PASS active actor/phase readout is explicit and original tiny phase pill is suppressed')
          print('PASS full card renderer remains uncropped and no fake debug zones returned')
          PY
