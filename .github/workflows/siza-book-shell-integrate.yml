name: SIZA Adventure Book Shell integration

on:
  push:
    paths:
      - .github/workflows/siza-book-shell-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch current frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('siza-mobile-test/index.html')
          text = path.read_text(encoding='utf-8')

          if 'adventure-book-shell-v01.css' not in text:
              marker = '</head>'
              assert marker in text, 'head marker missing'
              text = text.replace(marker, '<link rel="stylesheet" href="adventure-book-shell-v01.css">\n' + marker, 1)

          if 'adventure-book-shell-renderer-v01.js' not in text:
              marker = "<script>\nconst NEREIDA_IMG="
              assert marker in text, 'main script marker missing'
              modules = (
                  '<script src="adventure-book-shell-v01.js"></script>\n'
                  '<script src="adventure-book-shell-adapter-v01.js"></script>\n'
                  '<script src="adventure-book-shell-renderer-v01.js"></script>\n'
              )
              text = text.replace(marker, modules + marker, 1)

          if 'function adventurePresentationModeV01' not in text:
              pattern = re.compile(r'function renderAdventure\(\)\{.*?\}\nfunction adventureChoice', re.S)
              replacement = r'''function adventurePresentationModeV01(e){return e?.id==='smugglers'?SizaBookShellV1.MODES.DIALOGUE:SizaBookShellV1.MODES.EXPLORATION}
          function adventureCounterpartV01(e){return e?.id==='smugglers'?{id:'smuggler',name:'Magistócrata contrabandista',title:'Interlocutor',portrait:'',status:[]}:null}
          function renderAdventure(){const a=state.adventure,e=currentAdventureEvent(),mode=adventurePresentationModeV01(e);const clues=EVENTS.map(x=>({text:x.clue,found:!!a.flags[x.id+'Resolved']}));const model=SizaBookShellAdapterV1.adventure({state,event:e,mode,playerPortrait:NEREIDA_IMG,counterpart:adventureCounterpartV01(e),meta:{chapter:mode===SizaBookShellV1.MODES.DIALOGUE?'DIÁLOGO':'EXPLORACIÓN',location:'Muelle Viejo',region:'Puerto de Salmuera',condition:a.landState},prompt:'¿Qué haces?'});const sceneHtml=`<div class="sceneVisual bookLegacySceneV01"><div class="dockShapes"><i class="house2"></i><i class="house1"></i><i class="tower"></i><div class="waterline"></div></div><div class="sceneLabel"><div class="eyebrow">Puerto de Salmuera · ${esc(a.landState)}</div><h2>${esc(e.title)}</h2></div></div>`;const actionsHtml=`<div class="bookActionsV01">${e.choices.map((c,i)=>`<button class="bookActionV01" onclick="SIZA.adventureChoice(${i})"><b>${esc(c.label)}</b><span>${esc(c.hint||'')}</span></button>`).join('')}</div>`;const supportHtml=`<div class="bookSupportV01"><div class="bookSupportGridV01"><section class="panel objectiveBox"><div class="eyebrow">Objective</div><h3>Los desaparecidos del puerto</h3><p>Descubre qué está ocurriendo bajo el Muelle Viejo. El Advance desbloquea el clímax; no completa la Tierra automáticamente.</p><div class="progress"><span style="width:${Math.min(100,a.advance/5*100)}%"></span></div><div class="chip gold">${a.advance}/5 Advance</div><div class="clues">${clues.map(c=>`<div class="clue ${c.found?'found':''}">${c.found?'◆':'◇'} ${esc(c.text)}</div>`).join('')}</div></section><section class="panel masterPulse"><div class="eyebrow">Master Pulse</div><div class="pulseRow"><span>Land State</span><b>${esc(a.landState)}</b></div><div class="pulseRow"><span>Event Priority</span><b>${e.id==='final'?'FORCED':'REACTIVE'}</b></div><div class="pulseRow"><span>Eligible Pool</span><b>${EVENTS.filter(x=>x.requires(a)).length}</b></div><div class="pulseRow"><span>Flags</span><b>${Object.keys(a.flags).filter(k=>a.flags[k]).length}</b></div></section><section class="panel pad"><div class="eyebrow">Journal</div><div class="journalList">${a.journal.length?a.journal.slice().reverse().map(j=>`<div class="journalItem"><b>${esc(j.title)}</b>${esc(j.text)}</div>`).join(''):'<div class="muted" style="font-size:10px;margin-top:10px">Aún no hay entradas.</div>'}</div></section></div></div>`;return SizaBookShellRendererV1.render(model,{sceneHtml,actionsHtml,overlaysHtml:supportHtml})}
          function adventureChoice'''
              text, count = pattern.subn(replacement, text, count=1)
              assert count == 1, f'renderAdventure replacement count={count}'

          if 'SizaBookShellAdapterV1.combat({state' not in text:
              old = ";return shell(body,'Siza Arena',`Reglas v${RULES_VERSION}`,`<span class=\"chip\">${ENTRY_V070[M.rules.entryMode].short}</span>`)}"
              new = ";const model=SizaBookShellAdapterV1.combat({state,playerPortrait:NEREIDA_IMG,rivalName:'Rival',meta:{chapter:'COMBATE',location:M.adventure?'Muelle Viejo':'Siza Arena',region:M.adventure?'Puerto de Salmuera':'',condition:label,sceneTitle:'Enfrentamiento'}});return SizaBookShellRendererV1.render(model,{sceneHtml:body,narrativeHtml:'',actionsHtml:''})}"
              assert old in text, 'renderMatchV600 return marker missing'
              text = text.replace(old, new, 1)

          required = [
              'adventure-book-shell-v01.css',
              'adventure-book-shell-v01.js',
              'adventure-book-shell-adapter-v01.js',
              'adventure-book-shell-renderer-v01.js',
              'function adventurePresentationModeV01',
              'SizaBookShellAdapterV1.combat({state'
          ]
          for token in required:
              assert token in text, f'missing integration token: {token}'

          path.write_text(text, encoding='utf-8')

          scripts = [x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S) if x.strip()]
          assert scripts, 'inline runtime script missing'
          Path('/tmp/siza-main.js').write_text(scripts[-1], encoding='utf-8')
          PY

      - name: Validate syntax and delta
        shell: bash
        run: |
          node --check /tmp/siza-main.js
          git diff --check
          grep -q 'adventure-book-shell-v01.css' siza-mobile-test/index.html
          grep -q 'SizaBookShellAdapterV1.adventure' siza-mobile-test/index.html
          grep -q 'SizaBookShellAdapterV1.combat' siza-mobile-test/index.html

      - name: Commit integration and remove migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siza-mobile-test/index.html
          git rm .github/workflows/siza-book-shell-integrate.yml
          git diff --cached --check
          git commit -m "Integrate Adventure Book Shell into Adventure and Combat"
          git pull --rebase origin main
          git push origin main
