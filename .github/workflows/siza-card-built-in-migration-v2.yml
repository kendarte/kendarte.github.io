name: Siza Built-in Card Renderer Migration v2

on:
  push:
    paths:
      - '.github/workflows/siza-card-built-in-migration-v2.yml'

permissions:
  contents: write

jobs:
  migrate-card-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Install transformation dependencies
        run: npm install --no-save acorn@8 jsdom@24

      - name: Execute corrected guarded migration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const {execFileSync}=require('child_process');
          const fs=require('fs');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN;
          const url=`https://api.github.com/repos/${repo}/contents/.github/workflows/siza-card-built-in-migration.yml?ref=main`;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          (async()=>{
            const r=await fetch(url,{headers});if(!r.ok)throw new Error(`GET ${r.status}: ${await r.text()}`);
            const f=await r.json(),yaml=Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8');
            const start=yaml.indexOf("          node <<'NODE'\n");
            const end=yaml.lastIndexOf('\n          NODE');
            if(start<0||end<0||end<=start)throw new Error('Could not extract migration script');
            let code=yaml.slice(start+"          node <<'NODE'\n".length,end).split('\n').map(line=>line.startsWith('          ')?line.slice(10):line).join('\n');
            const anchor='const core=dom.window.SIZA.runArenaCriticalV071();';
            if((code.split(anchor).length-1)!==1)throw new Error('Core validation anchor mismatch');
            code=code.replace(anchor,"dom.window.SIZA.reset();\n            const core=dom.window.SIZA.runArenaCriticalV071();");
            fs.writeFileSync('/tmp/siza-card-migrate.js',code,'utf8');
            execFileSync('node',['/tmp/siza-card-migrate.js'],{stdio:'inherit',env:process.env});
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE