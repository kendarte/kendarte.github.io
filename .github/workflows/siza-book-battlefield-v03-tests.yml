name: SIZA Book Battlefield v0.3 Tests

on:
  push:
    paths:
      - 'siza-world-engine/overlay/web/static/webclient/css/siza_tcg_battlefield_v03.css'
      - 'siza-world-engine/overlay/web/static/webclient/css/siza_tcg_zone_docks_v01.css'
      - 'siza-world-engine/overlay/web/static/webclient/js/siza_tcg_battlefield_v03.js'
      - 'siza-mobile-test/book-zone-snapshot-v01.js'
      - 'siza-world-engine/overlay/web/templates/webclient/webclient.html'
      - '.github/workflows/siza-book-battlefield-v03-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battlefield-layout-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate RPG scene TCG zone contract
        shell: bash
        run: |
          node --check siza-world-engine/overlay/web/static/webclient/js/siza_tcg_battlefield_v03.js
          node --check siza-mobile-test/book-zone-snapshot-v01.js
          python - <<'PY'
          from pathlib import Path

          css = Path('siza-world-engine/overlay/web/static/webclient/css/siza_tcg_battlefield_v03.css').read_text(encoding='utf-8')
          docks = Path('siza-world-engine/overlay/web/static/webclient/css/siza_tcg_zone_docks_v01.css').read_text(encoding='utf-8')
          js = Path('siza-world-engine/overlay/web/static/webclient/js/siza_tcg_battlefield_v03.js').read_text(encoding='utf-8')
          snap = Path('siza-mobile-test/book-zone-snapshot-v01.js').read_text(encoding='utf-8')
          template = Path('siza-world-engine/overlay/web/templates/webclient/webclient.html').read_text(encoding='utf-8')

          required = [
              '.arenaHalf.enemyHalf',
              'top: 8px !important',
              '.arenaHalf.playerHalf',
              'top: 164px !important',
              '.arenaHalf .arenaZones',
              'height: 48px !important',
              '.arenaHalf .arenaField',
              'height: 116px !important',
              'left: 110px !important',
              'right: 110px !important',
              '.stackAnchorV5:empty',
              'display: none !important',
              '.matchBoardV5 .matchLog',
              '.handAreaV5',
              'object-fit: contain !important',
          ]
          for token in required:
              assert token in css, f'missing RPG/TCG battlefield contract: {token}'

          for selector in ['.arenaHalf .arenaMag', '.arenaHalf .arenaMagSlot', '.arenaHalfLabelV610', '.emptyFieldV5']:
              assert selector in css, f'missing suppression selector: {selector}'

          for token in ['.bookTcgZoneDock-enemy', '.bookTcgZoneDock-player', '.bookTcgPile', '.bookTcgPileCount']:
              assert token in docks, f'missing compact deck-state dock styling: {token}'

          for token in ['library', 'graveyard', 'exile']:
              assert token in snap, f'missing read-only Arena zone snapshot: {token}'

          forbidden = [
              'SUPPORT · ARTIFACTS',
              'ENEMY INVOCATIONS / BATTLE SPRITES',
              'YOUR INVOCATIONS / BATTLE SPRITES',
              'STACK / EFFECTS',
              'border: 1px dashed',
              'object-fit: cover !important',
          ]
          for token in forbidden:
              assert token not in css, f'fake/debug card-table presentation returned: {token}'

          assert '0.3.2-book-battlefield-rpg-tcg-zones' in js
          assert 'siza_tcg_battlefield_v03.css?v=0320' in js
          assert 'siza_tcg_zone_docks_v01.css?v=0100' in js
          assert 'book-zone-snapshot-v01.js?v=0100' in js
          assert 'siza-book-battlefield-v02' in js
          assert 'siza_tcg_battlefield_v03.js' in template
          assert 'siza_tcg_battlefield_v02.js' not in template
          assert template.index('siza_tcg_embed_v01.js') < template.index('siza_tcg_battlefield_v03.js')

          print('PASS duplicate field portraits and debug lane labels are suppressed')
          print('PASS real permanent and creature planes use RPG-scene depth')
          print('PASS Library/Graveyard/Exile piles occupy the reserved side gutters')
          print('PASS Stack is transient and hand/log/HUD remain separate')
          print('PASS current full card renderer remains uncropped')
          PY
