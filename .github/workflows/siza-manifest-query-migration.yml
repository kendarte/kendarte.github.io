name: Siza Manifest Query Migration

on:
  push:
    paths:
      - '.github/workflows/siza-manifest-query-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-manifest-queries:
    runs-on: ubuntu-latest
    steps:
      - name: Install JSDOM
        run: npm install --no-save jsdom@24

      - name: Validate old/new and publish runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,api=`https://api.github.com/repos/${repo}`;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function get(path){const r=await fetch(`${api}/contents/${path}?ref=main`,{headers});if(!r.ok)throw new Error(`${path}: GET ${r.status}`);const f=await r.json();return{sha:f.sha,text:Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}}
          function inline(html,files){let out=html;for(const name of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js','creature-rules.js']){const tag=`<script src="../siza-core/${name}"></script>`;if(!out.includes(tag))throw new Error(`Missing ${name}`);out=out.replace(tag,`<script>${files[name]}</script>`)}return out}
          function dom(html,label){const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error(`[JSDOM ${label}]`,e.message));const d=new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc});d.window.setTimeout=()=>0;return d}
          (async()=>{
            const current=await get('siza-mobile-test/index.html'),files={};for(const n of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js','creature-rules.js'])files[n]=(await get(`siza-core/${n}`)).text;
            const oldDeficit="function deficitV070(m,P){return Math.max(0,m.dc-(P.mf+(m.roll||0)+(m.prismBonus||0)+(m.burnSelected?.length||0)))}";
            const oldSources="function manifestBonusSourcesV1(P,c){const spent=new Set(P?.artifactExhausted||[]),out=[];(P?.artifacts||[]).forEach((id,index)=>{if(spent.has(index))return;const source=cardById(id);for(const effect of SizaCardEffects.forEvent(source,'manifest-roll')){if(effect.type!=='manifest-bonus'||!(effect.amount>0))continue;if(effect.requiresPip&&!(c?.pips?.[effect.requiresPip]>0))continue;out.push({index,id,source,effect})}});return out}";
            assert(current.text.includes(oldDeficit)&&current.text.includes(oldSources),'Manifest query anchors changed');
            const candidate=current.text.replace(oldDeficit,'function deficitV070(m,P){return SizaManifestRules.deficit(m,P)}').replace(oldSources,"function manifestBonusSourcesV1(P,c){return SizaManifestRules.bonusSources(P,c,cardById,SizaCardEffects.forEvent)}");
            const marker='window.SIZA={',probe=`window.__MANIFEST_QUERY_COMPARE__={cardById,TEST_CARD_DB_V1,deficitV070,manifestBonusSourcesV1};\n`;assert(current.text.includes(marker),'SIZA marker missing');
            const O=dom(inline(current.text,files).replace(marker,probe+marker),'old'),N=dom(inline(candidate,files).replace(marker,probe+marker),'new'),o=O.window.__MANIFEST_QUERY_COMPARE__,n=N.window.__MANIFEST_QUERY_COMPARE__;
            let comparisons=0;
            const deficitCases=[
              [{dc:8,roll:1,prismBonus:0,burnSelected:[0,1,2,3,4]},{mf:2}],
              [{dc:7,roll:3,prismBonus:1,burnSelected:[]},{mf:2}],
              [{dc:9,roll:null,prismBonus:0,burnSelected:[]},{mf:2}],
              [{dc:6,roll:6,prismBonus:2,burnSelected:[4]},{mf:3}]
            ];
            for(const[m,p]of deficitCases){const a=o.deficitV070(JSON.parse(JSON.stringify(m)),JSON.parse(JSON.stringify(p))),b=n.deficitV070(JSON.parse(JSON.stringify(m)),JSON.parse(JSON.stringify(p)));assert(a===b,`deficit mismatch ${JSON.stringify(m)} ${a}/${b}`);comparisons++}
            const generated={id:'guard_manifest_bonus',name:'Guard Focus',type:'Artifact',effects:[{event:'manifest-roll',type:'manifest-bonus',amount:2,requiresPip:'U',exhaustSource:true}]};o.TEST_CARD_DB_V1.push({...generated});n.TEST_CARD_DB_V1.push({...generated});
            const sourceCases=[
              [{artifacts:['prism'],artifactExhausted:[]},{pips:{U:1}}],
              [{artifacts:['prism'],artifactExhausted:[0]},{pips:{U:1}}],
              [{artifacts:['prism'],artifactExhausted:[]},{pips:{R:1}}],
              [{artifacts:['guard_manifest_bonus'],artifactExhausted:[]},{pips:{U:2}}],
              [{artifacts:['prism','guard_manifest_bonus'],artifactExhausted:[0]},{pips:{U:1}}]
            ];
            const norm=list=>list.map(x=>({index:x.index,id:x.id,sourceId:x.source?.id,effect:{type:x.effect.type,event:x.effect.event,amount:x.effect.amount,requiresPip:x.effect.requiresPip,exhaustSource:x.effect.exhaustSource}}));
            for(const[p,c]of sourceCases){const a=norm(o.manifestBonusSourcesV1(JSON.parse(JSON.stringify(p)),c)),b=norm(n.manifestBonusSourcesV1(JSON.parse(JSON.stringify(p)),c));assert(JSON.stringify(a)===JSON.stringify(b),`bonus sources mismatch ${JSON.stringify(p)} ${JSON.stringify(c)} :: ${JSON.stringify(a)}/${JSON.stringify(b)}`);comparisons++}
            const arena=N.window.SIZA.runArenaCriticalV071();assert(arena.passed===arena.total,`Arena ${arena.passed}/${arena.total}`);console.log(`PASS manifest queries old/new ${comparisons} comparisons; Arena ${arena.passed}/${arena.total}`);O.window.close();N.window.close();
            const put=await fetch(`${api}/contents/siza-mobile-test/index.html`,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Use shared manifest roll queries',content:Buffer.from(candidate).toString('base64'),sha:current.sha,branch:'main'})});if(!put.ok)throw new Error(`PUT ${put.status}: ${await put.text()}`);const result=await put.json();console.log('COMMIT '+result.commit.sha);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
