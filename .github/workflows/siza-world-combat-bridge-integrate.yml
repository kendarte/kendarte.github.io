name: SIZA World Combat Bridge Integrate

on:
  push:
    paths:
      - '.github/scripts/patch-siza-world-combat-bridge-v01.js'
      - '.github/workflows/siza-world-combat-bridge-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply exact integration patch
        run: node .github/scripts/patch-siza-world-combat-bridge-v01.js

      - name: Validate bridge syntax and contract
        run: |
          node --check siza-mobile-test/world-combat-bridge-v01.js
          node .github/scripts/siza-world-combat-bridge-regression.js
          node --check .github/scripts/patch-siza-world-combat-bridge-v01.js

      - name: Validate integration anchors
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('siza-mobile-test/index.html','utf8');
          const required=[
            '<script src="world-combat-bridge-v01.js"></script>',
            "function createMatch(adventure=false,mode='prepare',worldEncounter=null)",
            'function startWorldEncounter(',
            'function getWorldCombatResult()',
            'SizaWorldCombatBridgeV01.emitResult(M)',
            'startWorldEncounter,getWorldCombatResult'
          ];
          for(const token of required)if(!html.includes(token))throw new Error('Missing '+token);
          console.log('PASS World Combat Bridge integration anchors');
          NODE
          git diff --check

      - name: Commit integrated runtime
        run: |
          if git diff --quiet -- siza-mobile-test/index.html; then
            echo "index.html already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siza-mobile-test/index.html
          git commit -m "Integrate World Combat Bridge v0.1 into SIZA Arena"
          git push origin HEAD:main
