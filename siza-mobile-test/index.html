function totalDeck(){return Object.values(state.deck.counts).reduce((a,b)=>a+b,0)}
function landCount(){return Object.entries(state.deck.counts).reduce((n,[id,c])=>n+(cardById(id)?.type==='Land'?c:0),0)}
function affinityInfo(c,m=state.player.mag){let penalty=0,unsupported=[];for(const [k,v] of Object.entries(c.pips||{})){if(v<=0)continue;const a=m.aff[k]||0;if(a===0)unsupported.push(k);else if(v>a)penalty+=v-a}return {penalty,unsupported}}
function dcFor(c,m=state.player.mag){const ai=affinityInfo(c,m);if(ai.unsupported.length)return Infinity;return c.difficulty??(4+Math.ceil((c.cost+1)/2))}
function naturalChance(c,m=state.player.mag){if(c.type==='Land')return 100;const dc=dcFor(c,m);if(!isFinite(dc))return 0;const need=dc-m.mf;if(need<=1)return 100;if(need>6)return 0;return Math.round((7-need)/6*100)}
function manifestRequirement(c,m=state.player.mag){const dc=dcFor(c,m);if(!isFinite(dc))return {unsupported:true,text:'SIN AFINIDAD',die:0,minBurn:0};const raw=dc-m.mf,minBurn=Math.max(0,raw-6),die=Math.max(1,Math.min(6,raw));return {unsupported:false,die,minBurn,text:minBurn?`${die}+ · Burn mínimo ${minBurn}`:`${die}+`}}

function enemyAfterMain(){const M=state.match;if(!M||M.over||M.active!=='enemy'||state.modal||M.responseWindow||M.combat)return;const E=M.enemy;M.enemyStage='combat';E.combatUsed=true;const attackers=E.battlefield.map((id,index)=>cardById(id)?.type==='Creature'?{index,id}:null).filter(Boolean);E.exhausted=attackers.map(a=>a.index);if(!attackers.length){M.phase='Combate rival';addLog('Combate rival','El rival no tiene Invocaciones para atacar.');save();render();return setTimeout(enemyPhysicalStep,620)}M.combat={owner:'enemy',attackers,blockers:{},status:'defense'};M.active='defense';M.phase='Tu Defensa';addLog('Ataque rival',`${attackers.length} Invocación${attackers.length===1?'':'es'} ataca${attackers.length===1?'':'n'}. Ahora eliges los bloqueos.`);save();render()}
function enemyPhysicalStep(){const M=state.match;if(!M||M.over||M.active!=='enemy'||M.combat)return;const E=M.enemy,P=M.player;M.enemyStage='physical';M.phase='Acción rival';if(!E.successful){const ar=d6(),dr=d6(),a=E.prow+ar,d=P.eva+dr;if(a>d){P.life-=1;setDamageFx('player',1,M.adventure?'Contrabandista':'Rival',state.player.mag.name);addLog('Acción Física rival',`PROW ${E.prow}+d6(${ar}) = ${a} vence EVA ${P.eva}+d6(${dr}) = ${d}. ${state.player.mag.name} recibe 1 daño.`)}else addLog('Acción Física rival',`PROW ${E.prow}+d6(${ar}) = ${a} no supera EVA ${P.eva}+d6(${dr}) = ${d}.`);checkWin()}else addLog('Acción rival','El rival ya tuvo una Manafestation proactiva exitosa; no obtiene Acción Física.');save();render();if(!M.over)setTimeout(finishEnemyTurn,650)}
function finishEnemyTurn(){const M=state.match;if(!M||M.over)return;const P=M.player;M.turn++;M.active='player';M.phase='Main';M.enemyStage=null;M.responseWindow=null;M.combat=null;M.ui=M.ui||{};M.ui.hand=-1;M.ui.creature=-1;M.ui.attackMode=false;M.ui.attackers=[];M.ui.fieldFocus=null;P.proactiveOpen=true;P.manifestActions=2;P.combatUsed=false;P.successful=false;P.physicalUsed=false;P.exhausted=[];drawCards(P,1);addLog('Turno',`Comienza tu turno ${M.turn}. Robas una carta y recuperas 2 acciones de Manafestation.`);save();render();toast(`Tu turno ${M.turn}: 2 acciones de Manafestation.`,'gold')}
function checkWin(){const M=state.match;if(M.player.life<=0||M.enemy.life<=0){M.over=true;M.winner=M.player.life>0?'player':'enemy';addLog('Match',`${M.winner==='player'?'Victoria':'Derrota'}.`);if(M.adventure&&M.winner==='player'){state.adventure.flags.smugglersResolved=true;state.adventure.advance=Math.min(5,state.adventure.advance+2);journal('Siza Encounter','Derrotaste al Magistócrata contrabandista. La escalera inferior quedó abierta.');state.adventure.currentEvent=null;chooseAdventureEvent()}}}
function returnAdventure(){state.match=null;state.route='adventure';save();render();toast('Resultado devuelto al Adventure Engine.','gold')}

if(state.match&&!state.match.over&&state.match.active==='enemy'&&!state.modal)setTimeout(enemyTurn,650);
