name: Siza Card Handoff Tests

on:
  push:
    paths:
      - 'siza-core/**'
      - 'siza-card-generator/**'
      - 'siza-mobile-test/index.html'
      - '.github/workflows/siza-card-handoff-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save jsdom@24
      - name: Run Generator → Collection → Deck contract
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const {JSDOM,VirtualConsole}=require('jsdom');const repo=process.env.GH_REPOSITORY,sha=process.env.GH_SHA,token=process.env.GH_TOKEN,headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function get(path){const r=await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${sha}`,{headers});if(!r.ok)throw new Error(`${path}: ${r.status}`);const f=await r.json();return Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}
          (async()=>{let html=await get('siza-mobile-test/index.html'),effects=await get('siza-core/card-effects.js'),schema=await get('siza-core/card-schema.js'),renderer=await get('siza-core/card-renderer.js'),catalog=await get('siza-core/cards.js'),manifest=await get('siza-core/manifest-rules.js'),crystal=await get('siza-core/crystal-rules.js'),entry=await get('siza-core/entry-rules.js'),creature=await get('siza-core/creature-rules.js');if(html.includes('<script src="../siza-core/card-effects.js"></script>'))html=html.replace('<script src="../siza-core/card-effects.js"></script>',`<script>${effects}</script>`);html=html.replace('<script src="../siza-core/card-schema.js"></script>',`<script>${schema}</script>`).replace('<script src="../siza-core/card-renderer.js"></script>',`<script>${renderer}</script>`);if(html.includes('<script src="../siza-core/cards.js"></script>'))html=html.replace('<script src="../siza-core/cards.js"></script>',`<script>${catalog}</script>`);if(html.includes('<script src="../siza-core/manifest-rules.js"></script>'))html=html.replace('<script src="../siza-core/manifest-rules.js"></script>',`<script>${manifest}</script>`);if(html.includes('<script src="../siza-core/crystal-rules.js"></script>'))html=html.replace('<script src="../siza-core/crystal-rules.js"></script>',`<script>${crystal}</script>`);if(html.includes('<script src="../siza-core/entry-rules.js"></script>'))html=html.replace('<script src="../siza-core/entry-rules.js"></script>',`<script>${entry}</script>`);if(html.includes('<script src="../siza-core/creature-rules.js"></script>'))html=html.replace('<script src="../siza-core/creature-rules.js"></script>',`<script>${creature}</script>`);else html=html.replace('<script>\nconst NEREIDA_IMG=',`<script>${creature}</script>\n<script>\nconst NEREIDA_IMG=`);const marker='window.SIZA={';assert(html.includes(marker),'SIZA export marker missing');html=html.replace(marker,`window.__HANDOFF_CONTRACT__={getState:()=>state,cardById,allCardsV1,renderCollection,renderDeck,CARD_DB,TEST_CARD_DB_V1};\n`+marker);const payload={action:'test-card',target:'collection',card:{id:'generator_contract',name:'Contrato Generator',type:'Creature',subtype:'Test',cost:2,difficulty:6,pips:{U:1},power:2,toughness:3,text:'Carta temporal.',flavor:'No canónica.',art:'blue',glyph:'G',artUrl:'../assets/cards/art/contract.webp',artTransform:{x:42,y:33,scale:1.1},effects:[{event:'enter',type:'draw',target:'self',amount:1}]},generatorCard:{id:'generator_contract',name:'Contrato Generator',cardType:'Creature',subtype:'Test',affinity:'azul',cost:2,difficulty:6,pips:{U:1},force:2,resistance:3,rules:'Carta temporal.',flavor:'No canónica.',artUrl:'../assets/cards/art/contract.webp',artTransform:{x:42,y:33,scale:1.1},effects:[{event:'enter',type:'draw',target:'self',amount:1}]}};const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error('[JSDOM]',e.message));const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc,beforeParse(w){w.localStorage.setItem('siza_card_generator_handoff_v1',JSON.stringify(payload))}});dom.window.setTimeout=()=>0;const H=dom.window.__HANDOFF_CONTRACT__,S=H.getState(),c=H.cardById('generator_contract');const results=[],test=(n,fn)=>{try{results.push({n,pass:!!fn()})}catch(e){results.push({n,pass:false,error:e.message})}};
            test('CARD_DB oficial permanece en 13',()=>H.CARD_DB.length===13);
            test('Carta temporal carga separada con effects',()=>H.TEST_CARD_DB_V1.length===1&&c?.generatorTest===true&&c.effects?.[0]?.type==='draw');
            test('Collection recibe y renderiza carta',()=>S.collection.includes('generator_contract')&&H.renderCollection().includes('Contrato Generator')&&H.renderCollection().includes('Editar en Card Generator'));
            test('Arte separado llega al renderer',()=>H.renderCollection().includes('contract.webp'));
            test('Carta temporal entra al Deck sin exceder 60',()=>{S.deck.counts.dock=11;dom.window.SIZA.deckDelta('generator_contract',1);return S.deck.counts.generator_contract===1&&Object.values(S.deck.counts).reduce((a,b)=>a+b,0)===60&&H.renderDeck().includes('Contrato Generator')});
            test('Arena sigue su contrato',()=>{const r=dom.window.SIZA.runArenaCriticalV071();return r.passed===r.total});
            for(const r of results)console.log(`${r.pass?'PASS':'FAIL'} ${r.n}${r.error?` :: ${r.error}`:''}`);const passed=results.filter(x=>x.pass).length;console.log(`SIZA handoff ${passed}/${results.length}`);dom.window.close();if(passed!==results.length)process.exit(1);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
