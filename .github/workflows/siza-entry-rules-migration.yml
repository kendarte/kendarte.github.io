name: Siza Entry Rules Migration

on:
  push:
    paths:
      - '.github/workflows/siza-entry-rules-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-entry-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Install JSDOM
        run: npm install --no-save jsdom@24

      - name: Validate old/new and publish runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,api=`https://api.github.com/repos/${repo}`;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          const assert=(value,message)=>{if(!value)throw new Error(message)};
          async function get(path){const r=await fetch(`${api}/contents/${path}?ref=main`,{headers});if(!r.ok)throw new Error(`${path}: GET ${r.status}`);const f=await r.json();return{sha:f.sha,text:Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}}
          function inlineCore(html,files){let out=html;for(const name of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js']){const tag=`<script src="../siza-core/${name}"></script>`;if(!out.includes(tag)){if(name==='entry-rules.js')continue;throw new Error(`Missing ${name}`)}out=out.replace(tag,`<script>${files[name]}</script>`)}return out}
          function makeDom(html,label){const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error(`[JSDOM ${label}]`,e.message));const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc});dom.window.setTimeout=()=>0;return dom}
          (async()=>{
            const current=await get('siza-mobile-test/index.html'),files={};
            for(const name of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js'])files[name]=(await get(`siza-core/${name}`)).text;
            const regression=await get('.github/scripts/siza-entry-rules-regression.js');
            const crystalTag='<script src="../siza-core/crystal-rules.js"></script>';
            const entryTag='<script src="../siza-core/entry-rules.js"></script>';
            const oldEntry="const ENTRY_V070={immediate:{short:'ENTRADA INMEDIATA',text:'Todas pueden atacar al entrar.'},prepare:{short:'PREPARACIÓN UNIVERSAL',text:'Esperan hasta el próximo turno propio.'},oneCrystal:{short:'IMPULSO DE 1 CRISTAL',text:'Las de un cristal atacan al entrar.'}};";
            const oldPreparing="function preparingV070(P,i){const M=state.match,c=cardById(P.battlefield[i]),born=P.summonedOn?.[i]??P.ownTurn,mode=M?.rules?.entryMode||'prepare';if(born<P.ownTurn||mode==='immediate')return false;if(mode==='oneCrystal'&&spellCostV070(c)===1)return false;return true}";
            const oldCanAttack="function canAttackV070(P,i){return cardById(P.battlefield[i])?.type==='Creature'&&!(P.exhausted||[]).includes(i)&&!preparingV070(P,i)}";
            const oldAvailable="function availableAttackersV610(){const P=state.match?.player;return P?P.battlefield.map((_,i)=>canAttackV070(P,i)?i:-1).filter(i=>i>=0):[]}";
            const oldBlockers="function legalBlockersV070(P){return P.battlefield.map((id,i)=>cardById(id)?.type==='Creature'&&!(P.exhausted||[]).includes(i)?i:-1).filter(i=>i>=0)}";
            for(const anchor of[crystalTag,oldEntry,oldPreparing,oldCanAttack,oldAvailable,oldBlockers])assert(current.text.includes(anchor),`Runtime anchor changed: ${anchor.slice(0,45)}`);
            let candidate=current.text.replace(crystalTag,crystalTag+'\n'+entryTag)
              .replace(oldEntry,'const ENTRY_V070=SizaEntryRules.MODES;')
              .replace(oldPreparing,"function preparingV070(P,i){const mode=state.match?.rules?.entryMode||'prepare';return SizaEntryRules.isPreparing(P,i,mode,cardById,spellCostV070)}")
              .replace(oldCanAttack,"function canAttackV070(P,i){const mode=state.match?.rules?.entryMode||'prepare';return SizaEntryRules.canAttack(P,i,mode,cardById,spellCostV070)}")
              .replace(oldAvailable,"function availableAttackersV610(){const P=state.match?.player,mode=state.match?.rules?.entryMode||'prepare';return P?SizaEntryRules.availableAttackers(P,mode,cardById,spellCostV070):[]}")
              .replace(oldBlockers,'function legalBlockersV070(P){return SizaEntryRules.legalBlockers(P,cardById)}');
            const marker='window.SIZA={',probe=`window.__ENTRY_COMPARE__={createMatch,setMatch:m=>state.match=m,preparingV070,canAttackV070,availableAttackersV610,legalBlockersV070,ENTRY_V070,TEST_CARD_DB_V1};\n`;
            assert(current.text.includes(marker)&&candidate.includes(marker),'SIZA marker missing');
            const O=makeDom(inlineCore(current.text,files).replace(marker,probe+marker),'old');
            const N=makeDom(inlineCore(candidate,files).replace(marker,probe+marker),'new');
            const o=O.window.__ENTRY_COMPARE__,n=N.window.__ENTRY_COMPARE__;
            const generated=[
              {id:'reg_entry_one',name:'One',type:'Creature',cost:9,difficulty:1,pips:{U:1},power:1,toughness:1,text:'One.',art:'multi',glyph:'1',effects:[]},
              {id:'reg_entry_two',name:'Two',type:'Creature',cost:1,difficulty:1,pips:{U:2},power:2,toughness:2,text:'Two.',art:'multi',glyph:'2',effects:[]},
              {id:'reg_entry_artifact',name:'Artifact',type:'Artifact',cost:1,difficulty:1,pips:{},text:'Artifact.',art:'multi',glyph:'A',effects:[]}
            ];
            o.TEST_CARD_DB_V1.push(...generated.map(x=>({...x})));n.TEST_CARD_DB_V1.push(...generated.map(x=>({...x})));
            assert(JSON.stringify(o.ENTRY_V070)===JSON.stringify(n.ENTRY_V070),'Entry mode metadata mismatch');
            let comparisons=0;
            for(const mode of['prepare','immediate','oneCrystal'])for(const exhausted of[[],[0],[1],[2]]){
              const om=o.createMatch(false,mode),nm=n.createMatch(false,mode);o.setMatch(om);n.setMatch(nm);
              const base={battlefield:['reg_entry_one','reg_entry_two','reg_entry_artifact'],powerCounters:[0,0,0],summonedOn:[3,3,2],exhausted:[...exhausted],ownTurn:3};
              Object.assign(om.player,JSON.parse(JSON.stringify(base)));Object.assign(nm.player,JSON.parse(JSON.stringify(base)));
              for(let i=0;i<3;i++){
                assert(o.preparingV070(om.player,i)===n.preparingV070(nm.player,i),`preparing mismatch ${mode}/${exhausted}/${i}`);
                assert(o.canAttackV070(om.player,i)===n.canAttackV070(nm.player,i),`attack mismatch ${mode}/${exhausted}/${i}`);
                comparisons+=2;
              }
              assert(JSON.stringify(o.availableAttackersV610())===JSON.stringify(n.availableAttackersV610()),`available mismatch ${mode}/${exhausted}`);
              assert(JSON.stringify(o.legalBlockersV070(om.player))===JSON.stringify(n.legalBlockersV070(nm.player)),`blocker mismatch ${mode}/${exhausted}`);
              comparisons+=2;
            }
            const oldBogus=o.createMatch(false,'bogus'),newBogus=n.createMatch(false,'bogus');assert(oldBogus.rules.entryMode===newBogus.rules.entryMode&&newBogus.rules.entryMode==='prepare','Invalid mode normalization changed');comparisons++;
            const arena=N.window.SIZA.runArenaCriticalV071();assert(arena.passed===arena.total,`Candidate Arena ${arena.passed}/${arena.total}`);
            console.log(`PASS entry old/new ${comparisons} comparisons; Arena ${arena.passed}/${arena.total}`);
            O.window.close();N.window.close();
            fs.mkdirSync('siza-mobile-test',{recursive:true});fs.mkdirSync('siza-core',{recursive:true});fs.mkdirSync('.github/scripts',{recursive:true});
            fs.writeFileSync('siza-mobile-test/index.html',candidate);for(const[name,text]of Object.entries(files))fs.writeFileSync(`siza-core/${name}`,text);fs.writeFileSync('.github/scripts/siza-entry-rules-regression.js',regression.text);
            cp.execFileSync('node',['.github/scripts/siza-entry-rules-regression.js'],{stdio:'inherit'});
            const put=await fetch(`${api}/contents/siza-mobile-test/index.html`,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Use shared Arena entry rules',content:Buffer.from(candidate,'utf8').toString('base64'),sha:current.sha,branch:'main'})});
            if(!put.ok)throw new Error(`PUT index ${put.status}: ${await put.text()}`);const result=await put.json();console.log('COMMIT '+result.commit.sha);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
