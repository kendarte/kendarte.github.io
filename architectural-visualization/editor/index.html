<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kendarte Archviz Editor</title>
<style>
:root{--bg:#0b0d10;--panel:#14171b;--panel2:#1b1f24;--line:#343a40;--text:#f4f5f6;--muted:#9ca4aa;--accent:#d9c3a3;--ok:#98e49d;--bad:#ff8f8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,sans-serif}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 18px;background:rgba(11,13,16,.97);border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.12em}.actions,.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:9px 12px;border-radius:7px;font-weight:700;cursor:pointer}.btn:hover{border-color:#6e7880}.btn.primary{background:var(--accent);border-color:var(--accent);color:#111}.btn.bad{color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1260px;margin:auto;padding:22px}.status{border:1px solid var(--line);background:#101318;padding:12px 14px;margin-bottom:16px;color:var(--muted);white-space:pre-wrap}.status.ok{color:var(--ok);border-color:#47784b}.status.err{color:var(--bad);border-color:#7d4141}.connect{display:grid;grid-template-columns:1fr auto auto;gap:8px}.connect input{width:100%;padding:10px;border:1px solid var(--line);background:#080a0c;color:#fff;border-radius:7px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0}.panel h2,.panel h3{margin:0 0 6px}.help,.note{color:var(--muted)}.help{margin:0 0 16px}.note{font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);background:#090b0e;color:#fff;border-radius:6px}.field textarea{min-height:84px;resize:vertical}.hero-row{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}.preview{height:220px;border:1px solid var(--line);background:#080a0c;display:grid;place-items:center;overflow:hidden;border-radius:8px}.preview img,.preview svg{width:100%;height:100%;display:block;object-fit:contain;background:#fff}.preview svg{background:#090b0e}.legacy{padding:20px;text-align:center;color:var(--accent)}.projects{display:grid;gap:18px}.project{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}.project-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:#0f1215;border-bottom:1px solid var(--line)}.project-title{display:flex;gap:10px;align-items:center}.project-title b{font-size:18px}.pill{padding:4px 7px;background:#252b31;border-radius:999px;color:#bcc4ca;font-size:11px}.project-body{padding:16px}.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.shot{border:1px solid var(--line);background:#0d1013;padding:12px;border-radius:9px}.shot-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.shot .preview{height:235px;margin-bottom:10px}.drop{border:1px dashed #58616a;color:var(--muted);padding:11px;text-align:center;border-radius:6px;margin-top:8px}.drop.over{border-color:var(--accent);color:var(--accent)}.queued{font-size:11px;color:var(--accent);margin-top:7px}.savebar{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;gap:8px}.ver{font-size:11px;color:#687078;margin-top:5px}@media(max-width:820px){.connect,.fields,.hero-row,.shots{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start}.wrap{padding:14px}.preview,.shot .preview{height:200px}.savebar{left:14px;right:14px}.savebar .btn{flex:1;padding:13px}}
</style>
</head>
<body>
<header class="top">
  <div><div class="brand">KENDARTE / ARCHVIZ EDITOR</div><div class="ver">WEB EDITOR v9 · 2026-09-19</div></div>
  <div class="actions"><a class="btn" href="../?live=1" target="_blank">LIVE SITE</a><button class="btn" id="reloadBtn" type="button">Reload</button></div>
</header>
<div class="wrap">
  <div class="status" id="status">Loading…</div>

  <section class="panel">
    <h2>Site</h2>
    <p class="help">Everything you change here is saved as a browser draft immediately.</p>
    <div class="fields" id="siteFields"></div>
    <div style="height:1px;background:var(--line);margin:18px 0"></div>
    <h3>Hero image</h3>
    <div class="hero-row">
      <div class="preview" id="heroPreview"></div>
      <div>
        <button class="btn primary" id="heroReplaceBtn" type="button">Replace hero image</button>
        <input id="heroFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <p class="note">Uses the original file. No resizing. No sprite. No recompression.</p>
        <div class="queued" id="heroQueued"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
      <div><h2>Projects</h2><p class="help">Unlimited projects and shots.</p></div>
      <button class="btn primary" id="addProjectBtn" type="button">+ Add project</button>
    </div>
  </section>

  <div class="projects" id="projects"></div>
</div>

<div class="savebar">
  <button class="btn" id="saveDraftBtn" type="button">SAVE DRAFT</button>
  <button class="btn primary" id="publishBtn" type="button">PUBLISH TO SITE</button>
</div>

<script>
(function(){
'use strict';

var DRAFT_KEY='archviz-editor-draft-v8';
var DB_NAME='archviz-editor-files-v8';
var DB_STORE='files';
var PUBLISH_SESSION_KEY='archviz-publish-session-v1';

var cfg=null;
var dirty=false;
var previewUrls=[];
var legacySprite=null;

function $(s){return document.querySelector(s);}
function setStatus(text,type){var e=$('#status');e.textContent=text;e.className='status'+(type?' '+type:'');}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}

async function publisherApi(){
  var r=await fetch('../publisher.json?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('Publisher configuration is unavailable.');
  var c=await r.json();
  if(!c.publishApi)throw new Error('Publisher setup is not finished yet.');
  var u=new URL(c.publishApi);
  if(u.protocol!=='https:')throw new Error('Publisher must use HTTPS.');
  return u.origin;
}

function draftImages(){
  var out=[];
  function add(image){if(image&&image.type==='draft')out.push(image);}
  add(cfg.heroImage);
  (cfg.projects||[]).forEach(function(project){(project.shots||[]).forEach(function(shot){add(shot.image);});});
  return out;
}

function signInForPublish(api){
  return new Promise(function(resolve,reject){
    var popup=window.open(api+'/auth/start','archviz-publisher','popup=yes,width=560,height=720');
    if(!popup){reject(new Error('Allow the GitHub sign-in popup, then publish again.'));return;}
    var timeout=setTimeout(function(){finish(new Error('GitHub sign-in timed out.'));},10*60*1000);
    var timer=setInterval(function(){if(popup.closed)finish(new Error('GitHub sign-in was closed.'));},400);
    function finish(error,session){
      clearTimeout(timeout);clearInterval(timer);window.removeEventListener('message',receive);
      if(error)reject(error);else resolve(session);
    }
    function receive(event){
      if(event.origin!==api||!event.data||event.data.type!=='archviz-publish-session'||!event.data.session)return;
      localStorage.setItem(PUBLISH_SESSION_KEY,event.data.session);finish(null,event.data.session);
    }
    window.addEventListener('message',receive);
  });
}

async function publish(){
  var btn=$('#publishBtn'),old=btn.textContent;
  btn.disabled=true;btn.textContent='PUBLISHING…';
  try{
    await saveDraft(true);
    var api=await publisherApi();
    var session=localStorage.getItem(PUBLISH_SESSION_KEY)||await signInForPublish(api);
    var form=new FormData();
    form.append('portfolio',JSON.stringify(cfg));
    var images=draftImages();
    for(var i=0;i<images.length;i++){
      var image=images[i],file=await dbGet(image.key);
      if(!file)throw new Error('Missing image: '+(image.name||image.key));
      form.append('file',file,image.key);
    }
    var response=await fetch(api+'/publish',{method:'POST',headers:{'Authorization':'Bearer '+session},body:form});
    if(response.status===401){
      localStorage.removeItem(PUBLISH_SESSION_KEY);
      session=await signInForPublish(api);
      response=await fetch(api+'/publish',{method:'POST',headers:{'Authorization':'Bearer '+session},body:form});
    }
    var result=await response.json().catch(function(){return {};});
    if(!response.ok)throw new Error(result.error||'Publish failed.');
    cfg=result.portfolio;
    clearDraft();await dbClear();dirty=false;await render();
    var commit=result.commit?result.commit.slice(0,7):'confirmed';
    setStatus('PUBLISHED TO SITE · '+commit,'ok');
    btn.textContent='PUBLISHED';
    setTimeout(function(){btn.textContent=old;},1400);
  }catch(e){
    setStatus('PUBLISH FAILED: '+e.message,'err');
    btn.textContent=old;
  }finally{btn.disabled=false;}
}

async function saveDraft(silent){
  if(!cfg)throw new Error('Portfolio is not loaded yet.');
  var payload=JSON.stringify(cfg);
  localStorage.setItem(DRAFT_KEY,payload);
  var verify=localStorage.getItem(DRAFT_KEY);
  if(verify!==payload)throw new Error('Browser draft verification failed.');
  dirty=false;
  if(!silent){
    var now=new Date().toLocaleTimeString();
    setStatus('DRAFT SAVED · '+now,'ok');
    var b=$('#saveDraftBtn');
    var old=b.textContent;
    b.textContent='SAVED';
    b.disabled=true;
    setTimeout(function(){b.textContent=old;b.disabled=false;},900);
  }
  return true;
}

function mark(msg){
  dirty=true;
  try{
    localStorage.setItem(DRAFT_KEY,JSON.stringify(cfg));
    setStatus(msg||'Draft updated.','ok');
  }catch(e){
    setStatus('Draft save error: '+e.message,'err');
  }
}

function clearDraft(){
  localStorage.removeItem(DRAFT_KEY);
}

function openDB(){
  return new Promise(function(resolve,reject){
    var req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=function(){var db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE);};
    req.onsuccess=function(){resolve(req.result);};
    req.onerror=function(){reject(req.error);};
  });
}

async function dbPut(key,file){
  var db=await openDB();
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(file,key);
    tx.oncomplete=function(){db.close();resolve();};
    tx.onerror=function(){db.close();reject(tx.error);};
  });
}

async function dbGet(key){
  var db=await openDB();
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readonly');
    var req=tx.objectStore(DB_STORE).get(key);
    req.onsuccess=function(){db.close();resolve(req.result||null);};
    req.onerror=function(){db.close();reject(req.error);};
  });
}

async function dbDelete(key){
  var db=await openDB();
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete=function(){db.close();resolve();};
    tx.onerror=function(){db.close();reject(tx.error);};
  });
}

async function dbClear(){
  var db=await openDB();
  return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).clear();
    tx.oncomplete=function(){db.close();resolve();};
    tx.onerror=function(){db.close();reject(tx.error);};
  });
}

function field(obj,key,label,full,area){
  var w=document.createElement('div');w.className='field'+(full?' full':'');
  var l=document.createElement('label');l.textContent=label;
  var i=document.createElement(area?'textarea':'input');i.value=obj[key]||'';
  i.addEventListener('input',function(){obj[key]=i.value;mark('Text updated. Draft saved.');});
  w.appendChild(l);w.appendChild(i);return w;
}

function clearPreviewUrls(){
  previewUrls.forEach(function(u){try{URL.revokeObjectURL(u);}catch(_e){}});
  previewUrls=[];
}

async function legacySpriteData(){
  if(legacySprite)return legacySprite;
  var r=await fetch('../sprite.b64',{cache:'force-cache'});
  if(!r.ok)throw new Error('Could not load the existing portfolio previews.');
  legacySprite='data:image/jpeg;base64,'+(await r.text()).replace(/\s+/g,'');
  return legacySprite;
}

async function previewHTML(image,alt){
  if(!image)return '<div class="legacy">No image yet</div>';
  if(image.type==='draft'){
    var file=await dbGet(image.key);
    if(file){
      var u=URL.createObjectURL(file);previewUrls.push(u);
      return '<img src="'+u+'" alt="'+esc(alt||'')+'">';
    }
    return '<div class="legacy">Draft file missing</div>';
  }
  if(image.type==='file'){
    return '<img src="../'+esc(image.src)+'?v='+Date.now()+'" alt="'+esc(alt||'')+'">';
  }
  var sprite=await legacySpriteData();
  var viewBox=image.viewBox||'0 0 300 225';
  var width=image.spriteWidth||300;
  var height=image.spriteHeight||3227;
  return '<svg viewBox="'+esc(viewBox)+'" preserveAspectRatio="xMidYMid meet" aria-label="'+esc(alt||'')+'"><image href="'+sprite+'" width="'+width+'" height="'+height+'"/></svg>';
}

async function loadPortfolio(forceRemote){
  setStatus('Loading portfolio…');
  var draft=!forceRemote?localStorage.getItem(DRAFT_KEY):null;
  if(draft){
    cfg=JSON.parse(draft);
    setStatus('DRAFT LOADED.');
  }else{
    var r=await fetch('../portfolio.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Could not load portfolio.json');
    cfg=await r.json();
    setStatus('Live portfolio loaded.','ok');
  }
  if(!Array.isArray(cfg.projects))cfg.projects=[];
  await render();
}

async function render(){
  clearPreviewUrls();
  renderSite();
  await renderHero();
  await renderProjects();
}

function renderSite(){
  var b=$('#siteFields');b.innerHTML='';
  b.appendChild(field(cfg.site,'brand','Brand',false,false));
  b.appendChild(field(cfg.site,'title','Service title',false,false));
  b.appendChild(field(cfg.site,'heroTitle','Hero headline',true,false));
  b.appendChild(field(cfg.site,'heroText','Hero text',true,true));
  b.appendChild(field(cfg.site,'ctaTitle','CTA headline',true,false));
  b.appendChild(field(cfg.site,'ctaText','CTA text',true,true));
  b.appendChild(field(cfg.site,'contactUrl','Contact URL',true,false));
}

async function renderHero(){
  $('#heroPreview').innerHTML=await previewHTML(cfg.heroImage,'Hero');
  $('#heroQueued').textContent=cfg.heroImage&&cfg.heroImage.type==='draft'?'FULL-RES DRAFT READY':'';
}

function button(label,fn,cls){
  var b=document.createElement('button');b.type='button';b.className='btn '+(cls||'');b.textContent=label;b.addEventListener('click',fn);return b;
}

async function renderProjects(){
  var list=$('#projects');list.innerHTML='';
  for(var i=0;i<cfg.projects.length;i++)list.appendChild(await projectCard(cfg.projects[i],i));
}

async function projectCard(project,pi){
  var card=document.createElement('section');card.className='project';
  var head=document.createElement('div');head.className='project-head';
  var title=document.createElement('div');title.className='project-title';
  title.innerHTML='<span class="pill">'+esc(project.number||String(pi+1).padStart(2,'0'))+'</span><b>'+esc(project.title||'Untitled project')+'</b>';
  var ctr=document.createElement('div');ctr.className='row';
  ctr.appendChild(button('↑',function(){moveProject(pi,-1);}));
  ctr.appendChild(button('↓',function(){moveProject(pi,1);}));
  ctr.appendChild(button('+ Shot',function(){addShot(project);}));
  ctr.appendChild(button('Delete',function(){deleteProject(pi);},'bad'));
  head.appendChild(title);head.appendChild(ctr);card.appendChild(head);

  var body=document.createElement('div');body.className='project-body';
  var fs=document.createElement('div');fs.className='fields';
  fs.appendChild(field(project,'number','Number',false,false));
  fs.appendChild(field(project,'eyebrow','Eyebrow',false,false));
  fs.appendChild(field(project,'title','Title',true,false));
  fs.appendChild(field(project,'summary','Summary',true,true));
  body.appendChild(fs);

  var shots=document.createElement('div');shots.className='shots';
  var arr=project.shots||[];
  for(var i=0;i<arr.length;i++)shots.appendChild(await shotCard(project,arr[i],i));
  body.appendChild(shots);card.appendChild(body);
  return card;
}

function slotKey(project,shot){return 'shot:'+project.id+':'+shot.id;}

async function shotCard(project,shot,si){
  var c=document.createElement('article');c.className='shot';
  var top=document.createElement('div');top.className='shot-top';
  top.innerHTML='<b>'+esc(shot.label||'Shot')+'</b><span class="pill">'+esc(shot.size||'half')+'</span>';
  c.appendChild(top);

  var prev=document.createElement('div');prev.className='preview';
  prev.innerHTML=await previewHTML(shot.image,shot.label);
  c.appendChild(prev);

  var fs=document.createElement('div');fs.className='fields';
  fs.appendChild(field(shot,'label','Label',false,false));
  var sw=document.createElement('div');sw.className='field';
  var lab=document.createElement('label');lab.textContent='Layout size';
  var sel=document.createElement('select');
  sel.innerHTML='<option value="half">Half</option><option value="wide">Wide</option>';
  sel.value=shot.size||'half';
  sel.addEventListener('change',function(){shot.size=sel.value;mark('Layout updated. Draft saved.');});
  sw.appendChild(lab);sw.appendChild(sel);fs.appendChild(sw);c.appendChild(fs);

  var row=document.createElement('div');row.className='row';row.style.marginTop='9px';
  var inp=document.createElement('input');inp.type='file';inp.accept='image/jpeg,image/png,image/webp';inp.hidden=true;
  var replace=button('Replace image',function(){inp.click();},'primary');
  inp.addEventListener('change',function(){if(inp.files&&inp.files[0])replaceImage(project,shot,inp.files[0]);});
  row.appendChild(replace);row.appendChild(inp);
  row.appendChild(button('↑',function(){moveShot(project,si,-1);}));
  row.appendChild(button('↓',function(){moveShot(project,si,1);}));
  row.appendChild(button('Delete',function(){deleteShot(project,si);},'bad'));
  c.appendChild(row);

  var q=document.createElement('div');q.className='queued';
  q.textContent=shot.image&&shot.image.type==='draft'?'FULL-RES DRAFT READY':'';
  c.appendChild(q);

  var drop=document.createElement('div');drop.className='drop';drop.textContent='or drop full-resolution image here';
  drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',function(){drop.classList.remove('over');});
  drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files&&e.dataTransfer.files[0])replaceImage(project,shot,e.dataTransfer.files[0]);});
  c.appendChild(drop);
  return c;
}

function validImage(file){return file&&/^image\/(jpeg|png|webp)$/.test(file.type);}

async function replaceImage(project,shot,file){
  if(!validImage(file)){setStatus('Use JPG, PNG or WebP.','err');return;}
  if(file.size>95*1024*1024){setStatus('Image is over the 95 MB limit.','err');return;}
  var key=slotKey(project,shot);
  await dbPut(key,file);
  shot.image={type:'draft',key:key,name:file.name,alt:shot.label||project.title};
  mark('Image replaced in draft. Full-resolution original is stored in this browser.');
  await renderProjects();
}

async function replaceHero(file){
  if(!validImage(file)){setStatus('Use JPG, PNG or WebP.','err');return;}
  if(file.size>95*1024*1024){setStatus('Image is over the 95 MB limit.','err');return;}
  await dbPut('hero',file);
  cfg.heroImage={type:'draft',key:'hero',name:file.name,alt:'Architectural visualization hero'};
  mark('Hero replaced in draft.');
  await renderHero();
}

function renumber(){cfg.projects.forEach(function(p,i){p.number=String(i+1).padStart(2,'0');});}

async function addProject(){
  var n=cfg.projects.length+1;
  cfg.projects.push({id:'project-'+Date.now(),number:String(n).padStart(2,'0'),eyebrow:'Portfolio study',title:'New Project',summary:'Project description.',shots:[]});
  renumber();mark('Project added. Draft saved.');await renderProjects();
}

async function deleteProject(i){
  if(!confirm('Delete this project?'))return;
  var p=cfg.projects[i];
  var shots=p.shots||[];
  for(var x=0;x<shots.length;x++)if(shots[x].image&&shots[x].image.type==='draft')await dbDelete(shots[x].image.key);
  cfg.projects.splice(i,1);renumber();mark('Project deleted. Draft saved.');await renderProjects();
}

async function moveProject(i,d){
  var j=i+d;if(j<0||j>=cfg.projects.length)return;
  var t=cfg.projects[i];cfg.projects[i]=cfg.projects[j];cfg.projects[j]=t;
  renumber();mark('Project order changed. Draft saved.');await renderProjects();
}

async function addShot(project){
  if(!Array.isArray(project.shots))project.shots=[];
  project.shots.push({id:'shot-'+Date.now(),label:'New shot',size:'half',image:null});
  mark('Shot added. Draft saved.');await renderProjects();
}

async function deleteShot(project,i){
  if(!confirm('Delete this shot?'))return;
  var s=project.shots[i];if(s.image&&s.image.type==='draft')await dbDelete(s.image.key);
  project.shots.splice(i,1);mark('Shot deleted. Draft saved.');await renderProjects();
}

async function moveShot(project,i,d){
  var j=i+d;if(j<0||j>=project.shots.length)return;
  var t=project.shots[i];project.shots[i]=project.shots[j];project.shots[j]=t;
  mark('Shot order changed. Draft saved.');await renderProjects();
}

$('#reloadBtn').addEventListener('click',function(){
  if(!confirm('Reload LIVE portfolio and discard this browser draft?'))return;
  clearDraft();dbClear().then(function(){loadPortfolio(true).catch(function(e){setStatus(e.message,'err');});});
});
$('#saveDraftBtn').addEventListener('click',function(){saveDraft(false).catch(function(e){setStatus('SAVE FAILED: '+e.message,'err');});});
$('#publishBtn').addEventListener('click',publish);
$('#addProjectBtn').addEventListener('click',addProject);
$('#heroReplaceBtn').addEventListener('click',function(){$('#heroFile').click();});
$('#heroFile').addEventListener('change',function(){if(this.files&&this.files[0])replaceHero(this.files[0]);});

window.addEventListener('beforeunload',function(e){
  if(dirty){e.preventDefault();e.returnValue='';}
});

window.addEventListener('error',function(e){setStatus('EDITOR ERROR: '+(e.message||'Unknown error'),'err');});
window.addEventListener('unhandledrejection',function(e){var m=e.reason&&e.reason.message?e.reason.message:String(e.reason||'Unknown error');setStatus('EDITOR ERROR: '+m,'err');});
