name: Siza Prism Effect Migration

on:
  push:
    paths:
      - '.github/workflows/siza-prism-effect-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-prism:
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save acorn@8 jsdom@24
      - name: Fetch exact migration script
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const repo=process.env.GH_REPOSITORY,sha=process.env.GH_SHA,token=process.env.GH_TOKEN;
          const path='.github/scripts/siza-prism-effect-migration.js';
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${sha}`,{headers}).then(async r=>{
            if(!r.ok)throw new Error(`GET ${r.status}: ${await r.text()}`);
            const f=await r.json();fs.mkdirSync('.github/scripts',{recursive:true});fs.writeFileSync(path,Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8'));console.log(`Fetched ${f.sha}`);
          }).catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
      - name: Repair temporary guard and isolate fixture
        run: |
          node <<'NODE'
          const fs=require('fs'),path='.github/scripts/siza-prism-effect-migration.js';
          let s=fs.readFileSync(path,'utf8');
          const bad=`assert(!src.includes("id==='prism'")&&!src.includes("id==='prism'"),name+' still hardcodes prism ID')`;
          const good=`assert(!src.includes("id==='prism'")&&!src.includes('id==="prism"'),name+' still hardcodes prism ID')`;
          if(!s.includes(bad))throw new Error('Temporary syntax repair anchor missing');
          s=s.replace(bad,good);
          const old=`const core=newDom.window.SIZA.runArenaCriticalV071();assert(core.passed===core.total,'Arena '+core.passed+'/'+core.total);console.log('PASS Arena '+core.passed+'/'+core.total);`;
          const next=`H.setModal(null);const core=newDom.window.SIZA.runArenaCriticalV071();for(const r of core.results)console.log((r.pass?'PASS':'FAIL')+' '+r.name+(r.error?' :: '+r.error:''));assert(core.passed===core.total,'Arena '+core.passed+'/'+core.total);console.log('PASS Arena '+core.passed+'/'+core.total);`;
          if(!s.includes(old))throw new Error('Arena fixture anchor missing');
          fs.writeFileSync(path,s.replace(old,next));
          NODE
      - name: Run guarded Prism migration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/siza-prism-effect-migration.js
