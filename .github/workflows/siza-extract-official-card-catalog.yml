name: Siza Extract Official Card Catalog

on:
  push:
    paths:
      - '.github/workflows/siza-extract-official-card-catalog.yml'

permissions:
  contents: write

jobs:
  extract-catalog:
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save jsdom@24
      - name: Switch Mobile Test to shared official catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,path='siza-mobile-test/index.html';
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'},api=`https://api.github.com/repos/${repo}/contents/${path}`;
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function get(p){const r=await fetch(`https://api.github.com/repos/${repo}/contents/${p}?ref=main`,{headers});if(!r.ok)throw new Error(`${p}: GET ${r.status}`);const f=await r.json();return Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}
          function inlineCore(html,schema,renderer,catalog=''){let out=html.replace('<script src="../siza-core/card-schema.js"></script>',`<script>${schema}</script>`).replace('<script src="../siza-core/card-renderer.js"></script>',`<script>${renderer}</script>`);if(catalog&&out.includes('<script src="../siza-core/cards.js"></script>'))out=out.replace('<script src="../siza-core/cards.js"></script>',`<script>${catalog}</script>`);return out}
          function makeDom(html,label){const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error(`[JSDOM ${label}]`,e.message));return new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc})}
          (async()=>{
            const r=await fetch(`${api}?ref=main`,{headers});if(!r.ok)throw new Error(`index GET ${r.status}`);const f=await r.json();let html=Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8');console.log(`Current Mobile blob ${f.sha}`);
            const start=html.indexOf('const LEGACY_FULL_CARD_IMAGES={'),endMarker='\nconst TEST_CARD_DB_V1=[];',end=html.indexOf(endMarker,start);
            assert(start>=0&&end>start,'Embedded official catalog block not found');assert(!html.includes('<script src="../siza-core/cards.js"></script>'),'Mobile already links shared catalog');
            const schema=await get('siza-core/card-schema.js'),renderer=await get('siza-core/card-renderer.js'),catalog=await get('siza-core/cards.js');
            const probe='window.SIZA={';assert(html.includes(probe),'SIZA export marker not found');
            let oldHtml=inlineCore(html,schema,renderer).replace(probe,`window.__CAT_OLD__={CARD_DB,LEGACY_FULL_CARD_IMAGES};\n`+probe);
            const oldDom=makeDom(oldHtml,'old');oldDom.window.setTimeout=()=>0;const old=oldDom.window.__CAT_OLD__;assert(old?.CARD_DB?.length===13,'Old CARD_DB is not 13');const oldCards=JSON.stringify(old.CARD_DB),oldLegacy=JSON.stringify(old.LEGACY_FULL_CARD_IMAGES);const oldArena=oldDom.window.SIZA.runArenaCriticalV071();assert(oldArena.passed===oldArena.total,`Old Arena ${oldArena.passed}/${oldArena.total}`);oldDom.window.close();

            html=html.slice(0,start)+`const LEGACY_FULL_CARD_IMAGES=SizaCardCatalog.legacyFullCardImages;\nconst CARD_DB=SizaCardCatalog.cards;`+html.slice(end);
            html=html.replace('<script src="../siza-core/card-schema.js"></script>','<script src="../siza-core/card-schema.js"></script>\n<script src="../siza-core/cards.js"></script>');
            assert((html.match(/SizaCardCatalog\.cards/g)||[]).length===1,'Shared catalog alias count mismatch');assert(!html.includes('const CARD_DB=['),'Embedded CARD_DB remains');
            let newHtml=inlineCore(html,schema,renderer,catalog).replace(probe,`window.__CAT_NEW__={CARD_DB,LEGACY_FULL_CARD_IMAGES};\n`+probe);
            const newDom=makeDom(newHtml,'new');newDom.window.setTimeout=()=>0;const fresh=newDom.window.__CAT_NEW__;assert(fresh?.CARD_DB?.length===13,'Shared CARD_DB is not 13');assert(JSON.stringify(fresh.CARD_DB)===oldCards,'Shared card catalog differs from embedded CARD_DB');assert(JSON.stringify(fresh.LEGACY_FULL_CARD_IMAGES)===oldLegacy,'Legacy image metadata differs');assert(fresh.CARD_DB===newDom.window.SizaCardCatalog.cards,'Mobile CARD_DB is not the shared catalog');const arena=newDom.window.SIZA.runArenaCriticalV071();assert(arena.passed===arena.total,`New Arena ${arena.passed}/${arena.total}`);console.log('PASS Catalog equality 13/13');console.log(`PASS Arena ${arena.passed}/${arena.total}`);newDom.window.close();

            const w=await fetch(api,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Move official Siza cards to shared catalog',content:Buffer.from(html,'utf8').toString('base64'),sha:f.sha,branch:'main'})});if(!w.ok)throw new Error(`PUT ${w.status}: ${await w.text()}`);const out=await w.json();console.log(`COMMIT ${out.commit.sha}`);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE