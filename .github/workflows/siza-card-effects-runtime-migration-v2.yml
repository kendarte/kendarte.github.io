name: Siza Data Driven Card Effects Migration V2

on:
  push:
    paths:
      - '.github/workflows/siza-card-effects-runtime-migration-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-effects:
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save acorn@8 jsdom@24
      - name: Fetch exact migration script
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const repo=process.env.GH_REPOSITORY,sha=process.env.GH_SHA,token=process.env.GH_TOKEN;
          const path='.github/scripts/siza-card-effects-runtime-migration.js';
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${sha}`,{headers}).then(async r=>{
            if(!r.ok)throw new Error(`GET ${r.status}: ${await r.text()}`);
            const f=await r.json();
            fs.mkdirSync('.github/scripts',{recursive:true});
            fs.writeFileSync(path,Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8'));
            console.log(`Fetched migration script ${f.sha}`);
          }).catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
      - name: Patch migration test harness
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='.github/scripts/siza-card-effects-runtime-migration.js';
          let s=fs.readFileSync(path,'utf8');
          const oldGuard=`assert(!html.includes("if(c.id==='servitor'")&&!html.includes("if(c.id==='leviathan'")&&!html.includes("if(c.id==='queen'")&&!html.includes("if(c.id==='spark'")&&!html.includes("else if(c.id==='mist'"),'Old stack card ID branches remain');`;
          const newGuard=`{const p=mainScript(html),n=p.decl.find(x=>x.id.name==='resolveTopStack');assert(n,'resolveTopStack missing after transform');const src=p.code.slice(n.start,n.end);assert(!src.includes("c.id==='servitor'")&&!src.includes("c.id==='leviathan'")&&!src.includes("c.id==='queen'")&&!src.includes("c.id==='spark'")&&!src.includes("c.id==='mist'"),'Old stack card ID branches remain inside resolver');}`;
          if(!s.includes(oldGuard))throw new Error('Guard patch anchor not found');
          s=s.replace(oldGuard,newGuard);
          const oldFixture=`H.setMatch(M);setup(H,M);H.resolveTopStack();`;
          const newFixture=`H.setMatch(M);for(const P of [M.player,M.enemy]){P.hand=[];P.library=[];P.graveyard=[];P.battlefield=[];P.artifacts=[];P.equipment=[];P.powerCounters=[];P.summonedOn=[];P.exhausted=[]}setup(H,M);H.resolveTopStack();`;
          if(!s.includes(oldFixture))throw new Error('Fixture patch anchor not found');
          fs.writeFileSync(path,s.replace(oldFixture,newFixture));
          NODE
      - name: Run guarded effects migration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/siza-card-effects-runtime-migration.js
