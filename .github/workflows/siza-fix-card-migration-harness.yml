name: Fix Siza Card Migration Harness

on:
  push:
    paths:
      - '.github/workflows/siza-fix-card-migration-harness.yml'

permissions:
  contents: write

jobs:
  fix-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Move core regression before modal renderer probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,path='.github/workflows/siza-card-built-in-migration.yml';
          const api=`https://api.github.com/repos/${repo}/contents/${path}`;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          (async()=>{
            const r=await fetch(`${api}?ref=main`,{headers});if(!r.ok)throw new Error(`GET ${r.status}: ${await r.text()}`);
            const f=await r.json(),text=Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8');
            const modal=`            M.player.hand=['spark','dock'];M.player.crystals={U:2,R:1};H.openManifest(0,H.cardById('spark'),'player',false);out=H.manifestInlineHtml();assert(out.includes('generatedCardThumbV1')&&!out.includes('cards-v0514'),'Manafestation still uses full-card image');\n`;
            const core=`            const core=dom.window.SIZA.runArenaCriticalV071();console.log(\`Core contract \${core.passed}/\${core.total}\`);for(const r of core.results)console.log(\`\${r.pass?'PASS':'FAIL'} \${r.name}\`);assert(core.passed===core.total,'Core contract failed after renderer migration');\n`;
            if((text.match(new RegExp(modal.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length!==1)throw new Error('Modal probe anchor mismatch');
            if((text.match(new RegExp(core.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length!==1)throw new Error('Core probe anchor mismatch');
            const next=text.replace(modal+core,core+modal);
            if(next===text)throw new Error('Harness order was not changed');
            const w=await fetch(api,{method:'PUT',headers,body:JSON.stringify({message:'Run core regression before modal renderer probe',content:Buffer.from(next,'utf8').toString('base64'),sha:f.sha,branch:'main'})});
            if(!w.ok)throw new Error(`PUT ${w.status}: ${await w.text()}`);const out=await w.json();console.log(`UPDATED ${out.commit.sha}`);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE