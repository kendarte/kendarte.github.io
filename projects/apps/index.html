const projects={
"dem":{type:"Automation · AI",title:"DEM · Money Hunt Control Plane v0.5",status:"Public prototype",intro:"A coded control plane for coordinating brand state, experiments, production jobs, approvals, distribution, metrics and learning loops inside the broader Deus Ex Machina system.",what:"DEM is the orchestration layer. Instead of treating content generation, publication and analytics as disconnected scripts, it tracks them as work performed by one system with explicit project, campaign, creative and approval state.",does:["Tracks projects, brands, campaigns and experiments.","Creates and follows production jobs through human approval.","Maintains publication/distribution queues and metrics.","Exposes replaceable connectors for Generation Core, Ollama, publication and analytics.","Keeps an audit trail so generated work can be traced back to the project and experiment that produced it."],access:"A public browser prototype is available now. The broader DEM architecture is still evolving; the prototype is the inspectable control-plane implementation, not a claim that every planned DEM module is finished.",tech:"JavaScript · browser UI · provider adapters · campaign/experiment state",links:[['Open public prototype','/dem-money-hunt/','Live app'],['View source on GitHub','https://github.com/kendarte/kendarte.github.io/tree/main/dem-money-hunt','Repository'],['Back to build log','/projects/','Index']]},
"generation-core":{type:"Generative AI",title:"Generation Core",status:"Functional · local",intro:"The local image-generation provider layer used by DEM to request generated assets without coupling the control plane directly to one external generation service.",what:"Generation Core separates the act of requesting an image from the specific generation backend. DEM can create a generation job; the provider layer performs the real generation and returns an asset/result to the higher-level workflow.",does:["Receives generation jobs from the higher-level production workflow.","Uses a real local image-generation provider instead of a mock-only path.","Allows the generation backend to be replaced without rewriting DEM's campaign/control logic.","Keeps generated assets conceptually attached to the job/project that requested them."],access:"The working provider is currently a local/internal tool. There is no public executable or public source package in this repository yet, so this page documents the real implementation state instead of pretending there is a download that does not exist.",tech:"Local generative AI · provider abstraction · image generation · DEM integration",links:[['Open related DEM prototype','/dem-money-hunt/','Related system'],['Back to build log','/projects/','Index']]},
