name: Add 3D AI workflow portfolio section
on:
  push:
    paths:
      - '.tmp_portfolio/trigger.txt'
permissions:
  contents: write
jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build portfolio update
        run: python scripts/add_ai_workflow.py
      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3d/index.html media/3d/ai-workflow.webp media/3d/ai-animation.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Add 3D rendering to AI animation workflow"
          git push
