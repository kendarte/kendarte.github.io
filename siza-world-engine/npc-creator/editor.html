<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIZA NPC Creator</title>
<style>
:root{--bg:#090d13;--panel:#111823;--panel2:#172131;--line:#2d3a4e;--text:#edf3fa;--muted:#93a3b8;--accent:#74bdf3;--ok:#72d99d;--bad:#ff7272;--warn:#f0c76d}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.top{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#0e141e;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.05em;margin-right:10px}.brand small{display:block;font-size:10px;color:var(--muted)}.btn{border:1px solid #38485f;background:#182435;color:var(--text);border-radius:7px;padding:7px 10px;cursor:pointer}.btn:hover{background:#213149}.btn.primary{background:#18496e;border-color:#4385b5}.btn.danger{background:#3b2025;border-color:#763940}.spacer{flex:1}.status{font-size:11px;color:var(--muted)}.layout{min-height:0;display:grid;grid-template-columns:265px minmax(520px,1fr) 350px}.left,.right{min-height:0;overflow:auto;background:var(--panel)}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.main{min-height:0;overflow:auto;padding:15px;background:#0c1118}.section{padding:12px;border-bottom:1px solid var(--line)}h3{margin:0 0 9px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#aebdd0}.field{display:grid;gap:4px;margin-bottom:9px}.field label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #35445a;border-radius:6px;background:#0b1119;color:var(--text);padding:8px}textarea{min-height:76px;resize:vertical}.json{font:11px Consolas,monospace;min-height:110px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.card{max-width:980px;margin:0 auto 13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.combat{border-color:#376b92;background:linear-gradient(#142333,#111823)}.check{display:flex;gap:7px;align-items:center}.check input{width:auto}.note{font-size:11px;color:var(--muted);line-height:1.45}.list{display:grid;gap:6px}.item{padding:8px;border:1px solid transparent;background:#0c131c;border-radius:7px;cursor:pointer}.item.sel{background:#172a3d;border-color:#67aae0}.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:var(--muted)}.pill{float:right;font-size:9px;border:1px solid #42536c;border-radius:999px;padding:1px 5px}.empty{padding:11px;border:1px dashed #34445a;border-radius:7px;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;margin:0;background:#090e14;border:1px solid #273447;border-radius:7px;padding:10px;font:11px Consolas,monospace;color:#cbd7e6}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.deckrows{display:grid;gap:3px;max-height:240px;overflow:auto;font-size:11px}.deckrow{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #202b39;padding:3px 0}.deckname{font-weight:800;margin-bottom:3px}.deckmeta{font-size:11px;color:var(--muted);margin-bottom:8px}details{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}summary{cursor:pointer;font-weight:700;color:#bdcadb}.mapinfo{font-size:11px;color:#b8cbe0;line-height:1.4}@media(max-width:1080px){.layout{grid-template-columns:220px minmax(480px,1fr) 300px}.grid6{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.layout{grid-template-columns:1fr}.left,.right{display:none}.grid2,.grid4{grid-template-columns:1fr}}
</style>
<script src="../../siza-core/decks.js"></script>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">SIZA NPC CREATOR<small>NPC + World Engine + deck de combate</small></div><button id="add" class="btn primary">+ NPC</button><button id="dup" class="btn">Duplicar</button><button id="del" class="btn danger">Eliminar</button><div class="spacer"></div><button id="mapImport" class="btn">Importar mapa</button><button id="jsonImport" class="btn">Importar NPC JSON</button><button id="jsonExport" class="btn">Exportar NPC JSON</button><button id="seedExport" class="btn">Exportar seed Python</button><input id="mapFile" type="file" accept=".json" hidden><input id="jsonFile" type="file" accept=".json" hidden><span id="status" class="status">Listo</span></header>
<div class="layout"><aside class="left"><div class="section"><h3>Proyecto</h3><div class="field"><label>Nombre</label><input id="projectName"></div><div class="field"><label>Campaign ID por defecto</label><input id="projectCampaign"></div><div id="mapInfo" class="mapinfo"></div></div><div class="section"><h3>NPCs <span id="npcCount"></span></h3><div id="npcList" class="list"></div></div><div class="section note">El editor guarda automáticamente en este navegador. El NPC persiste un <b>deck_id</b>; no guarda una copia congelada del deck.</div></aside><main id="editor" class="main"></main><aside class="right"><div class="section"><h3>Payload de combate</h3><pre id="payload">—</pre></div><div class="section"><h3>Deck canónico</h3><div id="deckInfo" class="empty">—</div></div><div class="section"><h3>Validación</h3><div id="validation" class="note">—</div></div></aside></div>
</div>
<script>
(()=>{
'use strict';
const STORE='siza_npc_creator_v2';
const $=id=>document.getElementById(id);
const clone=v=>JSON.parse(JSON.stringify(v));
const arr=v=>Array.isArray(v)?v:[];
const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
const lines=v=>String(v||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eid=()=>`npc-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
function freshNPC(n=1,campaign=''){return{editor_id:eid(),key:`Nuevo NPC ${n}`,npc_id:`NPC-${String(n).padStart(3,'0')}`,aliases:[],desc:'',dialogue_greeting:'',dialogue_topics:[],canon_status:'prototype',campaign_id:campaign,simulation_enabled:false,decision_enabled:false,current_room_id:'',current_room_key:'',home_room_id:'',work_room_id:'',rest_room_id:'',adventure_stats:{FUE:2,AGI:2,COO:2,INT:2,PER:2,PSI:2},knowledge:{},knowledge_facts:[],job:{},relationships:{},memories:[],routine:[],needs:{},need_rules:[],need_dynamics:[],decision_priorities:{DANGER:100,EVENT:80,NEED:70,JOB:60,RELATIONSHIP:50,ROUTINE:10},decision_goals:[],virtues:{},flaws:{},combat_profile:{enabled:false,deck_id:'',tcg_profile:{},loadout:{},world_status:{},encounter_tags:[]}}}
function freshProject(){return{version:2,meta:{name:'NPCs SIZA',campaign_id:''},map:{name:'',rooms:[]},npcs:[]}}
function normalize(raw){const p={...freshProject(),...obj(raw)};p.meta={name:p.meta?.name||'NPCs SIZA',campaign_id:p.meta?.campaign_id||''};p.map={name:p.map?.name||'',rooms:arr(p.map?.rooms)};p.npcs=arr(p.npcs).map((r,i)=>{const d=freshNPC(i+1,p.meta.campaign_id),n={...d,...obj(r)};n.editor_id=n.editor_id||eid();n.aliases=arr(n.aliases);n.adventure_stats={...d.adventure_stats,...obj(n.adventure_stats)};for(const k of ['knowledge','job','relationships','needs','decision_priorities','virtues','flaws'])n[k]=obj(n[k]);for(const k of ['knowledge_facts','dialogue_topics','memories','routine','need_rules','need_dynamics','decision_goals'])n[k]=arr(n[k]);n.combat_profile={...d.combat_profile,...obj(n.combat_profile)};n.combat_profile.tcg_profile=obj(n.combat_profile.tcg_profile);n.combat_profile.loadout=obj(n.combat_profile.loadout);n.combat_profile.world_status=obj(n.combat_profile.world_status);n.combat_profile.encounter_tags=arr(n.combat_profile.encounter_tags);return n});return p}
function restore(){try{return normalize(JSON.parse(localStorage.getItem(STORE)||'null'))}catch{return freshProject()}}
let state=restore();if(!state.npcs.length)state.npcs.push(freshNPC(1,state.meta.campaign_id));let selected=state.npcs[0].editor_id;
function current(){return state.npcs.find(n=>n.editor_id===selected)||null}
function save(msg='Guardado'){localStorage.setItem(STORE,JSON.stringify(state));$('status').textContent=msg;clearTimeout(save.t);save.t=setTimeout(()=>$('status').textContent='Listo',1400)}
function catalog(){return window.SizaDeckCatalog&&typeof window.SizaDeckCatalog.all==='function'?window.SizaDeckCatalog:null}
function decks(){try{return catalog()?.all()||[]}catch{return[]}}
function deck(id){try{return catalog()?.get?.(String(id||''))||null}catch{return null}}
function total(d){return Object.values(d?.counts||{}).reduce((s,n)=>s+(Number(n)||0),0)}
function cardName(id){try{return window.SizaCardCatalog?.get?.(id)?.name||id}catch{return id}}
function dl(name,text,type='text/plain'){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function slug(s){return String(s||'siza_npcs').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'siza_npcs'}
function jparse(s,label,kind){try{const v=JSON.parse(s);if(kind==='array'&&!Array.isArray(v))throw new Error('debe ser un array');if(kind==='object'&&(!v||typeof v!=='object'||Array.isArray(v)))throw new Error('debe ser un objeto');return v}catch(e){throw new Error(`${label}: ${e.message}`)}}
function field(label,id,val,type='text'){return`<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val??'')}"></div>`}
function area(label,id,val,klass=''){return`<div class="field"><label>${label}</label><textarea id="${id}" class="${klass}">${esc(val??'')}</textarea></div>`}
function j(v){return JSON.stringify(v,null,2)}
function set(id,fn,event='input'){const e=$(id);if(e)e.addEventListener(event,()=>{try{fn(e);save();renderSide()}catch(err){$('status').textContent=err.message;$('status').style.color='var(--bad)'}})}
function render(){state=normalize(state);if(!current())selected=state.npcs[0]?.editor_id||null;$('projectName').value=state.meta.name;$('projectCampaign').value=state.meta.campaign_id;renderList();renderEditor();renderSide()}
function renderList(){$('npcCount').textContent=`(${state.npcs.length})`;$('mapInfo').textContent=state.map.rooms.length?`${state.map.name||'Mapa'} · ${state.map.rooms.length} Rooms importados`:'Sin mapa importado.';$('npcList').innerHTML=state.npcs.map(n=>`<div class="item ${n.editor_id===selected?'sel':''}" data-id="${n.editor_id}"><span class="pill">${n.combat_profile.enabled?'COMBAT':'NPC'}</span><b>${esc(n.key)}</b><small>${esc(n.npc_id)}${n.current_room_id?' · '+esc(n.current_room_id):''}</small></div>`).join('');document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{selected=e.dataset.id;render()})}
function renderEditor(){const n=current();if(!n){$('editor').innerHTML='<div class="card empty">Sin NPC.</div>';return}const roomOpts=['<option value="">— sin Room —</option>',...state.map.rooms.map(r=>`<option value="${esc(r.room_id)}" ${r.room_id===n.current_room_id?'selected':''}>${esc(r.key||r.room_id)} · ${esc(r.room_id)}</option>`)].join('');const deckOpts=['<option value="">— sin deck —</option>',...decks().map(d=>`<option value="${esc(d.id)}" ${d.id===n.combat_profile.deck_id?'selected':''}>${esc(d.name)} · ${esc(d.id)}</option>`)].join('');const s=n.adventure_stats,cp=n.combat_profile;$('editor').innerHTML=`
<div class="card"><h3>Identidad</h3><div class="grid2">${field('Nombre / key','key',n.key)}${field('NPC ID','npcid',n.npc_id)}${field('Canon status','canon',n.canon_status)}${field('Campaign ID','campaign',n.campaign_id)}</div>${area('Aliases — uno por línea','aliases',n.aliases.join('\n'))}${area('Descripción','desc',n.desc)}${area('Saludo / diálogo inicial','greeting',n.dialogue_greeting)}${area('Temas de diálogo — JSON','dialoguetopics',j(n.dialogue_topics),'json')}<div class="note">Cada tema usa <b>topic</b>, <b>keywords</b> y <b>response</b>. Ejemplo: {"id":"rumor-patio","topic":"rumores","keywords":["patio","Squeek"],"response":"..."}. Las respuestas salen sólo cuando el jugador pregunta por ese tema.</div><div class="grid2"><label class="check"><input id="sim" type="checkbox" ${n.simulation_enabled?'checked':''}> Simulation enabled</label><label class="check"><input id="decision" type="checkbox" ${n.decision_enabled?'checked':''}> Decision enabled</label></div></div>
<div class="card"><h3>Ubicación</h3><div class="field"><label>Room del mapa importado</label><select id="roomSelect">${roomOpts}</select></div><div class="grid2">${field('Current room_id','roomid',n.current_room_id)}${field('Current Room key','roomkey',n.current_room_key)}${field('Home room_id','home',n.home_room_id)}${field('Work room_id','work',n.work_room_id)}${field('Rest room_id','rest',n.rest_room_id)}</div></div>
<div class="card"><h3>Adventure Stats</h3><div class="grid6">${['FUE','AGI','COO','INT','PER','PSI'].map(k=>field(k,'st_'+k,s[k], 'number')).join('')}</div></div>
<div class="card combat"><h3>Modo pelea / deck</h3><label class="check"><input id="combat" type="checkbox" ${cp.enabled?'checked':''}> Puede entrar en combate TCG</label><div class="grid2" style="margin-top:10px"><div class="field"><label>Deck del catálogo</label><select id="deckSelect">${deckOpts}</select></div>${field('deck_id manual','deckid',cp.deck_id)}</div><div class="note">En cada entrada a modo pelea, el bridge vuelve a resolver este <b>deck_id</b> desde SizaDeckCatalog y crea una biblioteca/una mano nuevas. Si el deck cambia en el catálogo, el NPC usa la versión nueva sin reexportarlo.</div><div class="grid4" style="margin-top:10px">${field('Life','life',cp.tcg_profile.life??'','number')}${field('MF','mf',cp.tcg_profile.mf??'','number')}${field('PROW','prow',cp.tcg_profile.prow??'','number')}${field('EVA','eva',cp.tcg_profile.eva??'','number')}</div>${area('Encounter tags — uno por línea','tags',cp.encounter_tags.join('\n'))}<details><summary>Loadout / world_status</summary><div class="grid2" style="margin-top:9px">${area('loadout JSON','loadout',j(cp.loadout),'json')}${area('world_status JSON','worldstatus',j(cp.world_status),'json')}</div></details></div>
<div class="card"><h3>World Engine data</h3><details open><summary>Knowledge + Facts</summary><div class="grid2" style="margin-top:9px">${area('knowledge JSON','knowledge',j(n.knowledge),'json')}${area('knowledge_facts JSON','facts',j(n.knowledge_facts),'json')}</div></details><details><summary>Job + relaciones + memories</summary><div class="grid2" style="margin-top:9px">${area('job JSON','job',j(n.job),'json')}${area('relationships JSON','relationships',j(n.relationships),'json')}</div>${area('memories JSON','memories',j(n.memories),'json')}</details><details><summary>Rutina + needs</summary><div class="grid2" style="margin-top:9px">${area('routine JSON','routine',j(n.routine),'json')}${area('needs JSON','needs',j(n.needs),'json')}${area('need_rules JSON','needrules',j(n.need_rules),'json')}${area('need_dynamics JSON','needdynamics',j(n.need_dynamics),'json')}</div></details><details><summary>Decision Layer / virtues / flaws</summary><div class="grid2" style="margin-top:9px">${area('decision_priorities JSON','priorities',j(n.decision_priorities),'json')}${area('decision_goals JSON','goals',j(n.decision_goals),'json')}${area('virtues JSON','virtues',j(n.virtues),'json')}${area('flaws JSON','flaws',j(n.flaws),'json')}</div></details></div>`;bind(n)}
function bind(n){set('key',e=>n.key=e.value);set('npcid',e=>n.npc_id=e.value);set('canon',e=>n.canon_status=e.value);set('campaign',e=>n.campaign_id=e.value);set('aliases',e=>n.aliases=lines(e.value));set('desc',e=>n.desc=e.value);set('greeting',e=>n.dialogue_greeting=e.value);set('dialoguetopics',e=>n.dialogue_topics=jparse(e.value,'dialogue_topics','array'),'change');set('sim',e=>n.simulation_enabled=e.checked,'change');set('decision',e=>n.decision_enabled=e.checked,'change');set('roomSelect',e=>{const r=state.map.rooms.find(x=>x.room_id===e.value);n.current_room_id=e.value;n.current_room_key=r?.key||'';if(!n.home_room_id)n.home_room_id=e.value;render()},'change');set('roomid',e=>n.current_room_id=e.value);set('roomkey',e=>n.current_room_key=e.value);set('home',e=>n.home_room_id=e.value);set('work',e=>n.work_room_id=e.value);set('rest',e=>n.rest_room_id=e.value);for(const k of ['FUE','AGI','COO','INT','PER','PSI'])set('st_'+k,e=>n.adventure_stats[k]=Number(e.value)||0);set('combat',e=>n.combat_profile.enabled=e.checked,'change');set('deckSelect',e=>{n.combat_profile.deck_id=e.value;render()},'change');set('deckid',e=>n.combat_profile.deck_id=e.value);for(const k of ['life','mf','prow','eva'])set(k,e=>{if(e.value==='')delete n.combat_profile.tcg_profile[k];else n.combat_profile.tcg_profile[k]=Number(e.value)});set('tags',e=>n.combat_profile.encounter_tags=lines(e.value));set('loadout',e=>n.combat_profile.loadout=jparse(e.value,'loadout','object'),'change');set('worldstatus',e=>n.combat_profile.world_status=jparse(e.value,'world_status','object'),'change');const spec=[['knowledge','knowledge','object'],['facts','knowledge_facts','array'],['job','job','object'],['relationships','relationships','object'],['memories','memories','array'],['routine','routine','array'],['needs','needs','object'],['needrules','need_rules','array'],['needdynamics','need_dynamics','array'],['priorities','decision_priorities','object'],['goals','decision_goals','array'],['virtues','virtues','object'],['flaws','flaws','object']];for(const [id,k,t] of spec)set(id,e=>n[k]=jparse(e.value,k,t),'change')}
function renderSide(){renderList();const n=current();if(!n){$('payload').textContent='—';return}const cp=n.combat_profile,p={opponent:{npc_id:n.npc_id,name:n.key,deck_id:cp.deck_id,tcg_profile:cp.tcg_profile,loadout:cp.loadout,world_status:cp.world_status},world_context_tags:cp.encounter_tags};$('payload').textContent=JSON.stringify(p,null,2);const d=deck(cp.deck_id);if(!cp.enabled)$('deckInfo').innerHTML='<div class="warn">Combate desactivado.</div>';else if(!catalog())$('deckInfo').innerHTML='<div class="bad">No cargó SizaDeckCatalog.</div>';else if(!cp.deck_id)$('deckInfo').innerHTML='<div class="bad">Falta deck_id.</div>';else if(!d)$('deckInfo').innerHTML=`<div class="bad">Deck desconocido: ${esc(cp.deck_id)}</div>`;else{$('deckInfo').innerHTML=`<div class="deckname">${esc(d.name)}</div><div class="deckmeta">${esc(d.id)} · ${total(d)} cartas · ${esc(d.role||'')}</div><div class="deckrows">${Object.entries(d.counts||{}).sort((a,b)=>b[1]-a[1]).map(([id,c])=>`<div class="deckrow"><span>${esc(cardName(id))}</span><b>×${c}</b></div>`).join('')}</div>`}const errors=[];if(!n.key.trim())errors.push('Falta nombre');if(!n.npc_id.trim())errors.push('Falta npc_id');if(cp.enabled&&!cp.deck_id)errors.push('Combate activo sin deck_id');if(cp.enabled&&cp.deck_id&&catalog()&&!d)errors.push('deck_id no existe en SizaDeckCatalog');$('validation').innerHTML=errors.length?errors.map(e=>`<div class="bad">• ${esc(e)}</div>`).join(''):'<div class="ok">NPC válido para exportar.</div>'}
function exportData(){return normalize(clone(state))}
function seed(){const data=state.npcs.map(n=>{const x=clone(n);delete x.editor_id;return x}),payload=JSON.stringify({meta:state.meta,npcs:data}),literal=JSON.stringify(payload);return`from evennia import create_object, search_object\nfrom evennia.objects.models import ObjectDB\nfrom services.knowledge_fact_engine import upsert_knowledge_fact\nimport json\n\nDATA = json.loads(${literal})\n\ndef find_room(room_id, room_key=''):\n    room_id = str(room_id or '')\n    if room_key:\n        for obj in search_object(room_key):\n            if str(getattr(obj.db, 'room_id', '') or '') == room_id:\n                return obj\n    for obj in ObjectDB.objects.all():\n        if str(getattr(obj.db, 'room_id', '') or '') == room_id:\n            return obj\n    return None\n\ndef find_npc(npc_id):\n    for obj in ObjectDB.objects.all():\n        if bool(getattr(obj.db, 'is_npc', False)) and str(getattr(obj.db, 'npc_id', '') or '') == str(npc_id or ''):\n            return obj\n    return None\n\ndef install(row):\n    npc_id = str(row.get('npc_id') or '')\n    npc = find_npc(npc_id)\n    room = find_room(row.get('current_room_id'), row.get('current_room_key'))\n    created = npc is None\n    if npc is None:\n        npc = create_object('typeclasses.npcs.NPC', key=row.get('key') or npc_id or 'NPC SIZA', location=room)\n    npc.key = row.get('key') or npc.key\n    if room is not None:\n        npc.location = room\n    npc.aliases.clear()\n    for alias in row.get('aliases') or []:\n        npc.aliases.add(str(alias))\n    for key in ('npc_id','desc','dialogue_greeting','canon_status','campaign_id','home_room_id','work_room_id','rest_room_id'):\n        setattr(npc.db, key, row.get(key))\n    npc.db.simulation_enabled = bool(row.get('simulation_enabled'))\n    npc.db.decision_enabled = bool(row.get('decision_enabled'))\n    for key in ('adventure_stats','knowledge','job','relationships','needs','decision_priorities','virtues','flaws'):\n        setattr(npc.db, key, dict(row.get(key) or {}))\n    for key in ('dialogue_topics','memories','routine','need_rules','need_dynamics','decision_goals'):\n        setattr(npc.db, key, list(row.get(key) or []))\n    combat = dict(row.get('combat_profile') or {})\n    npc.db.combat_profile = {'enabled': bool(combat.get('enabled')), 'deck_id': str(combat.get('deck_id') or '').strip() or None, 'tcg_profile': dict(combat.get('tcg_profile') or {}), 'loadout': dict(combat.get('loadout') or {}), 'world_status': dict(combat.get('world_status') or {}), 'encounter_tags': list(combat.get('encounter_tags') or [])}\n    npc.db.knowledge_facts = []\n    for fact in row.get('knowledge_facts') or []:\n        if isinstance(fact, dict):\n            upsert_knowledge_fact(npc, fact)\n    return {'npc_id': npc_id, 'key': npc.key, 'dbref': int(npc.id), 'created': created, 'room_id': str(getattr(getattr(npc.location, 'db', None), 'room_id', '') or '') if npc.location else None, 'deck_id': npc.db.combat_profile.get('deck_id')}\n\ndef build():\n    report = [install(row) for row in DATA.get('npcs') or []]\n    try:\n        caller.msg('SIZA_NPC_CREATOR=' + repr(report))\n    except NameError:\n        print('SIZA_NPC_CREATOR=', report)\n    return report\n\nbuild()\n`}
$('add').onclick=()=>{const n=freshNPC(state.npcs.length+1,state.meta.campaign_id);state.npcs.push(n);selected=n.editor_id;save();render()};$('dup').onclick=()=>{const s=current();if(!s)return;const n=clone(s);n.editor_id=eid();n.key+=' copia';n.npc_id+='-COPY';state.npcs.push(n);selected=n.editor_id;save();render()};$('del').onclick=()=>{const n=current();if(!n||!confirm(`¿Eliminar ${n.key} del editor?`))return;state.npcs=state.npcs.filter(x=>x.editor_id!==selected);if(!state.npcs.length)state.npcs.push(freshNPC(1,state.meta.campaign_id));selected=state.npcs[0].editor_id;save();render()};$('projectName').oninput=e=>{state.meta.name=e.target.value;save()};$('projectCampaign').oninput=e=>{state.meta.campaign_id=e.target.value;save()};$('mapImport').onclick=()=>$('mapFile').click();$('jsonImport').onclick=()=>$('jsonFile').click();$('mapFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const p=JSON.parse(await f.text()),rooms=arr(p.rooms).filter(r=>r.room_id).map(r=>({room_id:String(r.room_id),key:String(r.key||''),zone_id:String(r.zone_id||''),region_id:String(r.region_id||''),district_id:String(r.district_id||'')}));if(!rooms.length)throw new Error('Ese JSON no contiene Rooms del Map Creator');state.map={name:p.meta?.name||f.name,rooms};save('Mapa importado');render()}catch(err){$('status').textContent=err.message}$('mapFile').value=''};$('jsonFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;state=normalize(JSON.parse(await f.text()));if(!state.npcs.length)state.npcs.push(freshNPC(1,state.meta.campaign_id));selected=state.npcs[0].editor_id;save('NPC JSON importado');render()}catch(err){$('status').textContent=err.message}$('jsonFile').value=''};$('jsonExport').onclick=()=>dl(slug(state.meta.name)+'.npc.json',JSON.stringify(exportData(),null,2),'application/json');$('seedExport').onclick=()=>dl(slug(state.meta.name)+'_npc_seed.py',seed(),'text/x-python');render();
})();
