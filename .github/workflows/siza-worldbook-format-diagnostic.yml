name: SIZA World Book Format Diagnostic

on:
  push:
    paths:
      - '.github/workflows/siza-worldbook-format-diagnostic.yml'
  workflow_dispatch:

jobs:
  inspect-chunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect all World Book chunk boundaries
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          total = 0
          for index in range(6):
              path = Path(f'rivarica/chunks/wb-{index:02d}.js')
              text = path.read_text(encoding='utf-8')
              runs = list(re.finditer(r'[A-Za-z0-9+/=]{32,}', text))
              lengths = [len(m.group(0)) for m in runs]
              total += sum(lengths)
              print(f'wb-{index:02d}: chars={len(text)} quotes={text.count(chr(34))} backslashes={text.count(chr(92))} runs={lengths}')
              print('  prefix=', repr(text[:90]))
              print('  suffix=', repr(text[-90:]))
              print('  run_edges=', [(m.start(), m.end(), repr(m.group(0)[:12]), repr(m.group(0)[-12:])) for m in runs])
          print('TOTAL_BASE64_RUN_CHARS=', total, 'MOD4=', total % 4)
          PY
