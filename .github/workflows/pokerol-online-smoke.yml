name: POKEROL Online Smoke Build

on:
  push:
    branches: [main]
    paths:
      - 'pokerol/**'
      - '.github/workflows/pokerol-online-smoke.yml'
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build POKEROL image
        run: docker build -t pokerol-smoke ./pokerol

      - name: Start POKEROL container
        run: |
          docker run -d --name pokerol-smoke-run \
            -e PORT=4001 \
            -e POKEROL_SOLO_TEST_MODE=1 \
            -e EVENNIA_SUPERUSER_USERNAME=SmokeAdmin \
            -e EVENNIA_SUPERUSER_PASSWORD=SmokeOnly-LocalRunner-9274 \
            -e EVENNIA_SUPERUSER_EMAIL= \
            -p 4001:4001 \
            pokerol-smoke

      - name: Capture initial container diagnostics
        run: |
          sleep 8
          {
            echo '=== docker ps -a ==='
            docker ps -a || true
            echo '=== container state ==='
            docker inspect pokerol-smoke-run --format 'status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' || true
            echo '=== POKEROL logs ==='
            docker logs pokerol-smoke-run || true
            echo '=== Evennia status ==='
            timeout 5s docker exec pokerol-smoke-run sh -lc 'cd /app/runtime && python -m evennia status || true' || true
          } > /tmp/pokerol-diagnostics.txt 2>&1
          cat /tmp/pokerol-diagnostics.txt

      - name: Upload initial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokerol-container-diagnostics
          path: /tmp/pokerol-diagnostics.txt
          if-no-files-found: error
          retention-days: 1

      - name: Wait for Evennia web server
        run: |
          set -e
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4001/ >/dev/null; then
              echo "POKEROL web server is responding."
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx pokerol-smoke-run; then
              echo "Container stopped before web server became ready."
              docker inspect pokerol-smoke-run --format 'status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
              docker logs pokerol-smoke-run || true
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for POKEROL web server."
          docker inspect pokerol-smoke-run --format 'status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
          docker logs pokerol-smoke-run || true
          exit 1

      - name: Check webclient route
        run: curl -fsS http://127.0.0.1:4001/webclient/ >/dev/null

      - name: Verify Kanto first-start materialization
        run: |
          set -e
          docker exec pokerol-smoke-run sh -lc "grep -F 'POKEROL initial Kanto seed materialized' /app/runtime/server/logs/server.log"
          docker exec pokerol-smoke-run sh -lc "grep -F \"'rooms_created': 30\" /app/runtime/server/logs/server.log"
          docker exec pokerol-smoke-run sh -lc "grep -F \"'exits_created': 66\" /app/runtime/server/logs/server.log"

      - name: Capture final diagnostics
        if: always()
        run: |
          {
            echo '=== final container state ==='
            docker inspect pokerol-smoke-run --format 'status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
            echo '=== launcher logs ==='
            docker logs pokerol-smoke-run || true
            echo '=== server.log ==='
            docker exec pokerol-smoke-run sh -lc 'tail -n 120 /app/runtime/server/logs/server.log' || true
            echo '=== portal.log ==='
            docker exec pokerol-smoke-run sh -lc 'tail -n 120 /app/runtime/server/logs/portal.log' || true
          } > /tmp/pokerol-final-diagnostics.txt 2>&1
          cat /tmp/pokerol-final-diagnostics.txt

      - name: Upload final diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokerol-final-diagnostics
          path: /tmp/pokerol-final-diagnostics.txt
          if-no-files-found: warn
          retention-days: 1
