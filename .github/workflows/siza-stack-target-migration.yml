name: Siza Stack Target Migration

on:
  push:
    paths:
      - '.github/workflows/siza-stack-target-migration.yml'
      - '.github/scripts/siza-stack-target-migration.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-stack-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save jsdom@24
      - name: Validate old/new and publish runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/siza-stack-target-migration.js
