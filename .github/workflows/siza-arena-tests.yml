name: Siza Arena Tests

on:
  push:
    paths:
      - 'siza-mobile-test/index.html'
      - 'siza-mobile-test/adventure-book-shell-v01.js'
      - 'siza-mobile-test/adventure-book-shell-adapter-v01.js'
      - 'siza-mobile-test/adventure-book-shell-renderer-v01.js'
      - 'siza-mobile-test/adventure-book-shell-v01.css'
      - 'siza-mobile-test/world-combat-bridge-v01.js'
      - 'siza-core/**'
      - '.github/scripts/siza-arena-regression.js'
      - '.github/scripts/siza-combat-effects-regression.js'
      - '.github/scripts/siza-prism-effects-regression.js'
      - '.github/scripts/siza-equipment-effects-regression.js'
      - '.github/scripts/siza-battlefield-ui-index-regression.js'
      - '.github/scripts/siza-entry-rules-regression.js'
      - '.github/scripts/siza-crystal-state-regression.js'
      - '.github/scripts/siza-creature-stats-regression.js'
      - '.github/scripts/siza-bounce-regression.js'
      - '.github/scripts/siza-resolution-kind-regression.js'
      - '.github/scripts/siza-priority-response-regression.js'
      - '.github/scripts/siza-world-combat-bridge-regression.js'
      - '.github/scripts/siza-world-combat-index-regression.js'
      - '.github/workflows/siza-arena-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install JSDOM
        run: npm install --no-save jsdom@24

      - name: Fetch exact Arena regression inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const repo=process.env.GH_REPOSITORY,sha=process.env.GH_SHA,token=process.env.GH_TOKEN;
          const files=['siza-mobile-test/index.html','siza-mobile-test/adventure-book-shell-v01.js','siza-mobile-test/adventure-book-shell-adapter-v01.js','siza-mobile-test/adventure-book-shell-renderer-v01.js','siza-mobile-test/world-combat-bridge-v01.js','siza-core/card-effects.js','siza-core/card-schema.js','siza-core/cards.js','siza-core/card-renderer.js','siza-core/manifest-rules.js','siza-core/crystal-rules.js','siza-core/entry-rules.js','siza-core/creature-rules.js','.github/scripts/siza-arena-regression.js','.github/scripts/siza-combat-effects-regression.js','.github/scripts/siza-prism-effects-regression.js','.github/scripts/siza-equipment-effects-regression.js','.github/scripts/siza-battlefield-ui-index-regression.js','.github/scripts/siza-entry-rules-regression.js','.github/scripts/siza-crystal-state-regression.js','.github/scripts/siza-creature-stats-regression.js','.github/scripts/siza-bounce-regression.js','.github/scripts/siza-resolution-kind-regression.js','.github/scripts/siza-priority-response-regression.js','.github/scripts/siza-world-combat-bridge-regression.js','.github/scripts/siza-world-combat-index-regression.js'];
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          (async()=>{
            for(const path of files){
              const r=await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${sha}`,{headers});
              if(!r.ok)throw new Error(`${path}: GET ${r.status}`);
              const f=await r.json(),text=Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8');
              const dir=path.split('/').slice(0,-1).join('/');if(dir)fs.mkdirSync(dir,{recursive:true});
              fs.writeFileSync(path,text);
              console.log(`Fetched ${path} ${f.sha}`);
            }
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE

      - name: Inline shared Arena modules for JSDOM harnesses
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='siza-mobile-test/index.html';let html=fs.readFileSync(path,'utf8');
          for(const name of ['entry-rules.js','creature-rules.js']){
            const tag=`<script src="../siza-core/${name}"></script>`;
            if(!html.includes(tag)){if(name==='creature-rules.js')continue;throw new Error(`Missing shared core tag ${name}`)}
            html=html.replace(tag,`<script>${fs.readFileSync(`siza-core/${name}`,'utf8')}</script>`);
          }
          if(!html.includes('SizaCreatureRules'))html=html.replace('<script>\nconst NEREIDA_IMG=',`<script>${fs.readFileSync('siza-core/creature-rules.js','utf8')}</script>\n<script>\nconst NEREIDA_IMG=`);
          for(const name of ['adventure-book-shell-v01.js','adventure-book-shell-adapter-v01.js','adventure-book-shell-renderer-v01.js','world-combat-bridge-v01.js']){
            const tag=`<script src="${name}"></script>`;
            if(!html.includes(tag))throw new Error(`Missing SIZA module tag ${name}`);
            html=html.replace(tag,`<script>${fs.readFileSync(`siza-mobile-test/${name}`,'utf8')}</script>`);
          }
          fs.writeFileSync(path,html);
          NODE

      - name: Run World Combat Bridge contract regression
        run: node .github/scripts/siza-world-combat-bridge-regression.js

      - name: Run integrated World Combat lifecycle regression
        run: node .github/scripts/siza-world-combat-index-regression.js

      - name: Run Arena regression suite
        run: node .github/scripts/siza-arena-regression.js

      - name: Run combat effects regression
        run: node .github/scripts/siza-combat-effects-regression.js

      - name: Run Prism effects regression
        run: node .github/scripts/siza-prism-effects-regression.js

      - name: Run Equipment effects regression
        run: node .github/scripts/siza-equipment-effects-regression.js

      - name: Run battlefield UI index regression
        run: node .github/scripts/siza-battlefield-ui-index-regression.js

      - name: Run entry rules regression
        run: node .github/scripts/siza-entry-rules-regression.js

      - name: Run crystal state regression
        run: node .github/scripts/siza-crystal-state-regression.js

      - name: Run creature stats regression
        run: node .github/scripts/siza-creature-stats-regression.js

      - name: Run bounce planning regression
        run: node .github/scripts/siza-bounce-regression.js

      - name: Run resolution classification regression
        run: node .github/scripts/siza-resolution-kind-regression.js

      - name: Run priority response regression
        run: node .github/scripts/siza-priority-response-regression.js
