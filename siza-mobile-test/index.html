<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siza Web v0.5.11</title>
<style>html,body{margin:0;min-height:100%;background:#07111b;color:#f3ead5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#loading{padding:24px;text-align:center}#loading strong{display:block;margin-bottom:8px;color:#e6c878}</style>
</head>
<body>
<div id="loading"><strong>Siza Web v0.5.11</strong>Cargando prototipo completo…</div>
<script>
(async()=>{try{
const files=['v0510p01.txt','v0510p02.txt','v0510p03.txt','v0510p04.txt','v0510p05.txt','v0510p06.txt'];
const [parts,portraitText]=await Promise.all([
 Promise.all(files.map(async f=>{const r=await fetch(f+'?v=0511');if(!r.ok)throw new Error(f+': '+r.status);return r.text()})),
 fetch('nereida_portrait.b64?v=0511').then(r=>{if(!r.ok)throw new Error('portrait: '+r.status);return r.text()})
]);
const binary=atob(parts.join('').replace(/\s/g,''));const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no soporta la descompresión requerida.');
let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
const newDC=`function dcFor(c,m=state.player.mag){const ai=affinityInfo(c,m);if(ai.unsupported.length)return Infinity;const base=4+Math.ceil((c.cost+1)/2);return base+ai.penalty}
function naturalChance(c,m=state.player.mag){if(c.type==='Land')return 100;const dc=dcFor(c,m);if(!isFinite(dc))return 0;const need=dc-m.mf;if(need<=1)return 100;if(need>6)return 0;return Math.round((7-need)/6*100)}
function manifestRequirement(c,m=state.player.mag){const dc=dcFor(c,m);if(!isFinite(dc))return {unsupported:true,text:'SIN AFINIDAD',die:0,minBurn:0};const raw=dc-m.mf,minBurn=Math.max(0,raw-6),die=Math.max(1,Math.min(6,raw));return {unsupported:false,die,minBurn,text:minBurn?\`${'${die}'}+ · Burn mínimo ${'${minBurn}'}\`:\`${'${die}'}+\`}}
`;
html=html.replace(/function dcFor[\s\S]*?function manaHtml/,newDC+'function manaHtml');
html=html.replace("const ai=affinityInfo(c),risk=ai.unsupported.length?'SIN AFINIDAD':(ai.penalty?`+${ai.penalty} DC`:`MF ${naturalChance(c)}%`);","const req=manifestRequirement(c),risk=req.text;");
const newFocus=`function matchCardFocus(){const M=state.match;if(!M||M.ui?.hand==null||M.ui.hand<0)return'';const P=M.player,idx=M.ui.hand,c=cardById(P.hand[idx]);if(!c)return'';const isLand=c.type==='Land',reactive=M.active==='response'&&!!M.responseWindow;let action='';if(isLand){action=\`<div class="burnOnlyNoteV5"><b>LAND · RESERVA DE BURN</b><span>No se juega. Se consume sólo después de fallar una tirada de Manafestation.</span></div>\`}else if(reactive){if(M.responseWindow.used){action=\`<div class="reactiveOnlyV53"><b>RESPUESTA YA COMPROMETIDA</b><span>Resuelve el Stack para continuar.</span></div>\`}else if(c.type==='Instant'){const req=manifestRequirement(c,{aff:P.aff,mf:P.mf});action=\`<div class="manifestNeedV511"><b>Tirada ${'${req.text}'}</b><span>Respuesta reactiva.</span></div>\`+btn('Responder',\`SIZA.playSelectedHand()\`)}else{action=\`<div class="reactiveOnlyV53"><b>VENTANA REACTIVA</b><span>Sólo puedes Manafestar Instants mientras el spell rival está en el Stack.</span></div>\`}}else if(M.active==='player'){const req=manifestRequirement(c,{aff:P.aff,mf:P.mf});action=\`<div class="manifestNeedV511"><b>Tirada ${'${req.text}'}</b><span>${'${req.minBurn?`Requiere al menos ${req.minBurn} Reserva${req.minBurn===1?`:`s`} incluso con un 6.`:`Sin Burn obligatorio.`}'}</span></div>\`+btn('Manifestar',\`SIZA.playSelectedHand()\`,'',M.over)}else{action=\`<div class="reactiveOnlyV53"><b>TURNO DEL RIVAL</b><span>Espera una ventana de respuesta para usar Instants.</span></div>\`}return \`<div class="cardFocusV5 ${'${c.finalCardImage?`finalCardFocusV59`:`}`'}">${'${cardHtml(c)}'}<div class="cardFocusActions">${'${action}'}${'${btn(`Cerrar`,`SIZA.selectHand(-1)`,`ghost`)}'}</div></div>\`}
`;
html=html.replace(/function matchCardFocus\(\)[\s\S]*?function manifestInlineHtml\(\)/,newFocus+'function manifestInlineHtml()');
const newMF=`function manifestInlineHtml(){const M=state.match,m=state.modal;if(!M||!m||m.type!=='manifest')return'';const P=M[m.owner],landCards=P.hand.map((id,i)=>({id,i,c:cardById(id)})).filter(x=>x.c&&x.c.type==='Land'&&x.i!==m.idx),lands=landCards.length;const rolled=m.roll!=null;const deficit=rolled?Math.max(0,m.dc-(P.mf+m.roll)):0;const enemyAI=m.owner==='enemy'&&m.ai;const rawNeed=m.dc-P.mf;const minBurn=Math.max(0,rawNeed-6);const dieNeed=Math.max(1,Math.min(6,rawNeed));let info=minBurn>0?\`<div class="mfLine">Necesitas ${'${dieNeed}'}+ y ${'${minBurn}'} Burn mínimo</div><div class="mfSub">${'${enemyAI?`Rival · `:``}'}Carta comprometida</div><div class="mfStatus">Tirando d6…</div>\`:\`<div class="mfLine">Necesitas ${'${dieNeed}'}+</div><div class="mfSub">${'${enemyAI?`Rival · `:``}'}Carta comprometida</div><div class="mfStatus">Tirando d6…</div>\`;let actions='';if(rolled){if(deficit===0){info=\`<div class="mfLine">Sacaste ${'${m.roll}'}</div><div class="mfStatus good">MANAFESTACIÓN EXITOSA</div>\`;if(!enemyAI)actions=\`<div class="inlineMfActions"><button class="btn" onclick="SIZA.commitManifest(0)">${'${m.reactive?`Poner en Stack`:`Resolver`}'}</button></div>\`}else{const burnPreview=landCards.slice(0,Math.min(deficit,lands)).map(x=>\`<span class="burnReserveCardV5">${'${esc(x.c.name)}'}</span>\`).join('');if(lands>=deficit){info=\`<div class="mfLine">Sacaste ${'${m.roll}'} · falta ${'${deficit}'}</div><div class="mfStatus">${'${enemyAI?`RIVAL USA `:``}'}MANA BURN +${'${deficit}'}</div>\`;if(!enemyAI)actions=\`<div class="burnReserveV5">${'${burnPreview}'}</div><div class="inlineMfActions"><button class="burnLandTiny" onclick="SIZA.commitManifest(${'${deficit}'})">Burn ×${'${deficit}'} y ${'${m.reactive?`responder`:`salvar`}'}</button><button class="btn danger" onclick="SIZA.failManifest()">Aceptar fallo</button></div>\`}else{info=\`<div class="mfLine">Sacaste ${'${m.roll}'} · falta ${'${deficit}'}</div><div class="mfStatus bad">BURN INSUFICIENTE</div>\`;if(!enemyAI)actions=\`<div class="burnReserveV5">${'${burnPreview||`<span class="mfSub">No tienes Reservas en mano.</span>`}'}</div><div class="mfSub">Tienes ${'${lands}'}; necesitas ${'${deficit}'}.</div><div class="inlineMfActions"><button class="btn danger" onclick="SIZA.failManifest()">Aceptar fallo</button></div>\`}}}return \`<div class="manifestInlineV5"><div class="committedCardV5" title="Carta comprometida boca abajo"></div><div class="manifestDieV5 ${'${rolled?``:`rolling`}' }">${'${rolled?m.roll:`?`}'}</div><div class="manifestResultV5">${'${info}'}${'${actions}'}</div></div>\`}
`;
html=html.replace(/function manifestInlineHtml\(\)[\s\S]*?function responseWindowHtml\(\)/,newMF+'function responseWindowHtml()');
html=html.replace("const VERSION='0.5.9-work'","const VERSION='0.5.11-work'").replace('Live Match Runtime · v0.5.10','Live Match Runtime · v0.5.11');
html=html.replace('__NEREIDA_PORTRAIT__','data:image/jpeg;base64,'+portraitText.trim());
html=html.replace('</head>',`<style>.manifestNeedV511{display:flex;align-items:center;gap:8px;justify-content:center;margin:4px 0 8px;padding:7px 10px;border:1px solid rgba(216,181,109,.35);border-radius:9px;background:rgba(7,17,27,.9);font-size:11px}.manifestNeedV511 b{color:#efd28c;font-size:12px}.manifestNeedV511 span{color:#9fb1bf}.mfLine{font-size:15px!important;font-weight:800!important;color:#f3ead5!important}.mfStatus{font-size:12px!important;letter-spacing:.04em}.cardRisk{font-size:10px!important;letter-spacing:.02em!important}</style></head>`);
document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').innerHTML='<strong>No se pudo cargar Siza Web</strong>'+String(e.message||e)}})();
</script>
</body>
</html>
