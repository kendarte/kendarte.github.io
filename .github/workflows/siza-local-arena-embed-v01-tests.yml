name: SIZA Local Arena Embed v0.1 Tests

on:
  push:
    paths:
      - 'siza-world-engine/sync_siza_arena.bat'
      - 'siza-world-engine/start_world_engine.bat'
      - 'siza-world-engine/play_siza_world.bat'
      - 'siza-world-engine/update_world_engine.bat'
      - 'siza-world-engine/overlay/web/templates/webclient/webclient.html'
      - 'siza-world-engine/overlay/web/static/webclient/js/siza_tcg_embed_v01.js'
      - 'siza-world-engine/overlay/web/static/webclient/js/siza_combat_transition_v01.js'
      - 'siza-world-engine/overlay/web/static/webclient/js/siza_world_tcg_transport_v01.js'
      - 'siza-world-engine/overlay/web/static/webclient/css/siza_tcg_embed_v01.css'
      - 'siza-world-engine/overlay/web/static/webclient/css/siza_combat_transition_v01.css'
      - 'siza-mobile-test/**'
      - 'siza-core/**'
      - '.github/workflows/siza-local-arena-embed-v01-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-arena-embed-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Static mount contract
        shell: bash
        run: |
          node --check siza-world-engine/overlay/web/static/webclient/js/siza_tcg_embed_v01.js
          node --check siza-world-engine/overlay/web/static/webclient/js/siza_combat_transition_v01.js
          node --check siza-world-engine/overlay/web/static/webclient/js/siza_world_tcg_transport_v01.js
          node --check siza-mobile-test/world-combat-bridge-v01.js
          test -f siza-mobile-test/index.html
          test -f siza-mobile-test/world-combat-bridge-v01.js
          test -f siza-core/cards.js
          test -f siza-world-engine/sync_siza_arena.bat
          grep -Fq '..\siza-mobile-test" "runtime\web\static\webclient\tcg\siza-mobile-test" /MIR' siza-world-engine/sync_siza_arena.bat
          grep -Fq '..\siza-core" "runtime\web\static\webclient\tcg\siza-core" /MIR' siza-world-engine/sync_siza_arena.bat
          grep -Fq 'sync_siza_arena.bat' siza-world-engine/start_world_engine.bat
          grep -Fq 'sync_siza_arena.bat' siza-world-engine/play_siza_world.bat
          grep -Fq 'sync_siza_arena.bat' siza-world-engine/update_world_engine.bat
          grep -Fq 'siza_tcg_embed_v01.js' siza-world-engine/overlay/web/templates/webclient/webclient.html
          grep -Fq 'siza_tcg_embed_v01.css' siza-world-engine/overlay/web/templates/webclient/webclient.html
          grep -Fq 'siza_combat_transition_v01.js' siza-world-engine/overlay/web/templates/webclient/webclient.html
          grep -Fq 'siza_combat_transition_v01.css' siza-world-engine/overlay/web/templates/webclient/webclient.html
          ! grep -Fq 'siza_tcg_battlefield_v03.js' siza-world-engine/overlay/web/templates/webclient/webclient.html
          ! grep -Fq 'siza_combat_choreography_v01.js' siza-world-engine/overlay/web/templates/webclient/webclient.html
          ! grep -Fq 'siza_combat_animation_v02.js' siza-world-engine/overlay/web/templates/webclient/webclient.html
          ! grep -Fq '.creatureCommandDockV610' siza-world-engine/overlay/web/static/webclient/js/siza_tcg_embed_v01.js
          ! grep -Fq '.arenaField' siza-world-engine/overlay/web/static/webclient/js/siza_tcg_embed_v01.js
          ! grep -Fq '.handAreaV5' siza-world-engine/overlay/web/static/webclient/js/siza_tcg_embed_v01.js
          ! grep -Fq '.matchLog' siza-world-engine/overlay/web/static/webclient/js/siza_tcg_embed_v01.js
          ! grep -Fq 'allowtransparency' siza-world-engine/overlay/web/static/webclient/js/siza_tcg_embed_v01.js
          grep -Fq '.bookShellV01.modeCombat>.bookHeaderV01{display:none!important}' siza-world-engine/overlay/web/static/webclient/js/siza_tcg_embed_v01.js
          grep -Fq '.bookShellV01.modeCombat .matchBoardV5{width:100%!important;height:100%!important;min-height:0!important;max-height:none!important' siza-world-engine/overlay/web/static/webclient/js/siza_tcg_embed_v01.js
          grep -Fq 'canonicalEncounter' siza-world-engine/overlay/web/static/webclient/js/siza_tcg_embed_v01.js
          grep -Fq 'playBookTransition(function ()' siza-world-engine/overlay/web/static/webclient/js/siza_world_tcg_transport_v01.js
          grep -Fq 'typeof onCovered === "function"' siza-world-engine/overlay/web/static/webclient/js/siza_combat_transition_v01.js
          grep -Fq '.sizaBookClient[data-mode="COMBAT"] > .sizaBookHeader' siza-world-engine/overlay/web/static/webclient/css/siza_tcg_embed_v01.css
          grep -Fq '.sizaBookClient[data-mode="COMBAT"] > .sizaBookHeader' siza-world-engine/overlay/web/templates/webclient/webclient.html
          grep -Fq 'position:fixed !important' siza-world-engine/overlay/web/static/webclient/css/siza_tcg_embed_v01.css
          grep -Fq 'background:#07111b !important' siza-world-engine/overlay/web/static/webclient/css/siza_tcg_embed_v01.css
          echo 'PASS transition/full-board canonical Arena static contract'

      - name: Canonical Arena identity contract
        shell: bash
        run: |
          node <<'NODE'
          require('./siza-mobile-test/world-combat-bridge-v01.js');
          const bridge=globalThis.SizaWorldCombatBridgeV01;
          const match={player:{name:'Nereida',life:20},enemy:{name:'Rival',life:20}};
          const attached=bridge.attachEncounter(match,{
            encounter_id:'IDENTITY-001',
            encounter_type:'COMBAT_CONFRONTATION',
            site:{room_id:'ROOM:1',name:'Pescaderia de Darsena'},
            initiator:{entity_id:'PLAYER:1',name:'admin'},
            opponents:[{entity_id:'NPC:2',name:'Mara Vensal'}]
          });
          if(!attached.ok)throw new Error('encounter did not attach');
          const meta=bridge.presentationMeta(match);
          if(meta.player_name!=='Nereida')throw new Error(`World account name replaced Arena identity: ${meta.player_name}`);
          if(meta.opponent_name!=='Mara Vensal')throw new Error(`World opponent identity was lost: ${meta.opponent_name}`);
          console.log('PASS canonical Arena player identity survives World encounter metadata');
          NODE

      - name: Install JSDOM
        run: npm install --no-save jsdom@24

      - name: Covered transition to full-board child Arena to Evennia result regression
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          (async()=>{
            const dom=new JSDOM(`<!doctype html><html><body>
              <div id="siza-book-client" class="sizaBookClient" data-mode="EXPLORATION">
                <header class="sizaBookHeader">WORLD HEADER</header>
                <main class="sizaBookBody">
                  <section class="sizaBookScene">WORLD SCENE</section>
                  <section id="siza-tcg-tray" data-active="false">
                    <div id="siza-tcg-resource-mount"></div>
                    <div id="siza-tcg-hand-mount"></div>
                    <div id="siza-tcg-status"></div>
                  </section>
                </main>
              </div>
            </body></html>`,{runScripts:'outside-only',url:'http://localhost:4001/webclient/'});
            const w=dom.window;
            const listeners={};
            const sent=[];
            w.SizaWorldBookClient={setMode:(mode)=>{w.document.getElementById('siza-book-client').setAttribute('data-mode',mode);return mode;}};
            w.SizaBookShellV02={setCombatTray:(state)=>{w.document.getElementById('siza-tcg-tray').setAttribute('data-active',state.active?'true':'false');return true;}};
            w.Evennia={
              init:()=>{},
              isConnected:()=>true,
              msg:(name,args,kwargs)=>sent.push({name,args,kwargs}),
              emitter:{on:(name,fn)=>listeners[name]=fn}
            };

            w.eval(fs.readFileSync('siza-world-engine/overlay/web/static/webclient/js/siza_tcg_embed_v01.js','utf8'));
            w.eval(fs.readFileSync('siza-world-engine/overlay/web/static/webclient/js/siza_combat_transition_v01.js','utf8'));
            w.eval(fs.readFileSync('siza-world-engine/overlay/web/static/webclient/js/siza_world_tcg_transport_v01.js','utf8'));
            w.document.dispatchEvent(new w.Event('DOMContentLoaded'));
            await new Promise(r=>setTimeout(r,0));

            const encounter={
              encounter_id:'WEB-EMBED-001',encounter_type:'COMBAT_CONFRONTATION',
              site:{room_id:'CAR-KAL-DAR-TEST',name:'Dockside Fishery'},
              initiator:{entity_id:'PLAYER:1',name:'admin'},
              opponents:[{entity_id:'NPC:2',name:'Mara Vensal'}]
            };
            listeners.siza_combat_encounter([encounter]);

            const client=w.document.getElementById('siza-book-client');
            if(client.getAttribute('data-mode')!=='EXPLORATION')throw new Error('World shell switched before transition covered the scene');
            const transition=w.document.getElementById('siza-combat-book-transition-v02');
            if(!transition)throw new Error('World -> combat transition was not created');
            if(transition.parentNode!==client)throw new Error('transition does not cover the whole World book');
            if(transition.getAttribute('data-state')!=='closing')throw new Error('transition did not start in closing state');

            const frame=w.document.getElementById('siza-tcg-embed-frame');
            if(!frame)throw new Error('local Arena iframe was not preloaded');
            if(!frame.getAttribute('src').includes('/static/webclient/tcg/siza-mobile-test/index.html'))throw new Error(`wrong local Arena src: ${frame.getAttribute('src')}`);
            if(frame.hasAttribute('allowtransparency'))throw new Error('canonical Arena iframe is still transparent');

            await new Promise(r=>setTimeout(r,430));
            if(client.getAttribute('data-mode')!=='COMBAT')throw new Error('Arena was not revealed after transition fully covered World');
            if(w.document.getElementById('siza-tcg-tray').getAttribute('data-arena-source')!=='siza-mobile-test')throw new Error('embed is not marked as canonical siza-mobile-test source');

            let startedEncounter=null;
            frame.contentWindow.SIZA={
              startWorldEncounter:(packet,mode)=>{startedEncounter={packet,mode};return {ok:true,status:'WORLD_ENCOUNTER_STARTED',encounter_id:packet.encounter_id};},
              getWorldCombatResult:()=>null
            };
            frame.dispatchEvent(new w.Event('load'));
            await new Promise(r=>setTimeout(r,0));
            if(!startedEncounter||startedEncounter.packet.encounter_id!=='WEB-EMBED-001')throw new Error('pending encounter was not delivered to child Arena after load');
            if(startedEncounter.packet.initiator.name!=='Nereida')throw new Error(`World login leaked into Arena identity: ${startedEncounter.packet.initiator.name}`);
            if(!String(startedEncounter.packet.initiator.portrait||'').includes('nereida_voss.webp'))throw new Error('canonical Nereida portrait was not supplied to Arena');

            const childStyle=frame.contentWindow.document.getElementById('siza-world-embed-style');
            if(!childStyle)throw new Error('child Arena embed style was not installed');
            if(!childStyle.textContent.includes('.bookShellV01.modeCombat>.bookHeaderV01{display:none!important}'))throw new Error('duplicate child book header is still enabled');
            if(!childStyle.textContent.includes('.bookShellV01.modeCombat .matchBoardV5{width:100%!important;height:100%!important;min-height:0!important;max-height:none!important'))throw new Error('child match board is not constrained to the iframe viewport');

            const result={
              result_id:'WEB-EMBED-001:RESULT:1',encounter_id:'WEB-EMBED-001',status:'RESOLVED',outcome:'PLAYER_WIN',
              winner_ids:['PLAYER:1'],defeated_ids:['NPC:2'],participants:[]
            };
            frame.contentWindow.dispatchEvent(new frame.contentWindow.CustomEvent('siza:combat-result',{detail:result}));
            await new Promise(r=>setTimeout(r,0));
            const resultSend=sent.find(row=>row.name==='text'&&String(row.args&&row.args[0]).startsWith('siza-combat-result '));
            if(!resultSend)throw new Error('child CombatResult did not return through Evennia transport');

            console.log('PASS World visible -> covered transition -> full-board canonical Arena -> CombatResult -> Evennia');
            dom.window.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
