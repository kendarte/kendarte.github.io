name: SIZA Book Battlefield v0.2 Tests

on:
  push:
    paths:
      - 'siza-world-engine/overlay/web/static/webclient/css/siza_tcg_battlefield_v02.css'
      - 'siza-world-engine/overlay/web/static/webclient/js/siza_tcg_battlefield_v02.js'
      - 'siza-world-engine/overlay/web/templates/webclient/webclient.html'
      - '.github/workflows/siza-book-battlefield-v02-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battlefield-layout-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate battlefield layout contract
        shell: bash
        run: |
          node --check siza-world-engine/overlay/web/static/webclient/js/siza_tcg_battlefield_v02.js
          python - <<'PY'
          from pathlib import Path

          css = Path('siza-world-engine/overlay/web/static/webclient/css/siza_tcg_battlefield_v02.css').read_text(encoding='utf-8')
          js = Path('siza-world-engine/overlay/web/static/webclient/js/siza_tcg_battlefield_v02.js').read_text(encoding='utf-8')
          template = Path('siza-world-engine/overlay/web/templates/webclient/webclient.html').read_text(encoding='utf-8')

          required_css = [
              '.arenaHalf.enemyHalf',
              'top: 14px !important',
              '.arenaHalf.playerHalf',
              'top: 205px !important',
              '.arenaHalf .arenaZones',
              'display: flex !important',
              'SUPPORT · ARTIFACTS · EQUIPMENT · ENCHANTMENTS',
              'ENEMY INVOCATIONS / BATTLE SPRITES',
              'YOUR INVOCATIONS / BATTLE SPRITES',
              '.stackAnchorV5',
              'STACK / EFFECTS',
              '.handAreaV5',
              '.resourceRailV610',
          ]
          for token in required_css:
              assert token in css, f'missing battlefield CSS contract: {token}'

          support_block = css.split('.arenaHalf .arenaZones {', 1)[1].split('}', 1)[0]
          assert 'display: flex !important' in support_block, 'support zones must stay visible'
          assert 'display: none' not in support_block, 'support zones must not be hidden'
          assert 'siza_tcg_battlefield_v02.css?v=0200' in js, 'child iframe stylesheet injection missing'
          assert 'doc.head.appendChild(link)' in js, 'battlefield CSS must win cascade inside iframe'
          assert 'siza_tcg_embed_v01.js' in template and 'siza_tcg_battlefield_v02.js' in template
          assert template.index('siza_tcg_embed_v01.js') < template.index('siza_tcg_battlefield_v02.js'), 'battlefield override must load after Arena embed'

          print('PASS enemy and player battlefield halves are separated')
          print('PASS support permanents zone is visible')
          print('PASS Invocation battle-sprite lanes and Stack zone are reserved')
          print('PASS battlefield override is injected after Arena embed CSS')
          PY
