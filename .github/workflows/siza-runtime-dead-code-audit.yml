name: Siza Runtime Dead Code Audit

on:
  push:
    paths:
      - '.github/workflows/siza-runtime-dead-code-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-runtime:
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save acorn@8
      - name: Fetch exact audit inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const repo=process.env.GH_REPOSITORY,sha=process.env.GH_SHA,token=process.env.GH_TOKEN;
          const files=['siza-mobile-test/index.html','.github/scripts/siza-runtime-dead-code-audit.js'];
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          (async()=>{for(const path of files){const r=await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${sha}`,{headers});if(!r.ok)throw new Error(`${path}: GET ${r.status}`);const f=await r.json(),text=Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8');const dir=path.split('/').slice(0,-1).join('/');if(dir)fs.mkdirSync(dir,{recursive:true});fs.writeFileSync(path,text);console.log(`Fetched ${path} ${f.sha}`)}})().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
      - name: Audit named function references
        run: node .github/scripts/siza-runtime-dead-code-audit.js
