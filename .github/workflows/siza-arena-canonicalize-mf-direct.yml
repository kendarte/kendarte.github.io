name: Siza Arena Validate Canonical Manafestation

on:
  push:
    paths:
      - '.github/workflows/siza-arena-canonicalize-mf-direct.yml'

permissions:
  contents: read

jobs:
  validate-canonical-manafestation:
    runs-on: ubuntu-latest
    steps:
      - name: Install validation dependencies
        run: npm install --no-save acorn@8 jsdom@24

      - name: Validate current Arena through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const acorn = require('acorn');
          const { JSDOM, VirtualConsole } = require('jsdom');

          const repo = process.env.GH_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const path = 'siza-mobile-test/index.html';
          const api = `https://api.github.com/repos/${repo}/contents/${path}?ref=main`;
          const headers = {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28'
          };

          async function main() {
            const read = await fetch(api, { headers });
            if (!read.ok) throw new Error(`GET ${read.status}: ${await read.text()}`);
            const current = await read.json();
            const html = Buffer.from(current.content.replace(/\n/g, ''), 'base64').toString('utf8');
            console.log(`Arena blob ${current.sha}`);

            const scriptOpen = html.lastIndexOf('<script>');
            const scriptClose = html.indexOf('</script>', scriptOpen);
            if (scriptOpen < 0 || scriptClose < 0) throw new Error('Main script block not found');
            const code = html.slice(scriptOpen + '<script>'.length, scriptClose);
            const ast = acorn.parse(code, { ecmaVersion: 'latest', sourceType: 'script' });

            const declarations = [];
            function walk(node) {
              if (!node || typeof node !== 'object') return;
              if (node.type === 'FunctionDeclaration' && node.id) declarations.push(node.id.name);
              for (const [key, value] of Object.entries(node)) {
                if (key === 'start' || key === 'end' || key === 'loc') continue;
                if (Array.isArray(value)) for (const child of value) walk(child);
                else if (value && typeof value === 'object' && typeof value.type === 'string') walk(value);
              }
            }
            walk(ast);

            const counts = new Map();
            for (const name of declarations) counts.set(name, (counts.get(name) || 0) + 1);
            const duplicates = [...counts.entries()].filter(([, count]) => count > 1).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
            console.log(`Named function declarations: ${declarations.length}`);
            console.log(`Duplicate names: ${duplicates.length}`);
            for (const [name, count] of duplicates) console.log(`${count}x ${name}`);

            const targets = [
              'playHand','openManifest','rollManifest','cancelManifest','selectBurn',
              'commitManifest','failManifest','manifestInlineHtml','enemyResolveManifestRoll'
            ];
            for (const name of targets) {
              const count = counts.get(name) || 0;
              console.log(`CANONICAL ${name}: ${count}`);
              if (count !== 1) throw new Error(`${name}: expected exactly 1 active declaration, found ${count}`);
            }

            const virtualConsole = new VirtualConsole();
            virtualConsole.on('jsdomError', error => console.error('[JSDOM]', error.message));
            const dom = new JSDOM(html, {
              runScripts: 'dangerously',
              url: 'https://siza.local/',
              virtualConsole
            });
            const runner = dom.window.SIZA?.runArenaCriticalV071;
            if (typeof runner !== 'function') throw new Error('SIZA.runArenaCriticalV071 is not available');
            const report = runner();
            console.log(`SIZA Arena contract ${report.version}: ${report.passed}/${report.total}`);
            for (const result of report.results) {
              console.log(`${result.pass ? 'PASS' : 'FAIL'} ${result.name}${result.error ? ` :: ${result.error}` : ''}`);
            }
            dom.window.close();
            if (report.passed !== report.total) throw new Error(`Arena contract failed: ${report.passed}/${report.total}`);
          }

          main().catch(error => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE
