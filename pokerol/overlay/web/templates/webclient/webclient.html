{% extends "webclient/base.html" %}
{% load static %}

{% block guilib_import %}
{{ block.super }}
<link rel="stylesheet" type="text/css" href="{% static 'webclient/css/pokerol_playable_client_v01.css' %}">
<link rel="stylesheet" type="text/css" href="{% static 'webclient/css/pokerol_pokemon_battle_v01.css' %}">
<link rel="stylesheet" type="text/css" href="{% static 'webclient/css/pokerol_multiplayer_battle_v01.css' %}">
<script src="{% static 'webclient/js/pokerol_playable_client_v01.js' %}" type="text/javascript" charset="utf-8"></script>
<script src="{% static 'webclient/js/pokerol_pokemon_battle_v01.js' %}" type="text/javascript" charset="utf-8"></script>
<script src="{% static 'webclient/js/pokerol_battle_medium_ui_v01.js' %}" type="text/javascript" charset="utf-8"></script>
<script src="{% static 'webclient/js/pokerol_battle_position_ui_v01.js' %}" type="text/javascript" charset="utf-8"></script>
<script src="{% static 'webclient/js/pokerol_battle_reaction_ui_v01.js' %}" type="text/javascript" charset="utf-8"></script>
<script src="{% static 'webclient/js/pokerol_multiplayer_battle_v01.js' %}" type="text/javascript" charset="utf-8"></script>
<script src="{% static 'webclient/js/pokerol_brand.js' %}" type="text/javascript" charset="utf-8"></script>
{% endblock %}

{% block client %}
<div id="pokerol-client" class="pkGameShell">
  <header class="pkTopbar">
    <div class="pkBrand">
      <strong>POKEROL</strong>
      <span id="pk-mode-label">AVENTURA · KANTO</span>
    </div>
    <nav class="pkQuickbar" aria-label="Menú">
      <button id="pk-party" type="button">POKÉMON</button>
      <button id="pk-bag" type="button">BOLSA</button>
      <button id="pk-look" type="button">MIRAR</button>
      <button id="pk-test" class="pkPrimary" type="button">PRUEBA</button>
    </nav>
  </header>

  <main id="pk-stage" class="pkStage" aria-live="polite">
    <div id="pk-stage-bg" class="pkStageBackground"></div>
    <div class="pkStageShade"></div>

    <div class="pkStageHud">
      <div class="pkLocationPlate">
        <span class="pkEyebrow">UBICACIÓN</span>
        <strong id="pk-room-name">Conectando con Kanto…</strong>
        <span id="pk-room-id"></span>
      </div>
      <div id="pk-exit-strip" class="pkExitStrip" aria-label="Destinos"></div>
    </div>

    <div id="pk-actor-layer" class="pkActorLayer" aria-label="Personajes y objetos interactuables"></div>

    <div id="pk-player-avatar" class="pkPlayerAvatar" aria-label="Tu entrenador">
      <div class="pkPlayerHead"></div>
      <div class="pkPlayerBody"></div>
      <span>ENTRENADOR</span>
    </div>

    <section id="pk-dialogue" class="pkDialogueBox">
      <div class="pkDialogueHeader">
        <strong id="pk-speaker">NARRADOR</strong>
        <button id="pk-log-toggle" type="button">HISTORIAL</button>
      </div>
      <div id="pk-dialogue-text" class="pkDialogueText">Conectando con el mundo…</div>
      <div id="pk-context-actions" class="pkContextActions"></div>
    </section>

    <aside id="pk-history" class="pkHistory" aria-label="Historial">
      <div class="pkHistoryHead"><strong>HISTORIAL</strong><button id="pk-log-close" type="button">×</button></div>
      <div id="messagewindow"></div>
    </aside>
  </main>

  <div id="input" class="pkFreeActionBar" data-role-input data-update-append>
    <div id="prompt" class="prompt"></div>
    <div id="inputcontrol">
      <textarea id="inputfield" class="form-control" aria-label="Acción libre" placeholder="¿Qué haces?"></textarea>
      <button id="inputsend" type="button" aria-label="Enviar acción">▶</button>
    </div>
  </div>

  <div id="toolbar"></div>
</div>
{% endblock %}

{% block scripts %}{% endblock %}
