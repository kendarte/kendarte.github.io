name: Siza Dead Combat Helper Cleanup

on:
  push:
    paths:
      - '.github/workflows/siza-dead-helper-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-dead-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save jsdom@24
      - name: Validate and publish runtime cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/siza-dead-helper-migration.js
