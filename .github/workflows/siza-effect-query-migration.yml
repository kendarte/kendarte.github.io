name: Siza Effect Query Migration

on:
  push:
    paths:
      - '.github/workflows/siza-effect-query-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-effect-queries:
    runs-on: ubuntu-latest
    steps:
      - name: Install JSDOM
        run: npm install --no-save jsdom@24

      - name: Validate old/new and publish runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,api=`https://api.github.com/repos/${repo}`;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function get(path){const r=await fetch(`${api}/contents/${path}?ref=main`,{headers});if(!r.ok)throw new Error(`${path}: GET ${r.status}`);const f=await r.json();return{sha:f.sha,text:Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}}
          function inline(html,files){let out=html;for(const name of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js','creature-rules.js']){const tag=`<script src="../siza-core/${name}"></script>`;if(!out.includes(tag))throw new Error(`Missing ${name}`);out=out.replace(tag,`<script>${files[name]}</script>`)}return out}
          function dom(html,label){const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error(`[JSDOM ${label}]`,e.message));const d=new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc});d.window.setTimeout=()=>0;return d}
          (async()=>{
            const current=await get('siza-mobile-test/index.html'),files={};for(const n of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js','creature-rules.js'])files[n]=(await get(`siza-core/${n}`)).text;
            const oldHas="function cardHasEffectV1(c,type,event=null){const list=event?SizaCardEffects.forEvent(c,event):SizaCardEffects.normalizeEffects(c?.effects);return list.some(e=>e.type===type)}";
            const oldGain="function combatPowerCounterGainV1(c){return SizaCardEffects.forEvent(c,'combat-damage').filter(e=>e.type==='add-power-counter').reduce((n,e)=>n+(e.amount||0),0)}";
            assert(current.text.includes(oldHas)&&current.text.includes(oldGain),'Effect query anchors changed');
            const candidate=current.text.replace(oldHas,"function cardHasEffectV1(c,type,event=null){return SizaCardEffects.hasEffect(c,type,event)}").replace(oldGain,"function combatPowerCounterGainV1(c){return SizaCardEffects.sumAmount(c,'combat-damage','add-power-counter')}");
            const marker='window.SIZA={',probe=`window.__EFFECT_QUERY_COMPARE__={cardById,TEST_CARD_DB_V1,cardHasEffectV1,combatPowerCounterGainV1};\n`;assert(current.text.includes(marker),'SIZA marker missing');
            const O=dom(inline(current.text,files).replace(marker,probe+marker),'old'),N=dom(inline(candidate,files).replace(marker,probe+marker),'new'),o=O.window.__EFFECT_QUERY_COMPARE__,n=N.window.__EFFECT_QUERY_COMPARE__;
            const generated=[
              {id:'guard_effect_counter',name:'Guard Counter',type:'Instant',effects:[{event:'resolve',type:'counter-stack-target'}]},
              {id:'guard_effect_gain',name:'Guard Gain',type:'Creature',effects:[{event:'combat-damage',type:'add-power-counter',amount:2},{event:'combat-damage',type:'add-power-counter',amount:3},{event:'enter',type:'add-power-counter',amount:9}]},
              {id:'guard_effect_mixed',name:'Guard Mixed',type:'Creature',effects:[{event:'attack-declared',type:'damage-character',target:'opponent',amount:2},{event:'resolve',type:'draw',target:'self',amount:1}]}
            ];o.TEST_CARD_DB_V1.push(...generated.map(x=>({...x})));n.TEST_CARD_DB_V1.push(...generated.map(x=>({...x})));
            const ids=['counter','ignimite','guard_effect_counter','guard_effect_gain','guard_effect_mixed'],queries=[['counter-stack-target',null],['counter-stack-target','resolve'],['add-power-counter',null],['add-power-counter','combat-damage'],['draw','resolve'],['damage-character','attack-declared']];let comparisons=0;
            for(const id of ids){for(const[type,event]of queries){const a=o.cardHasEffectV1(o.cardById(id),type,event),b=n.cardHasEffectV1(n.cardById(id),type,event);assert(a===b,`hasEffect mismatch ${id} ${type} ${event}`);comparisons++}const ag=o.combatPowerCounterGainV1(o.cardById(id)),bg=n.combatPowerCounterGainV1(n.cardById(id));assert(ag===bg,`counter gain mismatch ${id}: ${ag}/${bg}`);comparisons++}
            assert(n.combatPowerCounterGainV1(n.cardById('guard_effect_gain'))===5,'generated gain expected 5');
            const arena=N.window.SIZA.runArenaCriticalV071();assert(arena.passed===arena.total,`Arena ${arena.passed}/${arena.total}`);console.log(`PASS effect queries old/new ${comparisons} comparisons; Arena ${arena.passed}/${arena.total}`);O.window.close();N.window.close();
            const put=await fetch(`${api}/contents/siza-mobile-test/index.html`,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Use shared effect query helpers',content:Buffer.from(candidate).toString('base64'),sha:current.sha,branch:'main'})});if(!put.ok)throw new Error(`PUT ${put.status}: ${await put.text()}`);const result=await put.json();console.log('COMMIT '+result.commit.sha);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
