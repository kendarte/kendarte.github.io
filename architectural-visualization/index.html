<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kendarte — Pre-Sale Architectural Visualization</title>
<meta name="description" content="Sales-ready architectural visualization for home builders and residential developers.">
<style>
:root{--ink:#111214;--paper:#f4f1ea;--muted:#666;--line:#d8d1c5;--dark:#17191d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--paper);color:var(--ink)}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:auto}
.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:rgba(17,18,20,.94);color:#fff;backdrop-filter:blur(10px)}.brand{font-weight:800;letter-spacing:.12em}.top nav{display:flex;gap:22px;font-size:14px}.admin-link{display:none}.admin .admin-link{display:inline-block}
.hero{position:relative;min-height:78vh;background:#111;overflow:hidden}.hero-media{position:absolute;inset:0}.hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover;display:block}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.12) 58%,rgba(0,0,0,.2))}.hero-copy{position:absolute;z-index:2;left:6vw;bottom:10vh;color:#fff;max-width:760px}.eyebrow{font-size:12px;letter-spacing:.2em;font-weight:700;text-transform:uppercase}.hero h1,.intro h2,.project h2,.process h2,.cta h2{font-family:Georgia,serif;font-weight:500}.hero h1{font-size:clamp(42px,6vw,86px);line-height:.95;margin:.35em 0}.hero p{font-size:clamp(16px,2vw,22px);max-width:720px}.btn{display:inline-block;margin-top:22px;padding:13px 18px;border:1px solid currentColor;font-weight:700}
.section{padding:80px 6vw}.intro{display:grid;grid-template-columns:1.05fr 1fr;gap:8vw;align-items:start}.intro h2,.project h2,.process h2,.cta h2{font-size:clamp(34px,4vw,62px);margin:.25em 0}.services{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.pill{padding:9px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.project{padding:86px 6vw;border-top:1px solid var(--line)}.project-head{display:grid;grid-template-columns:1fr 1fr;gap:6vw;align-items:end;margin-bottom:30px}.project-num{font-size:72px;font-family:Georgia,serif;color:#b2a994}.summary{color:#555;line-height:1.65}.shots{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.shot-card{margin:0}.shot-card.half{grid-column:span 6}.shot-card.wide{grid-column:span 12}.shot{background:#ddd;overflow:hidden;min-height:240px}.shot img,.shot svg{width:100%;height:100%;display:block;object-fit:cover}.shot svg{aspect-ratio:4/3}.cap{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#666;margin-top:7px}
.process{background:var(--dark);color:#fff;padding:90px 6vw;display:grid;grid-template-columns:1fr 1.25fr;gap:7vw}.steps{display:grid;gap:22px}.step{display:grid;grid-template-columns:52px 1fr;gap:16px;border-top:1px solid #4a4d52;padding-top:16px}.step b{font-size:26px}.capstrip{background:#0e0f11;color:white;display:flex;flex-wrap:wrap;justify-content:center;gap:18px;padding:22px;text-transform:uppercase;letter-spacing:.16em;font-size:12px}.cta{text-align:center;padding:100px 6vw}.footer{padding:28px 6vw;background:#111214;color:#fff;display:flex;justify-content:space-between;gap:20px;font-size:13px}
.loading{padding:120px 20px;text-align:center;color:#777}
@media(max-width:800px){.top nav a:not(.admin-link):not(:last-child){display:none}.intro,.project-head,.process{grid-template-columns:1fr}.shots{grid-template-columns:1fr}.shot-card.half,.shot-card.wide{grid-column:auto}.hero{min-height:65vh}.section,.project{padding:56px 20px}.process,.cta{padding:64px 20px}.hero-copy{left:20px;right:20px;bottom:50px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#top" id="brand">KENDARTE / ARCHVIZ</a><nav><a href="#work">Work</a><a href="#services">Services</a><a href="#process">Process</a><a class="admin-link" href="editor.html">Manage</a><a id="contactTop" href="https://kendarte.github.io/#contact">Contact</a></nav></header>
<main id="app"><div class="loading">Loading portfolio…</div></main>
<script>
const q=new URLSearchParams(location.search);if(q.get("admin")==="1")document.body.classList.add("admin");
let spriteData=null;
async function loadSprite(src){
 if(spriteData)return spriteData;
 const b64=await fetch(src,{cache:"force-cache"}).then(r=>{if(!r.ok)throw new Error("sprite");return r.text()});
 spriteData="data:image/jpeg;base64,"+b64.replace(/\s+/g,"");
 return spriteData;
}
async function mediaEl(image, hero=false){
 if(!image)return '<div class="shot"></div>';
 if(image.type==="file") return '<img loading="'+(hero?'eager':'lazy')+'" src="'+esc(image.src)+'" alt="'+esc(image.alt||"")+'">';
 const data=await loadSprite(image.src||"sprite.b64");
 const vb=image.viewBox||"0 0 300 225";
 return '<svg viewBox="'+vb+'" preserveAspectRatio="xMidYMid slice" aria-label="'+esc(image.alt||"")+'"><image href="'+data+'" width="'+(image.spriteWidth||300)+'" height="'+(image.spriteHeight||3227)+'"/></svg>';
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function render(){
 const data=await fetch("portfolio.json?"+Date.now()).then(r=>r.json());
 document.title="Kendarte — "+data.site.title;
 document.getElementById("brand").textContent=data.site.brand;
 document.getElementById("contactTop").href=data.site.contactUrl;
 const hero=await mediaEl(data.heroImage,true);
 let projects="";
 for(const p of data.projects){
   let shots="";
   for(const s of p.shots){
     shots += '<figure class="shot-card '+esc(s.size||"half")+'"><div class="shot">'+await mediaEl(s.image)+'</div><figcaption class="cap">'+esc(s.label)+'</figcaption></figure>';
   }
   projects += '<article class="project"><div class="project-head"><div><div class="project-num">'+esc(p.number)+'</div><div class="eyebrow">'+esc(p.eyebrow)+'</div><h2>'+esc(p.title)+'</h2></div><p class="summary">'+esc(p.summary)+'</p></div><div class="shots">'+shots+'</div></article>';
 }
 const servicePills=data.services.map(x=>'<span class="pill">'+esc(x)+'</span>').join("");
 const steps=data.workflow.map((x,i)=>'<div class="step"><b>'+String(i+1).padStart(2,"0")+'</b><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p></div></div>').join("");
 document.getElementById("app").innerHTML=
 '<section id="top" class="hero"><div class="hero-media">'+hero+'</div><div class="hero-copy"><div class="eyebrow">'+esc(data.site.title)+'</div><h1>'+esc(data.site.heroTitle)+'</h1><p>'+esc(data.site.heroText)+'</p><a class="btn" href="#work">View projects</a></div></section>'+
 '<section id="services" class="section intro"><div><div class="eyebrow">What I deliver</div><h2>Architectural models → persuasive marketing imagery.</h2></div><div><p>I turn existing 3D architectural models and project references into polished visuals for listings, brochures, pre-sale campaigns and presentations.</p><div class="services">'+servicePills+'</div></div></section>'+
 '<section id="work">'+projects+'</section>'+
 '<section id="process" class="process"><div><div class="eyebrow">Workflow</div><h2>Simple input.<br>Sales-ready output.</h2></div><div class="steps">'+steps+'</div></section>'+
 '<div class="capstrip"><span>Static renders</span><b>+</b><span>360° panorama</span><b>+</b><span>Interactive walkthrough</span><b>+</b><span>VR visualization</span></div>'+
 '<section class="cta"><div class="eyebrow">Start a project</div><h2>'+esc(data.site.ctaTitle)+'</h2><p>'+esc(data.site.ctaText)+'</p><a class="btn" href="'+esc(data.site.contactUrl)+'">Contact Kendarte ↗</a></section>';
}
render().catch(e=>{console.error(e);document.getElementById("app").innerHTML='<div class="loading">Portfolio failed to load.</div>'});
</script>
<footer class="footer"><span>KENDARTE · Pre-Sale Architectural Visualization</span><a href="#top">Back to top ↑</a></footer>
</body></html>
