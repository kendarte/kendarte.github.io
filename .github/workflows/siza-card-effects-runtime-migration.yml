name: Siza Data Driven Card Effects Migration

on:
  push:
    paths:
      - '.github/workflows/siza-card-effects-runtime-migration.yml'

permissions:
  contents: write

jobs:
  migrate-effects:
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save acorn@8 jsdom@24
      - name: Replace hardcoded stack effects with data driven resolver
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const acorn=require('acorn');const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,path='siza-mobile-test/index.html';
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'},api=`https://api.github.com/repos/${repo}/contents/${path}`;
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function getFile(p){const r=await fetch(`https://api.github.com/repos/${repo}/contents/${p}?ref=main`,{headers});if(!r.ok)throw new Error(`${p}: GET ${r.status}`);const f=await r.json();return{sha:f.sha,text:Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}}
          function mainScript(html){const so=html.lastIndexOf('<script>'),sc=html.indexOf('</script>',so);assert(so>=0&&sc>so,'main script not found');const start=so+8,code=html.slice(start,sc),ast=acorn.parse(code,{ecmaVersion:'latest'}),decl=[];function walk(n){if(!n||typeof n!=='object')return;if(n.type==='FunctionDeclaration'&&n.id)decl.push(n);for(const[k,v]of Object.entries(n)){if(k==='start'||k==='end')continue;if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'&&v.type)walk(v)}}walk(ast);return{start,sc,code,decl}}
          function replaceFunction(html,name,replacement){const p=mainScript(html),nodes=p.decl.filter(n=>n.id.name===name);assert(nodes.length===1,`${name}: expected 1 declaration, got ${nodes.length}`);const n=nodes[0],code=p.code.slice(0,n.start)+replacement+p.code.slice(n.end);return html.slice(0,p.start)+code+html.slice(p.sc)}
          function inlineCore(html,files){let out=html;const pairs=[['card-effects.js',files.effects],['card-schema.js',files.schema],['cards.js',files.cards],['card-renderer.js',files.renderer]];for(const[name,text]of pairs){const tag=`<script src="../siza-core/${name}"></script>`;if(out.includes(tag))out=out.replace(tag,`<script>${text}</script>`)}return out}
          function makeDom(html,label,beforeParse){const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error(`[JSDOM ${label}]`,e.message));return new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc,beforeParse})}
          const resolver=`function cardHasEffectV1(c,type,event=null){const list=event?SizaCardEffects.forEvent(c,event):SizaCardEffects.normalizeEffects(c?.effects);return list.some(e=>e.type===type)}
function bounceTargetsForEffectV1(M,s,entryIndex){const targets=[];for(const owner of ['player','enemy']){M[owner].battlefield.forEach((id,j)=>{if(!(owner===s.owner&&j===entryIndex))targets.push({owner,zone:'battlefield',index:j,id})});M[owner].artifacts.forEach((id,j)=>targets.push({owner,zone:'artifacts',index:j,id}));M[owner].equipment.forEach((e,j)=>targets.push({owner,zone:'equipment',index:j,id:e.id}))}return targets}
function effectSideV1(target,P,O,defaultTarget='self'){const t=target||defaultTarget;return t==='opponent'?O:P}
function applyCardEffectV1(effect,s,c,P,O,entryIndex=null){const M=state.match;if(!M)return{terminal:false};if(effect.type==='counter-stack-target'){let i=M.stack.findIndex(x=>x.id===s.targetStackId);if(i<0)i=M.stack.length-1;if(i>=0){const t=M.stack.splice(i,1)[0];M[t.owner].graveyard.push(t.cardId);addLog('Negación',\`${'${'}c.name} anula ${'${'}cardById(t.cardId).name}.\`)}return{terminal:true}}if(effect.type==='draw'){const T=effectSideV1(effect.target,P,O,'self'),n=effect.amount||1;drawCards(T,n);if(effect.event==='resolve')addLog('Efecto',n===1?\`${'${'}c.name} toma una carta.\`:\`${'${'}c.name} toma ${'${'}n} cartas.\`);return{terminal:false}}if(effect.type==='damage-character'){const T=effectSideV1(effect.target,P,O,'opponent'),n=effect.amount||1;T.life-=n;const target=T===M.player?'player':'enemy',label=T===M.player?state.player.mag.name:'Personaje rival';setDamageFx(target,n,c.name,label);addLog('Daño',\`${'${'}c.name} hace ${'${'}n} daño al Personaje.\`);checkWin();return{terminal:false}}if(effect.type==='observe-top'){const T=effectSideV1(effect.target,P,O,'self');if(T.library[0]){if(s.owner==='player'&&T===P)M.pendingChoice={type:'observe',cardId:T.library[0]};else addLog('Observar','El rival observa la carta superior.')}return{terminal:false}}if(effect.type==='bounce-other-permanent'){const targets=bounceTargetsForEffectV1(M,s,entryIndex);if(targets.length){if(s.owner==='player')M.pendingChoice={type:'bounce',targets};else bounceV070(targets.find(x=>x.owner==='player')||targets[0])}return{terminal:false}}if(effect.type==='discard'){const T=effectSideV1(effect.target,P,O,'self');if(effect.amount===1){if(s.owner==='player'&&T===P)M.pendingChoice={type:'discard'};else if(T.hand.length){const id=T.hand.pop();T.graveyard.push(id)}}return{terminal:false}}return{terminal:false}}
function applyCardEffectsV1(c,event,s,P,O,entryIndex=null){let terminal=false;for(const effect of SizaCardEffects.forEvent(c,event)){const r=applyCardEffectV1(effect,s,c,P,O,entryIndex);terminal=terminal||!!r.terminal;if(state.match?.pendingChoice||state.match?.over||terminal)break}return{terminal}}
function resolveTopStack(){const M=state.match,s=M.stack.pop();if(!s)return;const P=M[s.owner],O=s.owner==='player'?M.enemy:M.player,c=cardById(s.cardId);if(c.type==='Creature'){const i=addCreatureV070(P,c.id);addLog('Materialización',\`${'${'}c.name} entra en Invocaciones.\`);applyCardEffectsV1(c,'enter',s,P,O,i);return}if(c.type==='Artifact'){if(c.id==='tideblade')P.equipment.push({id:c.id,target:null});else P.artifacts.push(c.id);addLog('Permanente',\`${'${'}c.name} entra en su zona propia.\`);applyCardEffectsV1(c,'enter',s,P,O,null);return}const result=applyCardEffectsV1(c,'resolve',s,P,O,null);P.graveyard.push(c.id);if(result.terminal)return;checkWin()}`;
          const commit=`function commitManifest(){const m=state.modal,M=state.match;if(!m||m.roll==null)return;const P=M[m.owner],c=cardById(m.cardId),burn=m.burnSelected.length,total=P.mf+m.roll+m.prismBonus+burn;if(total<m.dc)return;consumeBurnV070(m,P);const id=P.hand.splice(m.idx,1)[0];if(m.offeringIndex!=null){const off=removeBattlefieldAt(P,m.offeringIndex);addLog('Ofrenda · prueba',\`${'${'}cardById(off).name} se sacrifica después del éxito.\`)}if(!M.stack.length)M.stackReturnOwner=m.owner;const obj={id:'stk_'+Date.now()+Math.random(),cardId:id,owner:m.owner,targetStackId:m.reactive&&cardHasEffectV1(c,'counter-stack-target','resolve')?m.targetStackId:null};M.stack.push(obj);addLog(m.reactive?'Respuesta':'Manafestation',\`${'${'}m.owner==='enemy'?'Rival · ':''}${'${'}c.name}: MF ${'${'}P.mf} + dado ${'${'}m.roll}${'${'}m.prismBonus?' + Prisma 1':''}${'${'}burn?\` + Burn ${'${'}burn}\`:''} = ${'${'}total} / D${'${'}m.dc} — ÉXITO.\`);state.modal=null;openPriorityV070(obj);save();render()}`;
          const enemyPlay=`function enemyChoosePlay(){const M=state.match,E=M.enemy;if(M.active!=='enemy'||state.modal||M.responseWindow)return;const loose=E.equipment.findIndex(e=>e.target==null),color=['U','R','G','W','B'].find(k=>(E.crystals?.[k]||0)>0);if(loose>=0&&color&&E.battlefield.length){spendV070(E,{[color]:1});E.equipment[loose].target=0;addLog('Equipo rival',\`${'${'}cardById(E.equipment[loose].id).name} se equipa pagando ${'${'}COLORS[color]}.\`);return setTimeout(enemyChoosePlay,260)}const x=E.hand.map((id,i)=>({i,c:cardById(id)})).filter(x=>x.c?.type!=='Land'&&!cardHasEffectV1(x.c,'counter-stack-target','resolve')&&paymentV070(E,x.c)).sort((a,b)=>a.c.difficulty-b.c.difficulty)[0];if(!x)return enemyAfterMain();openManifest(x.i,x.c,'enemy',false)}`;
          const enemyRespond=`function enemyRespondV070(){const M=state.match,R=M?.responseWindow;if(!R||R.responder!=='enemy'||state.modal)return;const E=M.enemy,x=E.hand.map((id,i)=>({i,c:cardById(id)})).filter(x=>x.c?.type==='Instant'&&paymentV070(E,x.c)).sort((a,b)=>(cardHasEffectV1(a.c,'counter-stack-target','resolve')?-1:0)-(cardHasEffectV1(b.c,'counter-stack-target','resolve')?-1:0))[0];if(!x){addLog('Prioridad rival','El rival pasa.');return passPriorityV070('enemy')}openManifest(x.i,x.c,'enemy',true)}`;
          (async()=>{const index=await getFile(path),files={effects:(await getFile('siza-core/card-effects.js')).text,schema:(await getFile('siza-core/card-schema.js')).text,cards:(await getFile('siza-core/cards.js')).text,renderer:(await getFile('siza-core/card-renderer.js')).text};let html=index.text;console.log(`Current Mobile blob ${index.sha}`);assert(!html.includes('<script src="../siza-core/card-effects.js"></script>'),'Mobile already links effect contract');
            const oldSource=inlineCore(html,files);const oldMarker='window.SIZA={';assert(oldSource.includes(oldMarker),'SIZA export marker missing');const oldTest=oldSource.replace(oldMarker,`window.__FX_TEST__={createMatch,setMatch:m=>state.match=m,getMatch:()=>state.match,resolveTopStack,addCreatureV070,TEST_CARD_DB_V1};\n`+oldMarker);const oldDom=makeDom(oldTest,'old');oldDom.window.setTimeout=()=>0;
            html=html.replace('<script src="../siza-core/card-schema.js"></script>','<script src="../siza-core/card-effects.js"></script>\n<script src="../siza-core/card-schema.js"></script>');html=replaceFunction(html,'resolveTopStack',resolver);html=replaceFunction(html,'commitManifest',commit);html=replaceFunction(html,'enemyChoosePlay',enemyPlay);html=replaceFunction(html,'enemyRespondV070',enemyRespond);assert(html.includes("SizaCardEffects.forEvent(c,event)"),'Data driven resolver missing');assert(!html.includes("if(c.id==='servitor'")&&!html.includes("if(c.id==='leviathan'")&&!html.includes("if(c.id==='queen'")&&!html.includes("if(c.id==='spark'")&&!html.includes("else if(c.id==='mist'"),'Old stack card ID branches remain');
            const newSource=inlineCore(html,files);const probe=`window.__FX_TEST__={createMatch,setMatch:m=>state.match=m,getMatch:()=>state.match,resolveTopStack,addCreatureV070,TEST_CARD_DB_V1,cardHasEffectV1,commitManifest,enemyChoosePlay,enemyRespondV070,setModal:m=>state.modal=m,getModal:()=>state.modal};\n`;const newTest=newSource.replace(oldMarker,probe+oldMarker);const newDom=makeDom(newTest,'new');newDom.window.setTimeout=()=>0;
            function snapshot(dom,setup){const H=dom.window.__FX_TEST__,M=H.createMatch(false,'prepare');H.setMatch(M);setup(H,M);H.resolveTopStack();return JSON.stringify({pl:M.player.life,el:M.enemy.life,ph:M.player.hand,eh:M.enemy.hand,plib:M.player.library,elib:M.enemy.library,pg:M.player.graveyard,eg:M.enemy.graveyard,pbf:M.player.battlefield,ebf:M.enemy.battlefield,pc:M.player.powerCounters,sc:M.player.summonedOn,stack:M.stack.map(x=>({cardId:x.cardId,owner:x.owner,targetStackId:x.targetStackId||null})),choice:M.pendingChoice?{type:M.pendingChoice.type,cardId:M.pendingChoice.cardId||null,targets:(M.pendingChoice.targets||[]).map(x=>({owner:x.owner,zone:x.zone,index:x.index,id:x.id}))}:null})}
            const cases=[['spark',(H,M)=>{M.player.graveyard=[];M.enemy.life=20;M.stack=[{id:'s',cardId:'spark',owner:'player'}]}],['mist',(H,M)=>{M.player.hand=[];M.player.library=['spark'];M.player.graveyard=[];M.stack=[{id:'m',cardId:'mist',owner:'player'}]}],['servitor',(H,M)=>{M.player.hand=[];M.player.library=['spark'];M.stack=[{id:'v',cardId:'servitor',owner:'player'}]}],['counter',(H,M)=>{M.player.graveyard=[];M.enemy.graveyard=[];M.enemy.life=20;M.stack=[{id:'target',cardId:'spark',owner:'enemy'},{id:'c',cardId:'counter',owner:'player',targetStackId:'target'}]}],['leviathan',(H,M)=>{H.addCreatureV070(M.enemy,'watcher');M.stack=[{id:'l',cardId:'leviathan',owner:'player'}]}],['queen',(H,M)=>{M.player.hand=[];M.player.library=['spark','mist','watcher'];M.stack=[{id:'q',cardId:'queen',owner:'player'}]}]];
            for(const[name,setup]of cases){const a=snapshot(oldDom,setup),b=snapshot(newDom,setup);assert(a===b,`${name}: old/new state mismatch\nOLD ${a}\nNEW ${b}`);console.log(`PASS equivalence ${name}`)}
            const H=newDom.window.__FX_TEST__;H.TEST_CARD_DB_V1.push({id:'generated_draw2',name:'Generated Draw Two',type:'Instant',cost:1,difficulty:1,pips:{},text:'Draw two.',art:'multi',glyph:'G',effects:[{event:'resolve',type:'draw',target:'self',amount:2}]});let M=H.createMatch(false,'prepare');H.setMatch(M);M.player.hand=[];M.player.library=['spark','mist','watcher'];M.player.graveyard=[];M.stack=[{id:'g',cardId:'generated_draw2',owner:'player'}];H.resolveTopStack();assert(M.player.hand.join(',')==='spark,mist'&&M.player.graveyard.includes('generated_draw2'),'Generated draw effect did not execute from data');console.log('PASS generated non-hardcoded draw effect');
            H.TEST_CARD_DB_V1.push({id:'generated_counter',name:'Generated Counter',type:'Instant',cost:1,difficulty:1,pips:{U:1},text:'Counter.',art:'blue',glyph:'C',effects:[{event:'resolve',type:'counter-stack-target'}]});M=H.createMatch(false,'prepare');H.setMatch(M);M.player.hand=['generated_counter'];M.stack=[{id:'target',cardId:'spark',owner:'enemy'}];H.setModal({owner:'player',cardId:'generated_counter',idx:0,roll:6,burnSelected:[],prismBonus:0,dc:1,offeringIndex:null,reactive:true,targetStackId:'target'});H.commitManifest();assert(M.stack.at(-1).targetStackId==='target','Generated counter did not inherit reactive target from effect data');console.log('PASS generated counter targeting uses effect data');
            const core=newDom.window.SIZA.runArenaCriticalV071();assert(core.passed===core.total,`Arena core ${core.passed}/${core.total}`);console.log(`PASS Arena ${core.passed}/${core.total}`);oldDom.window.close();newDom.window.close();
            const w=await fetch(api,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Resolve Siza cards from structured effect data',content:Buffer.from(html,'utf8').toString('base64'),sha:index.sha,branch:'main'})});if(!w.ok)throw new Error(`PUT ${w.status}: ${await w.text()}`);const out=await w.json();console.log(`COMMIT ${out.commit.sha}`);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
