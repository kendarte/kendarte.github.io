<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Factory Web Test</title>
<style>
:root{
  --bg:#090c11; --panel:#111722; --panel2:#151d29; --panel3:#0d131c;
  --line:#253142; --text:#eef3f8; --muted:#91a0b1; --accent:#ff3b50;
  --good:#42d392; --warn:#ffbf47; --bad:#ff5d6c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Segoe UI,Inter,Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}
button{border:1px solid var(--line);background:#1a2432;color:var(--text);border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}
button:hover{border-color:#43536c}
button.primary{background:var(--accent);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{background:#281217;border-color:#5a222c;color:#ff9ba6}
input,select,textarea{width:100%;background:#0b1119;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{resize:vertical;min-height:72px}
label{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.7px;margin-bottom:5px}
.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:10px;background:#0b0f15}
.brand{font-size:18px;font-weight:950;letter-spacing:2px;margin-right:8px}.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:4px 7px;border-radius:999px}
.spacer{flex:1}
.app{height:calc(100% - 64px);display:grid;grid-template-columns:280px 1fr 340px}
.sidebar,.inspector{background:var(--panel);overflow:auto}
.sidebar{border-right:1px solid var(--line)}
.inspector{border-left:1px solid var(--line)}
.section{padding:14px;border-bottom:1px solid var(--line)}
.sectionTitle{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sectionTitle strong{font-size:12px;letter-spacing:1px}.sectionTitle span{color:var(--muted);font-size:11px}
.sceneList{padding:10px}
.sceneCard{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.sceneCard.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.sceneCard .num{font-size:11px;color:var(--muted);font-weight:800}
.sceneCard .type{font-size:11px;color:#b2c0cf;text-transform:uppercase;letter-spacing:1px;margin-left:5px}
.sceneCard .name{font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sceneCard .dur{font-size:11px;color:var(--muted);margin-top:5px}
.center{display:grid;grid-template-rows:1fr 190px;min-width:0}
.previewWrap{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#182331 0,#0a0d12 55%,#07090d 100%)}
.previewFrame{position:relative;background:#070a0f;box-shadow:0 30px 80px #000;border:1px solid #2c3440;overflow:hidden;transition:.2s}
.previewFrame.vertical{width:360px;height:640px}.previewFrame.wide{width:640px;height:360px}.previewFrame.square{width:520px;height:520px}
#previewScene{position:absolute;inset:0}
.previewBrand{position:absolute;left:20px;bottom:14px;font-size:11px;letter-spacing:3px;font-weight:900;z-index:20}
.previewCaption{position:absolute;left:20px;right:20px;bottom:45px;text-align:center;font-weight:950;font-size:25px;line-height:1.02;text-transform:uppercase;text-shadow:0 4px 12px #000;z-index:20}
.previewBg{position:absolute;inset:0;background:radial-gradient(circle at 25% 12%,rgba(42,85,135,.45),transparent 36%),radial-gradient(circle at 82% 82%,rgba(154,29,48,.28),transparent 38%),linear-gradient(160deg,#101722,#05070a 70%)}
.phone{position:absolute;left:9%;right:9%;top:7%;bottom:12%;border-radius:32px;background:#0f1620;border:1px solid #ffffff18;box-shadow:0 25px 70px #000;overflow:hidden}
.phoneTop{height:12%;border-bottom:1px solid #ffffff12;padding:7% 7% 0;color:#d8dee5;font-size:12px;display:flex;justify-content:space-between}
.chatHead{height:14%;display:flex;align-items:center;gap:10px;padding:4% 6%;background:#ffffff06;border-bottom:1px solid #ffffff12}.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#28598f,#112740);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}.chatName{font-size:15px;font-weight:850}.chatSub{font-size:10px;color:#8e9daf}
.bubble{margin:7% 6%;width:75%;background:#1b2735;border-radius:6px 18px 18px 18px;padding:12px;font-size:14px;line-height:1.25}
.moneyBox,.feeBox{margin:6% 6%;border-radius:15px;padding:12px}.moneyBox{background:#151f2b;border:1px solid #ffffff12}.feeBox{background:#331218;border:1px solid var(--accent)}.moneyBox small,.feeBox small{color:#9aacbd;letter-spacing:1px}.moneyBox strong,.feeBox strong{display:block;font-size:30px;margin-top:5px}
.headlineScene,.statScene,.quoteScene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10%}.headlineBig{font-size:52px;line-height:.96;font-weight:1000}.headlineBody{font-size:18px;line-height:1.2;color:#c2ccd6;margin-top:20px}
.statBig{font-size:82px;font-weight:1000;color:var(--accent)}.statLabel{font-size:24px;font-weight:950}.quoteText{font-size:38px;line-height:1.08;font-weight:900}.quoteBy{margin-top:22px;color:#9ba8b8}
.evidenceScene{position:absolute;left:6%;right:6%;top:7%;bottom:16%;background:white;border-radius:18px;overflow:hidden;box-shadow:0 25px 70px #000}.evidenceScene img{width:100%;height:100%;object-fit:cover;object-position:top}.evidenceMock{color:#12161c;padding:28px}.evidenceMock small{color:#677889;letter-spacing:2px;font-weight:800}.evidenceMock h2{font-size:28px;line-height:1.05}.focusBox{position:absolute;left:8%;right:8%;bottom:18%;padding:14px;background:#f6f7f9;color:#111;font-size:18px;font-weight:900;border-left:7px solid var(--accent);box-shadow:0 18px 55px #000}
.splitScene{position:absolute;inset:10%;display:grid;grid-template-columns:1fr 1fr;gap:10px}.splitCell{background:#121b27;border:1px solid #ffffff14;border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:center}.splitCell small{color:#8fa0b4;letter-spacing:1px;font-weight:800}.splitCell strong{font-size:24px;line-height:1.05;margin-top:10px}
.imageScene{position:absolute;inset:0}.imageScene img{width:100%;height:100%;object-fit:cover}.imgShade{position:absolute;inset:0;background:linear-gradient(0deg,#000d,transparent 65%)}.imgTitle{position:absolute;left:8%;right:8%;bottom:18%;font-size:38px;font-weight:1000;line-height:1}
.timeline{border-top:1px solid var(--line);background:#0d1219;overflow:auto;padding:12px}
.timelineTop{display:flex;align-items:center;gap:10px;margin-bottom:10px}.timelineTop strong{font-size:12px;letter-spacing:1px}.timelineTop span{color:var(--muted);font-size:11px}
.tracks{display:flex;gap:6px;min-width:max-content}.clip{height:82px;min-width:120px;background:#162131;border:1px solid #2b3b52;border-radius:8px;padding:8px;position:relative}.clip.active{border-color:var(--accent)}.clip .ct{font-size:10px;color:#8fa1b5;text-transform:uppercase}.clip .cn{font-weight:850;margin-top:5px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clip .cd{position:absolute;bottom:7px;left:8px;font-size:10px;color:#9eacbc}
.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.wide{grid-column:1/-1}.hidden{display:none!important}
.jsonArea{min-height:160px;font-family:Consolas,monospace;font-size:12px}
.status{padding:10px 12px;background:#090d12;border:1px solid var(--line);border-radius:8px;color:#b8c5d3;white-space:pre-wrap}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:100}.modalBox{width:min(820px,92vw);max-height:85vh;overflow:auto;background:#111722;border:1px solid var(--line);border-radius:14px;padding:16px}.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">VIDEO FACTORY</div>
  <div class="badge">WEB TEST</div>
  <button onclick="loadExample()">Load Example</button>
  <button onclick="openJson()">AI / JSON</button>
  <button onclick="exportProject()">Export JSON</button>
  <div class="spacer"></div>
  <select id="format" style="width:145px" onchange="state.format=this.value;renderAll()">
    <option value="9:16">Short 9:16</option>
    <option value="16:9">YouTube 16:9</option>
    <option value="1:1">Square 1:1</option>
  </select>
  <button class="primary" onclick="simulateRender()">Render Test</button>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="section"><div class="sectionTitle"><strong>PROJECT</strong><span>assistant-friendly schema</span></div><label>NAME</label><input id="projectName" value="looks_legit_test" oninput="state.name=this.value"><div style="height:8px"></div><label>BRAND</label><input id="brand" value="LOOKS LEGIT" oninput="state.brand=this.value;renderPreview()"><div style="height:8px"></div><label>VOICE</label><select id="voice" onchange="state.voice=this.value"><option>am_michael</option><option>af_heart</option><option>af_nicole</option><option>am_fenrir</option></select></div>
    <div class="section"><div class="sectionTitle"><strong>SCENES</strong><span id="sceneCount"></span></div><button style="width:100%" onclick="addScene()">+ Add Scene</button></div><div class="sceneList" id="sceneList"></div>
  </aside>
  <main class="center"><div class="previewWrap"><div id="previewFrame" class="previewFrame vertical"><div class="previewBg"></div><div id="previewScene"></div><div id="previewCaption" class="previewCaption"></div><div id="previewBrand" class="previewBrand"></div></div></div><div class="timeline"><div class="timelineTop"><strong>AUTO TIMELINE</strong><span>estimated from narration; backend uses real Kokoro duration</span></div><div id="tracks" class="tracks"></div></div></main>
  <aside class="inspector">
    <div class="section"><div class="sectionTitle"><strong>SCENE INSPECTOR</strong><span id="selectedLabel"></span></div><div class="fieldGrid"><div><label>TYPE</label><select id="f_type" onchange="edit('type',this.value);renderInspector()"><option>headline</option><option>chat</option><option>evidence</option><option>stat</option><option>quote</option><option>image</option><option>split</option></select></div><div><label>CAPTION</label><input id="f_caption" oninput="edit('caption',this.value)"></div><div class="wide"><label>NARRATION</label><textarea id="f_voice" oninput="edit('voice',this.value)"></textarea></div><div data-types="headline quote image"><label>TITLE / ATTRIBUTION</label><input id="f_title" oninput="edit('title',this.value)"></div><div data-types="headline quote stat"><label>BODY / LABEL</label><input id="f_body" oninput="edit('body',this.value)"></div><div data-types="chat"><label>SENDER</label><input id="f_sender" oninput="edit('sender',this.value)"></div><div data-types="chat"><label>SUBTITLE</label><input id="f_sub" oninput="edit('sub',this.value)"></div><div data-types="chat" class="wide"><label>MESSAGE</label><textarea id="f_message" oninput="edit('message',this.value)"></textarea></div><div data-types="chat"><label>AMOUNT</label><input id="f_amount" oninput="edit('amount',this.value)"></div><div data-types="chat"><label>FEE</label><input id="f_fee" oninput="edit('fee',this.value)"></div><div data-types="evidence" class="wide"><label>SOURCE URL</label><input id="f_sourceUrl" oninput="edit('sourceUrl',this.value)"></div><div data-types="evidence"><label>SOURCE LABEL</label><input id="f_sourceLabel" oninput="edit('sourceLabel',this.value)"></div><div data-types="evidence" class="wide"><label>FOCUS / EXCERPT</label><textarea id="f_focus" oninput="edit('focus',this.value)"></textarea></div><div data-types="stat"><label>BIG NUMBER</label><input id="f_number" oninput="edit('number',this.value)"></div><div data-types="stat"><label>LABEL</label><input id="f_label" oninput="edit('label',this.value)"></div><div data-types="split"><label>LEFT LABEL</label><input id="f_leftLabel" oninput="edit('leftLabel',this.value)"></div><div data-types="split"><label>RIGHT LABEL</label><input id="f_rightLabel" oninput="edit('rightLabel',this.value)"></div><div data-types="split"><label>LEFT TEXT</label><input id="f_left" oninput="edit('left',this.value)"></div><div data-types="split"><label>RIGHT TEXT</label><input id="f_right" oninput="edit('right',this.value)"></div><div data-types="image" class="wide"><label>IMAGE</label><input id="f_image" type="file" accept="image/*" onchange="loadImage(this)"></div></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="duplicateScene()">Duplicate</button><button class="danger" onclick="deleteScene()">Delete</button></div></div>
    <div class="section"><div class="sectionTitle"><strong>TEST STATUS</strong><span>frontend only</span></div><div id="status" class="status">Ready. Load the example or edit scenes.</div></div>
  </aside>
</div>
<div id="jsonModal" class="modal hidden"><div class="modalBox"><div class="sectionTitle"><strong>AI / JSON BRIDGE</strong><span>paste a full project from ChatGPT, or copy the current one</span></div><textarea id="jsonText" class="jsonArea"></textarea><div class="modalActions"><button onclick="closeJson()">Cancel</button><button onclick="copyJson()">Copy</button><button class="primary" onclick="importJson()">Import JSON</button></div></div></div>
<script>
const example={version:1,name:'looks_legit_test',brand:'LOOKS LEGIT',format:'9:16',voice:'am_michael',voiceSpeed:1.03,accent:'#ff354b',fps:24,scenes:[{type:'chat',voice:'You already got scammed once. Then the F.B.I. says they recovered your money.',caption:'THE “FBI” RECOVERED YOUR MONEY.',sender:'FBI Recovery Unit',sub:'Government service',message:'Good news. We recovered funds connected to your fraud case.',amount:'$18,740',fee:'$495 recovery fee'},{type:'evidence',voice:"There is only one problem. That's not the F.B.I.",caption:"THAT'S NOT THE FBI.",sourceUrl:'https://www.ic3.gov/PSA/2026/PSA260720',sourceLabel:'FBI / IC3',focus:'IC3 will never ask for payment to recover lost funds.'},{type:'headline',voice:"It's scam number two.",caption:'SCAM #2',title:'SCAM #2',body:'The recovery offer is the second attack.'}]};
let state=structuredClone(example),selected=0;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function estimate(s){const words=(s.voice||'').trim().split(/\s+/).filter(Boolean).length;return Math.max(.8,words/2.55+.18)}
function renderAll(){document.getElementById('format').value=state.format;document.getElementById('projectName').value=state.name;document.getElementById('brand').value=state.brand;document.getElementById('voice').value=state.voice;renderSceneList();renderInspector();renderPreview();renderTimeline()}
function renderSceneList(){const el=document.getElementById('sceneList');el.innerHTML='';state.scenes.forEach((s,i)=>{const d=document.createElement('div');d.className='sceneCard '+(i===selected?'active':'');d.onclick=()=>{selected=i;renderAll()};d.innerHTML=`<div><span class="num">SCENE ${i+1}</span><span class="type">${esc(s.type)}</span></div><div class="name">${esc(s.title||s.caption||s.message||s.voice||'Untitled')}</div><div class="dur">~${estimate(s).toFixed(1)} sec</div>`;el.appendChild(d)});document.getElementById('sceneCount').textContent=state.scenes.length+' total'}
function current(){return state.scenes[selected]||{}}
function v(id,val=''){const e=document.getElementById(id);if(e)e.value=val??''}
function renderInspector(){if(!state.scenes.length)return;const s=current();document.getElementById('selectedLabel').textContent='Scene '+(selected+1);v('f_type',s.type);v('f_caption',s.caption);v('f_voice',s.voice);v('f_title',s.title);v('f_body',s.body);v('f_sender',s.sender);v('f_sub',s.sub);v('f_message',s.message);v('f_amount',s.amount);v('f_fee',s.fee);v('f_sourceUrl',s.sourceUrl);v('f_sourceLabel',s.sourceLabel);v('f_focus',s.focus);v('f_number',s.number);v('f_label',s.label);v('f_leftLabel',s.leftLabel);v('f_rightLabel',s.rightLabel);v('f_left',s.left);v('f_right',s.right);document.querySelectorAll('[data-types]').forEach(e=>e.classList.toggle('hidden',!e.dataset.types.split(' ').includes(s.type)))}
function edit(k,val){current()[k]=val;renderSceneList();renderPreview();renderTimeline()}
function addScene(){state.scenes.push({type:'headline',voice:'New narration.',caption:'NEW SCENE',title:'New Scene',body:''});selected=state.scenes.length-1;renderAll()}
function duplicateScene(){state.scenes.splice(selected+1,0,structuredClone(current()));selected++;renderAll()}
function deleteScene(){if(state.scenes.length<=1)return;state.scenes.splice(selected,1);selected=Math.min(selected,state.scenes.length-1);renderAll()}
function loadExample(){state=structuredClone(example);selected=0;renderAll();setStatus('Example loaded. Three scene types ready for testing.','good')}
function loadImage(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{current().imageData=r.result;renderPreview()};r.readAsDataURL(f)}
function renderPreview(){const frame=document.getElementById('previewFrame');frame.className='previewFrame '+(state.format==='16:9'?'wide':state.format==='1:1'?'square':'vertical');frame.style.setProperty('--accent',state.accent||'#ff354b');document.getElementById('previewBrand').textContent=state.brand||'';const s=current(),out=document.getElementById('previewScene');out.innerHTML='';const accent=state.accent||'#ff354b';document.documentElement.style.setProperty('--accent',accent);if(s.type==='chat'){out.innerHTML=`<div class="phone"><div class="phoneTop">9:41 <span>5G ▰</span></div><div class="chatHead"><div class="avatar">${esc((s.sender||'APP').slice(0,3).toUpperCase())}</div><div><div class="chatName">${esc(s.sender||'Unknown')}</div><div class="chatSub">${esc(s.sub||'')}</div></div></div><div class="bubble">${esc(s.message||'')}</div>${s.amount?`<div class="moneyBox"><small>RECOVERED FUNDS</small><strong>${esc(s.amount)}</strong></div>`:''}${s.fee?`<div class="feeBox"><small>REQUIRED PAYMENT</small><strong>${esc(s.fee)}</strong></div>`:''}</div>`}else if(s.type==='evidence'){out.innerHTML=`<div class="evidenceScene">${s.imageData?`<img src="${s.imageData}">`:`<div class="evidenceMock"><small>${esc(s.sourceLabel||'SOURCE')}</small><h2>${esc(s.sourceUrl||'Evidence capture appears here')}</h2><p>In the real local app Playwright captures this URL automatically.</p></div>`}</div>${s.focus?`<div class="focusBox">${esc(s.focus)}</div>`:''}`}else if(s.type==='stat'){out.innerHTML=`<div class="statScene"><div class="statBig">${esc(s.number||'41%')}</div><div class="statLabel">${esc(s.label||s.body||'')}</div></div>`}else if(s.type==='quote'){out.innerHTML=`<div class="quoteScene"><div class="quoteText">“${esc(s.body||'')}”</div><div class="quoteBy">${esc(s.title||'')}</div></div>`}else if(s.type==='image'){out.innerHTML=`<div class="imageScene">${s.imageData?`<img src="${s.imageData}">`:''}<div class="imgShade"></div><div class="imgTitle">${esc(s.title||'IMAGE SCENE')}</div></div>`}else if(s.type==='split'){out.innerHTML=`<div class="splitScene"><div class="splitCell"><small>${esc(s.leftLabel||'LEFT')}</small><strong>${esc(s.left||'')}</strong></div><div class="splitCell"><small>${esc(s.rightLabel||'RIGHT')}</small><strong>${esc(s.right||'')}</strong></div></div>`}else{out.innerHTML=`<div class="headlineScene"><div class="headlineBig">${esc(s.title||'HEADLINE')}</div><div class="headlineBody">${esc(s.body||'')}</div></div>`}document.getElementById('previewCaption').innerHTML=esc(s.caption||s.voice||'')}
function renderTimeline(){const t=document.getElementById('tracks');t.innerHTML='';state.scenes.forEach((s,i)=>{const d=estimate(s),c=document.createElement('div');c.className='clip '+(i===selected?'active':'');c.style.width=(110+d*24)+'px';c.onclick=()=>{selected=i;renderAll()};c.innerHTML=`<div class="ct">${esc(s.type)}</div><div class="cn">${esc(s.caption||s.title||s.voice||'Scene')}</div><div class="cd">~${d.toFixed(2)}s</div>`;t.appendChild(c)})}
function projectJson(){return JSON.stringify(state,null,2)}
function openJson(){document.getElementById('jsonText').value=projectJson();document.getElementById('jsonModal').classList.remove('hidden')}
function closeJson(){document.getElementById('jsonModal').classList.add('hidden')}
async function copyJson(){await navigator.clipboard?.writeText(document.getElementById('jsonText').value);setStatus('Project JSON copied. This is the bridge I can generate directly.','good')}
function importJson(){try{const x=JSON.parse(document.getElementById('jsonText').value);if(!Array.isArray(x.scenes)||!x.scenes.length)throw Error('Project must contain scenes[]');state=x;selected=0;closeJson();renderAll();setStatus('JSON imported successfully.','good')}catch(e){setStatus('JSON import failed: '+e.message,'bad')}}
function exportProject(){const blob=new Blob([projectJson()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.name||'video')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);setStatus('Project JSON exported.','good')}
function setStatus(msg,kind=''){const s=document.getElementById('status');s.textContent=msg;s.className='status '+kind}
async function simulateRender(){const total=state.scenes.reduce((a,s)=>a+estimate(s),0)+(state.scenes.length-1)*.14;setStatus('TEST RENDER STARTED\nValidating project schema...','warn');await wait(280);setStatus('TEST RENDER\nNarration timing estimated...\n'+state.scenes.length+' scenes · ~'+total.toFixed(2)+' sec','warn');await wait(320);setStatus('TEST RENDER\nVisual payload built...\nAI/JSON schema valid.','warn');await wait(320);setStatus('PASS\nFrontend workflow is valid.\nIn the installed app, Render MP4 sends this same project schema to Kokoro + Playwright + FFmpeg.','good')}
const wait=ms=>new Promise(r=>setTimeout(r,ms));renderAll();
</script>
</body>
</html>
