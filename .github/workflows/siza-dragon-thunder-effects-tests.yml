name: Siza Dragon Thunder Effects Tests

on:
  push:
    paths:
      - 'siza-core/card-effects.js'
      - 'siza-core/card-schema.js'
      - 'siza-core/cards.js'
      - 'siza-core/decks.js'
      - 'siza-core/manifest-rules.js'
      - 'siza-core/crystal-rules.js'
      - 'siza-core/creature-rules.js'
      - 'siza-card-generator/**'
      - '.github/workflows/siza-dragon-thunder-effects-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dragon-thunder-effects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate structured effects and runtime hooks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const vm=require('vm');
          const repo=process.env.GH_REPOSITORY,sha=process.env.GH_SHA,token=process.env.GH_TOKEN;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          async function get(path){const r=await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${sha}`,{headers});if(!r.ok)throw new Error(`${path}: ${r.status}`);const f=await r.json();return Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const files=['siza-core/card-effects.js','siza-core/card-schema.js','siza-core/cards.js','siza-core/decks.js','siza-core/manifest-rules.js','siza-core/crystal-rules.js','siza-core/creature-rules.js'];
            const context={window:{},console};context.window.window=context.window;vm.createContext(context);
            for(const path of files)vm.runInContext(await get(path),context,{filename:path});
            const w=context.window,E=w.SizaCardEffects,C=w.SizaCardCatalog,D=w.SizaDeckCatalog,M=w.SizaManifestRules,X=w.SizaCrystalRules,Z=w.SizaCreatureRules;
            const deck=D.get('vertical_dragon_thunder_classic');
            assert(deck&&Object.values(deck.counts).reduce((a,b)=>a+b,0)===60,'Dragon Thunder must remain 60 cards');
            const nonlands=Object.keys(deck.counts).map(id=>C.get(id)).filter(c=>c&&c.type!=='Land');
            assert(nonlands.length&&nonlands.every(c=>Array.isArray(c.effects)&&c.effects.length),'Every Dragon Thunder non-Reserve must carry structured effects');
            for(const card of nonlands){const v=E.validateEffects(card.effects);assert(v.valid,`${card.name}: ${v.errors.join('; ')}`);assert(!v.warnings.some(x=>x.includes('requiere handler runtime')),`${card.name}: authoring-only effect remains`)}
            for(const type of ['dragon-manifest-bonus','storm-manifest-bonus','ready-source','tribal-stat-bonus','ally-enter-damage','ally-enter-draw','targeted-subtype-damage','sacrifice-or-damage','burn-create-token','attack-splash-damage','destroy-relic-or-loot','modal-damage-or-exile-relic','bottom-then-draw'])assert(E.editorDefinition(type)?.runtime==='wired',`${type} must be wired in Generator`);
            const make=()=>({life:20,hand:[],library:[],battlefield:[],powerCounters:[],summonedOn:[],artifacts:[],artifactExhausted:[],equipment:[],graveyard:[],exile:[],exhausted:[],aff:{U:1,R:2,G:0},crystals:{},ownTurn:1,offeringUsed:false});
            const p=make(),o=make();X.resetPool(p);X.resetPool(o);
            p.library=['dtc_flash_discharge','dtc_lightning_strike'];p.artifacts=['dtc_dragonstorm_front','dtc_predators_ascension','dtc_crucible_of_the_bloodline'];
            const before=o.life,idx=Z.addCreature(p,'dtc_thunderfront_regent');
            assert(o.life===before-1,'Dragonstorm Front did not trigger on Dragon entry');
            assert(Z.effectivePower(p,idx,C.get,E.forEvent)===5&&Z.toughness(p,idx,C.get)===5,'Crucible tribal +1/+1 is not live');
            assert(p.hand.length===1,'Predator Ascension did not draw on 4+ ATK entry');
            const fam=Z.addCreature(p,'dtc_familiar_conductor');
            const bonus=M.bonusSources(p,C.get('dtc_cataclysm_maw'),C.get,E.forEvent);
            assert(bonus.some(x=>x.zone==='battlefield'&&x.effect.type==='dragon-manifest-bonus'),'Familiar Conductor is not exposed as a live Manafestation bonus');
            p.hand=['dtc_cinderwing_twin','dtc_thunder_peaks','dtc_thunder_peaks'];
            const tokenBefore=p.battlefield.length;
            M.manifestStackPlan({idx:0,owner:'player',burnSelected:[1,2],reactive:false},p,C.get('dtc_cinderwing_twin'),E.hasEffect);
            assert(p.battlefield.length===tokenBefore+1&&p.battlefield.at(-1)==='dtc_dragon_token','Cinderwing Twin did not create its 3/3 Dragon token from Burn');
            w.SizaDragonThunderRuntime.queueBurn(p,'dtc_variable_ember_devastator',2);
            const variable=Z.addCreature(p,'dtc_variable_ember_devastator');
            assert(p.powerCounters[variable]===2,'Variable Ember Devastator did not receive Burn-scaled counters');
            console.log(`PASS Dragon Thunder: ${nonlands.length} active non-Reserve cards, structured Generator effects and core runtime hooks verified.`);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
