<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cargando Faro Ahogado…</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#0b0e13;color:#edf2f7;display:grid;place-items:center;height:100vh;margin:0}.box{max-width:520px;padding:28px;border:1px solid #2a3446;border-radius:12px;background:#111722}p{color:#91a0b5}</style></head><body><div class="box"><h1>Faro Ahogado</h1><p id="msg">Cargando el mapa actual en SIZA Map Creator…</p></div><script>fetch('./presets/faro-ahogado-current.siza-map.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar el preset');return r.json()}).then(data=>{localStorage.setItem('siza_map_creator_v1',JSON.stringify(data));location.replace('./')}).catch(err=>{document.getElementById('msg').textContent='Error: '+err.message})</script></body></html>
