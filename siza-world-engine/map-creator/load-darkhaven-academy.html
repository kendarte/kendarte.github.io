  {id:'dh_gate',key:'Puerta de Darkhaven',room_id:'DH7-ROOM-001',x:300,y:1180,desc:'Dos portones de hierro enmarcan un paso de piedra gris; sobre ellos, el emblema nuevo de Darkhaven apenas cubre las marcas de la antigua prisión. Una garita, un tablero de ingreso y las cadenas del rastrillo ocupan el primer plano.',canon_status:'prototype',zone_id:'DH7-ACCESS',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['muros de antigua prisión','vitrales añadidos durante la reconstrucción'],hearing:['guardias y estudiantes entrando y saliendo'],smell:['sal del mar','piedra húmeda']},space_profile:{room_type:'acceso fortificado',scale:'grande',geometry:'portón y corredor de ingreso',orientation:'conduce al patio central',focal_points:['portón','vitrales'],status:'prototype'}},
  {id:'dh_courtyard',key:'Patio Central de la Antigua Prisión',room_id:'DH7-ROOM-002',x:650,y:1180,desc:'El patio abre un rectángulo de piedra entre alas de celdas reconvertidas. Bancas, tablones de anuncios y rutas marcadas en pintura separan el tránsito de estudiantes de los ejercicios que cruzan el centro.',canon_status:'derived',zone_id:'DH7-CENTRAL',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['piedra marcada por el uso carcelario','uniformes negros y Mistcoats'],hearing:['órdenes de entrenamiento','conversaciones de estudiantes'],smell:['lluvia','sal']},space_profile:{room_type:'patio interior',scale:'grande',geometry:'patio rectangular cercado por alas de piedra',orientation:'núcleo de distribución de la academia',focal_points:['torres','galerías','vitrales'],status:'derived'}},
  {id:'dh_guard',key:'Sala de Guardia',room_id:'DH7-ROOM-003',x:980,y:1000,desc:'Un mostrador bajo, casilleros numerados y una pared de llaves ordenan la sala. Detrás del vidrio hay listas de turnos, radios cargando y una mesa donde se revisa el equipo antes de salir.',canon_status:'derived',zone_id:'DH7-OPERATIONS',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['armarios de equipo','tableros de turno'],hearing:['cambios de guardia']},space_profile:{room_type:'sala operativa',scale:'mediana',geometry:'sala cerrada junto al patio',orientation:'vigila accesos y circulación',focal_points:['mesa de guardia'],status:'derived'}},
  {id:'dh_command',key:'Mando Regional de Sector 7',room_id:'DH7-ROOM-004',x:1280,y:1000,desc:'Mesas unidas forman una superficie de mapas, comunicados y fichas de incidente. Las luces dejan el resto de la sala en penumbra, con archivadores metálicos y una pizarra llena de cambios recientes.',canon_status:'derived',zone_id:'DH7-COMMAND',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['mapas provinciales','registros de incidentes'],hearing:['mensajes operativos']},space_profile:{room_type:'centro de mando',scale:'mediana',geometry:'sala administrativa fortificada',orientation:'conectada con comunicaciones y dirección',focal_points:['mapa de Caribia','mesa de coordinación'],status:'derived'}},
  {id:'dh_comms',key:'Sala de Comunicaciones',room_id:'DH7-ROOM-005',x:1580,y:1000,desc:'Racks de radio, auriculares y lámparas de señal llenan las estaciones contra la pared. El centro queda libre para una mesa de coordinación cubierta de anotaciones y mensajes que todavía esperan respuesta.',canon_status:'derived',zone_id:'DH7-COMMAND',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['equipos cristalinos de comunicación'],hearing:['mensajes de puestos y faros']},space_profile:{room_type:'comunicaciones',scale:'mediana',geometry:'sala técnica',orientation:'adyacente al mando regional',focal_points:['consolas físicas','registros'],status:'derived'}},
  {id:'dh_director',key:'Dirección de Orphim Trimago',room_id:'DH7-ROOM-006',x:1280,y:760,desc:'El despacho conserva la altura severa de la antigua oficina de mando, aunque ahora hay vitrinas, plantas y una biblioteca desigual. El escritorio domina la sala; detrás, los ventanales dan al patio interior.',canon_status:'derived',zone_id:'DH7-ADMIN',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['documentos de admisión','objetos recuperados','ventanas al mar']},space_profile:{room_type:'despacho de dirección',scale:'mediana',geometry:'antigua oficina de mando de la prisión',orientation:'sobre el ala administrativa',focal_points:['escritorio de Trimago'],status:'derived'}},
  {id:'dh_archives',key:'Archivos de Sector 7',room_id:'DH7-ROOM-007',x:1580,y:760,desc:'Estanterías altas forman pasillos estrechos entre cajas, expedientes y gabinetes con sellos de colores. Una mesa de consulta sostiene lámparas verdes, guantes de algodón y varios archivos abiertos a medio revisar.',canon_status:'derived',zone_id:'DH7-RESEARCH',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['estanterías cerradas','expedientes de campo'],hearing:['pasos amortiguados']},space_profile:{room_type:'archivo institucional',scale:'grande',geometry:'salas de archivo convertidas desde dependencias carcelarias',orientation:'entre administración e investigación',focal_points:['expedientes restringidos'],status:'derived'}},
  {id:'dh_classrooms',key:'Aulas de Darkhaven',room_id:'DH7-ROOM-008',x:980,y:1400,desc:'Pizarras gastadas, bancos móviles y paneles de práctica ocupan las aulas conectadas por una galería. Hay apuntes, protecciones de entrenamiento y restos de ejercicios recientes sobre las mesas.',canon_status:'derived',zone_id:'DH7-ACADEMIC',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['pizarras','Pages de práctica','bancos de piedra y madera'],hearing:['instrucción','discusiones de estudiantes']},space_profile:{room_type:'aulas',scale:'mediana',geometry:'serie de salas conectadas por galería',orientation:'ala académica junto al patio',focal_points:['mesa del instructor'],status:'derived'}},
  {id:'dh_briefing',key:'Sala de Briefing de Fireteams',room_id:'DH7-ROOM-009',x:1280,y:1400,desc:'Una mesa larga con un plano modular ocupa el centro. En las paredes cuelgan mapas, fotografías y tablillas de evaluación; los asientos están dispuestos para que cada miembro vea la misma ruta.',canon_status:'prototype',zone_id:'DH7-ACADEMIC',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['mapas de faros','listas de equipo'],hearing:['briefings y desacuerdos']},space_profile:{room_type:'sala de briefing',scale:'mediana',geometry:'anfiteatro operativo',orientation:'entre aulas y salida operativa',focal_points:['mapa táctico físico'],status:'prototype'}},
  {id:'dh_training',key:'Patio de Entrenamiento y Esgrima',room_id:'DH7-ROOM-010',x:1280,y:1660,desc:'El suelo está dividido entre arena compacta, placas de impacto y líneas de práctica. Armeros, bastidores y postes de esgrima rodean el espacio, mientras las viejas paredes del patio cierran el ruido.',canon_status:'derived',zone_id:'DH7-TRAINING',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['marcas de práctica','armas de entrenamiento'],hearing:['acero de práctica','órdenes de instructores']},space_profile:{room_type:'patio de entrenamiento',scale:'grande',geometry:'patio amurallado',orientation:'ala de entrenamiento',focal_points:['zona de duelo'],status:'derived'}},
  {id:'dh_dorm_ft7',key:'Dormitorios del Fireteam 7',room_id:'DH7-ROOM-011',x:650,y:1510,desc:'Cuatro antiguas celdas se abren a una sala común estrecha. Camas, casilleros y equipo personal dejan claro quién vive aquí, con una mesa central llena de piezas, notas y tazas olvidadas.',canon_status:'derived',zone_id:'DH7-RESIDENTIAL',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['puertas y muros heredados de celdas','pertenencias personales'],hearing:['vida cotidiana del equipo']},space_profile:{room_type:'dormitorios en antiguas celdas',scale:'mediana',geometry:'corredor carcelario con habitaciones adaptadas',orientation:'ala residencial próxima al patio',focal_points:['celdas adaptadas'],status:'derived'}},
  {id:'dh_dorm_general',key:'Dormitorios Generales',room_id:'DH7-ROOM-012',x:360,y:1510,desc:'Una galería larga reúne puertas iguales, ropa tendida y pequeños tablones personales. El bloque conserva la medida de las celdas, pero cada habitación ha sido adaptada con luz, libros y objetos de sus ocupantes.',canon_status:'derived',zone_id:'DH7-RESIDENTIAL',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['filas de antiguas celdas adaptadas'],hearing:['estudiantes cambiando de turno']},space_profile:{room_type:'dormitorio institucional',scale:'grande',geometry:'bloque de celdas transformado',orientation:'ala residencial',focal_points:['galería central'],status:'derived'}},
  {id:'dh_dining',key:'Comedor de Darkhaven',room_id:'DH7-ROOM-013',x:650,y:1840,desc:'Mesas largas de madera y bandejas de metal ocupan el salón bajo lámparas cálidas. Cerca de la cocina se acumulan platos, avisos y conversaciones; al fondo, las ventanas altas dan una luz pálida.',canon_status:'derived',zone_id:'DH7-SUPPORT',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['mesas largas','uniformes mezclados'],hearing:['rumores','cubiertos','discusiones de misión'],smell:['comida de Berta']},space_profile:{room_type:'comedor institucional',scale:'grande',geometry:'salón de mesas largas',orientation:'junto a cocina y ala residencial',focal_points:['mesas del Fireteam'],status:'derived'}},
  {id:'dh_kitchen',key:'Cocina y Taller de Berta',room_id:'DH7-ROOM-014',x:360,y:1840,desc:'Dos fogones, una mesa de corte y un banco de herramientas comparten el mismo espacio. Frascos, ollas, soldadura y madera apilada conviven sin orden aparente, aunque todo parece tener un uso preciso.',canon_status:'derived',zone_id:'DH7-SUPPORT',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['ollas','herramientas','soldadura'],hearing:['trabajo de cocina y taller'],smell:['raciones de Berta','metal caliente']},space_profile:{room_type:'cocina-taller',scale:'mediana',geometry:'dependencias de servicio conectadas',orientation:'detrás del comedor',focal_points:['fogones','banco de reparación'],status:'derived'}},
  {id:'dh_relic_lab',key:'Laboratorio de Artefactos y Reliquias',room_id:'DH7-ROOM-015',x:1880,y:760,desc:'Las mesas de trabajo están rodeadas de vitrinas selladas y bandejas de material clasificado. Lentes, pinzas, diagramas y marcas de seguridad rodean los objetos en estudio sin convertir la sala en un museo.',canon_status:'derived',zone_id:'DH7-RESEARCH',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['reliquias aisladas','instrumentos físicos','Pages de prueba'],hearing:['mecanismos de calibración']},space_profile:{room_type:'laboratorio esotécnico',scale:'grande',geometry:'salas reforzadas',orientation:'junto a archivos y contención',focal_points:['mesas de artefactos'],status:'derived'}},
  {id:'dh_fashion',key:'Atelier de Relena Dao',room_id:'DH7-ROOM-016',x:2180,y:760,desc:'Maniquíes, bastidores y rollos de tela llenan una sala atravesada por moldes y diagramas de estructura. Sobre las mesas hay piezas de uniforme, pruebas de color y herramientas finas alineadas con cuidado.',canon_status:'derived',zone_id:'DH7-RESEARCH',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['telas tratadas','estructuras de Fashion Frame','modelos y patrones'],hearing:['herramientas finas']},space_profile:{room_type:'atelier-laboratorio',scale:'mediana',geometry:'taller de diseño y prueba',orientation:'ala de investigación',focal_points:['mesa de Relena'],status:'derived'}},
  {id:'dh_framesmith',key:'Taller FrameSmith de Maine',room_id:'DH7-ROOM-017',x:1880,y:1180,desc:'Un puente grúa recorre el techo sobre bancos reforzados y piezas demasiado pesadas para mover a mano. Cables, núcleos abiertos y herramientas de precisión ocupan el taller junto a una zona limpia para calibrar.',canon_status:'derived',zone_id:'DH7-HEAVY',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['Deep Dive Frames','manacores','Spellblades desmontados'],hearing:['martillos','motores y mecanismos'],smell:['aceite','metal caliente']},space_profile:{room_type:'taller pesado',scale:'grande',geometry:'nave reforzada',orientation:'conecta con depósito y bahía de Deep Dive',focal_points:['banco de Maine','Frame en reparación'],status:'derived'}},
  {id:'dh_heavy',key:'Bahía de Equipos Pesados y Deep Dive Frames',room_id:'DH7-ROOM-018',x:2180,y:1180,desc:'Los Deep Dive Frames descansan en soportes de mantenimiento, conectados a mangueras y líneas de diagnóstico. Hay espacio para maniobrar alrededor de cada armazón, con contenedores de carga alineados contra el muro.',canon_status:'derived',zone_id:'DH7-HEAVY',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['Deep Dive Frames','equipos de contención pesada'],hearing:['cierres','pruebas mecánicas']},space_profile:{room_type:'bahía de equipo',scale:'grande',geometry:'nave de carga adaptada',orientation:'cerca de talleres y salida de despliegue',focal_points:['racks de Frames'],status:'derived'}},

  {id:'dh_observation',key:'Sala de Observación de Anomalías',room_id:'DH7-ROOM-023',x:1580,y:2110,desc:'Tras el vidrio de observación, la sala de contención ocupa casi todo el campo de vista. Monitores, cuadernos de registro y asientos escalonados permiten seguir cambios pequeños sin invadir el espacio vigilado.',canon_status:'prototype',zone_id:'DH7-CONTAINMENT',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['ventanas protegidas','cuadernos de observación']},space_profile:{room_type:'observación',scale:'mediana',geometry:'galería protegida',orientation:'sobre el bloque de contención',focal_points:['ventanas de observación'],status:'prototype'}},
  {id:'dh_tower',key:'Torre de Vigilancia',room_id:'DH7-ROOM-024',x:650,y:820,desc:'La escalera desemboca en una plataforma cerrada por ventanales estrechos. Prismáticos, una mesa de guardia y marcas de distancia señalan los puntos que se vigilan desde aquí, por encima de los tejados del complejo.',canon_status:'derived',zone_id:'DH7-TOWERS',region_id:'CARIBIA',district_id:'DARKHAVEN-ZONA-7',sensory_facts:{sight:['mar abierto','muros de Darkhaven','niebla a distancia'],hearing:['viento','campanas de señal']},space_profile:{room_type:'torre de vigilancia',scale:'vertical',geometry:'torre de piedra',orientation:'domina el patio y el mar',focal_points:['puesto superior'],status:'derived'}},
