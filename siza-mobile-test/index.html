<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Siza Web v0.5.12</title><style>html,body{margin:0;min-height:100%;background:#07111b;color:#f3ead5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#loading{padding:24px;text-align:center}#loading strong{display:block;margin-bottom:8px;color:#e6c878}</style></head><body><div id="loading"><strong>Siza Web v0.5.12</strong>Cargando prototipo completo…</div><script>
(async()=>{try{
const files=['v0512p01.txt', 'v0512p02.txt', 'v0512p03.txt', 'v0512p04.txt', 'v0512p05.txt', 'v0512p06.txt'];
const [parts,portraitText]=await Promise.all([Promise.all(files.map(async f=>{const r=await fetch(f+'?v=0512');if(!r.ok)throw new Error(f+': '+r.status);return r.text()})),fetch('nereida_portrait.b64?v=0512').then(r=>{if(!r.ok)throw new Error('portrait: '+r.status);return r.text()})]);
const binary=atob(parts.join('').replace(/\s/g,''));const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no soporta la descompresión requerida.');let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
html=html.replace('__NEREIDA_PORTRAIT__','data:image/jpeg;base64,'+portraitText.trim());document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').innerHTML='<strong>No se pudo cargar Siza Web</strong>'+String(e.message||e)}})();
</script></body></html>
