name: Build Siza card assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/siza-extract-card-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clean standalone card assets
        shell: bash
        run: |
          rm -rf siza-mobile-test/cards-v0514
          mkdir -p siza-mobile-test/cards-v0514
          unzip -o siza-mobile-test/siza_cards_q78.zip -d siza-mobile-test/cards-v0514
          test "$(find siza-mobile-test/cards-v0514 -maxdepth 1 -name '*.webp' | wc -l)" -eq 12
          find siza-mobile-test/cards-v0514 -maxdepth 1 -name '*.webp' -printf '%f %s bytes\n' | sort
      - name: Commit clean card assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add siza-mobile-test/cards-v0514/*.webp
          if git diff --cached --quiet; then
            echo 'No asset changes'
          else
            git commit -m 'Install clean standalone Siza v0.5.14 card assets'
            git push
          fi
