name: Siza Mobile Shared Card Core Migration

on:
  push:
    paths:
      - '.github/workflows/siza-mobile-use-shared-card-core.yml'

permissions:
  contents: write

jobs:
  migrate-card-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Install migration dependencies
        run: npm install --no-save acorn@8 jsdom@24

      - name: Bridge Mobile Test to shared card core
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const acorn=require('acorn');const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,path='siza-mobile-test/index.html';
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          const api=`https://api.github.com/repos/${repo}/contents/${path}`;
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function getText(p){const r=await fetch(`https://api.github.com/repos/${repo}/contents/${p}?ref=main`,{headers});if(!r.ok)throw new Error(`${p}: GET ${r.status}`);const f=await r.json();return Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}
          function parse(html){const so=html.lastIndexOf('<script>'),sc=html.indexOf('</script>',so);assert(so>=0&&sc>so,'main script not found');const start=so+8,code=html.slice(start,sc),ast=acorn.parse(code,{ecmaVersion:'latest'}),decl=[];function walk(n){if(!n||typeof n!=='object')return;if(n.type==='FunctionDeclaration'&&n.id)decl.push(n);for(const[k,v]of Object.entries(n)){if(k==='start'||k==='end')continue;if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'&&v.type)walk(v)}}walk(ast);return{start,sc,code,decl}}
          function replaceUnique(html,name,replacement){const p=parse(html),nodes=p.decl.filter(n=>n.id.name===name);assert(nodes.length===1,`${name}: expected 1 declaration, got ${nodes.length}`);const n=nodes[0],code=p.code.slice(0,n.start)+replacement+p.code.slice(n.end);return html.slice(0,p.start)+code+html.slice(p.sc)}
          function domFor(html){const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error('[JSDOM]',e.message));return new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc})}
          (async()=>{
            const r=await fetch(`${api}?ref=main`,{headers});if(!r.ok)throw new Error(`index GET ${r.status}`);const f=await r.json();let html=Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8');
            console.log(`Current Mobile blob ${f.sha}`);
            assert(!html.includes('../siza-core/card-schema.js'),'Shared schema already linked');
            assert(html.includes('function cardArtMarkupV1(c){'),'Local art adapter not found');
            const scriptAnchor='<script>\nconst NEREIDA_IMG=';
            assert(html.includes(scriptAnchor),'Main script anchor not found');
            html=html.replace(scriptAnchor,'<script src="../siza-core/card-schema.js"></script>\n<script src="../siza-core/card-renderer.js"></script>\n<script>\nconst NEREIDA_IMG=');
            html=replaceUnique(html,'cardArtMarkupV1',`function cardArtMarkupV1(c){return SizaCardRenderer.artHtml(SizaCardSchema.cardFromMobileShape(c),{variant:'mobile'})}`);
            html=replaceUnique(html,'cardThumbHtmlV1',`function cardThumbHtmlV1(c,opts={}){return SizaCardRenderer.renderThumb(SizaCardSchema.cardFromMobileShape(c),{variant:'mobile',stats:opts.stats||{}})}`);
            html=replaceUnique(html,'cardHtml',`function cardHtml(c,opts={}){const coreCard=SizaCardSchema.cardFromMobileShape(c),req=manifestRequirement(c),stats=opts.stats||{};let out=SizaCardRenderer.renderCard(coreCard,{variant:'mobile',risk:req.text,stats});const extra=(opts.actions?\`<div class="cardFooterActions">\${opts.actions}</div>\`:'')+(opts.locked?\`<div class="lockedOverlay"><div><b>Memoria no manifestada</b>Completa el Final Event del Muelle Viejo.</div></div>\`:'');return extra?out.replace('</article>',extra+'</article>'):out}`);
            assert((html.match(/\.\.\/siza-core\/card-schema\.js/g)||[]).length===1,'Schema link count mismatch');
            assert((html.match(/\.\.\/siza-core\/card-renderer\.js/g)||[]).length===1,'Renderer link count mismatch');
            assert(html.includes("SizaCardRenderer.renderCard(coreCard,{variant:'mobile'"),'Shared card adapter missing');

            const schema=await getText('siza-core/card-schema.js'),renderer=await getText('siza-core/card-renderer.js');
            let testHtml=html.replace('<script src="../siza-core/card-schema.js"></script>',`<script>${schema}</script>`).replace('<script src="../siza-core/card-renderer.js"></script>',`<script>${renderer}</script>`);
            const marker='window.SIZA={';assert(testHtml.includes(marker),'SIZA export marker missing');
            testHtml=testHtml.replace(marker,`window.__CARD_BRIDGE_TEST__={cardById,cardHtml,cardThumbHtmlV1,cardArtMarkupV1};\n`+marker);
            const dom=domFor(testHtml);dom.window.setTimeout=()=>0;const H=dom.window.__CARD_BRIDGE_TEST__;assert(H,'Bridge hooks unavailable');
            const core=dom.window.SIZA.runArenaCriticalV071();console.log(`Arena core ${core.passed}/${core.total}`);for(const x of core.results)console.log(`${x.pass?'PASS':'FAIL'} ${x.name}`);assert(core.passed===core.total,'Arena contract failed');
            const mist=H.cardById('mist'),face=H.cardHtml(mist),thumb=H.cardThumbHtmlV1(mist),withArt=H.cardHtml({...mist,artUrl:'../assets/cards/art/mist.webp',artTransform:{x:41,y:38,scale:1.15}});
            assert(face.includes('sizaCard generatedCardV1')&&face.includes('Niebla de Sal'),'Mobile full face no longer renders');
            assert(thumb.includes('generatedCardThumbV1'),'Mobile thumb no longer renders');
            assert(!face.includes('legacyFullCardImage')&&!face.includes('cards-v0514'),'Legacy full-card image leaked into face');
            assert(withArt.includes('../assets/cards/art/mist.webp')&&withArt.includes('object-position:41% 38%'),'Shared art transform missing');
            assert(typeof dom.window.SizaCardRenderer?.renderCard==='function','Shared renderer unavailable');
            console.log('PASS Shared renderer bridge contract 5/5');dom.window.close();

            const w=await fetch(api,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Use shared Siza card core in Mobile Test',content:Buffer.from(html,'utf8').toString('base64'),sha:f.sha,branch:'main'})});if(!w.ok)throw new Error(`PUT ${w.status}: ${await w.text()}`);const result=await w.json();console.log(`COMMIT ${result.commit.sha}`);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE