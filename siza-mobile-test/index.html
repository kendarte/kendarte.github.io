function loadGeneratorHandoffV1(){try{const raw=localStorage.getItem(GENERATOR_HANDOFF_KEY_V1);if(!raw)return null;const payload=JSON.parse(raw);if(payload?.action!=='test-card'||!payload.card)return null;const validation=SizaCardSchema.validateCard(payload.generatorCard||payload.card);if(!validation.valid)return null;const card={...SizaCardSchema.cardToMobileShape(validation.card),generatorTest:true,generatorCard:validation.card};const i=TEST_CARD_DB_V1.findIndex(c=>c.id===card.id);if(i>=0)TEST_CARD_DB_V1[i]=card;else TEST_CARD_DB_V1.push(card);return{payload,card}}catch(e){console.warn('Generator handoff inválido',e);return null}}
const generatorHandoffV1=loadGeneratorHandoffV1();
const cardById=id=>TEST_CARD_DB_V1.find(c=>c.id===id)||CARD_DB.find(c=>c.id===id);
function allCardsV1(){const ids=new Set(TEST_CARD_DB_V1.map(c=>c.id));return[...CARD_DB.filter(c=>!ids.has(c.id)),...TEST_CARD_DB_V1]}

function normalizeMatchV600(){if(!state.match)return;const M=state.match;M.combat=M.combat||null;M.pendingEquip=M.pendingEquip||null;M.damageFx=null;M.effectFx=null;M.ui=M.ui||{hand:-1,creature:-1};M.ui.attackers=Array.isArray(M.ui.attackers)?M.ui.attackers:[];M.ui.attackMode=!!M.ui.attackMode&&M.active==='player'&&!M.combat;M.ui.fieldFocus=null;for(const P of [M.player,M.enemy]){if(!P)continue;const returned=[],artifacts=[],equipment=P.equipment||[];P.battlefield=(P.battlefield||[]).filter(id=>{const c=cardById(id);if(c?.type==='Land'){returned.push(id);return false}if(c?.type==='Artifact'){if(isEquipmentCardV1(c))equipment.push({id,target:null});else artifacts.push(id);return false}return true});if(returned.length)P.hand=(P.hand||[]).concat(returned);P.artifacts=[...(P.artifacts||[]),...artifacts];P.equipment=equipment;P.manifestActions=Number.isFinite(P.manifestActions)?P.manifestActions:2;P.combatUsed=!!P.combatUsed;P.exhausted=Array.isArray(P.exhausted)?P.exhausted.filter(i=>Number.isInteger(i)&&i>=0&&i<P.battlefield.length):[];P.landPlayed=false}}
if(state.match?.rulesVersion!==RULES_VERSION)state.match=null;
normalizeMatchV600();
function load(){try{const raw=localStorage.getItem('siza_work_state_v1');if(raw){const s=JSON.parse(raw);const d=defaultState();return {...d,...s,player:{...d.player,...s.player,mag:{...d.player.mag,...(s.player?.mag||{}),aff:{...d.player.mag.aff,...(s.player?.mag?.aff||{})}}},adventure:{...d.adventure,...(s.adventure||{}),flags:{...d.adventure.flags,...(s.adventure?.flags||{})},journal:s.adventure?.journal||[],eventHistory:s.adventure?.eventHistory||[]},deck:s.deck||starterDeck()};}}catch(e){}return defaultState();}
function save(){try{localStorage.setItem('siza_work_state_v1',JSON.stringify({...state,modal:null,toasts:[],match:state.match?{...state.match,damageFx:null,effectFx:null,ui:{...(state.match.ui||{}),fieldFocus:null}}:null}));}catch(e){}}

xt)}</div>`).join(''):'<div class="muted" style="font-size:10px;margin-top:10px">Aún no hay entradas.</div>'}</div></section></div></div>`, 'Muelle Viejo','Adventure Engine · GOT Ascent / ZMud',`<span class="chip gold">Objective ${a.advance}/5</span>`)}

function runArenaSelfTestsV070(){const old=state.match,results=[],test=(name,fn)=>{try{results.push({name,pass:!!fn()})}catch(error){results.push({name,pass:false,error:error.message})}};const base=()=>({aff:{U:2,R:1},crystals:{U:2,R:1},battlefield:[],powerCounters:[],summonedOn:[],equipment:[],exhausted:[],ownTurn:2,offeringUsed:false});try{test('U/U/R no paga U/U/U',()=>directPlanV070(base(),cardById('leviathan'))===null);test('U/U paga una carta U/U',()=>JSON.stringify(directPlanV070(base(),cardById('counter')).spent)==='{"U":2}');test('Ofrenda cubre exactamente un Azul faltante',()=>{const P=base();P.battlefield=['servitor'];P.powerCounters=[0];P.summonedOn=[1];return offeringPlanV070(P,cardById('leviathan'))?.missing==='U'});test('Ofrenda no usa una criatura recién materializada',()=>{const P=base();P.battlefield=['servitor'];P.powerCounters=[0];P.summonedOn=[2];return offeringPlanV070(P,cardById('leviathan'))===null});test('Mana Burn admite más de dos Reservas',()=>deficitV070({dc:8,roll:1,prismBonus:0,burnSelected:[0,1,2,3,4]},{mf:2})===0);test('Una agotada no bloquea',()=>{const P=base();P.battlefield=['servitor','ignimite'];P.exhausted=[0];return JSON.stringify(legalBlockersV070(P))==='[1]'});test('Ignimite muestra +1/+1 por contador',()=>{const P=base();P.battlefield=['ignimite'];P.powerCounters=[1];return effectivePower(P,0)===2&&toughV070(P,0)===2});test('Equipo aplica +2/+0 sólo al objetivo',()=>{const P=base();P.battlefield=['servitor','ignimite'];P.powerCounters=[0,0];P.equipment=[{id:'tideblade',target:1}];return effectivePower(P,0)===2&&effectivePower(P,1)===3});test('Preparación universal impide atacar al entrar',()=>{const P=base();P.battlefield=['servitor'];P.summonedOn=[2];state.match={rules:{entryMode:'prepare'}};return !canAttackV070(P,0)});test('Entrada inmediata permite atacar al entrar',()=>{const P=base();P.battlefield=['servitor'];P.summonedOn=[2];state.match={rules:{entryMode:'immediate'}};return canAttackV070(P,0)});test('Impulso libera
