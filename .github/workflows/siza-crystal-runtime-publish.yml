name: Siza Crystal Runtime Publish

on:
  push:
    paths:
      - '.github/workflows/siza-crystal-runtime-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save jsdom@24
      - name: Fetch exact runtime publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('fs');const repo=process.env.GH_REPOSITORY,sha=process.env.GH_SHA,token=process.env.GH_TOKEN,path='.github/scripts/siza-crystal-runtime-publish.js';const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${sha}`,{headers}).then(async r=>{if(!r.ok)throw new Error(`GET ${r.status}: ${await r.text()}`);const f=await r.json();fs.mkdirSync('.github/scripts',{recursive:true});fs.writeFileSync(path,Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8'))}).catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
      - name: Validate and publish runtime only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/siza-crystal-runtime-publish.js
