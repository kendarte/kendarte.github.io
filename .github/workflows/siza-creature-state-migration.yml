name: Siza Creature State Migration

on:
  push:
    paths:
      - '.github/workflows/siza-creature-state-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-creature-state:
    runs-on: ubuntu-latest
    steps:
      - name: Install JSDOM
        run: npm install --no-save jsdom@24

      - name: Validate old/new and publish runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,api=`https://api.github.com/repos/${repo}`;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function get(path){const r=await fetch(`${api}/contents/${path}?ref=main`,{headers});if(!r.ok)throw new Error(`${path}: GET ${r.status}`);const f=await r.json();return{sha:f.sha,text:Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}}
          function inline(html,files){let out=html;for(const name of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js','creature-rules.js']){const tag=`<script src="../siza-core/${name}"></script>`;if(!out.includes(tag))throw new Error(`Missing ${name}`);out=out.replace(tag,`<script>${files[name]}</script>`)}return out}
          function dom(html,label){const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error(`[JSDOM ${label}]`,e.message));const d=new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc});d.window.setTimeout=()=>0;return d}
          (async()=>{
            const current=await get('siza-mobile-test/index.html'),files={};for(const n of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js','creature-rules.js'])files[n]=(await get(`siza-core/${n}`)).text;
            const oldAdd="function addCreatureV070(P,id){P.battlefield.push(id);P.powerCounters.push(0);P.summonedOn.push(P.ownTurn);return P.battlefield.length-1}";
            const oldRemove="function removeBattlefieldAt(P,i,dest='graveyard'){const M=state.match;if(i<0||i>=P.battlefield.length)return null;const id=P.battlefield.splice(i,1)[0];P[dest].push(id);P.powerCounters.splice(i,1);P.summonedOn.splice(i,1);P.exhausted=(P.exhausted||[]).filter(x=>x!==i).map(x=>x>i?x-1:x);for(const e of P.equipment||[]){if(e.target===i)e.target=null;else if(e.target>i)e.target--}if(M?.player===P&&M.ui){M.ui.attackers=(M.ui.attackers||[]).filter(x=>x!==i).map(x=>x>i?x-1:x);if(M.ui.creature===i)M.ui.creature=-1;else if(M.ui.creature>i)M.ui.creature--;const F=M.ui.fieldFocus;if(F?.owner==='player'){if(F.index===i)M.ui.fieldFocus=null;else if(F.index>i)F.index--}}if(M?.enemy===P&&M.ui?.fieldFocus?.owner==='enemy'){if(M.ui.fieldFocus.index===i)M.ui.fieldFocus=null;else if(M.ui.fieldFocus.index>i)M.ui.fieldFocus.index--}return id}";
            assert(current.text.includes(oldAdd)&&current.text.includes(oldRemove),'Creature state anchors changed');
            const newAdd="function addCreatureV070(P,id){return SizaCreatureRules.addCreature(P,id)}";
            const newRemove="function removeBattlefieldAt(P,i,dest='graveyard'){const M=state.match,id=SizaCreatureRules.removeAt(P,i,dest);if(id==null)return null;if(M?.player===P&&M.ui){M.ui.attackers=(M.ui.attackers||[]).filter(x=>x!==i).map(x=>x>i?x-1:x);if(M.ui.creature===i)M.ui.creature=-1;else if(M.ui.creature>i)M.ui.creature--;const F=M.ui.fieldFocus;if(F?.owner==='player'){if(F.index===i)M.ui.fieldFocus=null;else if(F.index>i)F.index--}}if(M?.enemy===P&&M.ui?.fieldFocus?.owner==='enemy'){if(M.ui.fieldFocus.index===i)M.ui.fieldFocus=null;else if(M.ui.fieldFocus.index>i)M.ui.fieldFocus.index--}return id}";
            const candidate=current.text.replace(oldAdd,newAdd).replace(oldRemove,newRemove),marker='window.SIZA={',probe=`window.__CREATURE_STATE_COMPARE__={createMatch,setMatch:m=>state.match=m,addCreatureV070,removeBattlefieldAt};\n`;assert(current.text.includes(marker),'SIZA marker missing');
            const O=dom(inline(current.text,files).replace(marker,probe+marker),'old'),N=dom(inline(candidate,files).replace(marker,probe+marker),'new'),o=O.window.__CREATURE_STATE_COMPARE__,n=N.window.__CREATURE_STATE_COMPARE__;
            let comparisons=0;
            for(const base of[
              {battlefield:[],powerCounters:[],summonedOn:[],ownTurn:1},
              {battlefield:['servitor'],powerCounters:[2],summonedOn:[2],ownTurn:3}
            ]){const a=JSON.parse(JSON.stringify(base)),b=JSON.parse(JSON.stringify(base)),ar=o.addCreatureV070(a,'watcher'),br=n.addCreatureV070(b,'watcher');assert(ar===br&&JSON.stringify(a)===JSON.stringify(b),`add mismatch ${JSON.stringify(base)}`);comparisons+=2}
            const scenarios=[
              {owner:'player',index:0,dest:'hand',battlefield:['servitor','ignimite','watcher'],powerCounters:[0,1,0],summonedOn:[1,1,1],exhausted:[1,2],equipment:[{id:'tideblade',target:2}],ui:{hand:-1,creature:2,attackMode:true,attackers:[1,2],fieldFocus:{owner:'player',index:2}}},
              {owner:'player',index:1,dest:'graveyard',battlefield:['servitor','ignimite','watcher'],powerCounters:[0,1,2],summonedOn:[1,1,1],exhausted:[0,1],equipment:[{id:'tideblade',target:1},{id:'tideblade',target:2}],ui:{hand:-1,creature:1,attackMode:true,attackers:[0,1,2],fieldFocus:{owner:'player',index:1}}},
              {owner:'enemy',index:0,dest:'graveyard',battlefield:['servitor','watcher'],powerCounters:[0,0],summonedOn:[1,1],exhausted:[1],equipment:[{id:'tideblade',target:1}],ui:{hand:-1,creature:-1,attackMode:false,attackers:[],fieldFocus:{owner:'enemy',index:1}}},
              {owner:'player',index:8,dest:'graveyard',battlefield:['servitor'],powerCounters:[0],summonedOn:[1],exhausted:[],equipment:[],ui:{hand:-1,creature:0,attackMode:false,attackers:[],fieldFocus:{owner:'player',index:0}}}
            ];
            for(const s of scenarios){const OM=o.createMatch(false,'prepare'),NM=n.createMatch(false,'prepare');o.setMatch(OM);n.setMatch(NM);for(const M of[OM,NM]){const P=M[s.owner];P.hand=[];P.graveyard=[];P.battlefield=[...s.battlefield];P.powerCounters=[...s.powerCounters];P.summonedOn=[...s.summonedOn];P.exhausted=[...s.exhausted];P.equipment=s.equipment.map(x=>({...x}));M.ui=JSON.parse(JSON.stringify(s.ui))}const a=o.removeBattlefieldAt(OM[s.owner],s.index,s.dest),b=n.removeBattlefieldAt(NM[s.owner],s.index,s.dest);assert(a===b,`remove return mismatch ${JSON.stringify(s)}`);const snap=M=>JSON.stringify({P:M[s.owner],ui:M.ui});assert(snap(OM)===snap(NM),`remove state mismatch ${JSON.stringify(s)}`);comparisons+=2}
            const arena=N.window.SIZA.runArenaCriticalV071();assert(arena.passed===arena.total,`Arena ${arena.passed}/${arena.total}`);console.log(`PASS creature battlefield state old/new ${comparisons} comparisons; Arena ${arena.passed}/${arena.total}`);O.window.close();N.window.close();
            const put=await fetch(`${api}/contents/siza-mobile-test/index.html`,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Use shared creature battlefield mutations',content:Buffer.from(candidate).toString('base64'),sha:current.sha,branch:'main'})});if(!put.ok)throw new Error(`PUT ${put.status}: ${await put.text()}`);const result=await put.json();console.log('COMMIT '+result.commit.sha);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
