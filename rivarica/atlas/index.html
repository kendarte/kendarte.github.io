<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas de Caribia</title><style>body{margin:0;background:#0d1112;color:#eee;font:16px system-ui;display:grid;place-items:center;min-height:100vh}</style></head><body><div id="load">Cargando Atlas de Caribia…</div><script src="atlas-data.js"></script><script>(async()=>{try{const bin=Uint8Array.from(atob(window.ATLAS_DATA),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close();}catch(e){document.getElementById('load').innerHTML='No se pudo cargar el Atlas.<br>'+e;}})();</script></body></html>
