name: Siza Card Core Tests

on:
  push:
    paths:
      - 'siza-core/**'
      - 'siza-card-generator/**'
      - 'siza-mobile-test/index.html'
      - '.github/workflows/siza-card-core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card-core:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install JSDOM
        run: npm install --no-save jsdom@24

      - name: Fetch exact card core files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const repo=process.env.GH_REPOSITORY,sha=process.env.GH_SHA,token=process.env.GH_TOKEN;
          const files=['siza-core/card-effects.js','siza-core/card-schema.js','siza-core/card-renderer.js','siza-core/card-renderer.css','siza-core/cards.js','siza-core/manifest-rules.js','siza-core/crystal-rules.js','siza-core/entry-rules.js','siza-card-generator/index.html','siza-card-generator/app.js','siza-mobile-test/index.html'];
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          (async()=>{for(const path of files){const r=await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${sha}`,{headers});if(!r.ok)throw new Error(`${path}: GET ${r.status}`);const f=await r.json(),data=Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8');fs.mkdirSync(path.split('/').slice(0,-1).join('/'),{recursive:true});fs.writeFileSync(path,data);console.log(`Fetched ${path} ${f.sha}`)}})().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE

      - name: Run schema renderer catalog effects and Manafestation contract
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const context={window:{}};vm.createContext(context);
          vm.runInContext(fs.readFileSync('siza-core/card-effects.js','utf8'),context);
          vm.runInContext(fs.readFileSync('siza-core/card-schema.js','utf8'),context);
          vm.runInContext(fs.readFileSync('siza-core/card-renderer.js','utf8'),context);
          vm.runInContext(fs.readFileSync('siza-core/cards.js','utf8'),context);
          vm.runInContext(fs.readFileSync('siza-core/manifest-rules.js','utf8'),context);
          vm.runInContext(fs.readFileSync('siza-core/crystal-rules.js','utf8'),context);
          vm.runInContext(fs.readFileSync('siza-core/entry-rules.js','utf8'),context);
          const E=context.window.SizaCardEffects,S=context.window.SizaCardSchema,R=context.window.SizaCardRenderer,C=context.window.SizaCardCatalog,M=context.window.SizaManifestRules,X=context.window.SizaCrystalRules,Y=context.window.SizaEntryRules;
          const results=[],test=(name,fn)=>{try{results.push({name,pass:!!fn()})}catch(e){results.push({name,pass:false,error:e.message})}};
          const queen={id:'memoria_reina_ahogada',name:'Memoria de la Reina Ahogada',cardType:'invocacion',subtype:'Avatar',affinity:'azul',difficulty:8,cost:5,crystals:['azul','azul','azul'],rules:'Roba dos cartas y luego descarta una.',flavor:'La corona sobrevivió.',force:5,resistance:5,artUrl:'../assets/cards/art/queen.webp',artTransform:{x:44,y:35,scale:1.2},effects:[{event:'enter',type:'draw',target:'self',amount:2},{event:'enter',type:'discard',target:'self',amount:1,choice:'owner'}]};
          test('Schema acepta invocacion + crystals[] de la spec',()=>{const c=S.normalizeCard(queen);return c.cardType==='Creature'&&c.pips.U===3&&c.crystals.length===3&&c.power===5&&c.toughness===5});
          test('Roundtrip Mobile conserva reglas arte y effects',()=>{const m=S.cardToMobileShape(queen),c=S.cardFromMobileShape(m);return m.type==='Creature'&&m.pips.U===3&&m.artUrl.includes('queen.webp')&&m.effects.length===2&&c.effects[0].type==='draw'&&c.rules.includes('Roba dos')});
          test('Contrato de efectos valida vocabulario actual',()=>E.validateEffects(queen.effects).valid&&E.forEvent(queen,'enter').length===2&&!E.validateEffects([{event:'resolve',type:'teleport'}]).valid);
          test('Schema conserva Equipar y modificador de Equipo',()=>{const m=S.cardToMobileShape(C.get('tideblade')),c=S.cardFromMobileShape(m);return m.equipCost===1&&m.effects?.[0]?.event==='equipped'&&m.effects[0].type==='modify-power'&&c.equipCost===1&&S.validateCard(m).valid});
          test('Renderer construye carta desde datos',()=>{const html=R.renderCard(queen);return html.includes('sizaGeneratedCard')&&html.includes('Memoria de la Reina Ahogada')&&html.includes('Roba dos cartas')&&!html.includes('finalCardImage')});
          test('Renderer aplica artUrl + transform',()=>{const html=R.renderCard(queen);return html.includes('../assets/cards/art/queen.webp')&&html.includes('object-position:44% 35%')&&html.includes('scale(1.2)')});
          test('Thumb reutiliza renderer de arte',()=>{const html=R.renderThumb(queen);return html.includes('sizaGeneratedThumb')&&html.includes('queen.webp')&&html.includes('5/5')});
          test('Superficie mobile mantiene clases runtime',()=>{const html=R.renderCard(queen,{variant:'mobile',risk:'6+'});return html.includes('sizaCard generatedCardV1')&&html.includes('cardRisk')&&html.includes('6+')&&html.includes('queen.webp')});
          test('Catálogo oficial contiene exactamente las 13 cartas actuales',()=>JSON.stringify(C.cards.map(c=>c.id))===JSON.stringify(['mist','spark','servitor','ignimite','counter','prism','watcher','smuggler','tideblade','leviathan','dock','cinder','queen']));
          test('Catálogo describe los seis efectos de resolución/entrada actuales',()=>C.get('mist').effects?.[0]?.type==='draw'&&C.get('spark').effects?.[0]?.type==='damage-character'&&C.get('counter').effects?.[0]?.type==='counter-stack-target'&&C.get('servitor').effects?.[0]?.type==='observe-top'&&C.get('leviathan').effects?.[0]?.type==='bounce-other-permanent'&&C.get('queen').effects?.length===2);
          test('Manafestation compartida conserva afinidad dificultad chance y Burn',()=>{const mag={mf:2,aff:{U:2,R:1,G:0}},card={type:'Creature',cost:3,difficulty:7,pips:{U:2}};const info=M.affinityInfo(card,mag),req=M.manifestRequirement(card,mag);return info.penalty===0&&info.unsupported.length===0&&M.dcFor(card,mag)===7&&M.naturalChance(card,mag)===33&&req.die===5&&req.minBurn===0&&req.text==='5+'&&M.dcFor({type:'Creature',cost:3,pips:{}},mag)===6&&M.naturalChance({type:'Creature',cost:1,difficulty:7,pips:{G:1}},mag)===0});
          test('Cristales compartidos conservan requisito coste y pago directo',()=>{const c={type:'Creature',cost:9,pips:{U:2,R:1,G:0}},p={crystals:{U:2,R:1,G:0,W:1,B:0}},req=X.crystalReq(c),direct=X.directPlan(p,c),flex=X.directPlan(p,{type:'Creature',cost:4,pips:{}});return JSON.stringify(req)==='{"U":2,"R":1}'&&X.spellCost(c)===3&&X.spellCost({type:'Creature',cost:8,pips:{}})===1&&X.spellCost({type:'Land',cost:8,pips:{U:3}})===0&&direct?.kind==='direct'&&direct.spent.U===2&&direct.spent.R===1&&flex?.kind==='flex'&&JSON.stringify(flex.options)==='["U","R","W"]'&&X.directPlan({crystals:{U:1,R:1}},c)===null});
          test('Entrada compartida conserva preparación ataque y bloqueo',()=>{const cards={one:{type:'Creature',pips:{U:1}},two:{type:'Creature',pips:{U:2}},art:{type:'Artifact',pips:{}}},resolve=id=>cards[id],p={battlefield:['one','two','art'],summonedOn:[3,3,3],ownTurn:3,exhausted:[1]};return Y.normalizeMode('bogus')==='prepare'&&!Y.isPreparing(p,0,'oneCrystal',resolve,X.spellCost)&&Y.isPreparing(p,1,'oneCrystal',resolve,X.spellCost)&&JSON.stringify(Y.availableAttackers(p,'oneCrystal',resolve,X.spellCost))==='[0]'&&JSON.stringify(Y.legalBlockers(p,resolve))==='[0]'});
          for(const r of results)console.log(`${r.pass?'PASS':'FAIL'} ${r.name}${r.error?` :: ${r.error}`:''}`);const passed=results.filter(x=>x.pass).length;console.log(`SIZA card core: ${passed}/${results.length}`);if(passed!==results.length)process.exit(1);
          NODE

      - name: Run generator live preview contract
        run: |
          node <<'NODE'
          const fs=require('fs');const {JSDOM,VirtualConsole}=require('jsdom');
          let html=fs.readFileSync('siza-card-generator/index.html','utf8');
          const effects=fs.readFileSync('siza-core/card-effects.js','utf8'),schema=fs.readFileSync('siza-core/card-schema.js','utf8'),renderer=fs.readFileSync('siza-core/card-renderer.js','utf8'),catalog=fs.readFileSync('siza-core/cards.js','utf8'),app=fs.readFileSync('siza-card-generator/app.js','utf8');
          html=html.replace('<script src="../siza-core/card-effects.js"></script>',`<script>${effects}</script>`).replace('<script src="../siza-core/card-schema.js"></script>',`<script>${schema}</script>`).replace('<script src="../siza-core/card-renderer.js"></script>',`<script>${renderer}</script>`).replace('<script src="./app.js"></script>',`<script>${app}</script>`);
          if(html.includes('<script src="../siza-core/cards.js"></script>'))html=html.replace('<script src="../siza-core/cards.js"></script>',`<script>${catalog}</script>`);
          const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error('[JSDOM]',e.message));const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-card-generator/',virtualConsole:vc});
          const d=dom.window.document,preview=d.querySelector('#cardPreview .sizaGeneratedCard'),json=d.getElementById('jsonOutput').value,status=d.getElementById('validationStatus').textContent,effectsJson=d.getElementById('effectsJson').value,schemaVersion=dom.window.SizaCardSchema.VERSION;
          const ok=!!preview&&preview.textContent.includes('Memoria de la Reina Ahogada')&&json.includes('"schemaVersion": "'+schemaVersion+'"')&&json.includes('"effects"')&&effectsJson.includes('"discard"')&&status.includes('Schema válido');
          console.log(`${ok?'PASS':'FAIL'} Generator usa schema/effects compartidos y crea preview vivo`);dom.window.close();if(!ok)process.exit(1);
          NODE

      - name: Run Mobile shared renderer bridge contract
        run: |
          node <<'NODE'
          const fs=require('fs');const {JSDOM,VirtualConsole}=require('jsdom');
          let html=fs.readFileSync('siza-mobile-test/index.html','utf8'),effects=fs.readFileSync('siza-core/card-effects.js','utf8'),schema=fs.readFileSync('siza-core/card-schema.js','utf8'),renderer=fs.readFileSync('siza-core/card-renderer.js','utf8'),catalog=fs.readFileSync('siza-core/cards.js','utf8'),manifest=fs.readFileSync('siza-core/manifest-rules.js','utf8'),crystal=fs.readFileSync('siza-core/crystal-rules.js','utf8'),entry=fs.readFileSync('siza-core/entry-rules.js','utf8');
          if(!html.includes('<script src="../siza-core/card-schema.js"></script>')||!html.includes('<script src="../siza-core/card-renderer.js"></script>'))throw new Error('Mobile Test is not linked to shared card core');
          if(html.includes('<script src="../siza-core/card-effects.js"></script>'))html=html.replace('<script src="../siza-core/card-effects.js"></script>',`<script>${effects}</script>`);
          html=html.replace('<script src="../siza-core/card-schema.js"></script>',`<script>${schema}</script>`).replace('<script src="../siza-core/card-renderer.js"></script>',`<script>${renderer}</script>`);
          if(html.includes('<script src="../siza-core/cards.js"></script>'))html=html.replace('<script src="../siza-core/cards.js"></script>',`<script>${catalog}</script>`);
          if(html.includes('<script src="../siza-core/manifest-rules.js"></script>'))html=html.replace('<script src="../siza-core/manifest-rules.js"></script>',`<script>${manifest}</script>`);
          if(html.includes('<script src="../siza-core/crystal-rules.js"></script>'))html=html.replace('<script src="../siza-core/crystal-rules.js"></script>',`<script>${crystal}</script>`);
          if(html.includes('<script src="../siza-core/entry-rules.js"></script>'))html=html.replace('<script src="../siza-core/entry-rules.js"></script>',`<script>${entry}</script>`);
          const marker='window.SIZA={';if(!html.includes(marker))throw new Error('SIZA export marker missing');html=html.replace(marker,`window.__CARD_CORE_BRIDGE__={cardById,cardHtml,cardThumbHtmlV1,CARD_DB};\n`+marker);
          const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error('[JSDOM bridge]',e.message));const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc});dom.window.setTimeout=()=>0;
          const H=dom.window.__CARD_CORE_BRIDGE__,mist=H.cardById('mist'),face=H.cardHtml(mist),thumb=H.cardThumbHtmlV1(mist),arena=dom.window.SIZA.runArenaCriticalV071();
          const ok=arena.passed===arena.total&&H.CARD_DB.length===13&&H.cardById('queen').effects?.length===2&&face.includes('sizaCard generatedCardV1')&&thumb.includes('generatedCardThumbV1')&&!face.includes('cards-v0514');
          console.log(`Arena via shared core ${arena.passed}/${arena.total}`);console.log(`${ok?'PASS':'FAIL'} Mobile Test consume renderer/catalog compartidos`);dom.window.close();if(!ok)process.exit(1);
          NODE
