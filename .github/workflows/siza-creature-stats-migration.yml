name: Siza Creature Stats Migration

on:
  push:
    paths:
      - '.github/workflows/siza-creature-stats-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-creature-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Install JSDOM
        run: npm install --no-save jsdom@24

      - name: Validate old/new and publish runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,api=`https://api.github.com/repos/${repo}`;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function get(path){const r=await fetch(`${api}/contents/${path}?ref=main`,{headers});if(!r.ok)throw new Error(`${path}: GET ${r.status}`);const f=await r.json();return{sha:f.sha,text:Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}}
          function inlineCore(html,files,injectCreature=false){let out=html;for(const name of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js']){const tag=`<script src="../siza-core/${name}"></script>`;if(!out.includes(tag))throw new Error(`Missing ${name}`);out=out.replace(tag,`<script>${files[name]}</script>`)}const ct='<script src="../siza-core/creature-rules.js"></script>';if(out.includes(ct))out=out.replace(ct,`<script>${files['creature-rules.js']}</script>`);else if(injectCreature)out=out.replace('<script>\nconst NEREIDA_IMG=',`<script>${files['creature-rules.js']}</script>\n<script>\nconst NEREIDA_IMG=`);return out}
          function dom(html,label){const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error(`[JSDOM ${label}]`,e.message));const d=new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc});d.window.setTimeout=()=>0;return d}
          (async()=>{
            const current=await get('siza-mobile-test/index.html'),files={};for(const n of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js','creature-rules.js'])files[n]=(await get(`siza-core/${n}`)).text;
            const regression=await get('.github/scripts/siza-creature-stats-regression.js');
            const entryTag='<script src="../siza-core/entry-rules.js"></script>',creatureTag='<script src="../siza-core/creature-rules.js"></script>';
            const oldEquipmentFor="function equipmentFor(P,idx){return (P.equipment||[]).filter(e=>e.target===idx)}";
            const oldCounter="function counterV070(P,i){return P.powerCounters?.[i]||0}";
            const oldBonus="function equipmentPowerBonusV1(P,i){return equipmentFor(P,i).reduce((sum,e)=>{const c=cardById(e.id);return sum+SizaCardEffects.forEvent(c,'equipped').filter(x=>x.type==='modify-power').reduce((n,x)=>n+(x.amount||0),0)},0)}";
            const oldPower="function effectivePower(P,i){const c=cardById(P.battlefield[i]);return(c?.power||0)+counterV070(P,i)+equipmentPowerBonusV1(P,i)}";
            const oldTough="function toughV070(P,i){return(cardById(P.battlefield[i])?.toughness||0)+counterV070(P,i)}";
            for(const a of[entryTag,oldEquipmentFor,oldCounter,oldBonus,oldPower,oldTough])assert(current.text.includes(a),`Stats anchor changed ${a.slice(0,50)}`);
            let candidate=current.text.replace(entryTag,entryTag+'\n'+creatureTag)
              .replace(oldEquipmentFor,'function equipmentFor(P,idx){return SizaCreatureRules.equipmentFor(P,idx)}')
              .replace(oldCounter,'function counterV070(P,i){return SizaCreatureRules.counter(P,i)}')
              .replace(oldBonus,'function equipmentPowerBonusV1(P,i){return SizaCreatureRules.equipmentPowerBonus(P,i,cardById,SizaCardEffects.forEvent)}')
              .replace(oldPower,'function effectivePower(P,i){return SizaCreatureRules.effectivePower(P,i,cardById,SizaCardEffects.forEvent)}')
              .replace(oldTough,'function toughV070(P,i){return SizaCreatureRules.toughness(P,i,cardById)}');
            const marker='window.SIZA={',probe=`window.__STATS_COMPARE__={TEST_CARD_DB_V1,equipmentFor,counterV070,equipmentPowerBonusV1,effectivePower,toughV070};\n`;assert(current.text.includes(marker),'SIZA marker missing');
            const O=dom(inlineCore(current.text,files,true).replace(marker,probe+marker),'old'),N=dom(inlineCore(candidate,files,false).replace(marker,probe+marker),'new'),o=O.window.__STATS_COMPARE__,n=N.window.__STATS_COMPARE__;
            const generated=[
              {id:'guard_body',name:'Body',type:'Creature',cost:1,difficulty:1,pips:{U:1},power:2,toughness:3,text:'Body.',art:'multi',glyph:'B',effects:[]},
              {id:'guard_blade',name:'Blade',type:'Artifact',cost:1,difficulty:1,pips:{},equipCost:1,text:'+3.',art:'multi',glyph:'E',effects:[{event:'equipped',type:'modify-power',amount:3}]},
              {id:'guard_charm',name:'Charm',type:'Artifact',cost:1,difficulty:1,pips:{},equipCost:1,text:'+1.',art:'multi',glyph:'C',effects:[{event:'equipped',type:'modify-power',amount:1}]}
            ];o.TEST_CARD_DB_V1.push(...generated.map(x=>({...x})));n.TEST_CARD_DB_V1.push(...generated.map(x=>({...x})));
            const cases=[
              {battlefield:['guard_body'],powerCounters:[0],equipment:[]},
              {battlefield:['guard_body'],powerCounters:[2],equipment:[]},
              {battlefield:['guard_body'],powerCounters:[2],equipment:[{id:'guard_blade',target:0}]},
              {battlefield:['guard_body'],powerCounters:[1],equipment:[{id:'guard_blade',target:0},{id:'guard_charm',target:0},{id:'guard_blade',target:null}]},
              {battlefield:['guard_body'],powerCounters:[],equipment:[{id:'guard_charm',target:1}]}
            ];let comparisons=0;
            for(const P of cases){for(const i of[0,1]){const checks=[['equipmentFor',x=>x.map(e=>({id:e.id,target:e.target}))],['counterV070',x=>x],['equipmentPowerBonusV1',x=>x],['effectivePower',x=>x],['toughV070',x=>x]];for(const[name,norm]of checks){const a=norm(o[name](P,i)),b=norm(n[name](P,i));assert(JSON.stringify(a)===JSON.stringify(b),`${name} mismatch case=${JSON.stringify(P)} i=${i}`);comparisons++}}}
            const arena=N.window.SIZA.runArenaCriticalV071();assert(arena.passed===arena.total,`Arena ${arena.passed}/${arena.total}`);console.log(`PASS creature stats old/new ${comparisons} comparisons; Arena ${arena.passed}/${arena.total}`);O.window.close();N.window.close();
            fs.mkdirSync('siza-mobile-test',{recursive:true});fs.mkdirSync('siza-core',{recursive:true});fs.mkdirSync('.github/scripts',{recursive:true});fs.writeFileSync('siza-mobile-test/index.html',candidate);for(const[n,t]of Object.entries(files))fs.writeFileSync(`siza-core/${n}`,t);fs.writeFileSync('.github/scripts/siza-creature-stats-regression.js',regression.text);cp.execFileSync('node',['.github/scripts/siza-creature-stats-regression.js'],{stdio:'inherit'});
            const put=await fetch(`${api}/contents/siza-mobile-test/index.html`,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Use shared creature stat rules',content:Buffer.from(candidate).toString('base64'),sha:current.sha,branch:'main'})});if(!put.ok)throw new Error(`PUT ${put.status}: ${await put.text()}`);const result=await put.json();console.log('COMMIT '+result.commit.sha);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
