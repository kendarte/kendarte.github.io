name: Video Factory Cloud Render

on:
  push:
    paths:
      - 'video-factory/queue/latest.json'
      - 'video-factory/cloud/**'
      - '.github/workflows/video-factory-render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-factory-cloud-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python renderer
        run: |
          python -m pip install --upgrade pip
          pip install 'kokoro==0.9.4' soundfile numpy pillow playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Render latest queued video
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: python video-factory/cloud/render.py

      - name: Publish rendered MP4
        run: |
          git config user.name 'video-factory-bot'
          git config user.email 'video-factory-bot@users.noreply.github.com'
          git add video-factory/renders/latest.mp4 video-factory/renders/latest.json
          if git diff --cached --quiet; then
            echo 'No render changes to publish.'
            exit 0
          fi
          git commit -m 'Render latest Video Factory job'
          git push
