name: Add visual development section
on:
  push:
    paths:
      - '.tmp_visual/trigger.txt'
permissions:
  contents: write
jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update portfolio
        run: python scripts/add_visual_development.py
      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add visual development process to portfolio"
          git push
