name: Siza Crystal State Migration

on:
  push:
    paths:
      - '.github/workflows/siza-crystal-state-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-crystal-state:
    runs-on: ubuntu-latest
    steps:
      - name: Install JSDOM
        run: npm install --no-save jsdom@24

      - name: Validate old/new and publish runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,api=`https://api.github.com/repos/${repo}`;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function get(path){const r=await fetch(`${api}/contents/${path}?ref=main`,{headers});if(!r.ok)throw new Error(`${path}: GET ${r.status}`);const f=await r.json();return{sha:f.sha,text:Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}}
          function inlineCore(html,files){let out=html;for(const name of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js']){const tag=`<script src="../siza-core/${name}"></script>`;if(!out.includes(tag))throw new Error(`Missing ${name}`);out=out.replace(tag,`<script>${files[name]}</script>`)}return out}
          function makeDom(html,label){const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error(`[JSDOM ${label}]`,e.message));const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc});dom.window.setTimeout=()=>0;return dom}
          (async()=>{
            const current=await get('siza-mobile-test/index.html'),files={};
            for(const name of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js','entry-rules.js'])files[name]=(await get(`siza-core/${name}`)).text;
            const regression=await get('.github/scripts/siza-crystal-state-regression.js');
            const oldReset="function resetCrystalsV070(P){P.crystals={};for(const[k,n]of Object.entries(P.aff||{}))if(n>0)P.crystals[k]=n;P.offeringUsed=false;P.artifactExhausted=[]}";
            const oldSpend="function spendV070(P,spent){for(const[k,n]of Object.entries(spent||{}))if((P.crystals?.[k]||0)<n)return false;for(const[k,n]of Object.entries(spent||{}))P.crystals[k]-=n;return true}";
            assert(current.text.includes(oldReset)&&current.text.includes(oldSpend),'Crystal state anchors changed');
            const candidate=current.text.replace(oldReset,'function resetCrystalsV070(P){return SizaCrystalRules.resetPool(P)}').replace(oldSpend,'function spendV070(P,spent){return SizaCrystalRules.spend(P,spent)}');
            const marker='window.SIZA={',probe=`window.__CRYSTAL_COMPARE__={resetCrystalsV070,spendV070};\n`;assert(current.text.includes(marker)&&candidate.includes(marker),'SIZA marker missing');
            const O=makeDom(inlineCore(current.text,files).replace(marker,probe+marker),'old'),N=makeDom(inlineCore(candidate,files).replace(marker,probe+marker),'new'),o=O.window.__CRYSTAL_COMPARE__,n=N.window.__CRYSTAL_COMPARE__;
            const resetCases=[
              {aff:{U:2,R:1,G:0},crystals:{U:0,R:0,G:9},offeringUsed:true,artifactExhausted:[0,2],exhausted:[1]},
              {aff:{U:0,R:0,G:0},crystals:{U:4},offeringUsed:false,artifactExhausted:[],exhausted:[]},
              {aff:{U:1,R:-1,W:2},crystals:{B:3},offeringUsed:true,artifactExhausted:[5],exhausted:[0,3]},
              {aff:{},crystals:{U:1,R:1},offeringUsed:true,artifactExhausted:[0],exhausted:[]}
            ];
            let comparisons=0;
            for(const base of resetCases){const op=JSON.parse(JSON.stringify(base)),np=JSON.parse(JSON.stringify(base));const or=o.resetCrystalsV070(op),nr=n.resetCrystalsV070(np);assert(or===nr,`reset return mismatch`);assert(JSON.stringify(op)===JSON.stringify(np),`reset state mismatch ${JSON.stringify(base)}`);comparisons+=2}
            const spendCases=[
              [{U:2,R:1},{U:1,R:1}],
              [{U:1,R:1},{U:2,R:1}],
              [{U:1,R:1},{}],
              [{U:2,R:0},{R:1}],
              [{U:3,G:2},{U:3,G:2}],
              [{B:1},null]
            ];
            for(const[pool,plan]of spendCases){const op={crystals:{...pool}},np={crystals:{...pool}},or=o.spendV070(op,plan),nr=n.spendV070(np,plan);assert(or===nr,`spend return mismatch ${JSON.stringify(pool)}/${JSON.stringify(plan)}`);assert(JSON.stringify(op)===JSON.stringify(np),`spend state mismatch ${JSON.stringify(pool)}/${JSON.stringify(plan)}`);comparisons+=2}
            const arena=N.window.SIZA.runArenaCriticalV071();assert(arena.passed===arena.total,`Candidate Arena ${arena.passed}/${arena.total}`);console.log(`PASS crystal state old/new ${comparisons} comparisons; Arena ${arena.passed}/${arena.total}`);O.window.close();N.window.close();
            fs.mkdirSync('siza-mobile-test',{recursive:true});fs.mkdirSync('siza-core',{recursive:true});fs.mkdirSync('.github/scripts',{recursive:true});fs.writeFileSync('siza-mobile-test/index.html',candidate);for(const[name,text]of Object.entries(files))fs.writeFileSync(`siza-core/${name}`,text);fs.writeFileSync('.github/scripts/siza-crystal-state-regression.js',regression.text);cp.execFileSync('node',['.github/scripts/siza-crystal-state-regression.js'],{stdio:'inherit'});
            const put=await fetch(`${api}/contents/siza-mobile-test/index.html`,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Use shared crystal pool mutations',content:Buffer.from(candidate,'utf8').toString('base64'),sha:current.sha,branch:'main'})});if(!put.ok)throw new Error(`PUT index ${put.status}: ${await put.text()}`);const result=await put.json();console.log('COMMIT '+result.commit.sha);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
