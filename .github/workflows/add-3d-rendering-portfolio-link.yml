name: Add 3D rendering portfolio link

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_3d_rendering_portfolio_link.py'

permissions:
  contents: write

jobs:
  patch-3d-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch 3D portfolio page
        run: python scripts/add_3d_rendering_portfolio_link.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3d/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add external 3D rendering portfolio link"
          git push
