name: Siza Handoff Deck Cleanup

on:
  push:
    paths:
      - '.github/workflows/siza-handoff-deck-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save jsdom@24
      - name: Clean deck filter and validate Generator card deck use
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const {JSDOM,VirtualConsole}=require('jsdom');const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,path='siza-mobile-test/index.html',headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'},api=`https://api.github.com/repos/${repo}/contents/${path}`;const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function get(p){const r=await fetch(`https://api.github.com/repos/${repo}/contents/${p}?ref=main`,{headers});if(!r.ok)throw new Error(`${p}: ${r.status}`);const f=await r.json();return Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}
          (async()=>{const r=await fetch(`${api}?ref=main`,{headers});if(!r.ok)throw new Error(`GET ${r.status}`);const f=await r.json();let html=Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8');const old=".filter(([,n])=>n>0&&cardById(n==null?'':arguments[0])!==null)";const next=".filter(([id,n])=>n>0&&!!cardById(id))";assert((html.split(old).length-1)===1,'Deck cleanup anchor mismatch');html=html.replace(old,next);
            const schema=await get('siza-core/card-schema.js'),renderer=await get('siza-core/card-renderer.js');let t=html.replace('<script src="../siza-core/card-schema.js"></script>',`<script>${schema}</script>`).replace('<script src="../siza-core/card-renderer.js"></script>',`<script>${renderer}</script>`);const marker='window.SIZA={';t=t.replace(marker,`window.__DECK_HANDOFF__={getState:()=>state,renderDeck,cardById};\n`+marker);const payload={action:'test-card',target:'collection',card:{id:'generator_probe',name:'Carta Generator Probe',type:'Creature',subtype:'Test',cost:2,difficulty:6,pips:{U:1},power:2,toughness:3,text:'Carta temporal.',flavor:'Test.',art:'blue',glyph:'P'},generatorCard:{id:'generator_probe',name:'Carta Generator Probe',cardType:'Creature',subtype:'Test',affinity:'azul',cost:2,difficulty:6,pips:{U:1},force:2,resistance:3,rules:'Carta temporal.',flavor:'Test.'}};const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error('[JSDOM]',e.message));const dom=new JSDOM(t,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc,beforeParse(w){w.localStorage.setItem('siza_card_generator_handoff_v1',JSON.stringify(payload))}});dom.window.setTimeout=()=>0;const H=dom.window.__DECK_HANDOFF__,S=H.getState();S.deck.counts.dock=11;dom.window.SIZA.deckDelta('generator_probe',1);assert(S.deck.counts.generator_probe===1,'Generator card was not added to deck');assert(Object.values(S.deck.counts).reduce((a,b)=>a+b,0)===60,'Deck total changed incorrectly');const deck=H.renderDeck();assert(deck.includes('Carta Generator Probe'),'Deck does not render Generator card');const core=dom.window.SIZA.runArenaCriticalV071();assert(core.passed===core.total,`Arena ${core.passed}/${core.total}`);console.log('PASS Generator card Collection → Deck');console.log(`Arena ${core.passed}/${core.total}`);dom.window.close();
            const w=await fetch(api,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Clean Generator handoff deck integration',content:Buffer.from(html,'utf8').toString('base64'),sha:f.sha,branch:'main'})});if(!w.ok)throw new Error(`PUT ${w.status}: ${await w.text()}`);const out=await w.json();console.log(`COMMIT ${out.commit.sha}`);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE