name: Siza Ofrenda Core Validate

on:
  push:
    paths:
      - '.github/workflows/siza-offering-core-validate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offering-core:
    runs-on: ubuntu-latest
    steps:
      - name: Install JSDOM
        run: npm install --no-save jsdom@24

      - name: Validate shared Ofrenda planner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const vm=require('vm');
          const repo=process.env.GH_REPOSITORY,sha=process.env.GH_SHA,token=process.env.GH_TOKEN;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const r=await fetch(`https://api.github.com/repos/${repo}/contents/siza-core/crystal-rules.js?ref=${sha}`,{headers});
            if(!r.ok)throw new Error(`GET crystal-rules ${r.status}`);
            const f=await r.json(),source=Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8');
            const context={window:{}};vm.createContext(context);vm.runInContext(source,context);const X=context.window.SizaCrystalRules;
            const cards={blue:{id:'blue',pips:{U:1}},red:{id:'red',pips:{R:1}}},resolve=id=>cards[id];
            const target={type:'Creature',pips:{U:2}},base={crystals:{U:1,R:1},battlefield:['blue'],summonedOn:[0],ownTurn:1,exhausted:[],offeringUsed:false};
            const plan=X.offeringPlan(base,target,resolve);
            assert(plan?.kind==='offering','Ofrenda should be available');
            assert(plan.missing==='U','Missing color should be U');
            assert(JSON.stringify(plan.spent)==='{"U":1,"R":1}','Ofrenda spend should substitute R');
            assert(plan.candidates.length===1&&plan.candidates[0].id==='blue','Blue permanent should be candidate');
            assert(X.offeringPlan({...base,summonedOn:[1]},target,resolve)===null,'Fresh permanent must not be candidate');
            assert(X.offeringPlan({...base,exhausted:[0]},target,resolve)===null,'Exhausted permanent must not be candidate');
            assert(X.offeringPlan({...base,offeringUsed:true},target,resolve)===null,'Ofrenda cannot be reused');
            const direct=X.paymentPlan({...base,crystals:{U:2,R:1}},target,resolve);
            assert(direct?.kind==='direct'&&direct.spent.U===2,'Direct payment must win over Ofrenda');
            console.log('PASS shared Ofrenda planner 5/5');
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE

      - name: Compare old and shared planner then publish Arena adapters
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,api=`https://api.github.com/repos/${process.env.GH_REPOSITORY}`;
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function get(path){const r=await fetch(`${api}/contents/${path}?ref=main`,{headers});if(!r.ok)throw new Error(`${path}: GET ${r.status}`);const f=await r.json();return{sha:f.sha,text:Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}}
          function inline(html,files){let out=html;for(const name of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js']){const tag=`<script src="../siza-core/${name}"></script>`;assert(out.includes(tag),`Missing ${name}`);out=out.replace(tag,`<script>${files[name]}</script>`)}return out}
          function makeDom(html,label){const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error(`[JSDOM ${label}]`,e.message));const d=new JSDOM(html,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc});d.window.setTimeout=()=>0;return d}
          (async()=>{
            const current=await get('siza-mobile-test/index.html'),files={};for(const n of ['card-effects.js','card-schema.js','cards.js','card-renderer.js','manifest-rules.js','crystal-rules.js'])files[n]=(await get(`siza-core/${n}`)).text;
            const oldOffering="function offeringPlanV070(P,c){const req=crystalReqV070(c),spent={},missing=[];let need=0;for(const[k,n]of Object.entries(req)){need+=n;const have=P.crystals?.[k]||0;spent[k]=Math.min(have,n);for(let i=have;i<n;i++)missing.push(k)}if(missing.length!==1||Object.values(P.crystals||{}).reduce((a,b)=>a+b,0)<need||P.offeringUsed)return null;const miss=missing[0],sub=['U','R','G','W','B'].find(k=>k!==miss&&(P.crystals?.[k]||0)>(spent[k]||0));if(!sub)return null;spent[sub]=(spent[sub]||0)+1;const candidates=P.battlefield.map((id,index)=>({id,index,c:cardById(id)})).filter(x=>(x.c?.pips?.[miss]||0)>0&&(P.summonedOn?.[x.index]??P.ownTurn)<P.ownTurn&&!(P.exhausted||[]).includes(x.index));return candidates.length?{kind:'offering',spent,missing:miss,candidates}:null}";
            const oldPayment="function paymentV070(P,c){return directPlanV070(P,c)||offeringPlanV070(P,c)}";
            assert(current.text.includes(oldOffering)&&current.text.includes(oldPayment),'Arena Ofrenda anchors changed');
            const candidate=current.text.replace(oldOffering,"function offeringPlanV070(P,c){return SizaCrystalRules.offeringPlan(P,c,cardById)}").replace(oldPayment,"function paymentV070(P,c){return SizaCrystalRules.paymentPlan(P,c,cardById)}");
            const marker='window.SIZA={',probe=`window.__OFFERING_COMPARE__={offeringPlanV070,paymentV070,cardById};\n`;assert(current.text.includes(marker),'SIZA marker missing');
            const O=makeDom(inline(current.text,files).replace(marker,probe+marker),'old'),N=makeDom(inline(candidate,files).replace(marker,probe+marker),'new'),o=O.window.__OFFERING_COMPARE__,n=N.window.__OFFERING_COMPARE__;
            const ids=['mist','spark','servitor','ignimite','counter','prism','watcher','smuggler','tideblade','leviathan','queen'];
            const scenarios=[
              {crystals:{U:1,R:1},battlefield:['mist','spark'],summonedOn:[0,0],ownTurn:1,exhausted:[],offeringUsed:false},
              {crystals:{U:2,R:0},battlefield:['mist'],summonedOn:[0],ownTurn:1,exhausted:[],offeringUsed:false},
              {crystals:{U:1,R:1},battlefield:['mist'],summonedOn:[1],ownTurn:1,exhausted:[],offeringUsed:false},
              {crystals:{U:1,R:1},battlefield:['mist'],summonedOn:[0],ownTurn:1,exhausted:[0],offeringUsed:false},
              {crystals:{U:1,R:1},battlefield:['mist'],summonedOn:[0],ownTurn:1,exhausted:[],offeringUsed:true}
            ];
            for(const id of ids)for(const p of scenarios){const oc=o.cardById(id),nc=n.cardById(id);assert(JSON.stringify(o.offeringPlanV070(p,oc))===JSON.stringify(n.offeringPlanV070(p,nc)),`offering mismatch ${id}`);assert(JSON.stringify(o.paymentV070(p,oc))===JSON.stringify(n.paymentV070(p,nc)),`payment mismatch ${id}`)}
            const report=N.window.SIZA.runArenaCriticalV071();assert(report.passed===report.total,`Candidate Arena ${report.passed}/${report.total}`);console.log(`PASS Ofrenda old/new ${ids.length*scenarios.length} cases; Arena ${report.passed}/${report.total}`);O.window.close();N.window.close();
            const put=await fetch(`${api}/contents/siza-mobile-test/index.html`,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Use shared Ofrenda payment planner',content:Buffer.from(candidate,'utf8').toString('base64'),sha:current.sha,branch:'main'})});if(!put.ok)throw new Error(`PUT index ${put.status}: ${await put.text()}`);const result=await put.json();console.log('COMMIT '+result.commit.sha);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
