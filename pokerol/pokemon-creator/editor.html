<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POKEROL Pokémon Creator</title>
<style>
:root{--bg:#090d13;--panel:#111823;--line:#2d3a4e;--text:#edf3fa;--muted:#93a3b8;--ok:#72d99d;--bad:#ff7272}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.top{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#0e141e;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.05em;margin-right:10px}.brand small{display:block;font-size:10px;color:var(--muted)}.btn{border:1px solid #38485f;background:#182435;color:var(--text);border-radius:7px;padding:7px 10px;cursor:pointer}.btn:hover{background:#213149}.btn.primary{background:#18496e;border-color:#4385b5}.btn.danger{background:#3b2025;border-color:#763940}.spacer{flex:1}.status{font-size:11px;color:var(--muted)}.layout{min-height:0;display:grid;grid-template-columns:275px minmax(560px,1fr) 360px}.left,.right{min-height:0;overflow:auto;background:var(--panel)}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.main{min-height:0;overflow:auto;padding:15px;background:#0c1118}.section{padding:12px;border-bottom:1px solid var(--line)}h3{margin:0 0 9px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#aebdd0}.field{display:grid;gap:4px;margin-bottom:9px}.field label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #35445a;border-radius:6px;background:#0b1119;color:var(--text);padding:8px}textarea{min-height:76px;resize:vertical}.json{font:11px Consolas,monospace;min-height:120px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.card{max-width:1040px;margin:0 auto 13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.moveCard{border-color:#4c6079;background:linear-gradient(#14202e,#111823)}.check{display:flex;gap:7px;align-items:center}.check input{width:auto}.note{font-size:11px;color:var(--muted);line-height:1.45}.list{display:grid;gap:6px}.item{padding:8px;border:1px solid transparent;background:#0c131c;border-radius:7px;cursor:pointer}.item.sel{background:#172a3d;border-color:#67aae0}.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:var(--muted)}.pill{float:right;font-size:9px;border:1px solid #42536c;border-radius:999px;padding:1px 5px}.empty{padding:11px;border:1px dashed #34445a;border-radius:7px;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;margin:0;background:#090e14;border:1px solid #273447;border-radius:7px;padding:10px;font:11px Consolas,monospace;color:#cbd7e6}.ok{color:var(--ok)}.bad{color:var(--bad)}.tabs{display:flex;gap:5px}.tab{flex:1}.tab.active{background:#24516f;border-color:#67aae0}.movegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.movecheck{padding:7px;border:1px solid #2b394c;border-radius:6px;background:#0c131c}.movecheck input{width:auto;margin-right:6px}@media(max-width:1100px){.layout{grid-template-columns:230px minmax(500px,1fr) 310px}.grid6{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.layout{grid-template-columns:1fr}.left,.right{display:none}.grid2,.grid3,.movegrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">POKEROL POKÉMON CREATOR<small>species + progression + TM/HM + world capabilities</small></div><button id="addPokemon" class="btn primary">+ Pokémon</button><button id="addMove" class="btn">+ Move</button><button id="duplicate" class="btn">Duplicar</button><button id="delete" class="btn danger">Eliminar</button><div class="spacer"></div><button id="importBtn" class="btn">Importar JSON</button><button id="exportBtn" class="btn">Exportar JSON</button><button id="validateBtn" class="btn">Validar</button><input id="fileInput" type="file" accept=".json" hidden><span id="status" class="status">Listo</span></header>
<div class="layout"><aside class="left"><div class="section"><h3>Proyecto</h3><div class="field"><label>Nombre</label><input id="projectName"></div></div><div class="section"><div class="tabs"><button id="tabPokemon" class="btn tab active">Pokémon</button><button id="tabMoves" class="btn tab">Moves</button></div></div><div class="section"><h3 id="listTitle">Pokémon</h3><div id="itemList" class="list"></div></div><div class="section note">Autosave local. Los Pokémon referencian moves por <b>move_id</b>; la física y utilidad del move existen una sola vez en el catálogo.</div></aside><main id="editor" class="main"></main><aside class="right"><div class="section"><h3>Payload resuelto</h3><pre id="payload">—</pre></div><div class="section"><h3>Capacidades de mundo</h3><div id="capabilities" class="note">—</div></div><div class="section"><h3>Validación</h3><div id="validation" class="note">—</div></div></aside></div></div>
<script>
(()=>{
'use strict';
const STORE='pokerol_pokemon_creator_v1';
const TYPES=['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];
const CATEGORIES=['ATTACK','DEFENSE','STATUS','ENVIRONMENTAL','MOVEMENT','SENSORY'];
const DAMAGE=['PHYSICAL','SPECIAL','STATUS'];
const DELIVERIES=['CONTACT','PROJECTILE','BEAM','PARABOLA','ARC','RAIN','FALL','GROUND_BURST','CRAWL','WAVE','CONE','MINE','FIELD','SELF','TARGETED','MOVEMENT'];
const DEFENSES=['NONE','BARRIER','SHELTER','REDIRECT','REFLECT','ABSORB','BRUSH'];
const EFFECTS=['CUT','PIERCE','BLUNT','BREAK','PUSH','PULL','LIFT','KNOCKDOWN','BURN','IGNITE','HEAT','COOL','FREEZE','MELT','WATER','SOAK','ELECTRIFY','POWER_DEVICE','SHORT_CIRCUIT','DIG','TUNNEL','ERODE','CREATE_COVER','DESTROY_COVER','CLEAR_SMOKE','CREATE_WIND','MOVE_AIR','MOVE_WATER','SURF','SWIM','FLY','GLIDE','CLIMB','CROSS_GAP','CARRY','LIGHT','DARKEN','GROW_PLANTS','CUT_VEGETATION','SENSE_HEAT','SENSE_LIFE','TRACK','SCENT','SONAR','TELEKINESIS','TELEPORT','HEAL','CLEANSE','SLEEP','WAKE','RESTRAIN','RELEASE'];
const MATERIALS=['CREATURE','VEGETATION','WOOD','STONE','SOIL','SAND','METAL','GLASS','ICE','WATER','FIRE','ELECTRICAL_DEVICE','ROPE','FABRIC','FRAGILE_STRUCTURE','HEAVY_OBJECT','SMOKE','GAS'];
const $=id=>document.getElementById(id),clone=v=>JSON.parse(JSON.stringify(v)),arr=v=>Array.isArray(v)?v:[],obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eid=prefix=>`${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
const lines=v=>String(v||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),csv=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean),j=v=>JSON.stringify(v,null,2);
function freshPokemon(n=1){return{editor_id:eid('pk'),species_id:`PKMN-${String(n).padStart(3,'0')}`,species_name:`Nuevo Pokémon ${n}`,dex_number:n,form:'',types:['Normal'],description:'',temperament:'',level:5,experience:0,growth_rate:'MEDIUM',evolution:[],base_stats:{HP:45,ATK:45,DEF:45,SPA:45,SPD:45,SPE:45},world_stats:{FUE:2,AGI:2,COO:2,INT:2,PER:2,PSI:2},locomotion:['WALK'],senses:['VISION'],body_tags:[],environment_tags:[],level_up_moves:[],tm_compatibility:[],hm_compatibility:[],known_moves:[],active_move_limit:4,notes:''}}
function freshMove(n=1){return{editor_id:eid('mv'),move_id:`MOVE-${String(n).padStart(3,'0')}`,name:`Nuevo Move ${n}`,pokemon_type:'Normal',category:'ATTACK',damage_class:'PHYSICAL',power:40,accuracy:100,pp:20,priority:0,description:'',delivery:'CONTACT',defense_profile:'NONE',range:'SHORT',target_mode:'SINGLE',world_enabled:true,world_effects:[],materials:['CREATURE'],requirements:{line_of_sight:false,ground_contact:false,requires_water:false,requires_airspace:false,requires_target:false},world_rules:[],machine:{kind:'NONE',id:'',reusable:false},tags:[]}}
function fresh(){return{version:1,meta:{name:'POKEROL Pokémon Set'},pokemon:[],moves:[]}}
function normalize(raw){let p={...fresh(),...obj(raw)};p.meta={name:p.meta?.name||'POKEROL Pokémon Set'};p.pokemon=arr(p.pokemon).map((r,i)=>{let d=freshPokemon(i+1),x={...d,...obj(r)};x.types=arr(x.types);x.base_stats={...d.base_stats,...obj(x.base_stats)};x.world_stats={...d.world_stats,...obj(x.world_stats)};for(const k of ['evolution','locomotion','senses','body_tags','environment_tags','level_up_moves','tm_compatibility','hm_compatibility','known_moves'])x[k]=arr(x[k]);return x});p.moves=arr(p.moves).map((r,i)=>{let d=freshMove(i+1),x={...d,...obj(r)};x.requirements={...d.requirements,...obj(x.requirements)};x.machine={...d.machine,...obj(x.machine)};for(const k of ['world_effects','materials','world_rules','tags'])x[k]=arr(x[k]);return x});return p}
function restore(){try{return normalize(JSON.parse(localStorage.getItem(STORE)||'null'))}catch{return fresh()}}
let state=restore();if(!state.pokemon.length)state.pokemon.push(freshPokemon(1));if(!state.moves.length)state.moves.push(freshMove(1));let mode='pokemon',selected=state.pokemon[0].editor_id;
function save(msg='Guardado'){localStorage.setItem(STORE,JSON.stringify(state));$('status').textContent=msg;clearTimeout(save.t);save.t=setTimeout(()=>$('status').textContent='Listo',1200)}
function current(){return(mode==='pokemon'?state.pokemon:state.moves).find(x=>x.editor_id===selected)||null}
function field(label,id,val,type='text'){return`<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val??'')}"></div>`}
function select(label,id,val,opts){return`<div class="field"><label>${label}</label><select id="${id}">${opts.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function area(label,id,val,klass=''){return`<div class="field"><label>${label}</label><textarea id="${id}" class="${klass}">${esc(val??'')}</textarea></div>`}
function check(label,id,val){return`<label class="check"><input id="${id}" type="checkbox" ${val?'checked':''}> ${label}</label>`}
function set(id,fn,event='input'){let e=$(id);if(e)e.addEventListener(event,()=>{try{fn(e);save();renderSide()}catch(err){$('status').textContent=err.message}})}
function setMode(next){mode=next;selected=(mode==='pokemon'?state.pokemon[0]:state.moves[0])?.editor_id||null;render()}
function render(){state=normalize(state);$('projectName').value=state.meta.name;$('tabPokemon').classList.toggle('active',mode==='pokemon');$('tabMoves').classList.toggle('active',mode==='moves');renderList();renderEditor();renderSide()}
function renderList(){let list=mode==='pokemon'?state.pokemon:state.moves;$('listTitle').textContent=mode==='pokemon'?`Pokémon (${list.length})`:`Moves (${list.length})`;$('itemList').innerHTML=list.map(x=>`<div class="item ${x.editor_id===selected?'sel':''}" data-id="${x.editor_id}"><span class="pill">${mode==='pokemon'?'LV '+x.level:x.delivery}</span><b>${esc(mode==='pokemon'?x.species_name:x.name)}</b><small>${esc(mode==='pokemon'?x.species_id:x.move_id)}</small></div>`).join('');document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{selected=e.dataset.id;render()})}
function moveOptions(selectedMoves){return state.moves.map(m=>`<label class="movecheck"><input type="checkbox" data-known="${esc(m.move_id)}" ${selectedMoves.includes(m.move_id)?'checked':''}> <b>${esc(m.name)}</b><br><small>${esc(m.move_id)} · ${esc(m.delivery)} · ${esc(m.world_effects.join(', ')||'sin world effects')}</small></label>`).join('')||'<div class="empty">Sin moves.</div>'}
function renderPokemon(p){const bs=p.base_stats,ws=p.world_stats;$('editor').innerHTML=`<div class="card"><h3>Identidad</h3><div class="grid3">${field('Species ID','speciesId',p.species_id)}${field('Nombre','speciesName',p.species_name)}${field('Dex #','dex',p.dex_number,'number')}${field('Forma','form',p.form)}${field('Tipos — coma','types',p.types.join(', '))}${field('Growth rate','growth',p.growth_rate)}</div>${area('Descripción','description',p.description)}${area('Temperamento','temperament',p.temperament)}</div><div class="card"><h3>Progresión</h3><div class="grid3">${field('Nivel','level',p.level,'number')}${field('Experiencia','experience',p.experience,'number')}${field('Límite moves activos (0 = sin límite)','moveLimit',p.active_move_limit,'number')}</div>${area('Evolución — JSON','evolution',j(p.evolution),'json')}${area('Moves por nivel — JSON [{level,move_id}]','levelMoves',j(p.level_up_moves),'json')}${area('Compatibilidad TM — IDs, uno por línea','tmCompat',p.tm_compatibility.join('\n'))}${area('Compatibilidad HM — IDs, uno por línea','hmCompat',p.hm_compatibility.join('\n'))}</div><div class="card"><h3>Stats Pokémon</h3><div class="grid6">${Object.keys(bs).map(k=>field(k,'bs'+k,bs[k],'number')).join('')}</div><h3>World Engine Stats</h3><div class="grid6">${Object.keys(ws).map(k=>field(k,'ws'+k,ws[k],'number')).join('')}</div></div><div class="card"><h3>Física y mundo</h3><div class="grid2">${area('Locomoción — uno por línea','locomotion',p.locomotion.join('\n'))}${area('Sentidos — uno por línea','senses',p.senses.join('\n'))}${area('Body tags — uno por línea','bodyTags',p.body_tags.join('\n'))}${area('Environment tags / resistencias','envTags',p.environment_tags.join('\n'))}</div></div><div class="card moveCard"><h3>Moves conocidos</h3><div class="note">Biblioteca real de técnicas conocidas. El loadout de combate puede limitarse sin perder capacidades fuera de combate.</div><div class="movegrid" id="knownMoves">${moveOptions(p.known_moves)}</div></div><div class="card">${area('Notas','notes',p.notes)}</div>`;
set('speciesId',e=>p.species_id=e.value);set('speciesName',e=>p.species_name=e.value);set('dex',e=>p.dex_number=+e.value);set('form',e=>p.form=e.value);set('types',e=>p.types=csv(e.value));set('growth',e=>p.growth_rate=e.value);set('description',e=>p.description=e.value);set('temperament',e=>p.temperament=e.value);set('level',e=>p.level=+e.value);set('experience',e=>p.experience=+e.value);set('moveLimit',e=>p.active_move_limit=+e.value);set('evolution',e=>p.evolution=JSON.parse(e.value||'[]'),'change');set('levelMoves',e=>p.level_up_moves=JSON.parse(e.value||'[]'),'change');set('tmCompat',e=>p.tm_compatibility=lines(e.value));set('hmCompat',e=>p.hm_compatibility=lines(e.value));set('locomotion',e=>p.locomotion=lines(e.value));set('senses',e=>p.senses=lines(e.value));set('bodyTags',e=>p.body_tags=lines(e.value));set('envTags',e=>p.environment_tags=lines(e.value));set('notes',e=>p.notes=e.value);Object.keys(bs).forEach(k=>set('bs'+k,e=>p.base_stats[k]=+e.value));Object.keys(ws).forEach(k=>set('ws'+k,e=>p.world_stats[k]=+e.value));document.querySelectorAll('[data-known]').forEach(e=>e.onchange=()=>{let id=e.dataset.known;p.known_moves=e.checked?[...new Set([...p.known_moves,id])]:p.known_moves.filter(x=>x!==id);save();renderSide()})}
function multiChecks(values,selected,attr){return values.map(v=>`<label class="movecheck"><input type="checkbox" ${attr}="${esc(v)}" ${selected.includes(v)?'checked':''}> ${esc(v)}</label>`).join('')}
function renderMove(m){$('editor').innerHTML=`<div class="card moveCard"><h3>Move</h3><div class="grid3">${field('Move ID','moveId',m.move_id)}${field('Nombre','moveName',m.name)}${select('Tipo','moveType',m.pokemon_type,TYPES)}${select('Categoría','category',m.category,CATEGORIES)}${select('Damage class','damageClass',m.damage_class,DAMAGE)}${field('Power','power',m.power,'number')}${field('Accuracy','accuracy',m.accuracy,'number')}${field('PP','pp',m.pp,'number')}${field('Priority','priority',m.priority,'number')}</div>${area('Descripción','moveDescription',m.description)}</div><div class="card"><h3>Geometría / ejecución</h3><div class="grid3">${select('Delivery / trayectoria','delivery',m.delivery,DELIVERIES)}${select('Defensa asociada','defenseProfile',m.defense_profile,DEFENSES)}${field('Range','range',m.range)}${field('Target mode','targetMode',m.target_mode)}${check('World enabled','worldEnabled',m.world_enabled)}${check('Line of sight','lineOfSight',m.requirements.line_of_sight)}${check('Ground contact','groundContact',m.requirements.ground_contact)}${check('Requires water','requiresWater',m.requirements.requires_water)}${check('Requires airspace','requiresAirspace',m.requirements.requires_airspace)}${check('Requires target','requiresTarget',m.requirements.requires_target)}</div></div><div class="card"><h3>World Effects</h3><div class="note">Verbos autorizables por el World Engine; no texto narrativo.</div><div class="movegrid">${multiChecks(EFFECTS,m.world_effects,'data-effect')}</div></div><div class="card"><h3>Materiales / blancos compatibles</h3><div class="movegrid">${multiChecks(MATERIALS,m.materials,'data-material')}</div></div><div class="card"><h3>TM / HM</h3><div class="grid3">${select('Machine kind','machineKind',m.machine.kind,['NONE','TM','HM','TUTOR'])}${field('Machine ID','machineId',m.machine.id)}${check('Reusable','machineReusable',m.machine.reusable)}</div><div class="note">TM/HM sólo son fuentes de aprendizaje. La utilidad fuera de combate pertenece al Move Capability.</div></div><div class="card">${area('World rules — JSON','worldRules',j(m.world_rules),'json')}${area('Tags — uno por línea','moveTags',m.tags.join('\n'))}</div>`;
for(const [id,key] of [['moveId','move_id'],['moveName','name'],['moveDescription','description'],['range','range'],['targetMode','target_mode']])set(id,e=>m[key]=e.value);for(const [id,key] of [['power','power'],['accuracy','accuracy'],['pp','pp'],['priority','priority']])set(id,e=>m[key]=+e.value);for(const [id,key] of [['moveType','pokemon_type'],['category','category'],['damageClass','damage_class'],['delivery','delivery'],['defenseProfile','defense_profile']])set(id,e=>m[key]=e.value,'change');set('worldEnabled',e=>m.world_enabled=e.checked,'change');set('lineOfSight',e=>m.requirements.line_of_sight=e.checked,'change');set('groundContact',e=>m.requirements.ground_contact=e.checked,'change');set('requiresWater',e=>m.requirements.requires_water=e.checked,'change');set('requiresAirspace',e=>m.requirements.requires_airspace=e.checked,'change');set('requiresTarget',e=>m.requirements.requires_target=e.checked,'change');set('machineKind',e=>m.machine.kind=e.value,'change');set('machineId',e=>m.machine.id=e.value);set('machineReusable',e=>m.machine.reusable=e.checked,'change');set('worldRules',e=>m.world_rules=JSON.parse(e.value||'[]'),'change');set('moveTags',e=>m.tags=lines(e.value));document.querySelectorAll('[data-effect]').forEach(e=>e.onchange=()=>{let v=e.dataset.effect;m.world_effects=e.checked?[...new Set([...m.world_effects,v])]:m.world_effects.filter(x=>x!==v);save();renderSide()});document.querySelectorAll('[data-material]').forEach(e=>e.onchange=()=>{let v=e.dataset.material;m.materials=e.checked?[...new Set([...m.materials,v])]:m.materials.filter(x=>x!==v);save();renderSide()})}
function renderEditor(){let x=current();if(!x){$('editor').innerHTML='<div class="card empty">Sin selección.</div>';return}mode==='pokemon'?renderPokemon(x):renderMove(x)}
function moveById(id){return state.moves.find(m=>m.move_id===id)}
function pokemonPayload(p){return{...clone(p),resolved_moves:p.known_moves.map(id=>moveById(id)).filter(Boolean).map(m=>({move_id:m.move_id,name:m.name,type:m.pokemon_type,delivery:m.delivery,world_enabled:m.world_enabled,world_effects:m.world_effects,materials:m.materials,requirements:m.requirements,machine:m.machine}))}}
function validate(){let errors=[],ids=new Set();for(const p of state.pokemon){if(!p.species_id)errors.push('Pokémon sin species_id');if(ids.has(p.species_id))errors.push('species_id duplicado: '+p.species_id);ids.add(p.species_id);for(const id of p.known_moves)if(!moveById(id))errors.push(`${p.species_name}: move inexistente ${id}`);for(const row of p.level_up_moves)if(row.move_id&&!moveById(row.move_id))errors.push(`${p.species_name}: level-up move inexistente ${row.move_id}`)}ids=new Set();for(const m of state.moves){if(!m.move_id)errors.push('Move sin move_id');if(ids.has(m.move_id))errors.push('move_id duplicado: '+m.move_id);ids.add(m.move_id);if(m.world_enabled&&!m.world_effects.length&&m.category!=='ATTACK')errors.push(`${m.name}: world_enabled sin world_effects`);if(m.machine.kind!=='NONE'&&!m.machine.id)errors.push(`${m.name}: ${m.machine.kind} sin machine id`)}return errors}
function renderSide(){let x=current();$('payload').textContent=x?j(mode==='pokemon'?pokemonPayload(x):x):'—';if(mode==='pokemon'&&x){let moves=x.known_moves.map(moveById).filter(Boolean);$('capabilities').innerHTML=moves.length?moves.map(m=>`<div><b>${esc(m.name)}</b> · ${esc(m.delivery)}<br><small>${esc(m.world_effects.join(', ')||'sin efecto de mundo')}</small></div><br>`).join(''):'Sin moves conocidos.'}else if(mode==='moves'&&x){$('capabilities').innerHTML=`<b>${esc(x.delivery)}</b><br>${esc(x.world_effects.join(', ')||'sin efectos')}<br><small>Targets: ${esc(x.materials.join(', '))}</small>`}let errs=validate();$('validation').innerHTML=errs.length?`<span class="bad">${errs.map(esc).join('<br>')}</span>`:'<span class="ok">OK</span>'}
$('projectName').oninput=e=>{state.meta.name=e.target.value;save()};$('tabPokemon').onclick=()=>setMode('pokemon');$('tabMoves').onclick=()=>setMode('moves');$('addPokemon').onclick=()=>{let p=freshPokemon(state.pokemon.length+1);state.pokemon.push(p);mode='pokemon';selected=p.editor_id;save();render()};$('addMove').onclick=()=>{let m=freshMove(state.moves.length+1);state.moves.push(m);mode='moves';selected=m.editor_id;save();render()};$('duplicate').onclick=()=>{let x=current();if(!x)return;let y=clone(x);y.editor_id=eid(mode==='pokemon'?'pk':'mv');if(mode==='pokemon'){y.species_id+='_COPY';y.species_name+=' copia';state.pokemon.push(y)}else{y.move_id+='_COPY';y.name+=' copia';state.moves.push(y)}selected=y.editor_id;save();render()};$('delete').onclick=()=>{let list=mode==='pokemon'?state.pokemon:state.moves;if(list.length<=1)return alert('Debe quedar al menos un registro.');let i=list.findIndex(x=>x.editor_id===selected);if(i>=0)list.splice(i,1);selected=list[0].editor_id;save();render()};$('exportBtn').onclick=()=>{let blob=new Blob([j(state)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='pokerol-pokemon-set.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;state=normalize(JSON.parse(await f.text()));if(!state.pokemon.length)state.pokemon.push(freshPokemon(1));if(!state.moves.length)state.moves.push(freshMove(1));mode='pokemon';selected=state.pokemon[0].editor_id;save('Importado');render();e.target.value=''};$('validateBtn').onclick=()=>{let e=validate();alert(e.length?e.join('\n'):'POKEROL Pokémon set válido.');renderSide()};render();
})();
</script>
