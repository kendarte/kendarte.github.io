name: Siza World Combat Consequence Migration

on:
  push:
    paths:
      - '.github/workflows/siza-world-combat-consequence-migration.yml'
      - '.github/scripts/siza-world-combat-consequence-migration.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-world-combat-consequences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate packet authority routing and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/siza-world-combat-consequence-migration.py
