name: Repair 3D portfolio media

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_3d_media.py'
      - '.tmp_portfolio/repair-trigger.txt'

permissions:
  contents: write

jobs:
  repair-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image support
        run: python -m pip install --disable-pip-version-check pillow
      - name: Repair images and video
        run: python scripts/repair_3d_media.py
      - name: Verify generated media
        run: |
          file media/3d/hero.png media/3d/ser-drashton.png media/3d/orange-coat.png media/3d/ai-workflow.png media/3d/ai-animation.mp4
          ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height -of default=noprint_wrappers=1 media/3d/ai-animation.mp4
          grep -q '/media/3d/hero.png?v=0830-mediafix' 3d/index.html
          grep -q '/media/3d/ser-drashton.png?v=0830-mediafix' 3d/index.html
          grep -q '/media/3d/orange-coat.png?v=0830-mediafix' 3d/index.html
          if grep -q 'src="data:image/' 3d/index.html; then echo 'Embedded image source remains'; exit 1; fi
      - name: Commit repaired media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3d/index.html media/3d/hero.png media/3d/ser-drashton.png media/3d/orange-coat.png media/3d/ai-workflow.png media/3d/ai-animation.mp4 media/3d/embedded-*.png
          git diff --cached --quiet && exit 0
          git commit -m "Repair broken 3D portfolio media"
          git push
