name: Siza Generator Handoff Migration

on:
  push:
    paths:
      - '.github/workflows/siza-generator-handoff-migration.yml'

permissions:
  contents: write

jobs:
  migrate-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: npm install --no-save acorn@8 jsdom@24

      - name: Add temporary Generator card catalog to Mobile Test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const acorn=require('acorn');const {JSDOM,VirtualConsole}=require('jsdom');
          const repo=process.env.GH_REPOSITORY,token=process.env.GH_TOKEN,path='siza-mobile-test/index.html',headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};const api=`https://api.github.com/repos/${repo}/contents/${path}`;const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function text(p){const r=await fetch(`https://api.github.com/repos/${repo}/contents/${p}?ref=main`,{headers});if(!r.ok)throw new Error(`${p} GET ${r.status}`);const f=await r.json();return Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8')}
          function parse(html){const so=html.lastIndexOf('<script>'),sc=html.indexOf('</script>',so),start=so+8,code=html.slice(start,sc),ast=acorn.parse(code,{ecmaVersion:'latest'}),decl=[];function walk(n){if(!n||typeof n!=='object')return;if(n.type==='FunctionDeclaration'&&n.id)decl.push(n);for(const[k,v]of Object.entries(n)){if(k==='start'||k==='end')continue;if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object'&&v.type)walk(v)}}walk(ast);return{start,sc,code,decl}}
          function replaceFn(html,name,replacement){const p=parse(html),nodes=p.decl.filter(n=>n.id.name===name);assert(nodes.length===1,`${name} expected 1, got ${nodes.length}`);const n=nodes[0],code=p.code.slice(0,n.start)+replacement+p.code.slice(n.end);return html.slice(0,p.start)+code+html.slice(p.sc)}
          (async()=>{
            const r=await fetch(`${api}?ref=main`,{headers});if(!r.ok)throw new Error(`index GET ${r.status}`);const f=await r.json();let html=Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8');console.log(`Current blob ${f.sha}`);
            const cardById="const cardById=id=>CARD_DB.find(c=>c.id===id);";assert((html.split(cardById).length-1)===1,'cardById anchor mismatch');assert(!html.includes('TEST_CARD_DB_V1'),'Temporary catalog already exists');
            const catalog=`const TEST_CARD_DB_V1=[];\nconst GENERATOR_HANDOFF_KEY_V1='siza_card_generator_handoff_v1';\nconst GENERATOR_DRAFT_KEY_V1='siza_card_generator_draft_v1';\nfunction loadGeneratorHandoffV1(){try{const raw=localStorage.getItem(GENERATOR_HANDOFF_KEY_V1);if(!raw)return null;const payload=JSON.parse(raw);if(payload?.action!=='test-card'||!payload.card)return null;const validation=SizaCardSchema.validateCard(payload.generatorCard||payload.card);if(!validation.valid)return null;const card={...SizaCardSchema.cardToMobileShape(validation.card),generatorTest:true,generatorCard:validation.card};const i=TEST_CARD_DB_V1.findIndex(c=>c.id===card.id);if(i>=0)TEST_CARD_DB_V1[i]=card;else TEST_CARD_DB_V1.push(card);return{payload,card}}catch(e){console.warn('Generator handoff inválido',e);return null}}\nconst generatorHandoffV1=loadGeneratorHandoffV1();\nconst cardById=id=>TEST_CARD_DB_V1.find(c=>c.id===id)||CARD_DB.find(c=>c.id===id);\nfunction allCardsV1(){const ids=new Set(TEST_CARD_DB_V1.map(c=>c.id));return[...CARD_DB.filter(c=>!ids.has(c.id)),...TEST_CARD_DB_V1]}\n`;
            html=html.replace(cardById,catalog);
            const stateAnchor='let state=load();';assert((html.split(stateAnchor).length-1)===1,'state anchor mismatch');html=html.replace(stateAnchor,`let state=load();\napplyGeneratorHandoffV1();`);
            const apply=`function applyGeneratorHandoffV1(){const h=generatorHandoffV1;if(!h?.card)return;const id=h.card.id;if(!state.collection.includes(id))state.collection.push(id);if(h.payload.target==='deck'){const total=Object.values(state.deck.counts||{}).reduce((a,b)=>a+b,0);if(total<60)state.deck.counts[id]=Math.max(1,state.deck.counts[id]||0)}else if(h.payload.target==='hand'&&state.match?.player&&!state.match.player.hand.includes(id))state.match.player.hand.push(id);state.route='collection'}\nfunction editCardInGeneratorV1(id){const c=cardById(id);if(!c)return;const source=c.generatorCard||SizaCardSchema.normalizeCard(c);localStorage.setItem(GENERATOR_DRAFT_KEY_V1,JSON.stringify(source));location.href='../siza-card-generator/?cardId='+encodeURIComponent(id)+'&returnUrl='+encodeURIComponent('../siza-mobile-test/')}\n`;
            const renderAnchor='function render(){';assert(html.includes(renderAnchor),'render anchor missing');html=html.replace(renderAnchor,apply+renderAnchor);
            const collection=`function renderCollection(){let pool=allCardsV1().filter(c=>state.collection.includes(c.id)||c.adventureUnlock);const q=state.search.toLowerCase().trim();if(q)pool=pool.filter(c=>(c.name+' '+c.type+' '+(c.subtype||'')+' '+c.text).toLowerCase().includes(q));if(state.filter!=='all')pool=pool.filter(c=>c.type.toLowerCase()===state.filter);return shell(\`<div class="toolbar"><input class="search" data-search placeholder="Buscar carta, tipo o texto…" value="\${esc(state.search)}">\${['all','creature','instant','artifact','land'].map(f=>\`<button class="filterBtn \${state.filter===f?'active':''}" onclick="SIZA.setFilter('\${f}')">\${f==='all'?'Todas':f}</button>\`).join('')}</div><div class="cardsGrid">\${pool.map(c=>{const unlocked=state.collection.includes(c.id),actions=unlocked?\`<button class="btn ghost small" onclick="SIZA.editCardInGeneratorV1('\${c.id}')">Editar en Card Generator</button>\`:'';return cardHtml(c,{locked:!unlocked,actions})}).join('')}</div>\`, 'Collection','Siza · Persistent Memory',\`<span class="chip good">\${state.collection.length} desbloqueadas</span>\`)}`;
            html=replaceFn(html,'renderCollection',collection);
            const deck=`function renderDeck(){const owned=allCardsV1().filter(c=>state.collection.includes(c.id));const rows=Object.entries(state.deck.counts).filter(([,n])=>n>0&&cardById(n==null?'':arguments[0])!==null).sort((a,b)=>(cardById(a[0])?.cost||0)-(cardById(b[0])?.cost||0)).map(([id,n])=>{const c=cardById(id);if(!c)return'';const ai=affinityInfo(c);return \`<div class="deckRow"><div><div class="name">\${esc(c.name)}</div><div class="meta">\${c.type} · D\${c.difficulty??'—'}\${ai.unsupported.length?' · Sin afinidad':ai.penalty?' · Afinidad exigente':\` · Éxito natural \${naturalChance(c)}%\`}</div></div><button class="roundBtn" onclick="SIZA.deckDelta('\${id}',-1)">−</button><div class="deckCount">\${n}</div></div>\`}).join('');const valid=totalDeck()===60;const warns=Object.entries(state.deck.counts).filter(([id,n])=>n&&cardById(id)&&affinityInfo(cardById(id)).penalty>0).reduce((a,[,n])=>a+n,0);const curve=[0,1,2,3,4,5,6,7].map(v=>Object.entries(state.deck.counts).reduce((s,[id,n])=>{const c=cardById(id);return s+(c&&c.type!=='Land'&&Math.min(7,c.cost)===v?n:0)},0));const max=Math.max(1,...curve);return shell(\`<div class="deckLayout"><section><div class="toolbar"><input class="search" data-search placeholder="Filtrar colección…" value="\${esc(state.search)}"><span class="chip">\${state.player.mag.name} · Azul \${state.player.mag.aff.U} / Rojo \${state.player.mag.aff.R}</span></div><div class="cardsGrid">\${owned.filter(c=>!state.search||c.name.toLowerCase().includes(state.search.toLowerCase())).map(c=>cardHtml(c,{actions:\`<button class="btn secondary small" onclick="SIZA.deckDelta('\${c.id}',1)">+ Añadir</button>\`})).join('')}</div></section><aside class="panel deckSide"><div class="panelHeader"><h3>\${esc(state.deck.name)}</h3><span class="chip \${valid?'good':'bad'}">\${totalDeck()}/60</span></div><div class="deckSummary"><div class="deckStats"><div class="deckStat"><span>Cartas</span><b>\${totalDeck()}</b></div><div class="deckStat"><span>Reservas</span><b>\${landCount()}</b></div><div class="deckStat"><span>Afinidad exigente</span><b>\${warns}</b></div></div></div><div class="curve">\${curve.map((n,i)=>\`<div class="curveCol"><div class="curveBar" style="height:\${Math.round(n/max*56)}px"></div>\${i===7?'7+':i}</div>\`).join('')}</div>\${warns?\`<div class="warning">\${warns} cartas piden más profundidad de afinidad que la actual. La dificultad impresa no cambia; la interfaz lo muestra como información de construcción.</div>\`:''}\${!valid?\`<div class="warning error">El formato requiere exactamente 60 cartas.</div>\`:''}<div class="deckRows">\${rows}</div><div style="padding:12px;display:flex;gap:7px">\${btn('Practice Match','SIZA.startPractice()','',!valid)}\${btn('Reset deck','SIZA.resetDeck()','ghost')}</div></aside></div>\`, 'Deck Builder','Siza · Construction & Affinity',\`<span class="chip">Format · \${state.deck.format}</span>\`)}`;
            html=replaceFn(html,'renderDeck',deck);
            const exportAnchor='window.SIZA={nav,';assert((html.split(exportAnchor).length-1)===1,'SIZA export anchor mismatch');html=html.replace(exportAnchor,'window.SIZA={nav,editCardInGeneratorV1,');

            const schema=await text('siza-core/card-schema.js'),renderer=await text('siza-core/card-renderer.js');let testHtml=html.replace('<script src="../siza-core/card-schema.js"></script>',`<script>${schema}</script>`).replace('<script src="../siza-core/card-renderer.js"></script>',`<script>${renderer}</script>`);const marker='window.SIZA={';testHtml=testHtml.replace(marker,`window.__HANDOFF_TEST__={getState:()=>state,cardById,allCardsV1,renderCollection,CARD_DB,TEST_CARD_DB_V1};\n`+marker);
            const payload={action:'test-card',target:'collection',card:{id:'generator_probe',name:'Carta Generator Probe',type:'Creature',subtype:'Test',cost:2,difficulty:6,pips:{U:1},power:2,toughness:3,text:'Carta temporal de prueba.',flavor:'No pertenece al catálogo oficial.',art:'blue',glyph:'P',artUrl:'../assets/cards/art/probe.webp',artTransform:{x:43,y:31,scale:1.1}},generatorCard:{id:'generator_probe',name:'Carta Generator Probe',cardType:'Creature',subtype:'Test',affinity:'azul',cost:2,difficulty:6,pips:{U:1},force:2,resistance:3,rules:'Carta temporal de prueba.',flavor:'No pertenece al catálogo oficial.',artUrl:'../assets/cards/art/probe.webp',artTransform:{x:43,y:31,scale:1.1}}};
            const vc=new VirtualConsole();vc.on('jsdomError',e=>console.error('[JSDOM]',e.message));const dom=new JSDOM(testHtml,{runScripts:'dangerously',url:'https://siza.local/siza-mobile-test/',virtualConsole:vc,beforeParse(w){w.localStorage.setItem('siza_card_generator_handoff_v1',JSON.stringify(payload))}});dom.window.setTimeout=()=>0;const H=dom.window.__HANDOFF_TEST__,S=H.getState(),c=H.cardById('generator_probe');
            assert(H.CARD_DB.length===13,'Official CARD_DB mutated');assert(H.TEST_CARD_DB_V1.length===1&&c?.generatorTest,'Temporary card not loaded');assert(S.collection.includes('generator_probe')&&S.route==='collection','Handoff not applied to Collection');const col=H.renderCollection();assert(col.includes('Carta Generator Probe')&&col.includes('Editar en Card Generator')&&col.includes('probe.webp'),'Collection does not render Generator card');const core=dom.window.SIZA.runArenaCriticalV071();assert(core.passed===core.total,`Arena ${core.passed}/${core.total}`);console.log('PASS Generator handoff 5/5');console.log(`Arena ${core.passed}/${core.total}`);dom.window.close();
            const w=await fetch(api,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Connect Card Generator handoff to Mobile Test',content:Buffer.from(html,'utf8').toString('base64'),sha:f.sha,branch:'main'})});if(!w.ok)throw new Error(`PUT ${w.status}: ${await w.text()}`);const out=await w.json();console.log(`COMMIT ${out.commit.sha}`);
          })().catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE