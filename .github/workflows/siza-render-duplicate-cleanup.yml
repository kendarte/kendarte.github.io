name: Siza Render Duplicate Cleanup

on:
  push:
    paths:
      - '.github/workflows/siza-render-duplicate-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-render:
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save acorn@8 jsdom@24
      - name: Fetch exact cleanup script
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const repo=process.env.GH_REPOSITORY,sha=process.env.GH_SHA,token=process.env.GH_TOKEN;
          const path='.github/scripts/siza-render-duplicate-cleanup.js';
          const headers={'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${sha}`,{headers}).then(async r=>{
            if(!r.ok)throw new Error(`GET ${r.status}: ${await r.text()}`);
            const f=await r.json();fs.mkdirSync('.github/scripts',{recursive:true});fs.writeFileSync(path,Buffer.from(f.content.replace(/\n/g,''),'base64').toString('utf8'));console.log(`Fetched ${f.sha}`);
          }).catch(e=>{console.error(e.stack||e.message);process.exit(1)});
          NODE
      - name: Correct canonical removal fixture
        run: |
          node <<'NODE'
          const fs=require('fs'),path='.github/scripts/siza-render-duplicate-cleanup.js';let s=fs.readFileSync(path,'utf8');
          const old=`assert(ra.id==='servitor'&&ra.hand[0]==='servitor'&&ra.graveyard.length===0&&ra.battlefield[0]==='ignimite'&&ra.power[0]===2&&ra.exhausted[0]===0&&ra.equipment[0].target===0&&ra.ui.fieldFocus.index===0,'Canonical battlefield removal contract unexpected')`;
          const next=`assert(ra.id==='servitor'&&ra.hand[0]==='servitor'&&ra.graveyard.length===0&&ra.battlefield[0]==='ignimite'&&ra.power[0]===2&&ra.exhausted[0]===0&&ra.equipment[0].target===0&&ra.ui.fieldFocus.index===1&&ra.ui.creature===0&&JSON.stringify(ra.ui.attackers)==='[0,1]','Canonical battlefield removal contract unexpected')`;
          if(!s.includes(old))throw new Error('Removal fixture anchor missing');fs.writeFileSync(path,s.replace(old,next));
          NODE
      - name: Run guarded duplicate cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/siza-render-duplicate-cleanup.js
