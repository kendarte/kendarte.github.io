.matchShell{min-height:calc(100vh - 110px);display:grid;grid-template-rows:auto 1fr auto;gap:10px}.matchHeader{display:flex;justify-content:space-between;align-items:center}.fighter{display:flex;align-items:center;gap:10px}.fighterAvatar{width:42px;height:42px;border:1px solid #3d617e;border-radius:10px;overflow:hidden;background:#0e2234}.fighterAvatar img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}.fighterName{font-family:Georgia,serif;font-size:14px}.fighterMeta{font-size:9px;color:#7089a1;margin-top:2px}.life{min-width:58px;padding:8px 10px;border:1px solid #633d44;border-radius:10px;background:#21151a;color:#ff9a9f;text-align:center;font-family:Georgia,serif;font-size:20px}.board{border:1px solid #284259;border-radius:18px;overflow:hidden;background:radial-gradient(circle at center,#13344d 0,#0a1b2c 47%,#07121d 100%);position:relative;min-height:590px;box-shadow:var(--shadow)}.board:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(217,181,109,.25);box-shadow:0 0 20px rgba(217,181,109,.08)}.boardWatermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:82px;height:82px;border:1px solid rgba(217,181,109,.16);display:grid;place-items:center}.boardWatermark span{transform:rotate(-45deg);font-family:Georgia,serif;color:rgba(217,181,109,.18);font-size:30px}.zone{position:relative;z-index:2;min-height:275px;padding:14px 18px;display:grid;grid-template-columns:160px 1fr 210px;gap:14px;align-items:center}.magZone{height:210px;border:1px solid #31526c;background:rgba(5,15,25,.72);border-radius:13px;position:relative;overflow:hidden}.magZone img{position:absolute;height:120%;left:50%;bottom:-35%;transform:translateX(-50%);filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}.magZone .magInfo{position:absolute;inset:auto 8px 8px;background:rgba(5,14,23,.86);border:1px solid #314c63;border-radius:8px;padding:7px}.magZone .magInfo b{font-family:Georgia,serif;font-size:11px}.magZone .magIn function navBtn(r,label){return `<button class="navBtn ${state.route===r?'active':''}" onclick="SIZA.nav('${r}')"><span class="navIcon">${icon(r)}</span><span>${label}</span></button>`}
function btn(label,action,kind='',disabled=false){return `<button class="btn ${kind}" ${disabled?'disabled':''} onclick="${action}">${label}</button>`}
function toast(msg,kind=''){const id=Date.now()+Math.random();state.toasts=[{id,msg,kind}];renderToasts();setTimeout(()=>{state.toasts=state.toasts.filter(t=>t.id!==id);renderToasts()},2600)}
function renderToasts(){document.querySelectorAll('.toast').forEach(x=>x.remove());for(const t of state.toasts){const d=document.createElement('div');d.className='toast '+t.kind;d.textContent=t.msg;document.body.appendChild(d)}}
function totalDeck(){return Object.values(state.deck.counts).reduce((a,b)=>a+b,0)}
function landCount(){return Object.entries(state.deck.counts).reduce((n,[id,c])=>n+(cardById(id)?.type==='Land'?c:0),0)}
function affinityInfo(c,m=state.player.mag){let penalty=0,unsupported=[];for(const [k,v] of Object.entries(c.pips||{})){if(v<=0)continue;const a=m.aff[k]||0;if(a===0)unsupported.push(k);else if(v>a)penalty+=v-a}return {penalty,unsupported}}
function dcFor(c,m=state.player.mag){const ai=affinityInfo(c,m);if(ai.unsupported.length)return Infinity;const base=4+Math.ceil((c.cost+1)/2);return base+ai.penalty}
function naturalChance(c,m=state.player.mag){if(c.type==='Land')return 100;const dc=dcFor(c,m);if(!isFinite(dc))return 0;const need=dc-m.mf;if(need<=1)return 100;if(need>6)return 0;return Math.round((7-need)/6*100)}
function manifestRequirement(c,m=state.player.mag){const dc=dcFor(c,m);if(!isFinite(dc))return {unsupported:true,text:'SIN AFINIDAD',die:0,minBurn:0};const raw=dc-m.mf,minBurn=Math.max(0,raw-6),die=Math.max(1,Math.min(6,raw));return {unsupported:false,die,minBurn,text:minBurn?`${die}+ · Burn mínimo ${minBurn}`:`${die}+`}}
function manaHtml(c){let out='';const generic=Math.max(0,c.cost-Object.values(c.pips||{}).reduce((a,b)=>a+b,0));if(generic)out+=`<span class="mana c">${generic}</span>`;for(const [k,v] of Object.entries(c.pips||{}))for(let i=0;i<v;i++)out+=`<span class="mana ${k.toLowerCase()}">${k}</span>`;return out||'<span class="mana c">0</span>'}
function finalRulesFixV510(c,mini=false){
 if(c.id==='spark') return `<div class="finalRulesFixV510 sparkFixV510 ${mini?'mini':''}">Inflige 2 de daño al Personaje rival.</div>`;
 if(c.id==='smuggler') return `<div class="finalRulesFixV510 smugglerFixV510 ${mini?'mini':''}">Siempre que ataque, inflige 1 de daño adicional al Personaje defensor.</div>`;
 return '';
}
function cardHtml(c,opts={}){
 const locked=opts.locked;
 if(c.finalCardImage){
   return `<article class="sizaCard finalPrintedCardV59 finalCardV510"><img class="finalPrintedImageV59" src="${c.finalCardImage}" alt="${esc(c.name)}" draggable="false">${opts.actions?`<div class="cardFooterActions">${opts.actions}</div>`:''}${locked?`<div class="lockedOverlay"><div><b>Memoria no manifestada</b>Completa el Final Event del Muelle Viejo.</div></div>`:''}</article>`
 }
 const req=manifestRequirement(c),risk=req.text;
 return `<article class="sizaCard ${c.art||''}"><div class="cardRisk">${risk}</div><div class="cardInner"><div class="cardName"><span>${esc(c.name)}</span><span class="manaCost">${manaHtml(c)}</span></div><div class="cardArt ${c.art||''}"><span class="artGlyph">${c.glyph||'✦'}</span><span class="artLabel">${esc(c.subtype||c.type)}</span></div><div class="typeLine">${esc(c.type)}${c.subtype?' — '+esc(c.subtype):''}</div><div class="rulesBox">${esc(c.text)}<div class="flavor">${esc(c.flavor||'')}</div></div>${c.power!=null?`<div class="pt">${c.power}/${c.toughness}</div>`:''}</div>${opts.actions?`<div class="cardFooterActions">${opts.actions}</div>`:''}${locked?`<div class="lockedOverlay"><div><b>Memoria no manifestada</b>Completa el Final Event del Muelle Viejo.</div></div>`:''}</article>`
}
function render(){try{let html='';if(state.route==='hub')html=renderHub();else if(state.route==='adventure')html=renderAdventure();else if(state.route==='collection')html=renderCollection();else if(state.route==='deck')html=renderDeck();else if(state.route==='match')html=renderMatch();else html=renderHub();app.innerHTML=html;bind();renderModal();renderToasts();}catch(err){console.error(err);app.innerHTML=`<div style="padding:40px;color:white"><h1>Siza Web</h1><p>El runtime encontró un error, pero la interfaz base sigue disponible.</p><pre style="white-space:pre-wrap;color:#ffadb5">${esc(err.stack||err.message)}</pre><button onclick="localStorage.clear();location.reload()">Reiniciar estado local</button></div>`}}
function bind(){document.querySelectorAll('[data-search]').forEach(el=>el.addEventListener('input',e=>{state.search=e.target.value;render()}))}

rds → State → Advance → Final Event.</p></div><div class="quickLink" onclick="SIZA.nav('adventure')">Entrar al Muelle →</div></section><section class="panel quickCard"><div><h4>Collection</h4><p>Las memorias obtenidas durante Adventure alimentan el mismo inventario utilizado por Siza.</p></div><div class="quickLink" onclick="SIZA.nav('collection')">Revisar cartas →</div></section><section class="panel quickCard"><div><h4>Siza Runtime</h4><p>Manafestation + d6, Mana Burn, afinidad, criaturas, Lands y plano físico en un match ejecutable.</p></div><div class="quickLink" onclick="SIZA.startPractice()">Iniciar prueba →</div></section></div>`, 'Command Hub','Siza Web · Work Prototype',`<span class="chip">Build ${VERSION}</span>`)}
const EVENTS=[
{id:'fisherman',priority:3,title:'El pescador que no habla',lead:'El anciano está empapado, pero no parece haber salido del agua.',text:'Cuando mencionas a los desaparecidos, mira hacia el faro. Sus labios se mueven sin producir sonido. Tiene sal incrustada bajo las uñas.',requires:a=>!a.flags.fishermanResolved,choices:[{label:'Leer sus gestos',hint:'PER check',action:()=>adventureCheck('PER',5,'fishermanResolved','El pescador dibuja con el dedo tres círculos y señala hacia abajo.','El anciano se aparta. Algo en tu insistencia lo ha asustado.')},{label:'Seguir su mirada',hint:'Advance seguro',action:()=>resolveAdventure('fishermanResolved',1,'El pescador no habló, pero dejó claro que el faro importa.')}],clue:'El pescador mudo señaló hacia el faro.'},

{id:'smugglers',priority:5,title:'La segunda aduana',lead:'Tres hombres bloquean la escalera inferior. El del centro lleva una baraja atada al antebrazo.',text:'“Hasta aquí llega la curiosidad”, dice. Detrás de ellos, una cadena húmeda desaparece bajo el muelle.',requires:a=>a.advance>=2&&!a.flags.smugglersResolved,choices:[{label:'Desafiar al Magistócrata',hint:'Siza Encounter',action:()=>startAdventureDuel()},{label:'Abrirte paso',hint:'PROW vs EVA',action:()=>adventurePhysical('smugglersResolved','Golpeas primero y el grupo pierde formación. Bajo la escalera encuentras una cuerda cubierta de escamas.','El contrabandista anticipa el golpe. Te obligan a volver al muelle superior.')}],clue:'Los contrabandistas estaban protegiendo la escalera inferior.'},

function chooseAdventureEvent(){const a=state.adventure;if(a.advance>=5&&!a.finalDone){a.currentEvent='final';return}const eligible=EVENTS.filter(e=>e.requires(a)).sort((x,y)=>y.priority-x.priority);a.currentEvent=(eligible[0]||{id:'ambient'}).id}
function currentAdventureEvent(){if(!state.adventure.currentEvent)chooseAdventureEvent();if(state.adventure.currentEvent==='final')return {id:'final',title:'Final Event — La Reina Ahogada',lead:'La corona aparece primero. Después los ojos.',text:'La figura se levanta del trono sumergido y el agua parece olvidar que debería caer. No te ataca. Extiende una mano abierta: una memoria demasiado grande para caber en una sola imagen.',choices:[{label:'Aceptar la memoria',hint:'Unlock Card',action:finishAdventure},{label:'Romper el vínculo',hint:'Resolución alternativa',action:()=>{state.adventure.finalDone=true;state.adventure.landState='quiet';journal('Final Event','Rompiste el vínculo con la Reina Ahogada. El Muelle quedó en silencio.');save();chooseAdventureEvent();render();toast('Tierra resuelta sin capturar la memoria.','gold')}}]};return EVENTS.find(e=>e.id===state.adventure.currentEvent)||{id:'ambient',title:'Muelle Viejo',lead:'La marea golpea los pilotes.',text:'El Master no encuentra un evento forzado. Queda contenido ambiental disponible.',choices:[{label:'Reevaluar Event Pool',hint:'Master',action:()=>{chooseAdventureEvent();render()}}]}}
function renderAdventure(){const a=state.adventure,e=currentAdventureEvent();const clues=EVENTS.map(x=>({text:x.clue,found:!!a.flags[x.id+'Resolved']}));return shell(`<div class="adventureGrid"><section class="panel scenePanel"><div class="sceneVisual"><div class="dockShapes"><i class="house2"></i><i class="house1"></i><i class="tower"></i><div class="waterline"></div></div><div class="sceneLabel"><div class="eyebrow">Puerto de Salmuera · ${esc(a.landState)}</div><h2>${esc(e.title)}</h2></div></div><div class="storyBlock"><p class="lead">${esc(e.lead)}</p><p>${esc(e.text)}</p></div><div class="choices">${e.choices.map((c,i)=>`<button class="choiceBtn" onclick="SIZA.adventureChoice(${i})"><span>${esc(c.label)}</span><span>${esc(c.hint||'')}</span></button>`).join('')}</div></section><div class="stackCol"><section class="panel objectiveBox"><div class="eyebrow">Objective</div><h3>Los desaparecidos del puerto</h3><p>Descubre qué está ocurriendo bajo el Muelle Viejo. El Advance desbloquea el clímax; no completa la Tierra automáticamente.</p><div class="progress"><span style="width:${Math.min(100,a.advance/5*100)}%"></span></div><div class="chip gold">${a.advance}/5 Advance</div><div class="clues">${clues.map(c=>`<div class="clue ${c.found?'found':''}">${c.found?'◆':'◇'} ${esc(c.text)}</div>`).join('')}</div></section><section class="panel masterPulse"><div class="eyebrow">Master Pulse</div><div class="pulseRow"><span>Land State</span><b>${esc(a.landState)}</b></div><div class="pulseRow"><span>Event Priority</span><b>${e.id==='final'?'FORCED':'REACTIVE'}</b></div><div class="pulseRow"><span>Eligible Pool</span><b>${EVENTS.filter(x=>x.requires(a)).length}</b></div><div class="pulseRow"><span>Flags</span><b>${Object.keys(a.flags).filter(k=>a.flags[k]).length}</b></div></section><section class="panel pad"><div class="eyebrow">Journal</div><div class="journalList">${a.journal.length?a.journal.slice().reverse().map(j=>`<div class="journalItem"><b>${esc(j.title)}</b>${esc(j.text)}</div>`).join(''):'<div class="muted" style="font-size:10px;margin-top:10px">Aún no hay entradas.</div>'}</div></section></div></div>`, 'Muelle Viejo','Adventure Engine · GOT Ascent / ZMud',`<span class="chip gold">Objective ${a.advance}/5</span>`)}
function adventureChoice(i){const e=currentAdventureEvent();const c=e.choices[i];if(c)c.action()}
function journal(title,text){state.adventure.journal.push({title,text,at:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})})}
function resolveAdventure(flag,advance,text){state.adventure.flags[flag]=true;state.adventure.advance=Math.min(5,state.adventure.advance+advance);journal('Discovery',text);state.adventure.currentEvent=null;chooseAdventureEvent();save();render();toast(`${advance?`Advance +${advance} · `:''}${text}`,'gold')}
function adventureCheck(stat,dc,flag,successText,failText){const base=stat==='PER'?2:2,roll=d6(),total=base+roll;if(total>=dc)resolveAdventure(flag,1,`${successText} (${stat} ${base}+${roll}=${total})`);else{state.adventure.flags[flag]=true;state.adventure.advance=Math.min(5,state.adventure.advance+1);journal('Consequence',`${failText} Aun así, la consecuencia revela información útil. (${stat} ${base}+${roll}=${total})`);state.adventure.currentEvent=null;chooseAdventureEvent();save();render();toast(`Fallo ${stat}: ${total} vs ${dc}. La consecuencia también genera +1 Advance.`,'bad')}}
function adventurePhysical(flag,successText,failText){const a=state.player.mag.prow+d6(),b=2+d6();if(a>b)resolveAdventure(flag,1,`${successText} (PROW ${a} vs EVA ${b})`);else{state.adventure.flags[flag]=true;state.adventure.advance=Math.min(5,state.adventure.advance+1);journal('Consequence',`${failText} El fracaso abre otra pista. (PROW ${a} vs EVA ${b})`);state.adventure.currentEvent=null;chooseAdventureEvent();save();render();toast(`Choque físico perdido: ${a} vs ${b}. Consecuencia +1 Advance.`,'bad')}}
function adventureManifestCheck(flag){const m=state.player.mag,dc=8,roll=d6(),total=m.mf+roll;if(total>=dc)resolveAdventure(flag,1,`La luz cruza el agua y revela el trono. (MF ${m.mf}+${roll}=${total})`);else{journal('Manafestation fallida',`La luz no logra cruzar la marea. MF ${m.mf}+${roll}=${total} vs ${dc}.`);state.adventure.currentEvent=null;save();chooseAdventureEvent();render();toast('La Manafestation falló; el evento sigue avanzando por otra ruta.','bad')}}
function finishAdventure(){state.adventure.finalDone=true;state.adventure.landState='awakened';state.adventure.flags.queenMemory=true;if(!state.collection.includes('queen'))state.collection.push('queen');journal('Objective Resolved','Aceptaste la Memoria de la Reina Ahogada. La carta fue añadida a Collection.');state.adventure.currentEvent=null;save();render();toast('Memoria desbloqueada: Reina Ahogada.','gold')}
function renderCollection(){let pool=CARD_DB.filter(c=>state.collection.includes(c.id)||c.adventureUnlock);const q=state.search.toLowerCase().trim();if(q)pool=pool.filter(c=>(c.name+' '+c.type+' '+(c.subtype||'')+' '+c.text).toLowerCase().includes(q));if(state.filter!=='all')pool=pool.filter(c=>c.type.toLowerCase()===state.filter);return shell(`<div class="toolbar"><input class="search" data-search placeholder="Buscar carta, tipo o texto…" value="${esc(state.search)}">${['all','creature','instant','artifact','land'].map(f=>`<button class="filterBtn ${state.filter===f?'active':''}" onclick="SIZA.setFilter('${f}')">${f==='all'?'Todas':f}</button>`).join('')}</div><div class="cardsGrid">${pool.map(c=>cardHtml(c,{locked:!state.collection.includes(c.id)})).join('')}</div>`, 'Collection','Siza · Persistent Memory',`<span class="chip good">${state.collection.length} desbloqueadas</span>`)}
function setFilter(f){state.filter=f;render()}
function renderDeck(){const owned=CARD_DB.filter(c=>state.collection.includes(c.id));const rows=Object.entries(state.deck.counts).filter(([,n])=>n>0).sort((a,b)=>cardById(a[0]).cost-cardById(b[0]).cost).map(([id,n])=>{const c=cardById(id),ai=affinityInfo(c);return `<div class="deckRow"><div><div class="name">${esc(c.name)}</div><div class="meta">${c.type} · C${c.cost}${ai.unsupported.length?' · Sin afinidad':ai.penalty?` · +${ai.penalty} DC`:` · MF ${naturalChance(c)}%`}</div></div><button class="roundBtn" onclick="SIZA.deckDelta('${id}',-1)">−</button><div class="deckCount">${n}</div></div>`}).join('');const valid=totalDeck()===60;const warns=Object.entries(state.deck.counts).filter(([id,n])=>n&&affinityInfo(cardById(id)).penalty>0).reduce((a,[,n])=>a+n,0);const curve=[0,1,2,3,4,5,6,7].map(v=>Object.entries(state.deck.counts).reduce((s,[id,n])=>s+(cardById(id).type!=='Land'&&Math.min(7,cardById(id).cost)===v?n:0),0));const max=Math.max(1,...curve);return shell(`<div class="deckLayout"><section><div class="toolbar"><input class="search" data-search placeholder="Filtrar colección…" value="${esc(state.search)}"><span class="chip">${state.player.mag.name} · Azul ${state.player.mag.aff.U} / Rojo ${state.player.mag.aff.R}</span></div><div class="cardsGrid">${owned.filter(c=>!state.search||c.name.toLowerCase().includes(state.search.toLowerCase())).map(c=>cardHtml(c,{actions:`<button class="btn secondary small" onclick="SIZA.deckDelta('${c.id}',1)">+ Añadir</button>`})).join('')}</div></section><aside class="panel deckSide"><div class="panelHeader"><h3>${esc(state.deck.name)}</h3><span class="chip ${valid?'good':'bad'}">${totalDeck()}/60</span></div><div class="deckSummary"><div class="deckStats"><div class="deckStat"><span>Cartas</span><b>${totalDeck()}</b></div><div class="deckStat"><span>Lands</span><b>${landCount()}</b></div><div class="deckStat"><span>Strained</span><b>${warns}</b></div></div></div><div class="curve">${curve.map((n,i)=>`<div class="curveCol"><div class="curveBar" style="height:${Math.round(n/max*56)}px"></div>${i===7?'7+':i}</div>`).join('')}</div>${warns?`<div class="warning">${warns} cartas exceden la profundidad de afinidad actual. Siguen siendo manifestables, pero reciben penalización de DC.</div>`:''}${!valid?`<div class="warning error">El formato requiere exactamente 60 cartas.</div>`:''}<div class="deckRows">${rows}</div><div style="padding:12px;display:flex;gap:7px">${btn('Practice Match','SIZA.startPractice()','',!valid)}${btn('Reset deck','SIZA.resetDeck()','ghost')}</div></aside></div>`, 'Deck Builder','Siza · Construction & Affinity',`<span class="chip">Format · ${state.deck.format}</span>`)}
function deckDelta(id,delta){const c=cardById(id),cur=state.deck.counts[id]||0;if(delta>0){if(totalDeck()>=60)return toast('El deck ya tiene 60 cartas.','bad');if(c.type!=='Land'&&cur>=4)return toast('Máximo 4 copias en Siza Core 60.','bad');if(!state.collection.includes(id))return toast('Esa carta no está en tu Collection.','bad')}state.deck.counts[id]=Math.max(0,cur+delta);save();render()}
function resetDeck(){state.deck=starterDeck();save();render();toast('Deck restaurado.','gold')}
function makeLibrary(){const arr=[];for(const [id,n] of Object.entries(state.deck.counts))for(let i=0;i<n;i++)arr.push(id);return shuffle(arr)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function d6(){return 1+Math.floor(Math.random()*6)}
function createMatch(adventure=false){
 const l1=makeLibrary(),l2=makeLibrary();
 const player={life:20,hand:l1.splice(0,7),library:l1,battlefield:[],graveyard:[],exile:[],landPlayed:false,proactiveOpen:true,successful:false,mf:state.player.mag.mf,prow:state.player.mag.prow,eva:state.player.mag.eva,aff:{...state.player.mag.aff},manifestSuccesses:0,physicalUsed:false};
 const enemy={life:20,hand:l2.splice(0,7),library:l2,battlefield:[],graveyard:[],exile:[],landPlayed:false,proactiveOpen:true,successful:false,mf:2,prow:2,eva:2,aff:{U:2,R:1,G:0},manifestSuccesses:0};
 function forceCard(side,id){if(side.hand.includes(id))return;const li=side.library.indexOf(id);if(li<0)return;let hi=side.hand.findIndex(x=>cardById(x)?.type!=='Land');if(hi<0)hi=side.hand.length-1;const old=side.hand[hi];side.hand[hi]=id;side.library[li]=old}
 function ensureLands(side,count,protectedId){let have=side.hand.filter(id=>cardById(id)?.type==='Land').length;while(have<count){const li=side.library.findIndex(id=>cardById(id)?.type==='Land');const hi=side.hand.findIndex(id=>cardById(id)?.type!=='Land'&&id!==protectedId);if(li<0||hi<0)break;const old=side.hand[hi];side.hand[hi]=side.library[li];side.library[li]=old;have++}}
 if(!adventure){forceCard(player,'counter');ensureLands(player,4,'counter');forceCard(enemy,'spark');ensureLands(enemy,3,'spark')}
 return {id:'match_'+Date.now(),turn:1,phase:'Main',active:'player',player,enemy,stack:[],log:[{t:'Match',m:adventure?'Adventure duel started.':'Practice match started. El rival tiene una jugada temprana y tu mano incluye una respuesta para probar Instants.'}],pending:null,responseWindow:null,enemyStage:null,adventure,over:false,winner:null}
}
function startPractice(){if(totalDeck()!==60){state.route='deck';render();return toast('Completa primero un deck de 60 cartas.','bad')}state.match=createMatch(false);state.route='match';save();render()}
function startAdventureDuel(){if(totalDeck()!==60){toast('El Adventure Encounter usará el deck inicial restaurado para la demo.','gold');state.deck=starterDeck()}state.match=createMatch(true);state.match.enemy.life=12;state.match.log.unshift({t:'Story',m:'El Contrabandista Carmesí abre su baraja.'});state.route='match';save();render()}

 }

}
function handCardHtml(id,idx){const c=cardById(id),sel=state.match?.ui?.hand===idx;const angle=(idx-(state.match.player.hand.length-1)/2)*1.8;return `<div class="handCardV5 ${sel?'selected':''}" style="transform:rotate(${angle}deg);z-index:${sel?35:idx+2}">${cardHtml(c)}<button class="handCardButton" title="${esc(c.name)}" onclick="SIZA.selectHand(${idx})"></button></div>`}
function matchCardFocus(){const M=state.match;if(!M||M.ui?.hand==null||M.ui.hand<0)return'';const P=M.player,idx=M.ui.hand,c=cardById(P.hand[idx]);if(!c)return'';const isLand=c.type==='Land',reactive=M.active==='response'&&!!M.responseWindow;let action='';if(isLand){action=`<div class="burnOnlyNoteV5"><b>LAND · RESERVA DE BURN</b><span>No se juega. Se consume sólo después de fallar una tirada de Manafestation.</span></div>`}else if(reactive){if(M.responseWindow.used){action=`<div class="reactiveOnlyV53"><b>RESPUESTA YA COMPROMETIDA</b><span>Resuelve el Stack para continuar.</span></div>`}else if(c.type==='Instant'){const req=manifestRequirement(c,{aff:P.aff,mf:P.mf});action=`<div class="manifestNeedV511"><b>Tirada ${req.text}</b><span>Respuesta reactiva.</span></div>`+btn('Responder',`SIZA.playSelectedHand()`)}else{action=`<div class="reactiveOnlyV53"><b>VENTANA REACTIVA</b><span>Sólo puedes Manafestar Instants mientras el spell rival está en el Stack.</span></div>`}}else if(M.active==='player'){const req=manifestRequirement(c,{aff:P.aff,mf:P.mf});action=`<div class="manifestNeedV511"><b>Tirada ${req.text}</b><span>Si fallas, Burn cubre la diferencia.</span></div>`+btn('Manifestar',`SIZA.playSelectedHand()`,'',M.over)}else{action=`<div class="reactiveOnlyV53"><b>TURNO DEL RIVAL</b><span>Espera una ventana de respuesta para usar Instants.</span></div>`}return `<div class="cardFocusV5 ${c.finalCardImage?'finalCardFocusV59':''}">${cardHtml(c)}<div class="cardFocusActions">${action}${btn('Cerrar','SIZA.selectHand(-1)','ghost')}</div></div>`}
function manifestInlineHtml(){const M=state.match,m=state.modal;if(!M||!m||m.type!=='manifest')return'';const P=M[m.owner],landCards=P.hand.map((id,i)=>({id,i,c:cardById(id)})).filter(x=>x.c&&x.c.type==='Land'&&x.i!==m.idx),lands=landCards.length;const rolled=m.roll!=null;const deficit=rolled?Math.max(0,m.dc-(P.mf+m.roll)):0;const enemyAI=m.owner==='enemy'&&m.ai;const rawNeed=m.dc-P.mf;const minBurn=Math.max(0,rawNeed-6);const dieNeed=Math.max(1,Math.min(6,rawNeed));let info=minBurn>0?`<div class="mfLine">Necesitas ${dieNeed}+ y ${minBurn} Burn mínimo</div><div class="mfSub">${enemyAI?'Rival · ':''}Carta comprometida</div><div class="mfStatus">Tirando d6…</div>`:`<div class="mfLine">Necesitas ${dieNeed}+</div><div class="mfSub">${enemyAI?'Rival · ':''}Carta comprometida</div><div class="mfStatus">Tirando d6…</div>`;let actions='';if(rolled){if(deficit===0){info=`<div class="mfLine">Sacaste ${m.roll}</div><div class="mfStatus good">MANAFESTACIÓN EXITOSA</div>`;if(!enemyAI)actions=`<div class="inlineMfActions"><button class="btn" onclick="SIZA.commitManifest(0)">${m.reactive?'Poner en Stack':'Resolver'}</button></div>`}else{const burnPreview=landCards.slice(0,Math.min(deficit,lands)).map(x=>`<span class="burnReserveCardV5">${esc(x.c.name)}</span>`).join('');if(lands>=deficit){info=`<div class="mfLine">Sacaste ${m.roll} · falta ${deficit}</div><div class="mfStatus">${enemyAI?'RIVAL USA ':' '}MANA BURN +${deficit}</div>`;if(!enemyAI)actions=`<div class="burnReserveV5">${burnPreview}</div><div class="inlineMfActions"><button class="burnLandTiny" onclick="SIZA.commitManifest(${deficit})">Burn ×${deficit} y ${m.reactive?'responder':'salvar'}</button><button class="btn danger" onclick="SIZA.failManifest()">Aceptar fallo</button></div>`}else{info=`<div class="mfLine">Sacaste ${m.roll} · falta ${deficit}</div><div class="mfStatus bad">BURN INSUFICIENTE</div>`;if(!enemyAI)actions=`<div class="burnReserveV5">${burnPreview||'<span class="mfSub">No tienes Reservas en mano.</span>'}</div><div class="mfSub">Tienes ${lands}; necesitas ${deficit}.</div><div class="inlineMfActions"><button class="btn danger" onclick="SIZA.failManifest()">Aceptar fallo</button></div>`}}}return `<div class="manifestInlineV5"><div class="committedCardV5" title="Carta comprometida boca abajo"></div><div class="manifestDieV5 ${rolled?'':'rolling'}">${rolled?m.roll:'?'}</div><div class="manifestResultV5">${info}${actions}</div></div>`}
function responseWindowHtml(){const M=state.match,R=M?.responseWindow;if(!M||!R)return'';const base=M.stack.find(x=>x.id===R.stackId),baseCard=cardById(base?.cardId),top=M.stack[M.stack.length-1],topCard=cardById(top?.cardId);if(!baseCard)return'';const used=!!R.used;return `<div class="responseWindowV53 ${used?'':'responsePulseV53'}"><div class="rwTitle">${used?`${esc(topCard?.name||'Tu Instant')} está sobre el Stack`:`${esc(baseCard.name)} · RESPUESTA`}</div><div class="rwText">${used?'Tu respuesta ya fue manifestada. Resuelve el Stack para ver el resultado.':'El rival puso un spell en el Stack. Toca un Instant de tu mano para responder o pasa prioridad.'}</div><div class="rwActions"><button class="btn ${used?'':'ghost'}" onclick="SIZA.passResponse()">${used?'RESOLVER STACK':'PASAR PRIORIDAD'}</button></div></div>`}

function setDamageFx(target,amount){const M=state.match;if(!M||!amount)return;const key='dmg_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);M.damageFx={target,amount,key};setTimeout(()=>{const C=state.match;if(C&&C.damageFx?.key===key){C.damageFx=null;if(state.route==='match')render()}},820)}

c3-37 20-51 38-48 19 3 29 25 22 55-6-8-13-13-22-17-10 7-23 11-38 10z" fill="#17151a"/><path d="M44 38c17-17 36-16 49 4" fill="none" stroke="#59292e" stroke-width="10" stroke-linecap="round"/><circle cx="55" cy="67" r="2.4" fill="#16191c"/><circle cx="78" cy="66" r="2.4" fill="#16191c"/><path d="M59 82c7 4 13 4 20 0" fill="none" stroke="#5a2f30" stroke-width="2" stroke-linecap="round"/><path d="M22 151l15-35 18 14 12-22 17 22 18-14 13 35" fill="#33242a" stroke="#a8585e" stroke-width="2"/><path d="M16 30l19-18 10 20-14 23z" fill="#40222a" opacity=".9"/></svg></div><div><div class="fighterName">${M.adventure?'Contrabandista Carmesí':'Practice Rival'}</div><div class="fighterMeta">MF ${E.mf} · PROW ${E.prow} · EVA ${E.eva}</div></div><div class="life">${E.life}</div></div><div class="chip gold topMatchChip ${M.active==='response'?'responseTurnBadgeV53':M.active==='enemy'?'enemyTurnBadgeV53':''}">${M.over?'MATCH ENDED':`Turn ${M.turn} · ${turnLabel}`}</div><div class="fighter"><div class="life">${P.life}</div><div style="text-align:right"><div class="fighterName">${state.player.mag.name}</div><div class="fighterMeta">MF ${P.mf} · Azul ${P.aff.U} · Rojo ${P.aff.R}</div></div><div class="fighterAvatar"><img src="${NEREIDA_IMG}" class="matchPortraitV55"></div></div></div><div class="matchBoardV5"><div class="rotateHintV5">Arena funciona mejor en horizontal</div><div class="arenaHalf enemyHalf"><div class="arenaMag enemyMag ${M.damageFx?.target==='enemy'?'damageHitV55':''}"><div class="rivalArtV54"><svg viewBox="0 0 120 160" aria-hidden="true"><defs><linearGradient id="rv54" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d3037"/><stop offset="1" stop-color="#111d27"/></linearGradient></defs><rect width="120" height="160" fill="url(#rv54)"/><path d="M25 145c2-35 15-52 35-54 23-2 36 18 38 54" fill="#20191b" stroke="#b76868" stroke-width="2"/><path d="M40 61c2-25 14-39 28-39 18 0 28 16 27 43-1 20-13 35-29 35-17 0-28-17-26-39z" fill="#a96e55"/><path d="M36 62c3-37 20-51 38-48 19 3 29 25 22 55-6-8-13-13-22-17-10 7-23 11-38 10z" fill="#17151a"/><path d="M44 38c17-17 36-16 49 4" fill="none" stroke="#59292e" stroke-width="10" stroke-linecap="round"/><circle cx="55" cy="67" r="2.4" fill="#16191c"/><circle cx="78" cy="66" r="2.4" fill="#16191c"/><path d="M59 82c7 4 13 4 20 0" fill="none" stroke="#5a2f30" stroke-width="2" stroke-linecap="round"/><path d="M22 151l15-35 18 14 12-22 17 22 18-14 13 35" fill="#33242a" stroke="#a8585e" stroke-width="2"/><path d="M16 30l19-18 10 20-14 23z" fill="#40222a" opacity=".9"/></svg></div><div class="arenaLifeV5">♥ ${E.life}</div>${damageFxHtml('enemy')}<div class="arenaMagInfo"><b>${M.adventure?'Contrabandista':'Rival'}</b><span>${E.hand.length} cartas · MF ${E.mf}</span></div></div><div class="arenaField">${enemyBF}</div><div class="arenaZones"><div class="arenaZoneChip">LIB <b>${E.library.length}</b></div><div class="arenaZoneChip">GY <b>${E.graveyard.length}</b></div><div class="arenaZoneChip">EX <b>${E.exile.length}</b></div></div></div><div class="arenaHalf playerHalf"><div class="arenaMagSlot"><div class="arenaMag ${M.damageFx?.target==='player'?'damageHitV55':''}"><img src="${NEREIDA_IMG}" class="matchPortraitV55"><div class="arenaLifeV5">♥ ${P.life}</div>${damageFxHtml('player')}<div class="arenaMagInfo"><b>${state.player.mag.name}</b><span>MF ${P.mf} · PROW ${P.prow} · EVA ${P.eva}</span></div></div>${physAllowed?`<button type="button" class="physicalActionV5" onclick="SIZA.physicalAttack()">Ataque físico</button>`:''}</div><div class="arenaField">${playerBF}</div><div class="arenaZones"><div class="arenaZoneChip">LIB <b>${P.library.length}</b></div><div class="arenaZoneChip">GY <b>${P.graveyard.length}</b></div><div class="arenaZoneChip">BURN <b>${P.exile.length}</b></div></div></div><div class="stackAnchorV5">${stackHtml}</div>${manifestInlineHtml()}${responseWindowHtml()}${matchCardFocus()}<div class="matchLog">${M.log.slice(-6).reverse().map(l=>`<div class="logItem"><strong>${esc(l.t)}< function addLog(t,m){state.match.log.push({t,m})}
function selectHand(idx){const M=state.match;if(!M||M.over)return;M.ui=M.ui||{};M.ui.hand=idx<0?-1:idx;M.ui.creature=-1;render()}
function playSelectedHand(){const M=state.match;if(!M||M.ui?.hand==null||M.ui.hand<0)return;playHand(M.ui.hand)}
function playHand(idx){const M=state.match;if(!M||M.over||state.modal)return;const P=M.player,id=P.hand[idx],c=cardById(id);if(!c)return;if(c.type==='Land')return toast('Las Lands no se juegan. Se guardan en la mano para Mana Burn después de una tirada fallida.','gold');const reactive=M.active==='response'&&!!M.responseWindow;if(reactive){if(M.responseWindow.used)return toast('Ya comprometiste una respuesta en esta ventana. Resuelve el Stack.','bad');if(c.type!=='Instant')return toast('Sólo los Instants pueden manifestarse en esta ventana de respuesta.','bad');const ai=affinityInfo(c,{aff:P.aff});if(ai.unsupported.length)return toast(`No tienes afinidad ${COLORS[ai.unsupported[0]]}.`,'bad');return openManifest(idx,c,'player')}if(M.active!=='player')return toast('Es el turno del rival. Espera una ventana de respuesta.','bad');if(!P.proactiveOpen)return toast('Tu secuencia proactiva de Manafestation está cerrada este turno.','bad');const ai=affinityInfo(c,{aff:P.aff});if(ai.unsupported.length)return toast(`No tienes afinidad ${COLORS[ai.unsupported[0]]}.`,'bad');openManifest(idx,c,'player')}
function openManifest(idx,c,owner){const M=state.match,P=M[owner],dc=dcFor(c,{aff:P.aff});M.ui=M.ui||{};M.ui.hand=-1;const reactive=owner==='player'&&M.active==='response'&&!!M.responseWindow;state.modal={type:'manifest',owner,idx,cardId:c.id,dc,roll:null,total:null,deficit:null,reactive,ai:owner==='enemy'};render();setTimeout(()=>{const m=state.modal;if(m&&m.type==='manifest'&&m.cardId===c.id&&m.roll==null)SIZA.rollManifest()},420)}
function rollManifest(){const m=state.modal;if(!m||m.type!=='manifest'||m.roll!=null)return;const P=state.match[m.owner],roll=d6();m.roll=roll;m.total=P.mf+roll;m.deficit=Math.max(0,m.dc-m.total);render();if(m.ai)setTimeout(enemyResolveManifestRoll,650)}
function renderModal(){document.querySelectorAll('.modalBack').forEach(x=>x.remove())}
function cancelManifest(){if(!state.modal)return;state.modal=null;render()}
function commitManifest(burn){const m=state.modal;if(!m||m.type!=='manifest'||m.roll==null)return;const M=state.match,P=M[m.owner],c=cardById(m.cardId),reactive=!!m.reactive,targetStackId=reactive&&c.role==='counter'?M.responseWindow?.stackId:null;if(burn){let need=burn;for(let i=P.hand.length-1;i>=0&&need>0;i--){if(cardById(P.hand[i]).type==='Land'&&i!==m.idx){P.exile.push(P.hand[i]);P.hand.splice(i,1);if(i<m.idx)m.idx--;need--}}if(need>0)return toast('No quedan suficientes Lands para completar Burn.','bad');addLog('Mana Burn',`${m.owner==='enemy'?'Rival: ':''}${burn} Land${burn===1?'':'s'} exiliada${burn===1?'':'s'} para salvar ${c.name}.`)}const id=P.hand.splice(m.idx,1)[0];if(!reactive)P.successful=true;P.manifestSuccesses++;const obj={id:'stk_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),cardId:id,owner:m.owner,targetStackId};M.stack.push(obj);addLog(m.owner==='enemy'?'Enemy MF':reactive?'Reactive MF':'Manafestation',`${c.name}: d6 ${m.roll}${burn?` + Burn ${burn}`:''} — SUCCESS.`);state.modal=null;M.ui.hand=-1;if(m.owner==='enemy'){M.responseWindow={id:'rw_'+Date.now(),stackId:obj.id,used:false};M.active='response';M.phase='Response Window';M.enemyStage='response';addLog('Priority',`El rival puso ${c.name} en el Stack. Puedes responder con un Instant.`);save();render();toast(`${c.name} está en el Stack — puedes responder.`, 'gold');return}if(reactive){if(M.responseWindow)M.responseWindow.used=true;M.active='response';M.phase='Response Window';save();render();toast(`${c.name} entra al Stack como respuesta.`,'gold');return}resolveTopStack();if(m.owner==='player'&&P.manifestSuccesses===3&&P.mf<3){P.mf=3;state.player.mag.evolution=Math.max(2,state.player.mag.evolution);addLog('Evolution','Nereida alcanza Evolution II: Manafestation 3 durante este match.');toast('Evolution II — Manafestation aumenta a 3.','gold')}save();render()}
function failManifest(){const m=state.modal;if(!m||m.type!=='manifest'||m.roll==null)return;const M=state.match,P=M[m.owner],c=cardById(m.cardId),reactive=!!m.reactive;if(reactive){addLog('Reactive MF',`${c.name}: d6 ${m.roll} — FAIL. Pierdes esta ventana de respuesta.`);state.modal=null;M.ui.hand=-1;save();render();toast('Respuesta fallida. El spell rival resolverá.','bad');setTimeout(()=>{if(state.match===M&&M.responseWindow)SIZA.passResponse()},650);return}P.proactiveOpen=false;addLog('Manafestation',`${c.name}: d6 ${m.roll} — FAIL. Secuencia proactiva cerrada.`);state.modal=null;M.ui.hand=-1;save();render();toast('Manafestation fallida. Todavía puedes combatir o actuar físicamente.','bad')}
function resolveTopStack(){const M=state.match;if(!M||!M.stack.length)return;const s=M.stack.pop(),P=M[s.owner],O=s.owner==='player'?M.enemy:M.player,c=cardById(s.cardId);if(c.role==='counter'){let targetIndex=-1;if(s.targetStackId)targetIndex=M.stack.findIndex(x=>x.id===s.targetStackId);if(targetIndex<0&&M.stack.length)targetIndex=M.stack.length-1;if(targetIndex>=0){const target=M.stack.splice(targetIndex,1)[0],TP=M[target.owner],tc=cardById(target.cardId);TP.graveyard.push(target.cardId);P.graveyard.push(c.id);addLog('Counter',`${c.name} contrarresta ${tc?.name||'el spell objetivo'}.`)}else{P.graveyard.push(c.id);addLog('Resolve',`${c.name} no encuentra un spell válido para contrarrestar.`)}checkWin();return}if(c.type==='Creature'||c.type==='Artifact'){P.battlefield.push(c.id);addLog('Resolve',`${c.name} entra al Battlefield.`);if(c.id==='queen'){drawCards(P,2);if(P.hand.length){const discarded=P.hand.pop();P.graveyard.push(discarded);addLog('Queen',`Roba 2 y descarta ${cardById(discarded).name}.`)}}}else if(c.id==='spark'){O.life-=2;setDamageFx(s.owner==='player'?'enemy':'player',2);P.graveyard.push(c.id);addLog('Resolve',`${c.name} hace 2 de daño a ${s.owner==='player'?'rival':'Nereida'}.`)}else if(c.id==='mist'){drawCards(P,1);P.graveyard.push(c.id);addLog('Resolve',`${c.name} roba una carta.`)}else{P.graveyard.push(c.id);addLog('Resolve',`${c.name} resuelve.`)}checkWin()}
function drawCards(P,n){for(let i=0;i<n;i++){if(!P.library.length)break;P.hand.push(P.library.shift())}}
function resolveStackAll(){const M=state.match;if(!M)return;let guard=0;while(M.stack.length&&!M.over&&guard++<20)resolveTopStack()}
function passResponse(){const M=state.match;if(!M||M.over||!M.responseWindow||state.modal)return;M.responseWindow=null;M.active='enemy';M.phase='Resolving Stack';M.enemyStage='resolve';M.ui.hand=-1;save();render();setTimeout(()=>{if(!state.match||state.match!==M||M.over)return;resolveStackAll();save();render();if(!M.over)setTimeout(enemyAfterMain,520)},380)}
function selectCreature(idx){const M=state.match;if(!M||M.over)return;M.ui=M.ui||{};M.ui.creature=idx<0?-1:idx;M.ui.hand=-1;render()}
function attackCreature(idx){const M=state.match,P=M.player,E=M.enemy;if(M.active!=='player'||M.over)return;const id=P.battlefield[idx],c=cardById(id);if(!c||c.type!=='Creature')return;let dmg=c.power||0;if(c.id==='smuggler')dmg+=1;E.life-=dmg;setDamageFx('enemy',dmg);M.ui.creature=-1;addLog('Combat',`${c.name} ataca por ${dmg}.`);checkWin();save();render()}
function attackAll(){const M=state.match,P=M.player,E=M.enemy;if(M.active!=='player'||M.over)return;const creatures=P.battlefield.map(id=>cardById(id)).filter(c=>c.type==='Creature');if(!creatures.length)return;let dmg=creatures.reduce((sum,c)=>sum+(c.power||0)+(c.id==='smuggler'?1:0),0);E.life-=dmg;setDamageFx('enemy',dmg);addLog('Combat',`${creatures.length} criatura${creatures.length===1?'':'s'} atacan por ${dmg}.`);checkWin();save();render()}
function physicalAttack(){const M=state.match;if(!M)return;const P=M.player,E=M.enemy;if(M.active!=='player'||M.over||P.successful)return toast('La Acción Física sólo está disponible si no hubo una Manafestation proactiva exitosa este turno.','bad');if(P.physicalUsed)return toast('Ya usaste el Ataque Físico este turno.','bad');P.physicalUsed=true;P.proactiveOpen=false;const prowRoll=d6(),evaRoll=d6(),a=P.prow+prowRoll,d=E.eva+evaRoll;if(a>d){E.life-=1;setDamageFx('enemy',1);addLog('Physical',`PROW ${P.prow}+d6(${prowRoll}) = ${a} vence EVA ${E.eva}+d6(${evaRoll}) = ${d}. El rival recibe 1 daño.`);toast(`Ataque físico: ${a} vs ${d} — IMPACTO. 1 daño.`,'gold')}else{addLog('Physical',`PROW ${P.prow}+d6(${prowRoll}) = ${a} no supera EVA ${E.eva}+d6(${evaRoll}) = ${d}.`);toast(`Ataque físico: ${a} vs ${d} — FALLA.`,'bad')}checkWin();save();render()}
function endTurn(){const M=state.match;if(!M||M.over||M.active!=='player'||state.modal)return;M.active='enemy';M.phase='Enemy Turn';M.enemyStage='start';M.ui.hand=-1;M.ui.creature=-1;M.responseWindow=null;addLog('Turn','Cedes el turno al rival.');save();render();setTimeout(enemyTurn,520)}
function enemyTurn(){const M=state.match;if(!M||M.over||M.active!=='enemy'||state.modal)return;const E=M.enemy;if(M.enemyStage==='manifest'&&!state.modal)M.enemyStage='main';if(M.enemyStage&&M.enemyStage!=='start'&&M.enemyStage!=='main')return;M.enemyStage='main';M.phase='Enemy Main';E.proactiveOpen=true;E.successful=false;drawCards(E,1);addLog('Enemy Turn',`El rival roba. Tiene ${E.hand.length} cartas.`);save();render();setTimeout(enemyChoosePlay,520)}
function enemyChoosePlay(){const M=state.match;if(!M||M.over||M.active!=='enemy'||state.modal)return;const E=M.enemy;const options=E.hand.map((id,i)=>({id,i,c:cardById(id)})).filter(x=>x.c&&x.c.type!=='Land'&&x.c.role!=='counter'&&affinityInfo(x.c,{aff:E.aff}).unsupported.length===0).sort((a,b)=>{const ar=a.c.role==='removal'?0:a.c.type==='Creature'?1:2,br=b.c.role==='removal'?0:b.c.type==='Creature'?1:2;return ar-br||a.c.cost-b.c.cost});if(!options.length){addLog('Enemy Main','El rival no tiene una Manafestation proactiva útil.');return enemyAfterMain()}const x=options[0];M.enemyStage='manifest';addLog('Enemy Main',`El rival compromete una carta boca abajo.`);openManifest(x.i,x.c,'enemy')}
function enemyResolveManifestRoll(){const m=state.modal,M=state.match;if(!M||M.over||!m||m.type!=='manifest'||m.owner!=='enemy'||m.roll==null)return;const E=M.enemy,lands=E.hand.reduce((n,id,i)=>n+(i!==m.idx&&cardById(id)?.type==='Land'?1:0),0),deficit=Math.max(0,m.dc-(E.mf+m.roll)),c=cardById(m.cardId);if(deficit<=lands){setTimeout(()=>{if(state.modal===m)commitManifest(deficit)},380)}else{E.proactiveOpen=false;addLog('Enemy MF',`${c.name}: d6 ${m.roll} — FAIL. Burn disponible ${lands}, necesitaba ${deficit}.`);state.modal=null;M.enemyStage='mainDone';save();render();setTimeout(enemyAfterMain,520)}}
function enemyAfterMain(){const M=state.match;if(!M||M.over||M.active!=='enemy'||state.modal||M.responseWindow)return;const E=M.enemy,P=M.player;M.enemyStage='combat';M.phase='Enemy Combat';const creatures=E.battlefield.map(id=>cardById(id)).filter(c=>c?.type==='Creature');if(creatures.length){const dmg=creatures.reduce((sum,c)=>sum+(c.power||0)+(c.id==='smuggler'?1:0),0);P.life-=dmg;setDamageFx('player',dmg);addLog('Enemy Combat',`${creatures.length} criatura${creatures.length===1?'':'s'} atacan por ${dmg}.`);checkWin()}else addLog('Enemy Combat','El rival no tiene criaturas para atacar.');save();render();if(!M.over)setTimeout(enemyPhysicalStep,620)}
function enemyPhysicalStep(){const M=state.match;if(!M||M.over||M.active!=='enemy')return;const E=M.enemy,P=M.player;M.enemyStage='physical';M.phase='Enemy Action';if(!E.successful){const ar=d6(),dr=d6(),a=E.prow+ar,d=P.eva+dr;if(a>d){P.life-=1;setDamageFx('player',1);addLog('Enemy Physical',`PROW ${E.prow}+d6(${ar}) = ${a} vence EVA ${P.eva}+d6(${dr}) = ${d}. Nereida recibe 1 daño.`)}else addLog('Enemy Physical',`PROW ${E.prow}+d6(${ar}) = ${a} no supera EVA ${P.eva}+d6(${dr}) = ${d}.`);checkWin()}else addLog('Enemy Action','El rival ya tuvo una Manafestation proactiva exitosa; no obtiene Acción Física.');save();render();if(!M.over)setTimeout(finishEnemyTurn,650)}
function finishEnemyTurn(){const M=state.match;if(!M||M.over)return;const P=M.player;M.turn++;M.active='player';M.phase='Main';M.enemyStage=null;M.responseWindow=null;P.proactiveOpen=true;P.successful=false;P.physicalUsed=false;drawCards(P,1);addLog('Turn',`Comienza tu turno ${M.turn}. Robas una carta.`);save();render();toast(`Tu turno ${M.turn}.`,'gold')}
function checkWin(){const M=state.match;if(M.player.life<=0||M.enemy.life<=0){M.over=true;M.winner=M.player.life>0?'player':'enemy';addLog('Match',`${M.winner==='player'?'Victoria':'Derrota'}.`);if(M.adventure&&M.winner==='player'){state.adventure.flags.smugglersResolved=true;state.adventure.advance=Math.min(5,state.adventure.advance+2);journal('Siza Encounter','Derrotaste al Magistócrata contrabandista. La escalera inferior quedó abierta.');state.adventure.currentEvent=null;chooseAdventureEvent()}}}
function returnAdventure(){state.match=null;state.route='adventure';save();render();toast('Resultado devuelto al Adventure Engine.','gold')}
window.SIZA={nav,reset,setFilter,adventureChoice,deckDelta,resetDeck,startPractice,startAdventureDuel,playHand,selectHand,playSelectedHand,selectCreature,attackCreature,rollManifest,cancelManifest,commitManifest,failManifest,attackAll,physicalAttack,endTurn,passResponse,returnAdventure};
render();
if(state.match&&!state.match.over&&state.match.active==='enemy'&&!state.modal)setTimeout(enemyTurn,650);
})();
</script>
