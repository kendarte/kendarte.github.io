name: SIZA DM Adjudicator Tests

on:
  push:
    paths:
      - 'siza-world-engine/overlay/services/dm_free_action_adjudicator.py'
      - 'siza-world-engine/overlay/services/dm_free_action_execution_bridge.py'
      - 'siza-world-engine/overlay/services/dm_free_action_check_engine.py'
      - 'siza-world-engine/overlay/services/dm_free_action_judge.py'
      - 'siza-world-engine/overlay/services/dm_world_context.py'
      - '.github/workflows/siza-dm-adjudicator-tests.yml'
  pull_request:
    paths:
      - 'siza-world-engine/overlay/services/dm_free_action_adjudicator.py'
      - 'siza-world-engine/overlay/services/dm_free_action_execution_bridge.py'
      - 'siza-world-engine/overlay/services/dm_free_action_check_engine.py'
      - 'siza-world-engine/overlay/services/dm_free_action_judge.py'
      - 'siza-world-engine/overlay/services/dm_world_context.py'
      - '.github/workflows/siza-dm-adjudicator-tests.yml'

jobs:
  adjudicator-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile DM adjudicator, judge, check and execution bridge
        run: |
          python -m py_compile \
            siza-world-engine/overlay/services/dm_free_action_adjudicator.py \
            siza-world-engine/overlay/services/dm_free_action_execution_bridge.py \
            siza-world-engine/overlay/services/dm_free_action_check_engine.py \
            siza-world-engine/overlay/services/dm_free_action_judge.py \
            siza-world-engine/overlay/services/dm_world_context.py
      - name: Validate deterministic adjudication boundary
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          overlay = Path('siza-world-engine/overlay').resolve()
          sys.path.insert(0, str(overlay))

          from services.dm_free_action_adjudicator import adjudicate_dm_free_action
          from services.dm_free_action_judge import build_dm_judge_request, parse_dm_judge_response
          from services import dm_free_action_check_engine as check_engine

          class DB:
              pass

          class Obj:
              def __init__(self, key, oid, *, location=None, npc=False, portable=False):
                  self.key = key
                  self.id = oid
                  self.location = location
                  self.contents = []
                  self.exits = []
                  self.destination = None
                  self.db = DB()
                  self.db.is_npc = npc
                  self.db.portable = portable
                  self.db.dm_affordances = []
                  self.db.exit_id = None
                  self.db.state = {}
                  self.db.adventure_stats = {}

          room = Obj('QA Room', 1)
          room.db.room_id = 'QA-ROOM'
          actor = Obj('QA Player', 2, location=room)
          actor.db.adventure_stats = {'FUE': 4, 'AGI': 3}
          room.contents.append(actor)
          portable = Obj('Portable Box', 3, location=room, portable=True)
          fixed = Obj('Fixed Counter', 4, location=room, portable=False)
          npc = Obj('QA NPC', 5, location=room, npc=True)
          npc.db.adventure_stats = {'AGI': 2, 'FUE': 2}
          room.contents.extend([portable, fixed, npc])
          exit_obj = Obj('salir', 6, location=room)
          destination = Obj('Street', 7)
          exit_obj.destination = destination
          exit_obj.db.exit_id = 'QA-EXIT'
          room.exits.append(exit_obj)

          def packet(action_type, primary_ref, secondary_ref='', *, desired='test', resolution='UNKNOWN', stat=''):
              return {
                  'status': 'INTERPRETED',
                  'accepted': True,
                  'intent': {
                      'intent': action_type,
                      'goal': desired,
                      'steps': [{
                          'action_type': action_type,
                          'verb': action_type.lower(),
                          'primary_ref': primary_ref,
                          'secondary_ref': secondary_ref,
                          'unresolved_target': '',
                          'desired_effect': desired,
                          'resolution_hint': resolution,
                          'stat_hint': stat,
                      }],
                      'context_needs': [],
                      'confidence': 0.99,
                  },
              }

          take = adjudicate_dm_free_action(actor, packet('TAKE', 'DBREF:3'))
          assert take['status'] == 'ADMISSIBLE', take
          assert take['steps'][0]['executor'] == 'GENERIC_TAKE', take

          fixed_take = adjudicate_dm_free_action(actor, packet('TAKE', 'DBREF:4'))
          assert fixed_take['status'] == 'NOT_ADMISSIBLE', fixed_take
          assert fixed_take['steps'][0]['reason'] == 'TARGET_NOT_PORTABLE', fixed_take

          attack = adjudicate_dm_free_action(actor, packet('ATTACK', 'DBREF:5', desired='atacar al NPC', resolution='COMBAT'))
          assert attack['status'] == 'ADMISSIBLE', attack
          assert attack['steps'][0]['executor'] == 'COMBAT', attack

          movement = adjudicate_dm_free_action(actor, packet('MOVE', 'EXIT_DBREF:6'))
          assert movement['status'] == 'ADMISSIBLE', movement
          assert movement['steps'][0]['executor'] == 'MOVEMENT', movement

          stale = adjudicate_dm_free_action(actor, packet('TAKE', 'DBREF:9999'))
          assert stale['status'] == 'NOT_ADMISSIBLE', stale
          assert stale['steps'][0]['reason'] == 'PRIMARY_REF_NOT_CURRENT', stale

          move_object = adjudicate_dm_free_action(
              actor,
              packet('MOVE_OBJECT', 'DBREF:3', 'DBREF:5', desired='patear la caja hacia el NPC', resolution='CONFRONT', stat='FUE'),
          )
          assert move_object['status'] == 'NEEDS_JUDGMENT', move_object
          assert move_object['steps'][0]['reason'] == 'REQUIRES_BOUNDED_DM_JUDGMENT', move_object
          assert move_object['steps'][0]['verified_context']['primary']['portable'] is True, move_object
          assert move_object['steps'][0]['verified_context']['secondary']['kind'] == 'NPC', move_object

          judge_request = build_dm_judge_request(
              'pateo la caja hacia el NPC para apartarlo',
              move_object,
              dm_plan={'campaign_id': 'QA', 'active_beat': {'id': 'QA-BEAT', 'state_goal': 'QA'}},
          )
          assert 'outcome' not in judge_request['schema']['properties'], judge_request['schema']
          judgment = {
              'judgments': [{
                  'step_index': 0,
                  'mode': 'CONFRONT',
                  'actor_stat': 'FUE',
                  'target_stat': 'AGI',
                  'difficulty_tier': '',
                  'reason': 'El jugador aplica fuerza y el objetivo puede apartarse activamente.',
              }]
          }
          fake = json.dumps({'message': {'content': json.dumps(judgment)}})
          judged = parse_dm_judge_response(fake, judge_request['steps'])
          assert judged['status'] == 'JUDGED' and judged['accepted'] is True, judged
          assert judged['judgments'][0]['mode'] == 'CONFRONT', judged
          assert judged['judgments'][0]['difficulty'] is None, judged

          bad_judgment = json.loads(json.dumps(judgment))
          bad_judgment['judgments'][0]['difficulty_tier'] = 'IMPOSSIBLE'
          rejected_judge = parse_dm_judge_response(
              json.dumps({'message': {'content': json.dumps(bad_judgment)}}),
              judge_request['steps'],
          )
          assert rejected_judge['status'] == 'INVALID_JUDGMENT', rejected_judge

          direct_judgment = {
              'judgments': [{
                  'step_index': 0,
                  'mode': 'DIRECT',
                  'actor_stat': 'FUE',
                  'target_stat': '',
                  'difficulty_tier': 'HARD',
                  'reason': 'El obstáculo exige un esfuerzo difícil pero no tiene oposición activa.',
              }]
          }
          direct = parse_dm_judge_response(
              json.dumps({'message': {'content': json.dumps(direct_judgment)}}),
              judge_request['steps'],
          )
          assert direct['status'] == 'JUDGED', direct
          assert direct['judgments'][0]['difficulty'] == 9, direct

          portable.db.dm_affordances = [{
              'id': 'QA-KICK',
              'enabled': True,
              'action_type': 'MOVE_OBJECT',
              'executor': 'CHECK_ONLY',
              'check': {
                  'id': 'QA-KICK-CHECK',
                  'trigger': 'OBSTACLE',
                  'mode': 'DIRECT',
                  'stat': 'FUE',
                  'difficulty': 4,
              },
          }]
          authored = adjudicate_dm_free_action(
              actor,
              packet('MOVE_OBJECT', 'DBREF:3', 'DBREF:5', desired='patear la caja hacia el NPC', resolution='CONFRONT', stat='FUE'),
          )
          assert authored['status'] == 'ADMISSIBLE', authored
          assert authored['steps'][0]['executor'] == 'AUTHORED_CHECK', authored
          assert authored['steps'][0]['authoritative_check']['mode'] == 'DIRECT', authored
          assert authored['steps'][0]['authoritative_check']['stat'] == 'FUE', authored
          assert authored['steps'][0]['model_resolution_hint'] == 'CONFRONT', authored
          assert authored['authority']['model_difficulty_used'] is False, authored

          check_engine.emit_world_action = lambda action: {'status': 'QA_CONSEQUENCE_ACCEPTED', 'action_id': action.get('action_id')}
          authored_result = check_engine.resolve_authored_dm_check(
              actor,
              authored['steps'][0],
              raw_player_input='pateo la caja hacia el NPC',
              forced_roll=1,
          )
          assert authored_result['status'] == 'AUTHORED_CHECK_RESOLVED', authored_result
          assert authored_result['executed'] is True, authored_result
          assert authored_result['outcome'] == 'SUCCESS', authored_result
          assert authored_result['resolution']['check_id'] == 'QA-KICK-CHECK', authored_result
          assert authored_result['calculation']['forced_for_validation'] is True, authored_result
          assert authored_result['consequence']['status'] == 'QA_CONSEQUENCE_ACCEPTED', authored_result

          portable.db.dm_affordances = [{
              'id': 'QA-LONG-CHECK',
              'enabled': True,
              'action_type': 'MOVE_OBJECT',
              'executor': 'CHECK_ONLY',
              'check': {
                  'id': 'QA-LONG-CHECK-SPEC',
                  'trigger': 'OBSTACLE',
                  'mode': 'ACCUMULATE',
                  'stat': 'FUE',
                  'difficulty': 4,
              },
          }]
          unsupported_authored = adjudicate_dm_free_action(
              actor,
              packet('MOVE_OBJECT', 'DBREF:3', 'DBREF:5', desired='empujar durante mucho tiempo'),
          )
          assert unsupported_authored['status'] == 'NOT_ADMISSIBLE', unsupported_authored
          assert unsupported_authored['steps'][0]['reason'] == 'AUTHORED_CHECK_MODE_NOT_EXECUTABLE', unsupported_authored

          print('SIZA DM adjudicator boundary: PASS')
          print('SIZA DM bounded judge contract: PASS')
          print('SIZA DM authored check execution: PASS')
          PY
