name: Siza Arena Canonicalize Manafestation

on:
  push:
    paths:
      - '.github/workflows/siza-arena-canonicalize-mf.yml'

permissions:
  contents: write

jobs:
  canonicalize-manafestation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install parser
        run: npm install --no-save acorn@8

      - name: Remove only dead pre-v0.7 Manafestation declarations
        run: |
          node <<'NODE'
          const fs = require('fs');
          const acorn = require('acorn');

          const path = 'siza-mobile-test/index.html';
          const html = fs.readFileSync(path, 'utf8');
          const scriptOpen = html.lastIndexOf('<script>');
          const scriptClose = html.indexOf('</script>', scriptOpen);
          if (scriptOpen < 0 || scriptClose < 0) throw new Error('Main script block not found');

          const codeStart = scriptOpen + '<script>'.length;
          const code = html.slice(codeStart, scriptClose);
          const ast = acorn.parse(code, { ecmaVersion: 'latest', sourceType: 'script' });
          const targets = new Set([
            'playHand',
            'openManifest',
            'rollManifest',
            'cancelManifest',
            'selectBurn',
            'commitManifest',
            'failManifest',
            'manifestInlineHtml',
            'enemyResolveManifestRoll'
          ]);
          const found = new Map([...targets].map(name => [name, []]));

          function walk(node) {
            if (!node || typeof node !== 'object') return;
            if (node.type === 'FunctionDeclaration' && node.id && targets.has(node.id.name)) {
              found.get(node.id.name).push(node);
            }
            for (const [key, value] of Object.entries(node)) {
              if (key === 'start' || key === 'end' || key === 'loc') continue;
              if (Array.isArray(value)) for (const child of value) walk(child);
              else if (value && typeof value === 'object' && typeof value.type === 'string') walk(value);
            }
          }
          walk(ast);

          for (const name of targets) {
            const nodes = found.get(name);
            if (nodes.length !== 2) {
              throw new Error(`${name}: expected exactly 2 declarations before canonicalization, found ${nodes.length}`);
            }
          }

          const removals = [];
          for (const name of targets) {
            const nodes = found.get(name).sort((a, b) => a.start - b.start);
            const dead = nodes[0];
            let start = dead.start;
            let end = dead.end;
            while (end < code.length && (code[end] === '\r' || code[end] === '\n')) end++;
            removals.push({ name, start, end });
          }
          removals.sort((a, b) => b.start - a.start);

          let next = code;
          for (const r of removals) {
            console.log(`REMOVE dead ${r.name} @ ${r.start}-${r.end}`);
            next = next.slice(0, r.start) + next.slice(r.end);
          }

          const verifyAst = acorn.parse(next, { ecmaVersion: 'latest', sourceType: 'script' });
          const verify = new Map([...targets].map(name => [name, 0]));
          function verifyWalk(node) {
            if (!node || typeof node !== 'object') return;
            if (node.type === 'FunctionDeclaration' && node.id && verify.has(node.id.name)) {
              verify.set(node.id.name, verify.get(node.id.name) + 1);
            }
            for (const [key, value] of Object.entries(node)) {
              if (key === 'start' || key === 'end' || key === 'loc') continue;
              if (Array.isArray(value)) for (const child of value) verifyWalk(child);
              else if (value && typeof value === 'object' && typeof value.type === 'string') verifyWalk(value);
            }
          }
          verifyWalk(verifyAst);
          for (const [name, count] of verify) {
            if (count !== 1) throw new Error(`${name}: expected 1 declaration after canonicalization, found ${count}`);
          }

          const nextHtml = html.slice(0, codeStart) + next + html.slice(scriptClose);
          fs.writeFileSync(path, nextHtml);
          console.log(`Canonicalized ${targets.size} Manafestation function names; current v0.7 declarations preserved.`);
          NODE

      - name: Verify intended diff
        run: |
          git diff --check
          git diff --stat
          git diff -- siza-mobile-test/index.html

      - name: Commit canonicalization
        run: |
          if git diff --quiet -- siza-mobile-test/index.html; then
            echo 'No change produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add siza-mobile-test/index.html
          git commit -m 'Canonicalize Arena Manafestation runtime'
          git push
